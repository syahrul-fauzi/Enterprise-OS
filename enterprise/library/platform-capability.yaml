metadata:
  id: LIB-PLATFORM-CAPABILITY
  name: EKL Standard Library — Platform Capability
  version: 1.0.0
  status: Normative
  authority: ACT-LEAD-ENTERPRISE-ARCHITECT
  owner: ACT-LEAD-ENTERPRISE-ARCHITECT
  created_at: 2026-07-23T00:00:00Z
  updated_at: 2026-07-23T00:00:00Z
  description: >
    Defines the PlatformCapability type for EKL, representing a technical capability provided by an enterprise platform.
language:
  requires: ">=1.0.0"
conformance:
  minimum_level: 3
type:
  id: PlatformCapability
  description: >
    A technical capability provided by an enterprise platform that supports business capabilities.
  grammar: CAP-GRAM-001
  ontology: ONT-001
  properties:
    - name: name
      type: string
      required: true
    - name: description
      type: string
      required: true
    - name: state
      type: enum
      values: [Concept, Development, Operational, Deprecated, Retired]
      required: true
