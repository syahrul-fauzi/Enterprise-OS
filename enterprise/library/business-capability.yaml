metadata:
  id: LIB-BUSINESS-CAPABILITY
  name: EKL Standard Library — Business Capability
  version: 1.0.0
  status: Normative
  authority: ACT-LEAD-ENTERPRISE-ARCHITECT
  owner: ACT-LEAD-ENTERPRISE-ARCHITECT
  created_at: 2026-07-23T00:00:00Z
  updated_at: 2026-07-23T00:00:00Z
  description: >
    Defines the BusinessCapability type for EKL, representing a high-level business ability.
language:
  requires: ">=1.0.0"
conformance:
  minimum_level: 3
type:
  id: BusinessCapability
  description: >
    A high-level ability of an enterprise to achieve a specific business outcome.
  grammar: CAP-GRAM-001
  ontology: ONT-001
  properties:
    - name: name
      type: string
      required: true
    - name: description
      type: string
      required: true
    - name: state
      type: enum
      values: [Concept, Development, Operational, Deprecated, Retired]
      required: true
