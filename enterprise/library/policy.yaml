metadata:
  id: LIB-POLICY
  name: EKL Standard Library — Policy
  version: 1.0.0
  status: Normative
  authority: ACT-LEAD-ENTERPRISE-ARCHITECT
  owner: ACT-LEAD-ENTERPRISE-ARCHITECT
  created_at: 2026-07-23T00:00:00Z
  updated_at: 2026-07-23T00:00:00Z
  description: >
    Defines the Policy type for EKL, representing a rule or principle that governs enterprise behavior.
language:
  requires: ">=1.0.0"
conformance:
  minimum_level: 3
type:
  id: Policy
  description: >
    A rule, principle, or regulation that guides enterprise behavior and decisions.
  grammar: CAP-GRAM-001
  ontology: ONT-001
  properties:
    - name: name
      type: string
      required: true
    - name: description
      type: string
      required: true
    - name: state
      type: enum
      values: [Concept, Development, Operational, Deprecated, Retired]
      required: true
