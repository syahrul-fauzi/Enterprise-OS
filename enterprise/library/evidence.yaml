metadata:
  id: LIB-EVIDENCE
  name: EKL Standard Library — Evidence
  version: 1.0.0
  status: Normative
  authority: ACT-LEAD-ENTERPRISE-ARCHITECT
  owner: ACT-LEAD-ENTERPRISE-ARCHITECT
  created_at: 2026-07-23T00:00:00Z
  updated_at: 2026-07-23T00:00:00Z
  description: >
    Defines the Evidence type for EKL, representing verifiable data supporting an assertion.
language:
  requires: ">=1.0.0"
conformance:
  minimum_level: 3
type:
  id: Evidence
  description: >
    Verifiable data or documentation that supports the validity of an assertion or decision.
  grammar: CAP-GRAM-001
  ontology: ONT-001
  properties:
    - name: name
      type: string
      required: true
    - name: description
      type: string
      required: true
    - name: state
      type: enum
      values: [Concept, Development, Operational, Deprecated, Retired]
      required: true
