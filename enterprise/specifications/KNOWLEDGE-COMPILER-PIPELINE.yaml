terminology_note: OFFICIAL_ARCHITECTURE_TERMINOLOGY_FROM_THIS_DOCUMENT_ONWARDS_REPLACES_LAYER_TERMINOLOGY_WITH_STATE_TRANSFORMATION_TERMINOLOGY_WHERE_APPROPRIATE.
