ssot_note: THIS_YAML_IS_SINGLE_SOURCE_OF_TRUTH_FOR_EOS_SEMANTICS._REGISTRY_AND_RUNTIME_MUST_NOT_REDEFINE_SEMANTICS._REGISTRY_ONLY_DECLARES_EDGE_INSTANCES._SEMANTICS_OF_EACH_EDGE_KIND_IS_DEFINED_HERE_AND_ONLY_HERE.
