baseline:
  id: ARCH-BASELINE-001
  name: EOS Implementation Baseline v1
  status: implementation_baseline_frozen
  version: 1.0.0
  change_policy: adr_required
  operating_phase: architecture_verification
  baseline_class: implementation
  lock_review: passed
  description: >
    Governed baseline for EOS core architecture after the discovery phase and
    during the architecture verification phase where validated specifications
    drive deterministic implementation artifacts and produce audit-ready
    execution evidence.
  registry_policy: append_only
  governance_consequences:
    constitution_changes: constitutional_amendment_and_adr_required
    canonical_model_changes: adr_and_migration_plan_required
    implementation_changes: baseline_update_not_required_if_contracts_hold
  artifacts:
    - id: ARCH-PHILOSOPHY-001
      name: EOS Philosophy
      status: frozen
      version: 1.0.0
      location: /root/Enterprise OS/ARCHITECTURE.md
      depends_on: []
      implements:
        - AXIOM-SEMANTIC-PRIMACY
      supersedes: null
      work_class: architecture
    - id: ARCH-CONSTITUTION-001
      name: EOS Architecture Constitution
      status: frozen
      version: 1.0.0
      location: /root/Enterprise OS/CONSTITUTION.md
      depends_on:
        - ARCH-PHILOSOPHY-001
      implements:
        - AXIOM-EVIDENCE-IMMUTABLE
        - AXIOM-CONTROLLED-EVOLUTION
      supersedes: null
      work_class: architecture
    - id: ARCH-EMA-001
      name: EOS Meta-Architecture
      status: frozen
      version: 1.0.0
      location: /root/Enterprise OS/enterprise/specifications/eos-architecture-closure.md
      depends_on:
        - ARCH-CONSTITUTION-001
      implements:
        - AXIOM-METAMODEL-INSTANCE-SEPARATION
      supersedes: null
      work_class: architecture
    - id: ARCH-ERA-001
      name: EOS Reference Architecture
      status: frozen
      version: 1.0.0
      location: /root/Enterprise OS/enterprise/specifications/eos-architecture-closure.md
      depends_on:
        - ARCH-EMA-001
        - ARCH-CONSTITUTION-001
      implements:
        - AXIOM-SINGLE-SEMANTIC-PROJECTION
        - AXIOM-CONTROLLED-EVOLUTION
      supersedes: null
      work_class: architecture
    - id: ARCH-SAG-001
      name: Specification Authoring Guide
      status: frozen
      version: 1.0.0
      location: /root/Enterprise OS/enterprise/specifications/specification-authoring-guide.md
      depends_on:
        - ARCH-ERA-001
        - ARCH-CONSTITUTION-001
      implements:
        - AUTHORING-CANONICAL-YAML
        - AUTHORING-DEFINITION-OF-READY
        - AUTHORING-DEFINITION-OF-DONE
      supersedes: null
      work_class: specification
    - id: ARCH-SES-001
      name: Specification Execution Specification
      status: frozen
      version: 1.0.0
      location: /root/Enterprise OS/enterprise/specifications/specification-execution-specification.md
      depends_on:
        - ARCH-SAG-001
        - ARCH-ERA-001
        - ARCH-CONSTITUTION-001
      implements:
        - EXECUTION-GOLDEN-SPECIFICATION
        - EXECUTION-DETERMINISTIC-GENERATION
        - EXECUTION-STAGED-DEFINITION-OF-DONE
      supersedes: null
      work_class: specification
  work_classes:
    architecture:
      review_policy: adr_required
      source_of_truth: governed_baseline
    specification:
      review_policy: sag_required
      source_of_truth: canonical_yaml
    implementation:
      review_policy: els_conformance_required
      source_of_truth: governed_els
