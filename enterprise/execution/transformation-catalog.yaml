gating:
  gate_b_requirement:
    katalog_entries_complete: 5
    contracts_defined_min_draft: true
    predicates_registered_min_draft: true
  gate_c:
    unlock_condition: T001_DETERMINISTIC_PASS_2X_RUN
    unlock_artifacts:
      transformation_proof: TRF-PROOF-T001 verdict = PASS
      deterministic_verified: 2x run output hash IDENTICAL
      ledger_append_verified: true
  gate_d:
    unlock_condition: GATE_C_VERIFIED
    engine_constraint: Engine_may_load_registry_MUST_NOT_infer_or_define_business_logic
  gate_e:
    unlock_condition: T005_PASS_END_TO_END_2X_RUN
    sprint0_exit: true

critical_rules:
  NO_ORCHESTRATION_BEFORE_PROOF: true
  rule_1_note: General orchestration ONLY loads TRANSFORMATION REGISTRY entries with lifecycle ≥ VERIFIED AND TRF-PROOF verdict = PASS. T001 MUST be proven standalone first.
  NO_ENGINE_SOURCE_OF_TRUTH: true
  rule_2_note: Engine MUST NEVER hardcode transformations as switch(id) case "T001". Engine ALWAYS calls via registry lookup.
  NO_SKIP: true
  rule_3_note: T002 shall not run before T001 PASS. T003 before T002 PASS. And so on. T005 = FINAL_CHAIN.
  REGISTRY_FIRST_PRODUCT: true
  rule_4_note: "Implementation roadmap derived from this catalog. Every PR claiming capability must cite: Catalog entry + Contract_ref + Predicate_refs + Evidence output."
  ADR_002_RISK_MITIGATION_1_GOD_REGISTRY_PREVENTED: true
  rule_5_note: >
    Registry source layout per-Transformation / per-Predicate single-purpose files ONLY.
    @repo/core-transformation-registry/src/index.ts = pure composition (≤100 LOC), NO declarations.
    Declarations live in: registry/transformations/t<NNN>.ts (max 200 LOC each), registry/predicates/t<NNN>.ts (max 200 LOC each).
    BEFORE adding T006..T150 declarations MUST continue this layout.
  ADR_002_RISK_MITIGATION_2_LEDGER_APPEND_ONLY_IMMUTABLE: true
  rule_6_note: >
    Proof Ledger = audit-grade immutable append-only.
    Dedup key = proof_id. IF duplicate proof_id → NO-OP, return ledger unchanged.
    FORBIDDEN: DELETE any entry, REPLACE entries[i] in-place, ALTER previous_entry_hash / entry_hash of prior entries.
    If ledger migration required: rename OLD dir proof-ledger → proof-ledger-archive/{sequence}/, NEW genesis = OLD.last_entry_hash.
    Proof objects themselves = immutable emissions, NEVER regenerated with mutated identity.
  ADR_002_RISK_MITIGATION_3_GOLDEN_REFERENCE_MATRIX_EXPANSION: true
  rule_7_note: >
    REQ-0001 = ROOT of TRUST fixture only.
    Future determinism coverage MUST include: REQ-0002 (multi aggregate Requirement + Capability + Policy) BEFORE T002 KBE gate opens;
    REQ-0010 (scale fixture 10+ instructions) before Sprint 0 exit.
    Golden content changes = MUST bump version 1.0.0→2.0.0 and create NEW file side-by-side; FROZEN old files preserved with original hash.
  ADR_002_RISK_MITIGATION_4_CATALOG_AS_PACKAGE_MANAGER_ENFORCED: true
  rule_8_note: >
    Transformation Catalog YAML = second most important file after Constitution.
    Each T entry MUST have ALL of: id, contract_ref, predicate_refs[], implementation_ref, proof_schema_ref, predecessor_id, successor_id,
    failure_strategy, rollback_strategy, semver, compatibility_matrix.requires/provides.
    Tooling reads YAML NOT hardcoded fallbacks. CLI `eos catalog show T003` MUST render compatibility matrix directly from YAML.
