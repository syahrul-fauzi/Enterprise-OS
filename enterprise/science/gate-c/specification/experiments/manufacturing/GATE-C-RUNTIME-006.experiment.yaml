version: "1.0.0"
status: EXPERIMENT_SUBJECT
experiment_subject_id: GATE-C-RUNTIME-006
domain: runtime
operation: verify-runtime-behavior
operation_label: VerifyRuntimeBehavior8ProofMatrix
schema_ref: specification/schemas/experiment.schema.yaml
illustrative_source: specification/hypothesis.yaml empirical_content_gate_c domain guinea pig Runtime verification row

predicate_anchor_map:
  pred_a_runtime_metrics_captured:
    expected_value: true
    rationale: >
      Execution harus benar-benar menghasilkan metrics yang valid dari runtime.
      recordWorkExecutionMetrics dan getWorkMetrics harus berjalan sesuai spesifikasi.
  pred_b_anomalies_detected:
    expected_value: true
    rationale: >
      Anomaly dapat terdeteksi dari runtime signal menggunakan detectMetricAnomalies.
      Tidak ada false negative dalam deteksi anomali.
  pred_c_incident_created:
    expected_value: true
    rationale: >
      Incident benar-benar tercipta ketika anomali terdeteksi. Lifecycle incident dimulai dengan benar.
  pred_d_acknowledge_recorded:
    expected_value: true
    rationale: >
      Lifecycle transition acknowledge tersimpan dengan benar di execution context.
  pred_e_circuit_breaker_works:
    expected_value: true
    rationale: >
      Recovery dan circuit-breaker behavior berjalan: shouldOpenCircuitBreaker dan shouldResetCircuitBreaker bekerja sesuai kondisi.
  pred_f_incident_resolved:
    expected_value: true
    rationale: >
      Incident dapat diselesaikan dan status berubah menjadi RESOLVED.
  pred_g_incident_closed:
    expected_value: true
    rationale: >
      Lifecycle incident dapat ditutup secara canonical tanpa state yang tersisa.
  pred_h_tenant_isolation_works:
    expected_value: true
    rationale: >
      Tenant isolation + evidence + durable read-back terbukti: traceExecutionByDecision dan getTraceForDecision memfilter tenantId dengan benar.

