transformation_contract:
  id: TC-RUNTIME-VERIFY-006
  name: Runtime 8-Proof Matrix Transformation Contract
  reference: LEX-000RT
  preconditions:
    - P1 Semua runtime primitives ter-export dan dapat diimport
    - P2 Core/B6 boundary terjaga, tidak ada perubahan core source
    - P3 Semua dependency closure terpenuhi
  postconditions:
    - Q1 Semua 8 proof dalam matrix terverifikasi dengan status PASS
    - Q2 Semua primitive dieksekusi (bukan hanya ada)
    - Q3 Runtime behavior terbukti sesuai spesifikasi
  invariants:
    - I1 Tidak ada cross-tenant contamination dalam trace execution
    - I2 Semua evidence append-only, tidak ada mutasi state yang tidak tercatat

expected_truth_table_row_match: P1
