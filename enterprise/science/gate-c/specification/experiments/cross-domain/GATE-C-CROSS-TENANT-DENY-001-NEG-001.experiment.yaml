transformation_contract:
  id: TC-CROSS-TENANT-GOV-002
  name: Cross-Tenant Unauthorized Access Governance Contract
  preconditions:
    - P1 Cross-tenant procurement request submitted with invalid/expired inter-tenant authorization
  postconditions:
    - Q1 Authorization is DENIED
    - Q2 State does NOT transition to AUTHORIZED
    - Q3 An UNAUTHORIZED_CROSS_TENANT_ATTEMPT event is logged in the evidence ledger
  invariants:
