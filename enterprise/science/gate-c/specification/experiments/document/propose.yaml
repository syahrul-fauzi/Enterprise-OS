predicate_anchor_map:
  pred_a_legitimate:
    expected_value: true
    rationale: >
      Authority originates from a well-formed Document Requirement then Document Policy then Document Contract AuthorityRel chain.
      Requirement DocReq-001 proposes after requirement approved.
      Policy DocPol-001 retention and classification policy derives authority from requirement via AuthorityRel ratifies.
      Contract DocCon-001 formal operational contract for proposal workflow derives authority from policy via AuthorityRel approves.
      No authority cycle detected. Root resolves to constitution vision then ASP then IA then governance reference implementation.
    authority_path_expected: Requirement then Policy then Contract then Epoch Sprint0 then Constitution
  pred_b_meaning_preserved:
    expected_value: true
    rationale: >
      Canonical Identity of the proposed document fixture doc fixtures documents proposal draft 001 SHALL remain identical before and after proposal operation.
      Proposal only attaches metadata proposer timestamp proposal_status proposer_signature_fingerprint but does not mutate normative content meaning.
      Title body classification retention_period unchanged. Semantic Equivalence equals TRUE.
    canonical_identity_expected: sha256 proposal draft 001 canonical id
  pred_c_provable:
    expected_value: true
    rationale: >
      Evidence of proposal plus audit trail entries SHALL exist in fixtures evidence sufficient to constructively entail postconditions below.
      Postconditions that must be entailed by evidence are proposal recorded status, proposer identity attested, timestamp recorded monotonic increasing.

