predicate_anchor_map:
  pred_a_legitimate:
    expected_value: true
    rationale: >
      Retrieve operation authorized by valid access control requestor possesses valid delegation authorization and document status permits retrieval APPROVED or ARCHIVED with retrieve allowed policy equals True per Policy.
      Authority chain from access policy retrieve roles to contract access control section to policy to requirement to constitution epoch.
      No cycle. Root resolved.
    authority_path_expected: Access Policy allowed role then Contract access control section then Policy then Requirement then Epoch then Constitution
  pred_b_meaning_preserved:
    expected_value: true
    rationale: >
      Semantic equivalence between canonical stored document fixtures documents source input and document received by requester after retrieval operation output.
      Even through transformations across serialization boundaries yaml to json to network transport to memory object the retrieve operation MUST deliver semantically equivalent content per MeaningPreserved predicate.
      Byte representation may differ example json vs yaml but Canonical Identity of the document MUST be identical between input and returned output.
    canonical_identity_expected: sha256 retrieved document 001 canonical id matches stored identity
  pred_c_provable:
    expected_value: true
    rationale: >
      Evidence MUST include access authorization decision trace authz pass fail retrieval evidence log timestamp requestor identity doc id bytes transferred or hash chain access evidence permanently logged to audit trail per Policy.
      Sufficient to constructively entail retrieval was performed for identity by requester at timestamp.

