    expected_evaluation_ref: specification/expected/evaluations/runtime-evaluations.yaml#expected_evaluations.RUNTM-006
    proof_matrix:
      - proof_id: 001
        name: Metrics Capture
        description: execution benar-benar menghasilkan metrics
        required_primitives:
          - recordWorkExecutionMetrics
          - getWorkMetrics
      - proof_id: 002
        name: Anomaly Detection
        description: anomaly dapat terdeteksi dari runtime signal
        required_primitives:
          - detectMetricAnomalies
      - proof_id: 003
        name: Incident Creation
        description: incident benar-benar tercipta
        required_primitives:
          - incident.create
      - proof_id: 004
        name: Acknowledge
        description: lifecycle transition tersimpan
        required_primitives:
          - incident.acknowledge
      - proof_id: 005
        name: Recovery
        description: recovery/circuit-breaker behavior benar-benar berjalan (verifikasi circuit breaker state dari execution context)
        required_primitives:
          - shouldOpenCircuitBreaker
          - shouldResetCircuitBreaker
          - recordObservedExecution
      - proof_id: 006
        name: Resolve
        description: incident dapat diselesaikan
        required_primitives:
          - incident.resolve
      - proof_id: 007
        name: Close
        description: lifecycle dapat ditutup secara canonical
        required_primitives:
          - incident.close
      - proof_id: 008
        name: Evidence / Isolation / Read-back
        description: tenant isolation + evidence + durable read-back terbukti
        required_primitives:
          - recordRuntimeInvocation
          - traceExecutionByDecision (tenant isolation filtering)
          - getTraceForDecision (read-back evidence)
