notes: |
  This manifest is the immutable laboratory notebook for Gate C specification reproducibility. It binds the experiment definition, oracle identity, reference dataset level, schema bundle, and integrity anchors into one portable contract. Execution runs MUST reference this manifest rather than duplicating specification identity inline. After Gate C0 PASS, the Science Kernel is calibrated and frozen; any later change to Oracle, Witness, Manifest, Dataset, or Protocol invalidates comparability unless handled as an instrument defect and re-calibration event.
