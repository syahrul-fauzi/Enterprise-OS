$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:eos:science:gate-c:schema:reproducibility-manifest:v1"
title: EOS Gate C Reproducibility Manifest Schema
description: >
  Machine-readable contract for the immutable reproducibility manifest that binds a Gate C
  specification release to the full experimental conditions, oracle identity, dataset level,
  truth table, protocol, schemas, and expected contracts.
type: object
additionalProperties: false
required:
  - version
  - manifest_id
  - status
  - gate
  - experiment
  - specification_release
  - environment
  - reference_dataset
  - oracle
  - truth_table
  - protocol
  - calibration
  - expected_contracts
  - schema_bundle
  - artifacts
  - execution
  - specification
  - integrity
properties:
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  manifest_id:
    type: string
    pattern: "^GATE-C-REPRO-MANIFEST-[0-9]{3}$"
  status:
    type: string
    enum: [PROPOSED, FROZEN, RETIRED]
  gate:
    const: GATE-C
  experiment:
    type: object
    additionalProperties: false
    required: [id, protocol_version, hypothesis_version]
    properties:
      id: { const: GATE-C }
      protocol_version: { type: string }
      hypothesis_version: { type: string }
  specification_release:
    type: object
    additionalProperties: false
    required: [release_id, freeze_state]
    properties:
      release_id: { type: string }
      freeze_state:
        type: string
        enum: [DRAFT, PARTIAL_FREEZE, FULL_FREEZE]
  environment:
    type: object
    additionalProperties: false
    required: [implementation, runtime, platform]
    properties:
      implementation: { type: string }
      runtime: { type: string }
      platform: { type: string }
  reference_dataset:
    type: object
    additionalProperties: false
    required: [dataset_version, manifest_ref, archive_target, certification_level]
    properties:
      dataset_version: { type: string }
      manifest_ref: { type: string }
      archive_target: { type: string }
      certification_level:
        type: string
        enum: [LEVEL_0_DEVELOPER, LEVEL_1_REFERENCE, LEVEL_2_CERTIFICATION, LEVEL_3_REGRESSION]
  oracle:
    type: object
    additionalProperties: false
    required: [oracle_id, oracle_ref, oracle_version, oracle_manifest_ref, oracle_hash]
    properties:
      oracle_id: { type: string }
      oracle_ref: { type: string }
      oracle_version: { type: string }
      oracle_manifest_ref: { type: string }
      oracle_hash: { type: string }
  truth_table:
    type: object
    additionalProperties: false
    required: [truth_table_ref, truth_table_version]
    properties:
      truth_table_ref: { type: string }
      truth_table_version: { type: string }
      truth_table_hash: { type: string }
  protocol:
    type: object
    additionalProperties: false
    required: [protocol_ref, protocol_version]
    properties:
      protocol_ref: { type: string }
      protocol_version: { type: string }
      protocol_hash: { type: string }
  calibration:
    type: object
    additionalProperties: false
    required:
      [calibration_report_id, calibration_report_ref, oracle_certificate_id, oracle_certificate_ref, witness_certificate_id, witness_certificate_ref, dataset_certificate_id, dataset_certificate_ref, kernel_status_ref]
    properties:
      calibration_report_id:
        type: string
        pattern: "^GATE-C0-CALIBRATION-REPORT-[0-9]{3}$"
      calibration_report_ref: { type: string }
      oracle_certificate_id:
        type: string
        pattern: "^SC-ORACLE-[0-9]{3}$"
      oracle_certificate_ref: { type: string }
      witness_certificate_id:
        type: string
        pattern: "^SC-WITNESS-[0-9]{3}$"
      witness_certificate_ref: { type: string }
      dataset_certificate_id:
        type: string
        pattern: "^SC-DATASET-[0-9]{3}$"
      dataset_certificate_ref: { type: string }
      kernel_status_ref: { type: string }
  expected_contracts:
    type: object
    additionalProperties: false
    required: [predicates_ref, evaluations_ref, expected_hash]
    properties:
      predicates_ref: { type: string }
      evaluations_ref: { type: string }
      expected_hash: { type: string }
  schema_bundle:
    type: object
    additionalProperties: false
    required: [schema_hash, schema_refs]
    properties:
      schema_hash: { type: string }
      schema_refs:
        type: array
        minItems: 1
        items: { type: string }
  artifacts:
    type: object
    additionalProperties: false
    required: [specification_hash, fixture_hash, oracle_hash, schema_hash]
    properties:
      specification_hash: { type: string }
      fixture_hash: { type: string }
      oracle_hash: { type: string }
      schema_hash: { type: string }
  execution:
    type: object
    additionalProperties: false
    required: [started_at, completed_at, seed]
    properties:
      started_at: { type: string }
      completed_at: { type: string }
      seed: { type: string }
  specification:
    type: object
    additionalProperties: false
    required: [hypothesis, protocol, truth_table, schemas, expected, signatures]
    properties:
      hypothesis: { type: string }
      protocol: { type: string }
      truth_table: { type: string }
      schemas:
        type: array
        minItems: 1
        items: { type: string }
      expected:
        type: object
        additionalProperties: false
        required: [predicates, evaluations]
        properties:
          predicates: { type: string }
          evaluations: { type: string }
      signatures:
        type: object
        additionalProperties: false
        required:
          [calibration_report, dataset_certificate, oracle_certificate, oracle_manifest, witness_certificate, witness_integrity, witness_bundle_layout]
        properties:
          calibration_report: { type: string }
          dataset_certificate: { type: string }
          oracle_certificate: { type: string }
          oracle_manifest: { type: string }
          witness_certificate: { type: string }
          witness_integrity: { type: string }
          witness_bundle_layout: { type: string }
  integrity:
    type: object
    additionalProperties: false
    required: [hash_basis, manifest_hash]
    properties:
      hash_basis: { type: string }
      manifest_hash: { type: string }
  notes:
    type: string
