scientific_phase_ordering:
  epistemological_basis: Gate C1 is a SCIENTIFIC EXPERIMENT falsifying CC-001.
    Coverage is measured AGAINST HYPOTHESIS FALSIFICATION, not against test case
    count.
  phase_order_mandatory:
    - PHASE_1: POSITIVE_CONTROL_ESTABLISHMENT
    - PHASE_2: NEGATIVE_CONTROL_CALIBRATION
    - PHASE_3: TRUTH_TABLE_COVERAGE_EXPANSION
    - PHASE_4: FALSIFICATION_ANALYSIS
  phase_current: PHASE_3
  phase_notes: >
    PHASE_1 completed at run-001. PHASE_2 calibration baseline remains valid.
    Truth-table corpus now spans P1 plus N1..N7. Gate C1 evidence is complete
    at the execution layer, but governance ratification remains pending until
    acceptance invariants and derived projections are fully normalized. PHASE_4
    requires that normalization audit passes together with independence,
    minimality, and counterfactual suites.
control_terminology_note: >
  Terminology is SCIENTIFIC CONTROL terminology. "Positive Test" → "POSITIVE
  CONTROL" (establishes PASS baseline for calibrated apparatus). "Negative Test"
  → "NEGATIVE CONTROL" (systematically falsifies each predicate by individually
  and jointly setting each to FALSE with all else held constant). Controls are
  designed to exercise the FULL 2^3=8 row Cartesian truth table of
  Constitutional Validity, one row per control.
diagnostic_order_of_diagnosis_IF_A_TEST_FAILS:
  mandatory_order:
    - STEP_1_FIXTURE: Is fixture content actually producing the scenario we are trying
        to test? (expected truth table row, expected witness pattern, expected
        contract) — MOST LIKELY ROOT CAUSE.
    - STEP_2_EXPECTED_TRUTH_TABLE: Is the expected predicate vector for this row
        consistent with truth-table.yaml + hypothesis H1?
    - STEP_3_EXECUTION: Did the reference runtime produce the witness for this control
        without crashes, hangs, or skipped stages?
    - STEP_4_EVIDENCE: Is the evidence artifact complete? Are canonical hashes
        computed on the proper exclusion basis? Is chain-of-custody populated?
    - STEP_5_ORACLE: Is the oracle actually applying the correct predicate evaluator
        REPLAY_AUTHORITY_RELATION / REPLAY_CANONICAL_IDENTITY /
        REPLAY_CONSTRUCTIVE_ENTAILMENT for this scenario?
    - STEP_6_SCIENCE_KERNEL: Is the Science Kernel bundle definition itself defective?
        ONLY QUESTION IF STEPS 1..5 ALL EXONERATED.
  forbidden_reverse_order: >
    Changing Oracle or Kernel before Fixture/Expected/Execution/Evidence is
    EXPLICITLY FORBIDDEN and invalidates the entire experiment run under the
    isolation axiom.
negative_control_exit_criteria:
  n_required_for_phase_2_complete: 1
  criteria_for_every_negative_control:
    - C1_FUNCTIONAL_CORRECTNESS: Expected verdict FAIL ∧ Actual verdict FAIL (must
        match at the verdict level; no false positive emission).
    - C2_DIAGNOSTIC_CORRECTNESS: Witness explicitly names which constitutional
        predicate failed. NOT a runtime crash, a syntax error, or an
        out-of-memory condition. Diagnostic predicate identifier MUST be in
        {pred_a_legitimate, pred_b_meaning_preserved, pred_c_provable} and MUST
        match the expected_diagnostic_predicate_failure for this control.
    - C3_MEASUREMENT_CORRECTNESS: Negative Control uses IDENTICAL measurement
        apparatus certificates, identical oracle_id, identical
        witness_certificate_id, identical dataset_certificate_id, and identical
        science_kernel_bundle_sha256 as the Positive Control replay run used for
        comparison (same epoch, no instrument drift).
    - C4_REPLAY_CORRECTNESS: "Replay of the same input fixture with the same kernel
        produces same verdict, same diagnostic predicate vector, and identical
        canonical evidence hash (byte-for-byte evidence for the witness
        canonical fields). Minor: Execution timestamp different OK; structural
        witness hash must match."
    - C5_ISOLATION_CORRECTNESS: "During the complete Negative Control experiment
        lifecycle (fixture authoring → last replay write): ZERO changes to the
        following files/categories: oracle.yaml, witness-integrity.yaml,
        manifest schemas, predicate evaluator definitions,
        science-kernel/bundle.manifest.yaml and bundle.sha256. IF any change
        recorded in git or hash diff, the experiment is INVALID and the control
        MUST be re-run after reverting instruments to baseline."
positive_control_replay_for_n1_comparison: run-003 (future replay of P1 with
  same kernel as N1) — establishes the identical-measurement-apparatus pair that
  N1 is compared against for C3 Measurement Correctness.
