      - Proof (ambiguous standalone — ALWAYS use Constitutional Proof prefix in EOS governance artifacts)
    epistemological_status: DERIVED_AUDITABLE_ARTIFACT_NOT_CONSTITUTIONAL
    derivation_chain: "(Legitimate(T)=TRUE ∧ MeaningPreserved(T)=TRUE ∧ Provable(T)=TRUE) [constitutional] → ConstitutionalProof(T) = ⟨w_A,w_B,w_C⟩ [derived witness tuple]; WITNESS FORM not normative; only JUSTIFICATION POWER normative."
    explicit_note: "Constitutional Proof is EXPLICITLY DERIVED. The ONLY constitutional-level concepts are: Predicate A (Legitimate), Predicate B (MeaningPreserved), Predicate C (Provable), and their conjunction ConstitutionallyValid(T) [IA-20]."
    cross_ref_axiom: [A, B, C, D]
    composite_id_scheme: "CP-<unix_millis>-<w_A_id_8hex>-<w_B_id_8hex>-<w_C_id_8hex>"
    witness_tuple: [LEX-0051, LEX-0052, LEX-0053]
    completeness_condition: "ConstitutionalProof(T) COMPLETE ⇔ ConstitutionallyValid(T) = TRUE ⇔ IA-20(T)=TRUE"
    aggregation_logic:
