ssot_note: SINGLE SOURCE OF TRUTH for all canonical EOS terminology. Every EOS artifact that introduces or uses a term that appears in EOS governance, canonical forms, contracts, or architectural invariants MUST have its canonical entry here. Tooling SHALL use this registry at Constitutional Verifier CV-STAGE-5 (LEX_SCAN) to reject unregistered terms, warn on deprecated aliases, and perform automatic term migration across epochs. Canonical terms are themselves CONSTITUTIONAL ARTIFACTS subject to PASAL 8 GB > GC filter and Evolution Domain A governance.
authoritative_ref:
  - IA-19 Constitutional Lexicon Registry (INVARIANT-ARCHITECTURE.yaml)
  - SEM-005 + SEM-006 + SEM-007 + SEM-008 (TERMINOLOGY-FREEZE-TF1.yaml)
  - Axiom A (Authority): Lexicon terms derive authority from this registry.
  - Axiom B (Meaning): Canonical terms are the meaning-vocabulary of EOS Canonical Forms.
lifecycle_model:
  states: [PROPOSED, ACTIVE, DEPRECATED, RETIRED, REJECTED]
  transitions:
    PROPOSED:  [ACTIVE, REJECTED]
    ACTIVE:    [DEPRECATED]
    DEPRECATED: [RETIRED]
    RETIRED:   []
    REJECTED:  []
  retention_policy:
    DEPRECATED: "retained indefinitely with alias field pointing to replacement; tooling emits WARNING."
    RETIRED:    "entry retained with historical status=RETIRED; tooling emits ERROR if used as primary term."

