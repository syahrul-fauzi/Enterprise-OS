  - term_id: LEX-0050
    canonical_term: Constitutional Proof
    definition: >
      DERIVED AUDITABLE ARTIFACT — NOT a constitutional-level concept.
      Constitutional Proof is the 3-WITNESS TUPLE that COLLECTS EVIDENCE JUSTIFYING each predicate TRUE:
        ConstitutionalProof(T) = ⟨witness_Legitimate(T), witness_MeaningPreserved(T), witness_Provable(T)⟩
      ConstitutionalProof(T) COMPLETE ⇔ ConstitutionallyValid(T) = IA-20(T) = TRUE.
      WITNESS FORM is NOT PRESCRIBED (fungible: YAML doc, JWT token, Merkle proof, Git commit hash chain,
      cryptographic signature bundle, RDF named graph, SQL table row — all valid).
      Only JUSTIFICATION POWER is normative: each w_X MUST be sufficient for a verifier to conclude Predicate_X=TRUE.
      A composite ID (format: CP-<unix_millis>-<w_A_id_8hex>-<w_B_id_8hex>-<w_C_id_8hex>) chains the witnesses.
      Composite ID + all 3 witness references appended ATOMICALLY to the Evidence Ledger;
      partial append = LEDGER_CORRUPTION (IA-17 FAIL).
      Downstream dependency order: ConstitutionalProof(T) COMPLETE → emit Evidence → Assessment → Justification → Verdict PASS.
    authority_source: IA-18 Constitutional Proof + CC-001 §6 Constitutional Validity + TERM-CONSTITUTIONAL-PROOF (TF1 witness tuple).
    epoch: Sprint0
    status: ACTIVE
    replacement: "—"
    aliases:
