    epistemological_status: FUNDAMENTAL_CONSTITUTIONAL_PREDICATE
    formal_signature: "Provable : Transformation → Boolean"
    formal_requirement: "Constructive entailment Evidence ⊢ Postconditions; no ex falso PASS."

