  - term_id: LEX-0000
    canonical_term: Constitutional Predicate Model
    definition: >
      THE IRREDUCIBLE FROZEN CORE of EOS (CC-001, one-decade horizon 2026–2036).
      NOT laws, NOT axioms — THREE FALSIFIABLE BOOLEAN PREDICATES + conjunction meta-predicate.
      Every architectural transformation SHALL be evaluated solely through:
        Predicate A: Legitimate(x)       — artifact authority chain is valid?
        Predicate B: MeaningPreserved(T) — semantic equivalence across T holds?
        Predicate C: Provable(T)         — evidence ⊢ postconditions of T?
      Constitutional Validity = Legitimate(T) ∧ MeaningPreserved(T) ∧ Provable(T).
      CC-001 §9 SCIENTIFIC METHOD: This model is a FALSIFIABLE HYPOTHESIS.
      Gate C/D/E evidence either CORROBORATES (all PASS reducible to ∧{A,B,C}) or FALSIFIES it.
      ALL other EOS concepts (Laws, Axioms, Graphs, Canonical Form, Proof, Planner, Runtime, Ledger)
      are STRICTLY DERIVED engineering mechanisms — NOT independently constitutional.
    authority_source: CC-001-CONSTITUTIONAL-CHARTER.md (FROZEN_FOR_ONE_DECADE_HORIZON) §2 Predicate Model + §6 Constitutional Validity + §9 Scientific Method
    epoch: Sprint0
    status: ACTIVE
    replacement: "—"
    aliases:
      - Three Constitutional Predicates (EOS Frozen Core)
      - Predicate Core (EOS)
      - CC-001 Irreducible Core
    epistemological_status: FALSIFIABLE_CONSTITUTIONAL_HYPOTHESIS
    frozen_scope: [Predicate A, Predicate B, Predicate C, Constitutional Validity Conjunction]
    derived_concepts: [Three Fundamental Laws, Four Constitutional Axioms, Authority Graph, Knowledge Graph, Canonical Form, Constitutional Proof, All IA-xx Invariants]

  - term_id: LEX-0000A
    canonical_term: Predicate A — Legitimate(x)
    definition: >
      CONSTITUTIONAL PREDICATE A (CC-001 §3). Boolean function: Artifact → {TRUE, FALSE}.
      Answers: "Apakah artefak x memiliki rantai legitimasi yang sah?" (Does x have a valid authority chain?).
      Formal: Legitimate(x) ⇔ AuthorityRoot(x) exists ∧ AuthorityPath(x) ⊆ AuthorityRel ∧ NoCycle(AuthorityPath(x)).
      AuthorityRel = {Authorizes, Delegates, Supersedes, Approves, DerivesAuthorityFrom, Ratifies, Amends, EpochBinds}
      — this FROZEN relation set is fundamental; Authority Graph is ONE derived materialization.
    authority_source: CC-001 §3 Predicate A + TERM-PRED-A-LEGITIMATE (TF1) + AuthorityRel frozen relation set
    epoch: Sprint0
    status: ACTIVE
    replacement: "—"
    aliases:
      - Legitimate(x) (EOS Predicate A)
      - Predikat A — Sah(x) (Bahasa Indonesia)
    epistemological_status: FUNDAMENTAL_CONSTITUTIONAL_PREDICATE
    frozen_relation_set: AuthorityRel
    formal_signature: "Legitimate : Artifact → Boolean"

  - term_id: LEX-0000B
    canonical_term: Predicate B — MeaningPreserved(T)
    definition: >
      CONSTITUTIONAL PREDICATE B (CC-001 §4). Boolean function: Transformation → {TRUE, FALSE}.
      Answers: "Apakah ekuivalensi makna terjaga lintas transformasi T?" (Is semantic equivalence preserved across T?).
      Formal: MeaningPreserved(T) ⇔ CanonicalIdentity well-defined on inputs(T)/outputs(T) ∧
              SemanticEquivalence(⊔inputs(T), ⊔outputs(T)) = TRUE.
      What is tested: CANONICAL IDENTITY (abstract logical identity) + SEMANTIC EQUIVALENCE,
      NOT representation (YAML/JSON/Proto/etc). SemanticRel = {DependsOn, Implements, Extends, Contains,
      References, EquivalentTo, Specializes, Refines, Uses} FROZEN relation set is fundamental;
      Knowledge Graph is ONE derived materialization.
    authority_source: CC-001 §4 Predicate B + TERM-PRED-B-MEANINGPRESERVED (TF1) + CanonicalIdentity + SemanticRel
    epoch: Sprint0
    status: ACTIVE
    replacement: "—"
    aliases:
      - MeaningPreserved(T) (EOS Predicate B)
      - Predikat B — MaknaTerjaga(T) (Bahasa Indonesia)
    epistemological_status: FUNDAMENTAL_CONSTITUTIONAL_PREDICATE
    frozen_relation_set: SemanticRel
    formal_signature: "MeaningPreserved : Transformation → Boolean"
    fundamental_concepts: [Canonical Identity, Semantic Equivalence, Transformation Contract]

  - term_id: LEX-0000C
    canonical_term: Predicate C — Provable(T)
    definition: >
      CONSTITUTIONAL PREDICATE C (CC-001 §5). Boolean function: Transformation → {TRUE, FALSE}.
      Answers: "Apakah bukti cukup untuk membuktikan postcondition T?" (Is evidence sufficient to entail T's postconditions?).
      STRONGER than "Proof": Proof is an artifact; Provable is a PROPERTY of the transformation.
      Formal: Provable(T) ⇔ ∀ t ∈ executions(T) : Evidence(t,T) ⊢ Postconditions(T) ∧
              ¬∃ evidential gap allowing ¬Postconditions(T) while Verdict PASS is emitted.
      Example: Execution → Evidence → Assessment → Verdict flow is NOT automatically Provable=TRUE
      if Evidence is insufficient to constructively entail Postconditions.
    authority_source: CC-001 §5 Predicate C + TERM-PRED-C-PROVABLE (TF1)
    epoch: Sprint0
    status: ACTIVE
    replacement: "—"
    aliases:
