mutation_integrity_framework:
  version: "1.0"
  created: "2026-11-14"

  mutation_flow:
    - step: 1
      action: "Read existing state + evidence before mutation"
      description: "Every mutation must start with reading the current state and its supporting evidence"

    - step: 2
      action: "Write new evidence into evidence/ first"
      description: "New evidence must be written to the evidence directory before any state change"

    - step: 3
      action: "Apply state change only after evidence is persisted"
      description: "State changes can only happen after supporting evidence is safely stored"

    - step: 4
      action: "Record mutation event in state-log/"
      description: "Every state change must be logged with timestamp, author, and evidence reference"

  recovery_guarantees:
    - guarantee: "No state change without evidence"
      description: "All state changes must have corresponding evidence artifacts"

    - guarantee: "Every state change is replayable"
      description: "The full history of state changes can be reconstructed from evidence and logs"

    - guarantee: "State can be rebuilt from evidence alone"
      description: "The current state can be regenerated by replaying all evidence artifacts"

  audit_trail_requirements:
    - "Every commit message must reference the evidence it introduces or modifies"
    - "No 'refactor' commits without evidence of the refactoring's correctness"
    - "No 'cleanup' commits without evidence of what was cleaned up and why"
    - "No 'fix' commits without evidence of the bug and its resolution"

  notes:
    - "This file is part of EOS-STATE-NEXT-002 implementation"
    - "No mutation enforcement has been implemented yet - this is the integrity framework definition"