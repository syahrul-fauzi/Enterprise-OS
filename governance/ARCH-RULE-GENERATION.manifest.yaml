abbreviation: ARCH-MAN
evolution_domain: DOMAIN-B-SPECIFICATION
ssot_note: THIS_MANIFEST_IS_THE_SINGLE_TRUTH_FOR_THE_MAPPING_BETWEEN_CONSTITUTION_STATEMENTS_(IA/ASP)_AND_THEIR_GENERATED_ACL_RULES_(ARCH-*)._IT_IMPLEMENTS_MP-01(A):_EVERY_IA_STATEMENT_WITH_ENFORCEMENT_ACL_RULE_ID_MUST_HAVE_A_CORRESPONDING_GENERATED_ARTIFACT._THIS_MANIFEST_ITSELF_IS_INPUT_TO_CC-PASS-4-VERIFICATION-RULE-GEN_OF_THE_CONSTITUTIONAL_COMPILER._NO_NEW_ARCH-RULE_MAY_EXIST_WITHOUT_A_ENTRY_IN_THIS_MANIFEST_DECLARING_WHICH_CONSTITUTION_SOURCE_PRODUCES_IT.
governance_ref:
  mp01_a: /root/Enterprise OS/governance/ARCHITECTURAL-STABILITY-PRINCIPLES.yaml#MP-01
  cc_pass4: /root/Enterprise OS/enterprise/specifications/CONSTITUTIONAL-COMPILER.spec.yaml#five_compiler_passes[CC-PASS-4-VERIFICATION-RULE-GEN]
  ia: /root/Enterprise OS/governance/INVARIANT-ARCHITECTURE.yaml
  asp: /root/Enterprise OS/governance/ARCHITECTURAL-STABILITY-PRINCIPLES.yaml
derived_from:
  - User_Point_Governance_Rules_Generated_Not_Manual
  - User_MP01_Computable_Governance_A
  - IA-06_Forbidden_Dependency_Table
  - IA-10_14_Invariants_With_ACL_IDs

manifest_preamble:
  statement: |
    Each ARCH-* compliance rule in EOS is declared here with:
      - source: which IA or ASP statement produced it
      - generation: whether MANUAL (legacy transitional) or GENERATED (from CONST-COMP Pass 4)
      - parameters: compiled scan parameters that Constitutional Verifier consumes
      - generated_path: for GENERATED rules, the output path under build/governance/generated-arch-rules/
      - violation_class: what type of governance failure it catches
      - remediation_snippet_ref: pointer to documentation explaining how to fix
    The goal per MP-01: 100% GENERATED at Phase 2 (Gate E exit).
    During Phase 0 (current), MANUAL rules exist for legacy ACL-001..007. All rules ARCH-18 onwards are GENERATED or in dual-source transition.

generation_status_legend:
  - id: MANUAL_LEGACY
    description: "Written by hand in architecture-compliance.yaml. No compiler pass produces it. PHASE 0 only. Sunset target Phase 2."
  - id: DUAL_SOURCE_TRANSITION
    description: "Both hand-written intent AND generated .yaml exist. Generated is canonical. Hand-writing = migration reference only. Phase 0-1."
  - id: GENERATED
    description: "Generated artifact ONLY. No hand-written source-of-truth. Phase 1+ target. Phase 2 mandatory for new rules."

rule_catalog:

  # ───────────────── Legacy Manual Rules (ACL-001..007) ─────────────────

  - arch_rule_id: ACL-001
    short_name: Frozen root directories
    source_statement_ref: ASP-01 + Sprint 0 Baseline Lock
    source_file_ref: /root/Enterprise OS/governance/BASELINE_LOCK.yaml
    generation: MANUAL_LEGACY
    scan_type: STRUCTURE_DIRECTORY_ENUMERATION
    check_parameters:
      allowed_root_dirs: [apps, capabilities, packages, contracts, decisions, config, scripts, governance, enterprise, build, implementation, experiments, workspace, workspace-legacy]
      forbidden_new_root_globs: ["!(apps|capabilities|packages|contracts|decisions|config|scripts|governance|enterprise|build|implementation|experiments|workspace|workspace-legacy)"]
    violation_class: BASELINE_VIOLATION
    remediation_snippet_ref: /root/Enterprise OS/governance/BASELINE_LOCK.yaml#remediation_add_root_dir
    sunset_plan: Phase 1 migration to a new GENERATED rule ARCH-26 via new IA statement for repository structural constitution.

  - arch_rule_id: ACL-002
    short_name: Package boundary authority declared
    source_statement_ref: ASP-01 + EVO-DOMAINS + package-authority.yaml
    source_file_ref: /root/Enterprise OS/governance/package-authority.yaml
    generation: MANUAL_LEGACY
    scan_type: METADATA_PRESENCE
    check_parameters:
      package_families_required: [core, composition, presentation, tooling]
      authority_field_required_per_package: [owner_team, allowed_change_class]
    violation_class: BASELINE_VIOLATION
    remediation_snippet_ref: /root/Enterprise OS/governance/package-authority.yaml
    sunset_plan: Phase 1 → ARCH-27 (from Domain Type System)

  - arch_rule_id: ACL-003
    short_name: Dependency law declared
    source_statement_ref: IA-06 Forbidden Dep Table
    source_file_ref: /root/Enterprise OS/governance/dependency-rules.yaml
    generation: MANUAL_LEGACY
    scan_type: POLICY_YAML_LOADABLE
    check_parameters:
      loadable_keys: [dependency_direction, prohibited_dependencies]
    violation_class: BASELINE_VIOLATION
    sunset_plan: Phase 1 → absorbed by ARCH-18-INV-TABLE (already GENERATED)

  - arch_rule_id: ACL-004
    short_name: Artifact lifecycle declared
    source_statement_ref: PROTO-GOV + IA-08
    source_file_ref: /root/Enterprise OS/governance/artifact-lifecycle.yaml
    generation: MANUAL_LEGACY
    scan_type: POLICY_YAML_LOADABLE
    check_parameters:
