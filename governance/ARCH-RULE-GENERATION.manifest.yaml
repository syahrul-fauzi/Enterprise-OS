      gates_required: [Gate_A, Gate_B, Gate_C, Gate_D, Gate_E]
    violation_class: BASELINE_VIOLATION
    sunset_plan: After Sprint 0 completion — this rule retires with the sprint.

  - arch_rule_id: ACL-006
    short_name: Baseline lock certificate declared
    source_statement_ref: Baseline Lock ADR-000
    source_file_ref: /root/Enterprise OS/governance/BASELINE_LOCK.yaml
    generation: MANUAL_LEGACY
    scan_type: POLICY_YAML_LOADABLE
