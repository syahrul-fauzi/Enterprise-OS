        downstream_src_paths: ["packages/core/runtime/**", "packages/core/*/src/passes/**", "packages/tooling/**", "packages/composition/**", "apps/**", "capabilities/**"]
      forbid_patterns:
        - fs.writeFileSync(upstream_path)
        - fs.appendFileSync(upstream_path)
        - fs.unlinkSync(upstream_path)
        - any DELETE/PUT/PATCH to REST endpoints managing upstream yaml
      domain_classification:
        glob_mapping_ref: /root/Enterprise OS/governance/EVOLUTION-DOMAINS.yaml#domain_artifact_full_mapping
        unclassified_error: "Any new .yaml / .ts / .tsx file MUST have either (a) explicit evolution_domain header or (b) match a glob in domain_artifact_full_mapping."
      direct_edit_prohibit_check: "For Domain A/B artifacts with direct_edit_prohibited=true: any edit MUST include ADR reference in commit message, else fail."
    vgen_id: VGEN-ASP02+04
    violation_class: AUTHORITY_REVERSAL / UNCLASSIFIED_ARTIFACT
    remediation_snippet_ref: /root/Enterprise OS/governance/ARCHITECTURAL-STABILITY-PRINCIPLES.yaml#ASP-02/enforcement

  - arch_rule_id: ARCH-25
    short_name: Protocol Boundary + Conformance + Private Import Forbid
    source_statement_ref: Protocol Governance (all)
    source_file_ref: /root/Enterprise OS/governance/PROTOCOL-GOVERNANCE.yaml
    generation: GENERATED
    generated_path: build/governance/generated-arch-rules/ARCH-25.generated.yaml
    scan_type: PROTOCOL_BOUNDARY_SCAN
    compiled_check_parameters:
      conformance_impl_private_import_forbid: true
      forbidden_import_targets:
        - from CONFORMANCE test files into IMPLEMENTATION private modules (e.g., "../impl/src/internal.ts")
        - rule: conformance test files may ONLY import public protocol interface modules
      ad_hoc_type_version_hash_headers_require:
        - rule: "Cross-component typed exchange objects (typed as Plan / IR / Evidence) MUST carry ir_format_version + ir_content_hash (or plan_hash equivalent)."
        - target_globs: ["packages/**/src/protocols/**/*.ts", "workspace/contracts/*.ts"]
      canonical_sufficiency_delegation_forbid:
        - rule: "No protocol YAML may reference implementation source code lines for semantics (e.g., 'matches impl/file.ts:42')."
        - target_globs: ["enterprise/specifications/protocols/*.yaml", "workspace/contracts/*.contract.yaml"]
    vgen_id: VGEN-PROTO-BOUNDARY
    violation_class: PROTOCOL_EROSION
    remediation_snippet_ref: /root/Enterprise OS/governance/PROTOCOL-GOVERNANCE.yaml#protocol_is_multi_faceted

  # ───────────────── Type System Rules (from Evolution Domain Type System) ─────────────────

  - arch_rule_id: ARCH-26-TYPE-IMPORT
    short_name: Type System — Forbidden Import Type Check
    source_statement_ref: Evolution Domains as Type System (artifact.schema.yaml#artifact_type + CONSTIT-IR.type_system_section)
    source_file_ref:
      - /root/Enterprise OS/enterprise/schema/artifact.schema.yaml#artifact_type
      - /root/Enterprise OS/workspace/contracts/CONSTITUTION-IR.contract.yaml#type_system_section
    generation: GENERATED
    generated_path: build/governance/generated-arch-rules/ARCH-26-TYPE-IMPORT.generated.yaml
    scan_type: TYPE_IMPORT_GRAPH_CHECK
    compiled_check_parameters:
      type_system_anchor: artifact.schema.yaml#artifact_type.type_name enum (18 types)
      cannot_import_type_rules_ref: CONSTIT-IR.type_system_section.types[].type_rules[cannot_import_type]
      cv_check_id: CV-TYPE-01
      severity_for_unallowed_import: FATAL
    vgen_id: VGEN-TYPE-SYSTEM
    violation_class: TYPE_ERROR_IMPORT_FORBIDDEN
    remediation_snippet_ref: /root/Enterprise OS/enterprise/schema/artifact.schema.yaml#artifact_type/type_rules

  - arch_rule_id: ARCH-27-TYPE-MUTATE
    short_name: Type System — Forbidden Mutation Type Check
    source_statement_ref: Evolution Domains as Type System (cannot_mutate_type rules + direct_edit_prohibited)
    source_file_ref:
      - /root/Enterprise OS/enterprise/schema/artifact.schema.yaml#artifact_type
      - /root/Enterprise OS/workspace/contracts/CONSTITUTION-IR.contract.yaml#type_system_section
    generation: GENERATED
    generated_path: build/governance/generated-arch-rules/ARCH-27-TYPE-MUTATE.generated.yaml
    scan_type: TYPE_MUTATION_WRITE_SCAN
    compiled_check_parameters:
      cannot_mutate_type_rules_ref: CONSTIT-IR.type_system_section.types[].type_rules[cannot_mutate_type]
      cv_check_id: CV-TYPE-02
      upstream_write_paths: ["governance/**", "enterprise/specifications/**", "workspace/contracts/**"]
      downstream_src_paths: ["packages/**/*.ts", "apps/**/*.ts", "capabilities/**/*.ts"]
    vgen_id: VGEN-TYPE-SYSTEM
    violation_class: TYPE_ERROR_MUTATION_FORBIDDEN
    remediation_snippet_ref: /root/Enterprise OS/enterprise/schema/artifact.schema.yaml#artifact_type/type_rules

  - arch_rule_id: ARCH-28-TYPE-UNCLASSIFIED
    short_name: Type System — Unclassified Artifact Check
    source_statement_ref: ASP-04 Disjoint Exhaustive Domains + artifact.schema.yaml#artifact_type (every artifact must have a type)
    source_file_ref:
      - /root/Enterprise OS/governance/ARCHITECTURAL-STABILITY-PRINCIPLES.yaml#ASP-04
      - /root/Enterprise OS/enterprise/schema/artifact.schema.yaml
    generation: GENERATED
    generated_path: build/governance/generated-arch-rules/ARCH-28-TYPE-UNCLASSIFIED.generated.yaml
    scan_type: ARTIFACT_CLASSIFICATION_ENUMERATION
    compiled_check_parameters:
      cv_check_id: CV-TYPE-03
      fallback_glob_mapping_ref: /root/Enterprise OS/governance/EVOLUTION-DOMAINS.yaml#domain_artifact_full_mapping
      required_header_fields: [artifact_type.type_name, artifact_type.evolution_domain]
      severity_domain_a_b_missing: FATAL
      severity_domain_c_missing: WARN
    vgen_id: VGEN-TYPE-SYSTEM
    violation_class: TYPE_ERROR_UNCLASSIFIED_ARTIFACT
    remediation_snippet_ref: /root/Enterprise OS/governance/EVOLUTION-DOMAINS.yaml#artifact_default_manifest_prototype

  # ───────────────── Conformance Properties Rules ─────────────────

  - arch_rule_id: ARCH-29-CONF-PROP-MEASURE
    short_name: Six-Dimensional Conformance Property Measurement
    source_statement_ref: CONFORMANCE-PROPERTIES.yaml (Deterministic / Compatible / Reproducible / Auditable / Explainable / Canonical)
    source_file_ref: /root/Enterprise OS/governance/CONFORMANCE-PROPERTIES.yaml
    generation: GENERATED
    generated_path: build/governance/generated-arch-rules/ARCH-29-CONF-PROP-MEASURE.generated.yaml
    scan_type: AGGREGATE_MEASUREMENT_DRIVER (not a single regex; aggregates Stage 1-3 into property vectors)
    compiled_check_parameters:
      measurement_algorithms: [MEASURE-DET-v1, MEASURE-COMPAT-v1, MEASURE-REPRO-v1, MEASURE-AUDIT-v1, MEASURE-EXP-v1, MEASURE-CAN-v1]
      vector_schema_ref: /root/Enterprise OS/governance/CONFORMANCE-PROPERTIES.yaml#conformance_property_vector_schema
      overall_verdict_logic_ref: /root/Enterprise OS/governance/CONFORMANCE-PROPERTIES.yaml#overall_verdict_logic
    vgen_id: VGEN-CONF-PROP
    violation_class: CONFORMANCE_PROPERTY_FAIL
    remediation_snippet_ref: /root/Enterprise OS/governance/CONFORMANCE-PROPERTIES.yaml#overall_verdict_logic

  # ───────────────── Authority DAG Rules ─────────────────

  - arch_rule_id: ARCH-30-DAG-REVERSE
    short_name: Authority DAG — Reverse Edge Detection
    source_statement_ref: Authority Flow DAG Direction Rule (edge direction = authority direction; reverse = invalid)
    source_file_ref: /root/Enterprise OS/enterprise/schema/AUTHORITY-DAG.schema.yaml#validation_rules/AUTHORITY_DIRECTION
    generation: GENERATED
    generated_path: build/governance/generated-arch-rules/ARCH-30-DAG-REVERSE.generated.yaml
    scan_type: DAG_EDGE_DIRECTION_CHECK
    compiled_check_parameters:
      cv_check_id: CV-DAG-01
      topological_invariant: "topological_order_index(from) < topological_order_index(to)"
