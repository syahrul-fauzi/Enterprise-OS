  # ───────────────── Generated Rules (ARCH-18..ARCH-25) ─────────────────

  - arch_rule_id: ARCH-18-ONT-TRIAD
    short_name: Ontological Triad enforcement (Knowledge × Registry × Runtime)
    source_statement_ref: IA-01 Ontological Triad
    source_file_ref: /root/Enterprise OS/governance/INVARIANT-ARCHITECTURE.yaml#principle_01_ontological_triad
    generation: DUAL_SOURCE_TRANSITION
    generated_path: build/governance/generated-arch-rules/ARCH-18-ONT-TRIAD.generated.yaml
    scan_type: CROSS_LAYER_DEPENDENCY_SCAN
    compiled_check_parameters:
      zone_separation:
        KNOWLEDGE_zone_paths: ["enterprise/constitution/**", "enterprise/knowledge/**", "enterprise/schema/**", "enterprise/library/**", "workspace/contracts/**"]
        REGISTRY_zone_paths: ["workspace/packages/core/*-registry/src/registry/**"]
        RUNTIME_zone_paths: ["workspace/packages/core/runtime/**", "workspace/packages/tooling/eos-cli/**"]
      forbidden_cross_zone_imports:
        KNOWLEDGE_imports_RUNTIME: true
        KNOWLEDGE_imports_REGISTRY_IMPL: true
        REGISTRY_imports_RUNTIME_STATE: true
    vgen_id: VGEN-IA01-TRIAD
    violation_class: ONTOLOGICAL_DRIFT
    remediation_snippet_ref: /root/Enterprise OS/governance/INVARIANT-ARCHITECTURE.yaml#principle_01_ontological_triad/remediation_pattern

  - arch_rule_id: ARCH-18-INV-TABLE
    short_name: Invariant Dependency Table (8 forbidden dep pairs)
    source_statement_ref: IA-06 Forbidden Dependency Table
    source_file_ref: /root/Enterprise OS/governance/INVARIANT-ARCHITECTURE.yaml#principle_06_machine_enforced_invariant_table
    generation: GENERATED
    generated_path: build/governance/generated-arch-rules/ARCH-18-INV-TABLE.generated.yaml
    scan_type: DEPENDENCY_GRAPH_ENFORCEMENT
    compiled_check_parameters:
      forbidden_dep_table_ref: /root/Enterprise OS/governance/INVARIANT-ARCHITECTURE.yaml#principle_06_machine_enforced_invariant_table/forbidden_dependency_table
    vgen_id: VGEN-IA06-TABLE
    violation_class: EPISTEMIC_DEPENDENCY_REVERSAL
    remediation_snippet_ref: /root/Enterprise OS/governance/INVARIANT-ARCHITECTURE.yaml#principle_06_machine_enforced_invariant_table/acl_enforcement

  - arch_rule_id: ARCH-19
    short_name: Knowledge Not Embedded in Runtime Literal Scan
    source_statement_ref: IA-09 Knowledge Not In Runtime
    source_file_ref: /root/Enterprise OS/governance/INVARIANT-ARCHITECTURE.yaml#principle_09_knowledge_not_in_runtime
    generation: DUAL_SOURCE_TRANSITION
    generated_path: build/governance/generated-arch-rules/ARCH-19.generated.yaml
    scan_type: REGEX_PATTERN_SCAN
    compiled_check_parameters:
      target_paths: ["packages/core/runtime/**/*.ts", "packages/tooling/eos-cli/**/*.ts", "packages/composition/**/*.ts", "apps/**/*.ts"]
      forbidden_patterns:
        - T\d{3}(?![\w-])  (transformation ids outside registry loader context)
        - PRED-\d{2,}       (predicate ids outside predicate loader)
        - capability:[\"']?[a-z]+-[a-z]+[\"']?  (capability kebab-case ids)
      context_whitelist:
        - file paths containing "registry/src/*-loader" (registry loader context allowed)
        - string is inside a contract_ref path string (pointing at YAML — acceptable)
    vgen_id: VGEN-IA09-RUNTIME
    violation_class: KNOWLEDGE_EMBEDDED_AT_RUNTIME
    remediation_snippet_ref: /root/Enterprise OS/governance/INVARIANT-ARCHITECTURE.yaml#principle_09_knowledge_not_in_runtime/remediation_pattern

  - arch_rule_id: ARCH-20-IA10-SNAPSHOT
    short_name: Immutable Knowledge Snapshot Boundary Enforcement
    source_statement_ref: IA-10 Immutable Knowledge Snapshot
    source_file_ref: /root/Enterprise OS/governance/INVARIANT-ARCHITECTURE.yaml#principle_10_immutable_knowledge_snapshot
    generation: GENERATED
    generated_path: build/governance/generated-arch-rules/ARCH-20-IA10-SNAPSHOT.generated.yaml
    scan_type: MUTABLE_READ_SCAN + EXEC_PLAN_SNAPSHOT_FIELD_CHECK
    compiled_check_parameters:
      mutable_reads_forbidden_paths:
        - "enterprise/constitution/**"
        - "enterprise/schema/**"
        - "workspace/contracts/**"
        - "governance/**"
      post_planning_src_dirs:
        - "packages/core/runtime/src"
        - "packages/core/registry-resolver/src"
        - "packages/core/proof-ledger/src"
        - "packages/composition/**"
      snapshot_attachment_field_name: knowledge_snapshot
      check_exec_plan: "Every ExecutionPlan object MUST carry non-empty knowledge_snapshot.id matching KS-\\d{4}\\.\\d{2}\\.\\d{2}\\.\\d{3}"
    vgen_id: VGEN-IA10
    violation_class: SNAPSHOT_BOUNDARY_VIOLATION
    remediation_snippet_ref: /root/Enterprise OS/governance/INVARIANT-ARCHITECTURE.yaml#principle_10_immutable_knowledge_snapshot/post_planning_prohibited_interactions

  - arch_rule_id: ARCH-21-IA11-SEM-DET
    short_name: Semantic Determinism — No Non-Deterministic Primitives in Semantic Paths
    source_statement_ref: IA-11 Semantic Determinism
    source_file_ref: /root/Enterprise OS/governance/INVARIANT-ARCHITECTURE.yaml#principle_11_semantic_determinism
    generation: GENERATED
    generated_path: build/governance/generated-arch-rules/ARCH-21-IA11-SEM-DET.generated.yaml
    scan_type: NON_DETERMINISTIC_PRIMITIVE_SCAN
    compiled_check_parameters:
      non_det_signatures:
        - "Math.random"
        - "Date.now"
        - "new Date()"
        - "fetch("
        - "axios"
        - process.env_conditional_branch: true  (process.env used in if/else for semantic decision)
      allowed_contexts:
        - diagnostics_only_block (diagnostics[] or console.log timestamp — not semantic branch)
      deterministic_tiebreak_signatures:
        - ".localeCompare("
        - "Object.keys().sort()"
        - ".sort((a,b)=>a.localeCompare(b))"
      semantic_path_globs:
        - "packages/core/registry-resolver/**/*.ts"
        - "packages/core/*/src/passes/**/*.ts"
        - "packages/core/runtime/**/*[!test].ts"
    vgen_id: VGEN-IA11
    violation_class: SEMANTIC_NONDETERMINISM
    remediation_snippet_ref: /root/Enterprise OS/governance/INVARIANT-ARCHITECTURE.yaml#principle_11_semantic_determinism/anti_patterns

  - arch_rule_id: ARCH-22-IA13-STABLE-IR
    short_name: Stable Intermediate Representations — Format + Version + Hash
    source_statement_ref: IA-13 Stable Intermediate Representations
    source_file_ref: /root/Enterprise OS/governance/INVARIANT-ARCHITECTURE.yaml#principle_13_stable_intermediate_representations
    generation: GENERATED
    generated_path: build/governance/generated-arch-rules/ARCH-22-IA13-STABLE-IR.generated.yaml
    scan_type: IR_CONTRACT_HEADER_SCAN
    compiled_check_parameters:
      required_ir_contract_paths:
        - "workspace/contracts/KNOWLEDGE-SNAPSHOT.contract.yaml"
        - "workspace/contracts/KNOWLEDGE-IR.contract.yaml"
        - "workspace/contracts/DECISION-IR.contract.yaml"
        - "workspace/contracts/EVIDENCE-PROVENANCE-GRAPH.contract.yaml"
        - "workspace/contracts/CONSTITUTION-IR.contract.yaml"
      required_protocol_version_fields: [ir_format_version, plan_format_version, format_version]
      required_protocol_hash_fields: [ir_content_hash, plan_hash, content_hash]
      emitter_source_scan: "All pass emitters that produce IR files MUST set both required version + hash fields before write."
    vgen_id: VGEN-IA13
    violation_class: IR_INSTABILITY
    remediation_snippet_ref: /root/Enterprise OS/governance/INVARIANT-ARCHITECTURE.yaml#principle_13_stable_intermediate_representations/ir_properties_required_per_ir

  - arch_rule_id: ARCH-23-IA14-PURE-PASS
    short_name: Pure Compiler Pass — No Upstream Mutation / No Undeclared State
    source_statement_ref: IA-14 Pure Compiler Passes
    source_file_ref: /root/Enterprise OS/governance/INVARIANT-ARCHITECTURE.yaml#principle_14_pure_compiler_passes
    generation: GENERATED
    generated_path: build/governance/generated-arch-rules/ARCH-23-IA14-PURE-PASS.generated.yaml
    scan_type: IMPURITY_PATTERN_SCAN + UPSTREAM_WRITE_SCAN
    compiled_check_parameters:
      pass_source_glob: "packages/**/*/src/passes/**/*.pass.ts"
      upstream_forbid_write_paths:
        - "governance/**"
        - "enterprise/constitution/**"
        - "enterprise/schema/**"
        - "enterprise/execution/**"
        - "enterprise/specifications/SEMANTIC-KERNEL.yaml"
        - "workspace/contracts/**"
      undeclared_external_state_signatures:
        - process.env_branch_in_semantic_code
        - new Date in non-diagnostics
        - Math.random
        - fetch/axios
        - globalThis mutable write
    vgen_id: VGEN-IA14
    violation_class: COMPILER_PASS_IMPURITY
    remediation_snippet_ref: /root/Enterprise OS/governance/INVARIANT-ARCHITECTURE.yaml#principle_14_pure_compiler_passes/per_pass_properties_required

  - arch_rule_id: ARCH-24
    short_name: Downward Authority Only + Evolution Domain Classification
    source_statement_ref: ASP-02 (Downward) + ASP-04 (Disjoint Domains)
    source_file_ref:
      - /root/Enterprise OS/governance/ARCHITECTURAL-STABILITY-PRINCIPLES.yaml#ASP-02
      - /root/Enterprise OS/governance/ARCHITECTURAL-STABILITY-PRINCIPLES.yaml#ASP-04
    generation: GENERATED
    generated_path: build/governance/generated-arch-rules/ARCH-24.generated.yaml
    scan_type: UPSTREAM_WRITE_SCAN + DOMAIN_CLASSIFICATION_SCAN
    compiled_check_parameters:
      forbid_write_by_impl_of_upstream:
