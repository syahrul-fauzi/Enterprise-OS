# OpenTelemetry Alignment (Observability ≠ Repair — strictly enforced)
observability_guidelines:
  - "Instrumentation may only collect telemetry to answer these questions (no more, no less): What happened? Where? Under which Work? Which execution? Which context? Which artifact? Which actor? Which transition?"
  - "Instrumentation MUST NOT modify user experience, alter UI flow, or inject hints to force successful task completion"
  - "Context propagation follows OpenTelemetry specifications to correlate traces/logs/metrics across all execution units"
  - "No semantic repair of failures allowed during observation — only record raw, unaltered observations"
  - "Post-observation analysis may correlate all signals to classify failures, but no in-experiment changes to 'fix' participant struggles"

# Failure Classification Taxonomy (for post-observation analysis only)
failure_taxonomy:
  - "discovery_failure: Participant cannot find the primary CTA or start work within 2 minutes"
  - "vocabulary_failure: Participant misinterprets core platform terminology or purpose"
  - "continuity_failure: Participant must re-enter data or start over when switching between assisted/self-managed work"
  - "agency_failure: Participant cannot find or use advanced controls when they need more control"
  - "product_distinctness_failure: Participant perceives platforms as variants rather than distinct products"
  - "capability_exposure_failure: Participant is asked to choose capabilities, workflows, or providers before starting work"
  - "substrate_limitation: Fundamental platform limitation that cannot be fixed with surface-level changes"

