# Observability Principle (Maintained from B4-003)
observability_guidelines:
  - "Context propagation strictly follows OpenTelemetry specifications"
  - "Observability ≠ repair — only record, correlate, understand; never modify runtime behavior to 'fix' failures"
  - "Work Identity ≠ Execution Identity ≠ Execution Context separation is enforced"
  - "All telemetry is correlated to business workloads, not just infrastructure"

# Failure Classification for Production Testing
production_failure_taxonomy:
  - "bug_implementation_gap: Code error that violates existing invariants"
  - "missing_invariant: Architectural invariant not yet implemented in substrate"
  - "missing_semantic_primitive: New semantic primitive required (requires ARB approval)"
  - "operational_failure: DevOps/infra issue unrelated to substrate semantics"

# Next Steps
execution_sequence:
  - "PR-001 (Reliability) and PR-007 (Observability) execute in parallel as foundational work"
  - "All dependent work items trigger automatically after dependencies pass verification"
  - "Weekly architecture reviews to classify any failures and approve primitive changes only if necessary"
  - "All evidence collected in /governance/production-evidence/ for final certification"

