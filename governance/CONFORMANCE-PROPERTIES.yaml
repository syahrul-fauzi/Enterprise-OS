  - VISION-02_Evidence_Precedes_Trust

conformance_property_definition_preamble:
  statement: |
    EOS replaces the binary PASS/FAIL verdict with a six-dimensional property vector.
    Each dimension carries independent measurement status, diagnostic detail, and evidence hash.
    An artifact's overall conformance is the conjunction of its property vector.
    Verdict = PASS only when: Deterministic=PASS ∧ Compatible=PASS ∧ Reproducible=PASS ∧ Auditable=PASS ∧ (Explainable=PASS∨WARN) ∧ Canonical=PASS.
    A property WARNING means: behavior is acceptable for a bounded window but triggers a remediation backlog item.
    A property FAIL blocks promotion to the next gate.
    A property INCONCLUSIVE means: the measurement framework itself is not yet complete;
    the artifact may be used in DRAFT paths only, never in STABLE execution.
  epistemological_shift: |
    "PASS" is not a single status. It is a measurement of six independent correctness axes.
    This matches the EOS epistemology: correctness = multi-dimensional evidence, not single-bit verdict.

six_core_properties:
  - id: CONF-PROP-DET
    name: Deterministic
    short_code: DETERMINISTIC
    definition: >
      Given identical Knowledge Snapshot ID + identical Semantic Kernel version + identical user input parameters,
      does the implementation produce byte-identical output across 2 or more independent runs?
    measurement_algorithm:
      algorithm_id: MEASURE-DET-v1
      runs_required_minimum: 2
      hash_equality: SHA-256 of canonical serialization of output
      canonicalization_ref: /root/Enterprise-OS/workspace/contracts/CONSTITUTION-IR.contract.yaml#ir_content_hash_calculation
    status_semantics:
      PASS: 2+ runs hash-equal; no non-deterministic primitives detected in source (ARCH-21 clean).
      WARN: Hash equality holds but ARCH-21 detected env/Math/Date usage in DIAGNOSTIC fields only (acceptable, no semantic branch).
      FAIL: Any 2 runs produce different hashes OR non-deterministic primitives used in semantic computation paths.
      INCONCLUSIVE: Fewer than 2 runs available, or fixture set incomplete.
    enforcement_arch_rule_ids: [ARCH-21]
    gate_required_for:
      Gate_D_exit: PASS_or_WARN_if_diagnostic_only
      Gate_E_exit: STRICTLY_PASS

  - id: CONF-PROP-COMPAT
    name: Compatible
    short_code: COMPATIBLE
    definition: >
      Does the implementation adhere to the compatibility policy for its governing protocol
      (SEMVER 2.0 for Domain B; BEHAVIORAL conformance for Domain C)?
    measurement_algorithm:
      algorithm_id: MEASURE-COMPAT-v1
      matrix_source: generated by Protocol Compilation from PROTOCOL-GOVERNANCE.yaml input
      matrix_ref: /root/Enterprise-OS/enterprise/specifications/PROTOCOL-COMPILATION.spec.yaml#compatibility_matrix_output
    status_semantics:
      PASS: All backward compatibility constraints from matrix satisfied; conformance test suite for target protocol version = 100% pass.
      WARN: Deprecated protocol API path used (still valid; overlap window active; deprecation log present).
      FAIL: Backward-incompatible change without MAJOR bump; or required field of governing protocol missing/altered.
      INCONCLUSIVE: Compatibility matrix not yet generated for protocol version pair.
    enforcement_arch_rule_ids: [ARCH-24, ARCH-25]
    gate_required_for:
      Gate_D_exit: PASS
      Gate_E_exit: PASS

  - id: CONF-PROP-REPRO
    name: Reproducible
    short_code: REPRODUCIBLE
    definition: >
      Can an independent third party, given ONLY:
      (1) the Knowledge Snapshot ID (KS-YYYY.MM.DD.NNN),
      (2) the Semantic Kernel version,
      (3) the Constitution IR hash,
      reproduce the entire Evidence Provenance Graph hash without access to any private build infrastructure?
    measurement_algorithm:
      algorithm_id: MEASURE-REPRO-v1
      third_party_simulation:
        steps:
          - Download Snapshot Archive from public artifact store (or reconstruct from KS manifest)
          - Run Constitutional Compiler (version matching build) → reproduce CONSTIT-IR hash
          - Run Knowledge Compiler Pipeline Passes 1-8 → reproduce Execution Plan hash
          - Replay execution → reproduce Proof Object hashes
          - Compute EPG Merkle root → compare to published Repository Proof root
      independence_requirement: >
        Simulator MUST NOT have access to: CI environment variables, internal package registries,
        build caches, or any state not explicitly referenced in the snapshot manifest.
    status_semantics:
      PASS: Third-party simulator produced bit-identical EPG merkle root within 0.1% timing tolerance (IO latency variance allowed).
      WARN: Reproducible but requires 1 extra network-accessible dependency not listed in snapshot manifest (documented in remediation backlog).
      FAIL: Third-party reproduction produces different EPG merkle root; or reproduction requires undocumented internal state.
      INCONCLUSIVE: Snapshot Archive not yet published for public download; third-party simulator not implemented.
    enforcement_arch_rule_ids: [ARCH-20, ARCH-22]
    gate_required_for:
      Gate_D_exit: PASS
      Gate_E_exit: PASS

  - id: CONF-PROP-AUDIT
    name: Auditable
    short_code: AUDITABLE
    definition: >
      Does every semantic inference, planning decision, and evidence node carry a complete,
      machine-inspectable provenance chain (rule_id + premise_ids[]) back to the exact
      authority objects (Constitution IR + Snapshot artifacts) that justified it?
    measurement_algorithm:
      algorithm_id: MEASURE-AUDIT-v1
      checks_ordered:
        - EPG node coverage: 100% of non-leaf EPG nodes have premise_ids[]
        - Inferred edges: 100% carry rule_id (INF-xxx)
        - Decision IR candidates: 100% selected + rejected alternatives carry constraint_ids
        - Chain termination: every provenance path terminates at either (a) CONSTIT-IR section ref or (b) snapshot manifest artifact entry
    status_semantics:
      PASS: 100% coverage on all four audits above; 0 broken provenance chains.
      WARN: ≥ 98% coverage; < 2% are leaf-only nodes (no incoming inference; acceptable but flagged).
      FAIL: < 98% coverage OR any provenance path terminates at an authority object not in CONSTIT-IR / snapshot.
      INCONCLUSIVE: EPG schema not finalized, or provenance collection instrumentation incomplete.
    enforcement_arch_rule_ids: [ARCH-22, ARCH-23]
    gate_required_for:
      Gate_D_exit: PASS_or_WARN
      Gate_E_exit: STRICTLY_PASS

  - id: CONF-PROP-EXP
    name: Explainable
    short_code: EXPLAINABLE
    definition: >
      For every non-trivial decision (plan selection, transformation ordering, candidate rejection, protocol fork),
      can a human auditor read, in ≤ 1 minute of inspection, a natural-language + structured-data justification
      that explains WHY the decision was made, citing the exact authority rules that forced it?
    measurement_algorithm:
      algorithm_id: MEASURE-EXP-v1
      inspection_criteria:
        decision_nodes_require_explanation:
          - DIR.selected_alternative change from default
          - Any candidate with score ≥ 0.8 that was rejected
          - Any plan step reordering from topological-default
          - Any WARN-level conformance property
        explanation_format_required:
          - structured: constraint_ids[], rule_refs[], premise_edge_ids[]
          - narrative: ≤ 200 word human-readable justification
          - authority_refs: 1+ direct links to CONSTIT-IR boundary/verification sections
    status_semantics:
      PASS: 100% of required decision nodes have compliant explanation; narrative + structured both present; authority refs valid.
      WARN: Structured explanation present but narrative missing or > 200 words (auditable but not ergonomic).
      FAIL: Any required decision node missing explanation OR authority_ref points to non-existent CONSTIT-IR section.
      INCONCLUSIVE: DIR explanation schema still in DRAFT; narrative template not finalized.
    enforcement_arch_rule_ids: [ARCH-22]
    gate_required_for:
      Gate_D_exit: PASS_or_WARN  (Explainable WARN is acceptable for D; E requires PASS)
      Gate_E_exit: STRICTLY_PASS

  - id: CONF-PROP-CAN
    name: Canonical
    short_code: CANONICAL
    definition: >
      Is the implementation's semantics defined SOLELY by its governing protocol YAML contract (Domain B)
      and Constitutional IR compiled rules — with no "secret" semantics hardcoded in implementation source,
      no "behaves like resolver.ts line 42" delegation, and no duplicate contract schemas living in .ts code?
      Put differently: if the implementation source is deleted and replaced entirely, can the replacement
      recover 100% of semantics from protocol YAML + CONSTIT-IR alone?
    measurement_algorithm:
      algorithm_id: MEASURE-CAN-v1
      canonical_sufficiency_test:
        precondition: "Delete all implementation .ts/.tsx files for the component. Keep only: protocol YAML, conformance fixtures, CONSTIT-IR."
        postcondition: "A new engineer, reading those files only, can write a replacement that passes 100% of conformance tests without asking a single question to the original authors."
      static_checks:
        - No .ts zod schema duplicates of YAML schema (zod MUST be generated from YAML, not hand-written canonical)
        - No protocol YAML references code lines like "matches behavior of impl/file.ts:42"
        - No .ts hardcoded T\d{3}, PRED-\d, capability-id-strings outside of registry loader context
    status_semantics:
      PASS: All canonical sufficiency static checks pass; no implementation-source-only semantics detected.
      WARN: Zod schemas exist but are generated (not hand-canonical); trace back to .schema.yaml generator provenance present.
      FAIL: Semantics delegation to code location detected OR hardcoded knowledge strings outside loader context.
      INCONCLUSIVE: Generator pipeline for zod from YAML not implemented; static scan heuristic incomplete.
    enforcement_arch_rule_ids: [ARCH-19, ARCH-20, ARCH-24]
    gate_required_for:
      Gate_D_exit: PASS
      Gate_E_exit: PASS

conformance_property_vector_schema:
  vector_id_pattern: CONF-VECTOR-<artifact_id>-<version>-<hash8>
  vector_fields_required:
    - field: vector_id
      type: string (pattern above)
    - field: artifact_ref
      type: { artifact_id, version, evolution_domain }
    - field: governing_constit_ir_hash
      type: sha256 (of CONSTIT-IR this measurement was run against)
    - field: properties
      type: map of property_short_code → property_measurement
    - field: overall_verdict
      type: enum [PASS, WARN, FAIL, INCONCLUSIVE]
    - field: measurement_report_hash
      type: sha256 of canonicalized details

  property_measurement_schema:
    fields:
      - field: property_id
        type: string
      - field: status
        type: enum
        enum_values: [PASS, WARN, FAIL, INCONCLUSIVE]
      - field: evidence_hash
        type: sha256
        description: "SHA-256 hash of measurement fixture + measurement output binary."
      - field: diagnostics
        type: array
        item_schema: { code: string, message: string, severity: string, remediation_ref: string }
      - field: gate_specific_override
        type: optional_struct
        description: "Optional. If a gate relaxes PASS requirement to PASS_or_WARN, document override here."

  overall_verdict_logic:
    PASS:
      - DETERMINISTIC = PASS
      - COMPATIBLE = PASS
      - REPRODUCIBLE = PASS
      - AUDITABLE = PASS
      - EXPLAINABLE ∈ {PASS, WARN}
      - CANONICAL = PASS
    WARN:
      - At least one property = WARN
      - ZERO properties = FAIL
      - All gate relaxations applied
    FAIL:
      - Any property = FAIL
    INCONCLUSIVE:
      - Any property = INCONCLUSIVE
      - No FAIL property

report_generation:
  storage_path_pattern: governance/conformance-properties/<artifact-kind>/<artifact-id>/<version>/CONF-VECTOR-<hash8>.yaml
  append_only: true  (new vectors appended side-by-side; old vectors NEVER mutated)
  merkle_chain: each report includes prior_report_hash to form audit chain for same artifact across versions

enforcement:
  acl_rule_ids:
    - ARCH-24 (classification + vector header presence for all Domain B/C STABLE artifacts)
    - ARCH-25 (conformance test integration)
  mp01_computable_note: >
    Every property above is MEASURED, not REVIEWED. The six measurement_algorithm blocks
    are the canonical implementation spec for the Constitutional Verifier's property engine.
    No human "I think it's canonical" verdict is accepted. The algorithm output is the only truth.
