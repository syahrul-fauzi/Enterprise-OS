gates:
  gate_a_governance:
    objective: repository law is explicit and machine-readable
    status: VERIFIED
    primary_artifacts:
      - governance/BASELINE_LOCK.yaml
      - governance/GOVERNANCE_STATE.yaml
    evidence_status: Governance Verified
    exit_predicates:
      - baseline lock certificate declared
      - governance state declared (repository_state root key at layer 3)
      - ssot stack 5 layers declared frozen in baseline lock
      - repository proof declared as external output never inline
      - implementation baseline declared
      - dependency rules declared
      - package authority declared
      - artifact lifecycle declared (5 canonical uppercase vocab)
      - architecture compliance declared
      - sprint0 exit predicates declared
      - governance validation evidence recorded
      - workspace manifest validation evidence recorded
      - architecture compliance evidence recorded
      - baseline lock evidence recorded
  gate_b_foundation:
    objective: canonical foundation (5 packages) exist as declarative knowledge without any execution behavior
    primary_artifacts:
      - workspace/contracts
      - workspace/packages/core/eir
      - workspace/packages/core/predicate-registry
      - workspace/packages/core/transformation-registry
      - workspace/packages/core/proof-ledger
    evidence_status: Conformance Verified
    declarative_boundary:
      allowed:
        - schema
        - specification
        - contract
        - interface
        - predicate_registry
        - transformation_registry
        - proof_metadata
      forbidden_behavior:
        - run
        - execute
        - compile
        - runtime execution entrypoints
      rule: Gate B produces canonical knowledge only. Runtime behavior starts at Gate C after registry declarations exist.
    structure_pattern_frozen:
      file_paths:
        - README.md
        - SPECIFICATION.md
        - package.json
        - tsconfig.json
        - eslint.config.mjs
        - src/index.ts
        - src/types.ts
        - src/interfaces.ts
        - src/schema.ts
        - contracts/
        - tests/
