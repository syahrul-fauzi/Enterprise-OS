      - gate_a_status_verified
      - baseline_lock_active
      - governance_parseable_by_tooling
      - no_new_baseline_violations
      - rule_of_five_preserved
      - implementation_discipline_active
    exit_predicates:
      - contracts source of truth established (6 contracts min)
      - packages/core/eir specified (schema + types + interfaces + registry + conformance)
      - packages/core/predicate-registry specified
      - packages/core/transformation-registry specified (T001 declared DRAFT+)
      - packages/core/proof-ledger specified (two proof levels distinguished: repository vs transformation)
      - every foundation package remains declarative and contains schema, interfaces, contracts, registries, and conformance tests
      - no gate_b package exposes runtime execution entrypoints
  req_0001_golden_reference:
    objective: deterministic golden reference for T001 input and expected output
    exit_predicates:
      - examples/vertical-slice/REQ-0001 exists
      - requirement.md exists
      - requirement.yaml exists
      - expected outputs declared for eir, cag, proof, and typescript
      - t001 entry exists in transformation registry (status >= DRAFT)
  gate_c_first_verified_transformation:
    objective: T001 (ELS to EIR) produces DETERMINISTIC transformation proof against Golden REQ-0001, WITHOUT any generic orchestrator
    status: DRAFT
    primary_artifacts:
      - workspace/packages/core/transformation-registry (T001 entry VERIFIED)
      - workspace/packages/core/eir (REQ-0001 golden output EIR record)
      - workspace/packages/core/proof-ledger (TRF-PROOF-T001 entry with verdict PASS)
      - workspace/examples/vertical-slice/REQ-0001
    output_kind: independent_transformation_artifact_before_any_orchestrator
    exit_predicates:
      - T001 can be executed in isolation (no engine dependency)
      - input = Golden REQ-0001 specification + contract_ref
      - output = EIR record (exact determinism: identical input => identical EIR hash)
      - predicate PRED-T001-INPUT-SCHEMA PASS
      - predicate PRED-T001-OUTPUT-DETERMINISTIC PASS
      - predicate PRED-T001-CONFORM-EIR PASS
      - Transformation Proof TRF-PROOF-T001 verdict = PASS with signature recorded
      - run twice on same input produces PROOF HASH IDENTICAL (determinism evidence)
  gate_d_execution_platform:
    objective: execution platform is registry-driven (no hardcoded pipeline). Engine loads registry, resolves DAG generically.
    status: DRAFT
    primary_artifacts:
      - workspace/packages/engine/transformation-engine
      - workspace/packages/tooling/compiler-cli
      - workspace/packages/engine/emitters
      - workspace/build/ci/
    evidence_status: Execution Verified
    exit_predicates:
      - transformation engine loads transformation registry (no hardcoded ID list)
      - DAG resolution is generic (derived from contracts/registry, not hardcoded)
      - no transformation ID is hardcoded by name inside runtime source code
      - predicates are evaluated through predicate registry lookup
      - proof object generation is deterministic (append only proof ledger)
      - CI pipeline emits repository proof at build/evidence/repository-proof/
  gate_e_proof_of_execution:
    objective: end-to-end deterministic execution proof (PoE v1). Re-run full pipeline and verify consistent proof hashes.
    status: DRAFT
    primary_artifacts:
      - workspace/build/evidence/
      - enterprise/governance/pipeline-acceptance-criteria.md
      - build/evidence/repository-proof/REP-PROOF-0001.json (final)
    evidence_status: End-to-End Verified
    exit_predicates:
      - REQ-0001 runs end-to-end via execution platform (Gate D)
      - PAC proof runner produces PASS or explicit non-pass verdict (all predicates enumerated)
      - proof ledger append operation is verified (audit trail is complete)
      - CI quality gate includes architecture, type, build, and proof checks
      - repository proof REP-PROOF-0001 is emitted with signature UNSIGNED or higher
      - run twice on same commit => identical proof hashes (registry hash identical)

current_priority_order:
