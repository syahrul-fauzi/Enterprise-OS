      authority_reference: workspace/contracts/KNOWLEDGE-SNAPSHOT.contract.yaml
    - id: PROTO-EPG-VERIFICATION
      name: Evidence Provenance Graph Verification Protocol
      version: 1.0.0-STABLE
      authority_reference: workspace/contracts/EVIDENCE-PROVENANCE-GRAPH.contract.yaml
    - id: PROTO-RUNTIME-EXEC-PLAN
      name: Execution Plan & KVM Runtime Protocol
      version: 0.1.0-DRAFT (future implementation; contract pending writing in Gate D P1)
      description: Execution Plan step opcodes, KVM interpreter semantics, plan_hash chain to DIR
      authority_reference: future workspace/contracts/EXECUTION-PLAN.contract.yaml
  new_protocols_future:
    - id: PROTO-CONFORMANCE-REPORTING
      version: 0.0.1-PROPOSAL
      description: Reporting format for conformance suite pass/fail result hash.

enforcement:
  acl_rule_ids:
    - ARCH-24: enforces downward direction only; implementations cannot write/modify protocol yaml spec directly.
    - ARCH-25: enforces protocol boundary conformance at code level — no cross-component bypass via non-protocol typed exchange.
    - ARCH-17: Sprint 0 structural freeze protects protocol specs during boot.
