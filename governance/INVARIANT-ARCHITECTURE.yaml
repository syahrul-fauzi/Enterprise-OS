version: "1.0.0"
status: FROZEN
kind: CONSTITUTIONAL_CONTRACT
ssot_note: THIS_YAML_IS_SINGLE_SOURCE_OF_TRUTH_FOR_ARCHITECTURE_INVARIANTS_ACL_MUST_ENFORCE
governance_ref:
  constitution_lock: /root/Enterprise OS/governance/BASELINE_LOCK.yaml
  axioms: /root/Enterprise OS/governance/AXIOMS.md
  arch_compliance: /root/Enterprise OS/governance/architecture-compliance.yaml
  dependency_rules: /root/Enterprise OS/governance/dependency-rules.yaml
derived_from:
  - EOS_Hierarchy_of_Truth_via_transformation_catalog
  - ADR-000_Sprint0_Architecture_Freeze
  - ADR-001_Knowledge_Before_Execution_KBE
  - ADR-002_Layered_Architecture_Invariants_Risk_Mitigation
  - Knowledge_Centric_Execution_Platform_Emergent_Model_20260730

invariant_design_principle:
  permanent_statement: >
    Runtime executes what the Knowledge Layer defines;
    it never defines knowledge itself.
  epistemological_status: CONSTITUTIONAL_META_PRINCIPLE
  enforcement_scope: ALL_PACKAGES_ALL_GATES_ALL_SPRINTS

constitutional_predicate_model:
  status: CONSTITUTIONAL_FOUNDATION_CORE
  epistemological_status: FROZEN_FOR_ONE_DECADE_HORIZON
  charter_cross_ref: governance/CC-001-CONSTITUTIONAL-CHARTER.md
  predicate_axiom_cross_ref: governance/AXIOMS.md
  preamble: >
    The 6-tier reference architecture (Constitution → Authority → Knowledge →
    Transformation → Execution → Evidence) remains valid as a Reference
    Architecture (engineering layout view). Constitutionally, however, EOS rests
    on THREE FALSIFIABLE BOOLEAN PREDICATES and one conjunction meta-predicate,
    as frozen in CC-001 Constitutional Charter:
      Predicate A — Legitimate(x)       (AuthorityRel is FUNDAMENTAL)
      Predicate B — MeaningPreserved(T) (CanonicalIdentity / SemanticRel are FUNDAMENTAL)
      Predicate C — Provable(T)         (Evidence ⊢ Postconditions is FUNDAMENTAL)
    Graphs (Authority Graph / Knowledge Graph), Canonical Form concretizations,
    Planner/Compiler/LLM strategies, and YAML/JSON/Binary serializations are all
    engineering MATERIALIZATIONS. They are NOT constitutional. Future epochs MAY
    replace any of them entirely — provided truth values of Legitimate /
    MeaningPreserved / Provable remain invariant on the same inputs.
  predicates:
    - predicate_id: PRED_A_LEGITIMATE
      name: Predicate A — Legitimate(x)
      answers_question: "Mengapa artefak ini sah? (Authority chain valid?)"
      signature: "Legitimate : Artifact → Boolean"
      charter_section: CC-001 §3
      formal_statement_reference: Legitimate(x) ⇔ AuthorityRoot(x) ∃ ∧ AuthorityPath(x) ⊆ AuthorityRel ∧ NoCycle(x)
      scope_includes:
        - Authority relation set AuthorityRel = { Authorizes, Delegates, Supersedes, Approves, DerivesAuthorityFrom, Ratifies, Amends, EpochBinds }
        - Approval / Delegation / Epoch governance
        - Constitutional Lexicon Registry (terminology governance)
      frozen_fundamental: AuthorityRel RELATION SET — NOT "Authority Graph" data structure
      derived_invariants:
        - IA-17 Constitution Preservation (Legitimate(T) sub-component)
        - IA-15 Dual Relations (AuthorityRel disjoint from SemanticRel)
        - ASP-02, ASP-03
    - predicate_id: PRED_B_MEANING_PRESERVED
      name: Predicate B — MeaningPreserved(T)
      answers_question: "Apakah makna normatif artefak bertahan lintas transformasi?"
      signature: "MeaningPreserved : Transformation → Boolean"
      charter_section: CC-001 §4
      formal_statement_reference: MeaningPreserved(T) ⇔ (∀i,o well-defined CanonicalIdentity) ∧ SemanticEquivalence(⊔Inputs CanonicalIdentity, ⊔Outputs CanonicalIdentity)
      scope_includes:
        - Canonical Identity (FUNDAMENTAL abstract logical identity)
        - Transformation Contract = ⟨Inputs, Outputs, Preconditions, Postconditions, Invariants⟩
        - Semantic relation set SemanticRel = { DependsOn, Implements, Extends, Contains, References, EquivalentTo, Specializes, Refines, Uses }
        - Requirements / Policies / Contracts / Vocabulary
      frozen_fundamental: CanonicalIdentity equivalence + SemanticRel RELATION SET — NOT "Canonical Form" concretization, NOT "Knowledge Graph" data structure
      derived_invariants:
        - IA-13 Stable Canonical Forms (concretization-side of CanonicalIdentity)
        - IA-15 Dual Relations (SemanticRel half)
        - IA-11 Semantic Determinism
        - IA-16 Contract / Strategy separation (SQL ↔ Optimizer pattern)
    - predicate_id: PRED_C_PROVABLE
      name: Predicate C — Provable(T)
      answers_question: "Jika verdict PASS, apakah buktinya cukup? (Evidence ⊢ Postconditions?)"
      signature: "Provable : Transformation → Boolean"
      charter_section: CC-001 §5
      formal_statement_reference: Provable(T) ⇔ (∀t exec-of-T, Evidence(t,T) ⊢ Postconditions(T)) ∧ (no evidential gap allowing ¬Postconditions while PASS emitted)
      scope_includes:
        - Transformation Strategy interchangeability (fungible implementation)
        - Execution / Evidence / Assessment / Justification / Verdict pipeline
        - ConstitutionalProof witness tuple (DERIVED: ⟨witness_A, witness_B, witness_C⟩)
      frozen_fundamental: Evidence-entailment property — NOT "Proof" artifact form, NOT pipeline stages
      derived_invariants:
        - IA-14 Pure Transformations
        - IA-18 Constitutional Proof (3-witness composite derived from 3-predicate conjunction)
        - IA-12 Explainability and Justification
        - IA-10 Immutable Knowledge Snapshot
  constitutional_validity_meta_predicate:
    id: ConstitutionallyValid
    signature: "ConstitutionallyValid(T) ⇔ Legitimate(T) ∧ MeaningPreserved(T) ∧ Provable(T)"
    charter_section: CC-001 §6
    meta_invariant_note: IA-20 Constitutional Validity codifies this as the sole evaluation criterion for every transformation / verdict / epochal revision.
    constitutional_proof_derived: >
      ConstitutionalProof(T) = ⟨witness_Legitimate(T), witness_MeaningPreserved(T), witness_Provable(T)⟩
      ConstitutionalProof(T) COMPLETE ⇔ ConstitutionallyValid(T).
      ConstitutionalProof is EXPLICITLY DERIVED, NOT constitutional.
  ordering_invariant: >
    Legitimate(x) MUST be resolved for all inputs BEFORE MeaningPreserved(T) is evaluated.
    MeaningPreserved(T) MUST hold BEFORE Provable(T) is evaluated.
    Final verdict emission ONLY AFTER ConstitutionallyValid(T) = TRUE.
    Implementation ordering corresponds to the old "6-tier" layout, but the layout is not
    itself constitutional.
  six_tier_reference_architecture_status:
    retained: true
    role: REFERENCE_ARCHITECTURE_ONLY
    constitutional_role: derived_view_NOT_foundation
    note: Six tiers remain useful as engineering reference layout but are NOT the constitutional predicate model.

principle_01_ontological_triad:
  id: IA-01
  name: Knowledge × Registry × Runtime — Clean Ontological Separation
  rationale: >
    Ketiga lapisan ini menjawab pertanyaan ontologis yang berbeda.
    Mencampurnya menciptakan epistemological drift di mana pengetahuan
    "ditemukan" di runtime bukannya didefinisikan di Knowledge Layer.
  layers:
    KNOWLEDGE:
      answers: Apa yang benar? (What is true?)
      scope:
        - Constitution
        - Ontology
        - Vocabulary
        - Contracts
        - Schemas
        - Business Knowledge (Capability, Actor, Policy, Service, Evidence)
        - Specifications
      allowed_artifact_formats:
        - .yaml (canonical declaration — SSOT)
        - .md (documentation — derived view only)
        - .schema.yaml (JSON/YAML Schema)
      forbidden_dependencies:
        - registry source code (.ts)
        - runtime source code (.ts)
        - engine implementations
        - scheduler logic
      storage_locations:
        - /root/Enterprise OS/enterprise/constitution/
        - /root/Enterprise OS/enterprise/knowledge/
        - /root/Enterprise OS/enterprise/schema/
        - /root/Enterprise OS/enterprise/library/
        - /root/Enterprise OS/workspace/contracts/
      ownership: Enterprise Architect + Domain Steward (human review required for changes)
      acl_check_required: true
    REGISTRY:
      answers: Apa yang tersedia? (What is available?)
      scope:
        - Transformation Registry
        - Predicate Registry
        - Capability Registry
        - Proof Registry (future)
      ontology_rule: Registry TIDAK menciptakan knowledge. Registry HANYA mengindeks knowledge.
      declaration_pattern:
        - manifest.yaml per entry (NOT .ts declarations)
        - root index.yaml = composition only (≤100 LOC logic)
      allowed_operations:
        - semantic indexing (consumes / produces / predicates / successors)
        - lifecycle tracking (DRAFT → VERIFIED → FROZEN)
        - dependency graph edges (predecessor / successor / compatibility)
      forbidden_operations:
        - business logic execution
        - transformation implementation
        - predicate evaluation logic
      storage_locations:
        - /root/Enterprise OS/workspace/packages/core/transformation-registry/src/registry/
        - /root/Enterprise OS/workspace/packages/core/predicate-registry/src/registry/
      ownership: Platform Engineer (YAML manifests) + automated validation (ACL)
      acl_check_required: true
    RUNTIME:
      answers: Apa yang sedang dieksekusi? (What is being executed?)
      scope:
        - Engine
        - Resolver
        - Executor (future explicit package)
        - Orchestrator
        - CLI
        - Scheduler (future)
      ontology_rule: Runtime TIDAK BOLEH mengandung knowledge.
      knowledge_access_rule: >
        Runtime ONLY accesses knowledge via:
        1. Registry lookup → contract_ref path string
        2. Filesystem read of canonical YAML at that path
        3. Schema validation against that YAML
        Runtime MUST NOT import, embed, or hardcode contract/schema values.
      allowed_operations:
        - load registry entries
        - resolve execution plan via Resolver
        - execute plan via Executor
        - collect results
        - emit proof
        - append to ledger
      forbidden_operations:
        - define new transformation contracts inline
        - hardcode predicate rules as switch/case
        - store compatibility matrix as TypeScript object literal
      storage_locations:
        - /root/Enterprise OS/workspace/packages/core/runtime/
        - /root/Enterprise OS/workspace/packages/tooling/eos-cli/
      ownership: Platform Engineer — subject to ARCH-18 invariant checks
      acl_check_required: true
  data_flow_unidirectional:
    order: [KNOWLEDGE, REGISTRY, RUNTIME, EVIDENCE]
    reverse_flow_allowed: false
    reverse_flow_exception:
      - proof_ledger_append (Evidence writes back to append-only store, NOT to Knowledge)
      - repository_proof_output (Evidence output, never consumed as input state)
    acl_enforcement_id: ARCH-18-ONT-TRIAD

principle_02_semantic_registry_graph:
  id: IA-02
  name: Registry = Semantic Graph Index, Bukan Flat Dictionary
  rationale: >
    Saat registry skala ke 50+ transformasi, linear list dengan predecessor/successor
    tidak cukup. Perlu semantic edges untuk dependency resolution, compatibility
    checking, dan DAG planning yang tidak memerlukan inference di resolver.
  semantic_fields_required_per_entry:
    - id
    - semantic.consumes[] (input artifact kinds)
    - semantic.produces[] (output artifact kinds)
    - semantic.predicates[] (ordered predicate IDs)
    - semantic.successors[] (directed edge to downstream transformations)
    - semantic.predecessors[] (directed edge to upstream transformations)
    - semantic.compatibility: { since, until }
    - semantic.maturity (DRAFT / VERIFIED / FROZEN / DEPRECATED)
  graph_model:
    node_kind: TRANSFORMATION
    edge_kinds:
      - PREDECESSOR (must PASS before this may run)
      - SUCCESSOR (this may trigger after PASS)
      - CONSUMES (input artifact)
      - PRODUCES (output artifact)
      - REQUIRES_PREDICATE (verification step)
      - COMPATIBLE_WITH (version range)
  resolver_rule: Resolver MEMBACA graph edges. Resolver TIDAK menghitung edges dari heuristik.
  storage_location: /root/Enterprise OS/enterprise/execution/transformation-catalog.yaml#graph
  acl_check_required: true

principle_03_resolver_executor_split:
  id: IA-03
  name: Registry Resolver = Layer Tersendiri dari Executor
  rationale: >
    DAG construction adalah pure function dari registry state + catalog graph.
    Execution adalah side-effectful step (IO, hashing, proof emission).
    Memisahkan keduanya memastikan:
    - Resolver testable tanpa filesystem write
    - Executor testable dengan fixture plan
    - Resolver logic reusable di CLI, Web, CI
  layer_contract:
    RESOLVER:
      responsibilities:
        - load registry metadata (catalog + .manifest.yaml)
        - resolve inter-transformation dependencies
        - verify prerequisite predicates presence
        - verify predecessor lifecycle ≥ VERIFIED if blocked_until_predecessor_verified
        - produce deterministic ExecutionPlan object
      output: ResolverResolutionBundle[] (existing) → ExecutionPlan (future)
      purity: PURE_FUNCTION — no writes, no network, no non-determinism
      implementation: /root/Enterprise OS/workspace/packages/core/registry-resolver/
      forbidden_concerns:
        - calling transformation implementation functions
        - writing evidence files
        - appending to ledger
        - retry loop control flow
    EXECUTOR:
      responsibilities:
        - menerima ExecutionPlan sebagai input TUNGGAL
        - menjalankan step sesuai plan
        - mengumpulkan output hash + predicate results
        - menghasilkan proof object
        - append proof ke ledger via proof-ledger package
      input_contract: ExecutionPlan (resolver output = executor input — no direct catalog read)
      purity: EFFECTFUL (IO writes allowed), but DETERMINISTIC for identical plan + identical inputs
      implementation: TBD_Gate_D_Bootstrap — NOT YET a separate package
      forbidden_concerns:
        - computing DAG edges
        - deciding which transformations are blocked
        - inferring compatibility matrix
  acl_check_required: true

principle_04_canonical_graph_catalog:
  id: IA-04
  name: Transformation Catalog = Canonical Graph, Bukan Daftar Linear
  rationale: >
    Linear predecessor_id / successor_id cukup untuk T001–T005 linear chain.
    Tapi tidak scalable ke fan-in (T006 butuh T002 + T004) atau fan-out
    (T002 feeds T003 + T007). Canonical Graph explicit di catalog = single read model
    untuk resolver, tidak ada inference logic.
  explicit_graph_section_required:
    path: "transformation-catalog.yaml → graph"
    structure:
      transformations:
        <T_ID>:
          outputs: [EIR, CAG, ...]
          successors: [T_ID...]
          predecessors: [T_ID...]
      artifact_kinds:
        <KIND_ID>:
          produced_by: [T_ID...]
          consumed_by: [T_ID...]
  resolver_obligation: >
    Resolver MUST read graph.transformations.<id> for edges.
    Fallback to legacy predecessor_id/successor_id ONLY during migration window.
    After Gate D unlocks: legacy fields are DEPRECATED, graph: section = SSOT.
  acl_check_required: true

principle_05_proof_class_split:
  id: IA-05
  name: "Bukti Terbagi Dua Kelas: Execution Proof × Validation Proof"
  rationale: >
    Saat Gate D berjalan, akan ada kebingungan antara "transformasi berhasil dijalankan"
    vs "repository / registry memenuhi governance". Keduanya punya lifecycle,
    storage location, dan verification strategy yang berbeda.
  proof_classes:
    EXECUTION_PROOF:
      semantic: Membuktikan bahwa suatu Transformation (atau pipeline) BERHASIL dijalankan.
      birth_moment: Setelah runtime / executor selesai jalan.
      id_patterns:
        - TRF-PROOF-T<NNN> (single transformation, level 1)
        - EXEC-PROOF-REQ<NNNN> (full pipeline, level 2)
      storage_location_prefix: /root/Enterprise OS/build/evidence/transformation-proofs/
      schema_ref: /root/Enterprise OS/workspace/packages/core/proof-ledger/src/schema.ts#TransformationProofEntrySchema
      verification: Re-run deterministik + hash equality.
      lifetime: Append-only ke ledger. NEVER mutate old proofs.
    VALIDATION_PROOF:
      semantic: Membuktikan bahwa suatu artefak (atau sekumpulan artefak) MEMENUHI governance.
      birth_moment: Setelah validation pass — TANPA memerlukan runtime execution.
      id_patterns:
        - REPO-PROOF-<seq> (repository-level validation, level 3)
        - REGISTRY-PROOF (registry semantic consistency + lifecycle rules)
        - CATALOG-PROOF (catalog completeness per KBE 5-artifact rule)
        - CONTRACT-PROOF (contract schema conformance + backward compatibility)
      storage_location_prefix: /root/Enterprise OS/build/evidence/validation-proofs/
      schema_ref: /root/Enterprise OS/workspace/packages/core/proof-ledger/src/schema.ts#RepositoryProofEntrySchema (extend for REGISTRY/CATALOG/CONTRACT kinds)
      verification: ACL validation run + schema validation.
      lifetime: May be regenerated when governance changes. Previous version preserved for audit.
  prohibition: EXECUTION_PROOF TIDAK BOLEH digunakan sebagai validation substitute. VALIDATION_PROOF TIDAK BOLEH mengklaim execution occurred.
  acl_check_required: true

principle_06_machine_enforced_invariant_table:
  id: IA-06
  name: Invariant Dependency Table — Machine-Enforced oleh ACL
  rationale: >
    Aturan dependency level "Constitution tidak boleh depend ke Runtime"
    adalah aturan epistemologis setara hukum fisika. Tidak boleh ada interpretasi.
    ACL HARUS gagal immediate jika ada PR yang melanggar tabel ini.
  enforcement_acl_rule_id: ARCH-18-INV-TABLE
  forbidden_dependency_table:
    - artifact: Constitution
      artifact_path_globs:
        - enterprise/constitution/**
      forbidden_dependency_kinds:
        - Runtime source imports
        - Engine source imports
        - CLI implementation code
        - Scheduler logic
      reason: Constitution = axiomatic layer. MUST be runtime-agnostic.
    - artifact: Schema
      artifact_path_globs:
        - enterprise/schema/**
        - workspace/contracts/**
      forbidden_dependency_kinds:
        - Engine source
        - Executor implementation
        - Runtime IO code
      reason: Schema = structural contract. MUST not know about execution strategy.
    - artifact: Contract
      artifact_path_globs:
        - workspace/contracts/**
      forbidden_dependency_kinds:
        - Executor functions
        - Orchestrator control flow utilities
        - CLI state management
      reason: Contract = input/output promise. Execution details = Runtime concern.
    - artifact: Registry
      artifact_path_globs:
        - workspace/packages/core/*-registry/src/registry/**
      forbidden_dependency_kinds:
        - Scheduler source
        - Runtime state (.ts files that mutate globalThis/global state)
      reason: Registry = immutable index. Must not depend on scheduling mechanics.
    - artifact: Predicate
      artifact_path_globs:
        - workspace/packages/core/predicate-registry/src/registry/predicates/**
      forbidden_dependency_kinds:
        - Runtime Context (request-scoped state objects)
        - Environment-dependent conditionals (process.env branching inside predicate declaration)
      reason: Predicate = truth-function declaration. Must be context-agnostic pure.
    - artifact: Transformation
      artifact_path_globs:
        - workspace/packages/core/transformation-registry/src/registry/transformations/**
      forbidden_dependency_kinds:
        - Orchestrator (top-level pipeline coordinator)
        - Scheduler loop
        - Engine hardcoded switch-case
      reason: Transformation = pure function descriptor. Pipeline = Runtime concern.
    - artifact: Proof
      artifact_path_globs:
        - build/evidence/**/*.json
        - build/evidence/**/*.yaml
      forbidden_dependency_kinds:
        - Engine mutable state reads
        - Engine field access for verification
      reason: Proof = immutable evidence. Verification MUST re-compute, NOT read engine state.
    - artifact: Ledger
      artifact_path_globs:
        - build/evidence/proof-ledger/**
      forbidden_dependency_kinds:
        - Mutable Storage API (PUT / DELETE / PATCH operations)
        - Rewrite / re-order logic
      reason: Ledger = append-only audit chain. Only APPEND via proof-ledger package allowed.
  acl_check_required: true

principle_07_no_god_registry:
  id: IA-07
  name: No God Registry — Per-Entry Manifest + Root Index Only
  rationale: >
    Satu file registry.ts berisi 200 transformations = merge conflict bomb
    + ownership ambiguity + review unscalable. Pattern manifest.yaml per entry
    memastikan: ownership per transformasi jelas, merge conflict minimal,
    review scope = 1 file per PR (kecuali root index yang ≤100 LOC).
  layout_pattern:
    registry_root:
      - registry/
        - transformations/
          - t001/
            - manifest.yaml  (canonical declaration, KBE-compliant SSOT)
          - t002/
            - manifest.yaml
        - predicates/
          - t001/
            - manifest.yaml
          - t002/
            - manifest.yaml
        - registry-manifest.yaml  (root index, pure composition, ≤100 LOC)
  composition_rule:
    registry-manifest.yaml = HANYA daftar include path + version metadata.
    NO inline declarations. NO logic beyond listing manifests.
  migration_note: >
    Existing .ts declaration files (t001.ts, t002.ts di registry/) adalah MIGRASI PENDING.
    Target state (Gate D): .ts files = YAML loaders ONLY.
    Declaration content = 100% in .manifest.yaml.
  acl_check_required: true

principle_08_evolution_policy_per_artifact_class:
  id: IA-08
  name: Evolution Policy Eksplisit per Artifact Class
  rationale: >
    Tanpa aturan evolusi eksplisit, suatu "minor fix" bisa merusak rantai bukti.
    Contoh: mengubah contract T001 tanpa major version = TRF-PROOF-T001 lama
    tidak lagi verifiable terhadap contract baru.
  policies:
    CONSTITUTION:
      path_globs: [enterprise/constitution/**, governance/BASELINE_LOCK.yaml]
      change_allowed: ONLY via ADR (Architecture Decision Record)
      direct_edit_prohibited: true
      review_required: Enterprise Architect sign-off + 1 peer
      acl_rule: Constitution edits require linked ADR reference in commit message.
    GOVERNANCE:
      path_globs: [governance/**]
      change_allowed: Backward compatible additions. Removals require ADR.
      direct_edit_prohibited: false
      review_required: Platform Steward
    CONTRACT:
      path_globs: [workspace/contracts/**]
      change_allowed:
        - IF backward compatible (new optional fields, new outputs): patch version OK
        - IF breaking (removed required field, changed type): MAJOR version bump required
      direct_edit_prohibited: false
      review_required: Domain Steward + Platform Steward
      integrity_rule: Existing proof IDs must remain verifiable against OLD contract version stored in snapshot dir.
    TRANSFORMATION:
      path_globs: [workspace/packages/core/transformation-registry/**, enterprise/execution/transformation-catalog.yaml#transformations]
      change_allowed: ONLY if all existing Proof Objects for prior versions remain verifiable.
      direct_edit_prohibited: false
      review_required: Platform Engineer + QA (determinism re-run)
      integrity_rule: When transformation logic changes semver, OLD implementation MUST be preserved side-by-side.
    REGISTRY:
      path_globs: [workspace/packages/core/*-registry/src/registry/**]
      change_allowed:
        - ENTRIES MAY BE ADDED freely (new DRAFT entries)
        - ENTRIES WITH lifecycle=VERIFIED MUST NOT BE DELETED
        - ENTRIES MAY BE DEPRECATED (lifecycle DEPRECATED) but NEVER removed
      direct_edit_prohibited: false
      review_required: Platform Engineer
      integrity_rule: Registry index is append-only in effect. Deletion of VERIFIED entry = ACL hard FAIL.
    TRANSFORMATION_CATALOG:
      path_globs: [enterprise/execution/transformation-catalog.yaml]
      change_allowed: Entries may be added. Existing VERIFIED entries MUST NOT have semantic contract fields removed.
      direct_edit_prohibited: false
      review_required: Enterprise Architect
    LEDGER:
      path_globs: [build/evidence/proof-ledger/**]
      change_allowed: APPEND ONLY. NO rewrite. NO in-place mutation. NO re-order.
      direct_edit_prohibited: true
      review_required: Automated SHA-256 chain verification by proof-ledger package
      migration_rule: "If ledger migration needed: rename OLD → proof-ledger-archive/{seq}/, NEW genesis = OLD.last_entry_hash"
    PROOF_OBJECTS:
      path_globs: [build/evidence/**/*.json]
      change_allowed: Write once. NEVER regenerate with mutated identity (same proof_id, different content = hash chain break).
      direct_edit_prohibited: true
      review_required: Automated hash verification
  acl_check_required: true

principle_09_knowledge_not_in_runtime:
  id: IA-09
  name: "Setelah Gate C: Roadmap = Kurangi Pengetahuan di Runtime, Bukan Tambah Fitur"
  rationale: >
    God Class Engine adalah anti-pattern yang menghancurkan EOS epistemology.
    Setiap commit post-Gate-C harus diaudit: "apakah pengetahuan ini seharusnya
    berada di Knowledge/Registry layer?" Jika ya, runtime tidak boleh menyimpannya.
  audit_question_for_every_runtime_commit: >
    Pengetahuan ini seharusnya berada di Knowledge Layer atau Registry?
    Jika jawabannya "ya", MOVE — jangan simpan di Runtime.
  knowledge_types_must_not_be_in_runtime:
    - Capability ID whitelists (hardcoded string arrays = ["legal-case", "legal-document"])
    - Compatibility matrix literals (Record<T_ID, {minVersion}>)
    - Contract field validators (zod schema duplicates of YAML schema)
    - Lifecycle promotion rules (if status === "VERIFIED" → allow logic inline)
    - Predicate phase ordering (PRE_EXECUTION = 1 constant duplicate)
  remediation_pattern:
    found_in_runtime_knowledge_type → MOVE to enterprise/knowledge/ manifest.yaml OR *-registry manifest.yaml → Runtime loads via registry lookup
  acl_heuristic:
    rule: >
      IF a source file in packages/core/runtime/ or packages/tooling/eos-cli/
      AND contains string literal matching T\d{3} OR "PRED-\d" OR capability-ID-like-kebab-case outside of registry function parameter,
      THEN it is a candidate violation for manual review.
  acl_check_required: true
  implementation_target: Gate_D_Bootstrap — before engine writes first code.

principle_10_immutable_knowledge_snapshot:
  id: IA-10
  name: Immutable Knowledge Snapshot — Root of Reproducibility
  rationale: >
    Registry Version saja tidak cukup. Yang harus direproduksi bukan hanya registry,
    tetapi SELURUH keadaan pengetahuan. Ketika planning dimulai, semua input knowledge
    (Constitution, Contracts, Ontology, Schemas, Registry, Graph, Policies, Compatibility)
    HARUS di-hash menjadi satu immutable tuple: Knowledge Snapshot. ID-nya = KS-YYYY.MM.DD.NNN.
    Setelah planning dimulai, TIDAK ADA mutable knowledge artifact yang boleh memengaruhi
    planning, execution, validation, atau evidence.
  formal_statement: >
    Every execution SHALL reference exactly one immutable Knowledge Snapshot.
    Planning, execution, validation, and evidence generation MUST operate exclusively against that snapshot.
    No mutable knowledge artifact SHALL influence an execution after planning has begun.
  scope:
    - Planner
    - Runtime
    - Validator
    - Evidence
  snapshot_identifier_pattern: KS-\d{4}\.\d{2}\.\d{2}\.\d{3}
  snapshot_content_tuple:
    - constitution_digest: SHA-256 of enterprise/constitution/**
    - contract_digest: SHA-256 of workspace/contracts/** + enterprise contracts
    - ontology_digest: "SHA-256 of semantic kernel: relationships + node kinds + vocab"
    - registry_digest: SHA-256 of all *-registry manifest.yaml files loaded
    - graph_digest: SHA-256 of transformation-catalog graph section
    - policy_digest: SHA-256 of governance/** policies.yaml + .md
    - schema_digest: SHA-256 of enterprise/schema/**
    - compatibility_digest: SHA-256 of semantic compatibility rules + semver policy
  post_planning_prohibited_interactions:
    description: Setelah object ExecutionPlan dibuat, NO mutable knowledge source may be read.
    prohibited_actions:
      - Planning Runtime Validator Evidence: read-live filesystem path dari constitution/ / contracts/ / governance/
      - Planning Runtime Validator Evidence: lakukan reload manifest.yaml dari registry
      - Execution: override contract_ref untuk point ke file version baru di tengah pipeline
  reproducibility_guarantee: >
    Given identical Knowledge Snapshot ID + identical Semantic Kernel version + identical user input parameters:
    Planning ALWAYS produces byte-identical Execution Plan.
    Execution ALWAYS produces byte-identical output artifacts (2x run hash equal, predicates all pass).
    Evidence ALWAYS produces byte-identical Proof + Ledger append record (signature scheme deterministic).
  acl_check_required: true
  enforcement_acl_rule_id: ARCH-20

principle_11_semantic_determinism:
  id: IA-11
  name: Semantic Determinism — Makna Pengetahuan Juga Harus Deterministik
  rationale: >
    Knowledge Before Execution mengunci bahwa behavior didefinisikan SEBELUM eksekusi.
    Tetapi itu tidak cukup: MAKNA dari pengetahuan itu sendiri harus deterministik.
    Jika reasoner (Semantic Kernel inference rules) dapat menghasilkan edges yang berbeda
    pada input yang sama — maka seluruh sistem reproducibility hancur di level epistemik.
  formal_statement: >
    Every semantic conclusion SHALL be reproducible from the same Knowledge Snapshot and Semantic Kernel.
  consequences:
    - Inference rules TIDAK BOLEH bergantung pada state eksternal (network, time, env vars, global mutable).
    - Reasoner HARUS bersifat deterministik: inputs identical → output edges identical, 100% of the time.
    - Graph yang sama + Semantic Kernel version yang sama SELALU menghasilkan execution plan yang sama (dengan konfigurasi planner yang sama).
    - Evidence DAPAT direproduksi tanpa ambiguity. Dua auditor independen yang memulai dari Knowledge Snapshot ID yang sama HARUS sampai pada set Proof Objects + hash identik.
  determinism_scope:
    DECLARED_RELATIONSHIPS:
      - 100% deterministic by construction (data in YAML manifests; not computed)
    INFERRED_RELATIONSHIPS:
      - WAJIB deterministic (reasoner produces identical conclusion set from identical premises)
      - Setiap inferred edge WAJIB membawa `rule_id` + `premise_edge_ids[]` sebagai provenance sehingga reproducible tanpa menjalankan entire reasoner
    PLANNER_OUTPUT:
      - ExecutionPlan.steps[] ordering WAJIB deterministic topological sort (tie-break via transformation_id lex order)
      - ExecutionPlan.evidence.required WAJIB deterministic flag derived from snapshot, NOT from env
    EVIDENCE_HASH:
      - Setiap Proof Object hash WAJIB deterministic: deterministic canonical JSON serialization (key order, no whitespace variant)
  anti_patterns:
    - Reasoner menggunakan Date.now() / Math.random() / process.env / fetch() untuk decision branch
    - Planner menghasilkan ordering berbeda karena object property iteration order V8 vs Node vs Browser
    - Registry manifest load time berubah karena caching policy non-deterministic → sort order berbeda
  acl_check_required: true
  enforcement_acl_rule_id: ARCH-21

principle_12_explainability_and_justification:
  id: IA-12
  name: Explainable Reasoning and Traceable Justification
  rationale: >
    Tanpa IA-12, reasoner dan planner menjadi "kotak hitam" yang menghasilkan output tanpa bukti
    langkah demi langkah. IA-12 memastikan SETIAP keputusan dan inferensi dapat ditelusuri
    kembali ke premises asal dengan jalur yang jelas.
  formal_statement: >
    Every semantic inference and planning decision SHALL have a machine-readable,
    inspectable provenance chain linking it to the exact premises and rules used.
    "Trust by explanation" instead of "trust by authority".
  scope:
    - Declared edge instances → provenance: registry manifest path + line ref
    - Inferred edges → provenance: inference rule_id (INF-xxx) + premise_edge_ids[]
    - Decision candidates → provenance: candidate_generator_id + parameter_set
    - Rejected alternatives → provenance: rejection_reason string + failed_constraint_ids[]
    - Execution steps → provenance: which DIR.selected_alternative chain, with step ids
  acl_check_required: true
  notes: IA-12 was an emergent invariant from prior discussion; formalized here to make the 11 invariants explicit.

principle_13_stable_canonical_forms:
  id: IA-13
  name: Stable Canonical Forms — Makna Independen dari Serialization, Transport, Storage, Execution Technology
  anchor: IA-13-STABLE-CANONICAL-FORMS
  rationale: >
    Makna (meaning), representasi fisik (serialization), dan transport (encoding) selama ini
    tercampur dalam istilah Intermediate Representation / Canonical Representation. IA-13
    diperkuat menjadi bentuk Axiom B: EOS membekukan Canonical Form, BUKAN cara ia dikompilasi,
    disimpan, atau dikirim. Engine berkomunikasi melalui Canonical Form yang versioned +
    deterministic + independently verifiable. Canonical Form adalah identity logis tunggal.
    YAML, JSON, Binary, ProtoBuf, Database, Memory Object, Graph, Event Stream — SEMUA adalah
    perwujudan dari Canonical Form YANG SAMA, selama round-trip deterministik terjaga. Ini
    memisahkan: Meaning (Law II) ← Canonical Form (identity) ← Serialization/Transport
    (implementation detail).
  formal_statement: >
    Every EOS artifact stage SHALL possess exactly one normative Canonical Form.
    Canonical Form SHALL be independent of serialization, transport, storage, and execution technology.
    YAML, JSON, Binary, ProtoBuf, Database record, Memory Object, Graph node, Event Stream —
    all MAY realize the SAME Canonical Form. The Meaning (Law II), its Canonical Form identity,
    and any concrete serialization/transport encoding SHALL remain strictly separable concerns.
    Any downstream component MAY encode that Canonical Form into any transport format
    provided round-trip determinism is preserved back to the normative form identity.
  deprecated_aliases:
    - Stable Canonical Representations
    - Stable Intermediate Representations
    - Canonical Representation
    - Intermediate Representation
    - IR
  scope_required_canonical_forms:
    - form_id: KNOWLEDGE-FORM
      abbreviation: K-FORM
      normative_term: Knowledge Canonical Form
      deprecated_aliases: [KNOWLEDGE-REP, KNOWLEDGE_IR, Knowledge IR, KIR, K-REP]
      produced_after: "Knowledge interpretation stage (historically: Passes 1-5 of knowledge builder pipeline)."
      authority_stage: INTERPRETATION
    - form_id: DECISION-FORM
      abbreviation: D-FORM
      normative_term: Decision Canonical Form
      deprecated_aliases: [DECISION-REP, DECISION_IR, Decision IR, DIR, D-REP]
      produced_after: "Planning + Decision stage (historically Passes 6-7)."
      authority_stage: DECISION
    - form_id: EXECUTION-FORM
      abbreviation: X-FORM
      normative_term: Execution Canonical Form
      deprecated_aliases: [EXECUTION-REP, EXECUTION_PLAN_IR, Execution Plan IR, Plan IR, X-REP]
      produced_after: "Plan compilation stage (historically Pass 8). Boundary for Execution System."
      authority_stage: EXECUTION
    - form_id: EVIDENCE-FORM
      abbreviation: V-FORM
      normative_term: Evidence Canonical Form
      deprecated_aliases: [EVIDENCE-REP, EVIDENCE_GRAPH_IR (EPG), Evidence Provenance Graph, Evidence IR, V-REP]
      produced_after: "Evidence compilation / Ledger append."
      authority_stage: EVIDENCE
  canonical_form_properties_required:
    - identity_independent_of_serialization: Canonical Form identity is the SAME across all concretizations (YAML, JSON, binary, graph, db, memory). Two artifacts with different serialization but identical Canonical Form are semantically identical.
    - explicit: disimpan sebagai normative artifact (atau bentuk canonical serialization yang dapat di-hash). TIDAK BOLEH hanya ada di in-memory object graph.
    - versioned: field `form_format_version` (SemVer string). Backward-compat = minor. Breaking = major.
    - deterministic: identik Canonical Form → identik identity-hash → identik logical equality (canonical serialization sorted keys for any given concretization).
    - self_describing: field header mendeskripsikan upstream source id + daftar transformations yang menghasilkan Canonical Form ini.
    - independently_verifiable: setiap Canonical Form WAJIB menyertakan `form_content_hash` yang dihitung pada emit time; verifier dapat recompute hash dari concretization manapun dan mendapatkan hash identity YANG SAMA.
    - transport_storage_execution_agnostic: serialization/transport/storage/execution format choice NOT normatively constrained; only round-trip determinism back to identity is.
  consequence_guarantees:
    - technology_freedom: Replace YAML dengan ProtoBuf? Tambah vector index projection? Semua legal — Canonical Form identity tetap sama. Tidak ada coupling ke media representasi.
    - resumeable_pipeline: Jika build gagal di titik manapun, developer dapat resume dari cached Canonical Form tanpa re-run upstream.
    - reproducibility: Interpretation → Decision → Execution → Evidence hash chain dapat diikuti byte-for-byte melalui form identity hashes.
    - debugging: Canonical Form snapshot = time capsule of state at an authority stage boundary, reproducible dari concretization manapun.
    - engine_swap: Ganti Planner engine? cukup pastikan input K-FORM = sama dan expected output D-FORM identity = sama. Tidak ada tight coupling ke compiler technology.
  verification_strategy:
    - Cross-format round-trip test: form(YAML) → encode JSON → decode → recanonicalize YAML; compare SHA-256 form identity byte-identical. Repeat for binary, graph, db concretizations.
    - Schema validation: Setiap Canonical Form punya schema + Zod validator for every concretization.
    - Schema drift test: golden fixture hash comparison; drift = test FAIL.
    - Reproducibility: 2x generate dari input sama → form identity hash sama di semua concretization.
  acl_check_required: true
  enforcement_acl_rule_id: ARCH-22-IA13-STABLE-CANONICAL-FORMS
  axiom_realization: Axiom B — Meaning
  tf1_cross_ref: governance/TERMINOLOGY-FREEZE-TF1.yaml#TERM-CANONICAL-FORM

principle_14_pure_compiler_passes:
  id: IA-14
  name: Pure Transformations — No Upstream Mutation, No Undeclared State
  rationale: >
    IA-10 (Immutable Snapshot) menjamin knowledge state tidak berubah setelah planning dimulai.
    IA-11 menjamin semantic determinism.
    IA-14 memperkuat keduanya dengan menjamin: SETIAP transformation secara individual BUKAN impurity.
    Transformation hanya memproduksi output canonical representation + diagnostics dari input
    canonical representation yang dideklarasikan. Tidak ada side effect. Tidak ada mutable shared
    state. Tidak ada env-dependent semantic branches.
  formal_statement: >
    Each reasoning transformation SHALL be functionally pure with respect to its declared inputs.
    A transformation MAY produce diagnostics and metadata, but SHALL NOT mutate upstream artifacts
    or depend on undeclared external state.
  per_transformation_properties_required:
    - declared_inputs: 'daftar eksplisit artifact classes / paths yang dibaca (misal: "ONLY snapshot + Semantic Kernel relationships").'
    - declared_outputs: "daftar eksplisit canonical representation classes yang dihasilkan + diagnostics."
    - no_upstream_mutation: "Transformation NEVER menulis ke upstream artifact. NEVER memanggil fs.writeFileSync ke snapshot archive, atau merubah kontrak/registry secara in-place."
    - no_undeclared_external_state: |
        Transformation TIDAK BOLEH bergantung pada:
          * environment vars untuk semantic decision branches
          * wall-clock time (Date.now() / new Date()) untuk non-diagnostic purposes
          * network IO (fetch, http, etc.)
          * global singletons / globalThis mutable state
          * process pid / rng / non-deterministic V8 property iteration
  diagnostics_vs_semantics_separation:
    rule: >
      Transformation boleh emit timestamp HANYA di field `diagnostics[]` metadata informational.
      Transformation TIDAK BOLEH menggunakan timestamp apapun di dalam perhitungan yang mempengaruhi
      output canonical representation (hanya untuk info audit tidak untuk hash determinism).
  transformation_failure_model:
    statement: >
      A pure transformation either returns output_representation: Canonical Representation +
      diagnostics: Diagnostic[], OR throws a validation error dengan pesan yang jelas mengapa input
      tidak valid. Transformation NEVER "returns best effort corrupted representation", dan NEVER
      silently swallows error kemudian mengembalikan representasi parsial tanpa tanda invalid.
  deprecated_aliases:
    - Pure Compiler Passes
    - Compiler Pass
    - Pass
  verification_strategy:
    - Unit test: input fixture representation → expected output representation golden hash. Determinism 2x run equal.
    - Unit test: upstream artifact exists before transformation, untouched (stat.mtime + content hash) after transformation.
    - Lint-like ACL scan (ARCH-23) for impurity patterns in transformation source files.
  acl_check_required: true
  enforcement_acl_rule_id: ARCH-23-IA14-PURE-PASS
  tf1_cross_ref: governance/TERMINOLOGY-FREEZE-TF1.yaml#TERM-TRANSFORMATION

principle_15_dual_primary_graphs:
  id: IA-15
  name: Dual Primary Graphs — Authority Graph × Knowledge Graph Strictly Separated
  anchor: IA-15-DUAL-PRIMARY-GRAPHS
  axiom_realization: Axiom A (Authority Graph) + Axiom B (Knowledge Graph)
  rationale: >
    Sebelumnya edge taxonomy tercampur: edge "approves" dan edge "depends_on" berada dalam
    satu graph yang sama. Padahal keduanya menjawab pertanyaan FUNDAMENTAL yang berbeda dan
    berasal dari HUKUM yang berbeda. IA-15 menetapkan EOS memiliki DUA graph primer yang
    benar-benar terpisah: Authority Graph (Law I, Axiom A) menjawab "Why is this artifact
    valid?"; Knowledge Graph (Law II, Axiom B) menjawab "What does this artifact mean?".
    Keduanya TIDAK BOLEH bercampur. Jika sebuah edge menjawab "mengapa sah" → Authority
    Graph. Jika menjawab "apa hubungannya secara semantik" → Knowledge Graph. Ini adalah
    pemisahan ontologis yang bersih antara legitimasi dan makna.
  formal_statement: >
    EOS SHALL maintain TWO strictly separate primary graphs:
      (a) AUTHORITY GRAPH — Law I / Axiom A domain. Node = artifacts and actors.
          Edges = legitimacy relations. Answers "Why is this artifact valid?".
      (b) KNOWLEDGE GRAPH — Law II / Axiom B domain. Node = semantic objects.
          Edges = meaning relations. Answers "What does this artifact mean?".
    No edge class SHALL appear in both graphs. Mixing authority edges into the semantic
    graph, or vice versa, is an IA-15 violation. The Constitutional Verifier MUST validate
    edge classification on every graph write operation.
  authority_graph_spec:
    node_kinds: [ConstitutionArtifact, GovernanceArtifact, SpecificationArtifact, Contract, RegistryEntry, DecisionRecord, HumanActor]
    edge_kinds:
      - approves
      - supersedes
      - delegates
      - authorizes
      - derives_authority_from
      - amends
      - attests
      - epoch_bounds
    graph_property: STRICTLY_DIRECTED_ACYCLIC_GRAPH
    cycle_detection_rule: "Any cycle in Authority Graph = FATAL IA-15 + IA-17 violation. Constitutional Verifier CV-STAGE-2 MUST detect and REJECT."
    authority_level_monotonicity: "Edge FROM node X TO node Y implies authority_level(X) > authority_level(Y) or authority_level(X) == authority_level(Y) for same-stage peer review. Backward edges (lower authority → higher authority) are FORBIDDEN."
  knowledge_graph_spec:
    node_kinds: [Requirement, Intent, Policy, ContractTerm, OntologyClass, CanonicalForm, VocabularyTerm, Capability, Actor, BusinessService]
    edge_kinds:
      - depends_on
      - implements
      - extends
      - contains
      - references
      - equivalent_to
      - specializes
      - refines
      - aggregates
    graph_property: DIRECTED_GRAPH (cycles ALLOWED only for equivalent_to symmetric closure; otherwise MUST be DAG for all other edge kinds)
    semantic_preservation_rule: "A transformation that maps Knowledge Graph G_in to G_out SHALL have an edge-by-edge semantic_preservation_proof that no meaning is added or removed, unless explicitly declared in the Transformation Semantics contract."
  separation_invariants:
    - disjoint_edge_kinds: "The sets AuthorityGraph.edge_kinds and KnowledgeGraph.edge_kinds are pairwise disjoint. No element appears in both."
    - disjoint_semantics: "An edge whose primary answer is 'why valid?' MUST NOT be stored or inferred inside the Knowledge Graph. An edge whose primary answer is 'what means?' MUST NOT be stored or inferred inside the Authority Graph."
    - cross_graph_reference_only: "An Authority Graph node MAY carry a reference (via URI / artifact_id) to a Knowledge Graph node that expresses its semantic content. But the reference itself is NOT an authority edge, and the graph structures remain separate."
  verification_strategy:
    - Constitutional Verifier CV-STAGE-4 scans every edge declaration and validates graph_class assignment (AUTHORITY vs KNOWLEDGE).
    - Cross-edge-kind scan: union of the two edge_kinds sets MUST equal the declaration set; intersection MUST be empty.
    - Cycle detection algorithm (Tarjan's) runs on Authority Graph; any SCC of size > 1 = FAIL.
  acl_check_required: true
  enforcement_acl_rule_id: ARCH-37-IA15-DUAL-GRAPHS
  gate_impact:
    gate_c: "Low — Current catalog edges are semantic; no authority graph yet. IA-15 establishes target state."
    gate_d: "MEDIUM — All T002..T005 contracts must declare graph_class per edge. Mixed-class edges = Gate-D Declined."
    gate_e: "HIGH — Repository Certification must show dual graph separation holds across all artifacts."

principle_16_transformation_semantics_strategy:
  id: IA-16
  name: Transformation Semantics × Transformation Strategy — Separasi Wajib Seperti SQL ↔ Optimizer
  anchor: IA-16-SEMANTICS-STRATEGY-SEPARATION
  axiom_realization: Axiom C — Realization
  rationale: >
    Selama ini "Transformation" adalah konsep campuran: ia mendefinisikan INPUT/OUTPUT
    (apa yang harus dihasilkan) TETAPI juga mendefinisikan CARA (planner, rule engine, LLM,
    dst). IA-16 memisahkan keduanya seperti pemisahan SQL Standard vs Query Optimizer,
    atau POSIX vs Kernel Implementation. Semantics = yang beku. Strategy = yang dapat
    berubah total. Pemisahan ini membuat EOS tahan terhadap perubahan teknologi: AI
    planner, SAT solver, streaming, distributed optimizer — semuanya adalah Strategy
    berbeda yang menjalankan Semantics yang SAMA.
  formal_statement: >
    Every EOS transformation SHALL be separable into two independently-versioned artifacts:
      (a) TRANSFORMATION SEMANTICS — frozen normative contract. Defines ONLY:
          Inputs, Outputs, Preconditions, Postconditions, Invariants.
          Semantics SHALL be technology-agnostic and implementation-oblivious.
      (b) TRANSFORMATION STRATEGY — interchangeable implementation. Defines HOW:
          Planner, SAT Solver, Rule Engine, LLM, Compiler, Streaming, Distributed Optimizer.
          Strategy MAY be replaced entirely without changing Semantics version.
    The relationship IS: Semantics 1 → * Strategy (one normative contract, many strategies allowed).
    A Strategy instance MUST produce output conforming to the Semantics contract for all inputs
    within the declared precondition domain.
  transformation_semantics_spec:
    fields_required:
      - id: canonical transformation_semantics_id (e.g. TS-ELS-TO-EIR-v1)
      - inputs: ordered list of (canonical_form_id, cardinality, preconditions)
      - outputs: ordered list of (canonical_form_id, cardinality, postconditions)
      - invariants: list of (invariant_id, formal_statement) that MUST hold across every strategy
      - semantic_preservation_claims: boolean flags for {authority, meaning}
      - conformance_class: reference to CONFORMANCE-PROPERTIES.yaml required vector
    forbidden_in_semantics:
      - Any reference to a specific algorithm, data structure, or programming language
      - Any reference to planner, rule engine, LLM, compiler, or scheduler type
      - Any performance, latency, or resource constraint (these are Strategy concerns)
      - Any hardcoded transformation sequence or step ordering
    versioning_policy:
      - Breaking change to inputs/outputs/preconditions/postconditions → MAJOR version bump
      - New optional field added → MINOR version bump
      - Correction of documented bug in semantics (not strategy) → PATCH only if no conforming strategy breaks
  transformation_strategy_spec:
    fields_required:
      - id: canonical strategy_id (e.g. STRAT-ELS-TO-EIR-VANILLA-COMPILER-v1)
      - implements_semantics: reference to transformation_semantics_id + version range
      - strategy_kind: enum { PLANNER, SAT_SOLVER, RULE_ENGINE, LLM, COMPILER, STREAMING, DISTRIBUTED_OPTIMIZER, HYBRID, OTHER }
      - correctness_proof_approach: { FORMAL, TEST_SUITE, GOLDEN_FIXTURES, PROBABILISTIC, INFORMAL }
      - determinism_class: { STRONG_DETERMINISTIC, WEAK_DETERMINISTIC, NON_DETERMINISTIC_BUT_AUDITABLE }
      - required_runtime_capabilities: list of capability tokens (e.g. "FILESYSTEM_READ", "LLM_API_ENDPOINT")
    interchangeability_property: >
      Two strategies S1 and S2 that implement the SAME Semantics contract SHALL be
      interchangeable: for every input in the precondition domain, S1(input) and S2(input)
      MUST produce outputs meeting the Semantics postconditions (they may differ internally,
      and even differ in output structuring if the Semantics allows multiple valid outputs,
      but both must pass conformance).
  separasi_pattern_examples:
    standard_example:
      analogy: "SQL Standard ↔ Query Optimizer"
      semantics: "ISO/IEC 9075 SQL:2023 — defines SELECT/JOIN/WHERE semantics ONLY"
      strategy_examples: ["PostgreSQL optimizer", "MySQL optimizer", "ClickHouse query planner", "DuckDB"]
    eos_example:
      semantics: "TS-REQ-TO-KNOWLEDGE-FORM-v1 — defines how Requirement YAML becomes Knowledge Canonical Form"
      strategy_examples:
        - "STRAT-R2KF-RULE-ENGINE-v1 — rule-based compiler"
        - "STRAT-R2KF-LLM-v2 — LLM-augmented transformation with audit trail"
        - "STRAT-R2KF-SAT-v3 — SAT solver for constraint satisfaction"
  verification_strategy:
    - Strategy interchangeability test: run S1(input) and S2(input) for N fixtures; both MUST produce conforming outputs.
    - Semantics purity check: ACL scan (ARCH-38) of transformation_semantics.yaml files for FORBIDDEN_IN_SEMANTICS patterns.
    - Semantics-to-Strategy wiring: verify strategy.implements_semantics references valid + active Semantics version.
  acl_check_required: true
  enforcement_acl_rule_id: ARCH-38-IA16-SEMANTICS-STRATEGY
  gate_impact:
    gate_c: "Low — Existing T001 has implicit semantics; no structural change required for PASS preservation."
    gate_d: "HIGH — Every transformation T002..T005 MUST have explicit Semantics artifact + at least one Strategy artifact."
    gate_e: "CRITICAL — Repository Certification must show: every Semantics has ≥2 Strategy implementations (conformance coverage)."

principle_17_constitution_preservation:
  id: IA-17
  name: Constitution Preservation — Meta-Invariant covering Legitimate ∧ MeaningPreserved ∧ Provable
  anchor: IA-17-CONSTITUTION-PRESERVATION
  axiom_realization: Constitutional Predicates A ∧ B ∧ C (Legitimate + MeaningPreserved + Provable) — frozen in CC-001 §3–§5
  predicate_derivation: Direct structural invariant form of the Constitutional Validity meta-predicate (ConstitutionallyValid ⇔ PRED_A ∧ PRED_B ∧ PRED_C). Former name "IA-17 Authority Preservation" is now the PRED_A sub-component only.
  rationale: >
    Penyempurnaan tingkat META di atas seluruh IA-xx invariant. SELURUH tahap EOS
    (planner, compiler, optimizer, AI planner, cache, incremental build, distributed execution)
    tunduk pada SATU aturan konstitusional yang sama: every transformation SHALL preserve
    constitutional validity. Artinya, tidak hanya otoritas (Legitimate/PRED_A) yang dijaga,
    tetapi juga makna normatif (MeaningPreserved/PRED_B) dan kebuktian (Provable/PRED_C).
    Sebuah transformation bisa byte-deterministik TETAPI jika maknanya drift (PRED_B=FALSE)
    atau evidence tidak cukup untuk membuktikan postcondition (PRED_C=FALSE) → tetap
    IA-17 violation. Inilah SATU invariant meta yang menggantikan kebutuhan akan "Authority
    Preservation", "Semantic Preservation", dan "Correctness Preservation" sebagai invariant
    terpisah.
  epistemological_status: CONSTITUTIONAL_META_INVARIANT (from CC-001 §6 Constitutional Validity)
  formal_statement: >
    Every architectural transformation SHALL preserve constitutional validity.

    ConstitutionallyValid(T)  ⇔  Legitimate(T)  ∧  MeaningPreserved(T)  ∧  Provable(T)

    Transformations MAY derive, refine, optimize, or materialize knowledge, but SHALL NEVER:
      (a) introduce new authoritative semantics not rooted in canonical sources   [= ¬Legitimate breach],
      (b) alter normative meaning via Canonical Identity drift                    [= ¬MeaningPreserved breach],
      (c) emit a PASS verdict without a sufficient evidence corpus entailing Postconditions(T)  [= ¬Provable breach].
  covering_cases:
    PLANNER: >
      Planner MAY select among candidates but SHALL NOT:
        (a) invent candidate semantics not present in Interpretation-stage CanonicalIdentity inputs [PRED_A],
        (b) produce a Decision Form whose CanonicalIdentity semantic_equivalence to input K-FORM = FALSE [PRED_B],
        (c) select PASS without sufficient evidence of preference rationale [PRED_C].
    COMPILER: >
      Compiler MAY optimize but MUST preserve:
        (a) observable authority semantics of input CanonicalIdentity [PRED_A],
        (b) semantic_equivalence of output CanonicalIdentity to input [PRED_B],
        (c) emitted evidence ⊢ Postconditions(TransformationContract) [PRED_C].
    OPTIMIZER: >
      Optimizer MAY reorder / parallelize, but SHALL NOT:
        (a) reorder across authority-level boundaries (authority monotonicity preserved) [PRED_A],
        (b) produce decision divergence on identical inputs (Semantic Determinism) [PRED_B],
        (c) declare optimization PASS without transformation-correctness evidence [PRED_C].
    AI_PLANNER: >
      AI Planner MAY propose candidates, but SHALL ensure:
        (a) each decision traceable to canonical Interpretation AuthorityRel edges; non-deterministic generation path is NOT by itself authority [PRED_A],
        (b) proposal CanonicalIdentity is well-defined and semantically closed under input [PRED_B],
        (c) every candidate carries provenance evidence (rule_id + premise_ids) sufficient for re-verification [PRED_C].
    CACHE: >
      Cache hits MUST verify:
        (a) cache.key derivation from CanonicalIdentity inputs, NEVER from stale AuthorityRel paths [PRED_A],
        (b) cached CanonicalIdentity semantic_equivalence check against current input (not just byte hash) [PRED_B],
        (c) cache evidence (hit miss derivation) preserved in ledger for audit [PRED_C].
    INCREMENTAL_BUILD: >
      Invalidation MUST cascade when ANY upstream CanonicalIdentity field changes that is:
        (a) AuthorityRel-relevant (authority change) [PRED_A],
        (b) SemanticRel-relevant (meaning change) [PRED_B],
        (c) EvidencePostcondition-relevant (provability change) [PRED_C].
    DISTRIBUTED_EXECUTION: >
      Scheduler split, partial result combine, retries MUST produce:
        (a) no authority_gain (distributed parts never have higher authority_level than whole) [PRED_A],
        (b) combined output CanonicalIdentity = deterministic merge = same as single-run X-FORM identity [PRED_B],
        (c) combine evidence sufficient to reconstruct Postconditions(whole-run contract) [PRED_C].
  constitutional_validity_pipeline:
    name: EOS Constitutional Validity Pipeline (formerly "Authority Pipeline" — expanded)
    stages_ordered:
      - AUTHORITY
      - INTERPRETATION
      - DECISION
      - EXECUTION
      - EVIDENCE
    predicate_boundary_per_stage:
      AUTHORITY:     "PRED_A resolved. All downstream stages inherit authority_level ≤ AUTHORITY stage."
      INTERPRETATION: "PRED_B resolved. CanonicalIdentity(i) well-defined for every input artifact i."
      DECISION:       "PRED_B maintained. Decision CanonicalIdentity semantically equivalent to Interpretation closure."
      EXECUTION:      "PRED_C established. Execution emits Evidence(t,T) ⊢ Postconditions(T)."
      EVIDENCE:       "All three witnesses collected. ConstitutionallyValid(T) ⇔ TRUE ↔ Verdict PASS emitted."
    authority_level_index_map:
      AUTHORITY: 0
      INTERPRETATION: 1
      DECISION: 2
      EXECUTION: 3
      EVIDENCE: 4
    invariant_each_step: "Every stage transition X→Y SHALL have authority_level_index(Y) ≥ authority_level_index(X). Strict equality ONLY allowed for intra-stage peer review."
    constitutional_integrity_rule: >
      Every artifact's constitutional_chain MUST resolve:
        (PRED_A) via AuthorityRel to an AUTHORITY-stage canonical root,
        (PRED_B) via SemanticEquivalence to a well-defined CanonicalIdentity,
        (PRED_C) via Evidence(t,T) ⊢ Postconditions(T) with no evidential gap.
      Loops, self-loops, dangling references = FATAL IA-17 violation.
  verification_strategy:
    - Constitutional Verifier CV-STAGE-2 (DAG direction) validates authority_level_index monotonicity on AuthorityRel edges [PRED_A sub-check].
    - CV-STAGE-1 (Type System) rejects AUTHORITY_GAIN_TYPE_ERROR + SEMANTIC_DRIFT_ERROR + EVIDENTIAL_GAP_ERROR [all three predicates].
    - ARCH-36-CONSTITUTION-GAIN (formerly ARCH-36-AUTHORITY-GAIN, expanded) performs structural scan of every transformation output for PRED_A/PRED_B/PRED_C violations.
    - Witness tuple ⟨witness_A, witness_B, witness_C⟩ is atomically appended to Ledger; re-verification of IA-17 PASS = re-verification of all three witnesses.
  acl_check_required: true
  enforcement_acl_rule_id: ARCH-36-CONSTITUTION-GAIN (supersedes legacy ARCH-36-AUTHORITY-GAIN)
  tf1_cross_ref: governance/TERMINOLOGY-FREEZE-TF1.yaml#TERM-IA17
  gate_impact:
    gate_c: "Low — T001 output sudah downstream of Interpretation. Existing T001 PASS Proof Object retroactively classified as witness_C (Provable sub-witness); witness_A and witness_B waived with explicit GATEC-CP-WAIVER notation for Sprint-0 only."
    gate_d: "CRITICAL — All Gate-D deliverables MUST emit complete ⟨witness_A, witness_B, witness_C⟩ tuple. Missing ANY witness = Gate-D Declined."
    gate_e: "FATAL — Repository Certification WAJIB menunjukkan: IA-17 = PASS on EVERY transformation in certification scope (no PRED_A/PRED_B/PRED_C breach on ANY artifact)."

principle_18_constitutional_proof:
  id: IA-18
  name: "Constitutional Proof — DERIVED Witness Tuple ⟨witness_Legitimate, witness_MeaningPreserved, witness_Provable⟩"
  anchor: IA-18-CONSTITUTIONAL-PROOF
  axiom_realization: CC-001 §6 Constitutional Validity (witness materialization of Predicates A ∧ B ∧ C)
  predicate_derivation: >
    Constitutional Proof is EXPLICITLY DERIVED, NOT constitutional. The three predicates
    Legitimate / MeaningPreserved / Provable and their conjunction ConstitutionallyValid
    are the ONLY constitutional-level concepts. IA-18 materializes that conjunction into
    a machine-auditable witness tuple that can be stored in the Ledger, replayed, and
    independently verified.
  rationale: >
    Konsep "Constitutional Proof" sebelumnya di-frame sebagai "tiga sub-proof" yang setara
    statusnya dengan predikat. Kini direduksi menjadi: Constitutional Proof adalah BUKAN
    konsep utama. Ia adalah WITNESS TUPLE — artefak audit yang materialisasi evaluasi
    tiga predikat konstitusional. Perbedaan filosofisnya mendalam:

    BEFORE: "Constitutional Proof adalah 3 sub-bukti yang harus PASS (Authority + Semantic + Correctness)."
    AFTER:  "ConstitutionalProof(T) = ⟨w_A, w_B, w_C⟩ where w_A justifies Legitimate(T),
            w_B justifies MeaningPreserved(T), w_C justifies Provable(T).
            ConstitutionalProof(T) is COMPLETE  ⇔  ConstitutionallyValid(T)."

    Ini sesuai dengan paradigma ilmu pengetahuan: "kita tidak membuktikan 'hukum', kita
    mengevaluasi predikat dan merekam witness-nya". Witness adalah artefak yang
    dapat dipertukarkan lintas epoch dan teknologi — selama ketiga predikat bernilai
    sama, bentuk witness boleh berubah total.
  formal_statement: >
    ConstitutionalProof is a DERIVED witness tuple, NOT a constitutional concept.

    ConstitutionalProof(T)  =  ⟨  witness_Legitimate(T),
                                   witness_MeaningPreserved(T),
                                   witness_Provable(T)       ⟩

    where each witness is any artifact that JUSTIFIES a TRUE evaluation of the
    corresponding predicate, per:

      witness_Legitimate(T)         justifies  Legitimate(T)         = TRUE
      witness_MeaningPreserved(T)   justifies  MeaningPreserved(T)   = TRUE
      witness_Provable(T)           justifies  Provable(T)           = TRUE

    Completeness property (from CC-001 §6):
      ConstitutionalProof(T) is COMPLETE   ⇔   ConstitutionallyValid(T)

    Witness FORM is NOT prescribed. A witness MAY be: a DAG walk certificate, a
    semantic equivalence proof object, a conformance test report, an LLM-generated
    audit trail, a cryptographic hash chain, or a human-signed approval document.
    Only the witness's JUSTIFICATION POWER (does it, on replay, cause the predicate
    to evaluate TRUE on T?) is normative. The representation = fungible engineering.
  three_witness_spec:
    witness_A_legitimate:
      name: Witness A — Legitimate(x) Justification
      predicate_reference: CC-001 §3 Legitimate(x)
      justifies: "Legitimate(T) = TRUE — artifact T has valid AuthorityRel chain from canonical root with no cycles."
      normative_relation_set: "AuthorityRel = { Authorizes, Delegates, Supersedes, Approves, DerivesAuthorityFrom, Ratifies, Amends, EpochBinds } (FROZEN per CC-001 §3)"
      evidence_elements_required:
        - authority_root_resolution: every artifact's authority_chain resolves to an AUTHORITY-stage canonical root via AuthorityRel edges only
        - no_authority_cycle: Tarjan SCC or equivalent algorithm confirms AuthorityRel closure = strict DAG (no SCC of size > 1)
        - authority_level_monotonicity: across every AuthorityRel edge, authority_level_index(target) ≥ authority_level_index(source)
        - epoch_binding_validity: artifact's declared_epoch is within the EpochBinds relation range authorized by Constitution
      representation_examples:
        - "Authority Graph walk certificate (Neo4j / RDF / SQL query result)"
        - "Git DAG merkle-proof of derives_authority_from chain"
        - "Cryptographic signature chain from Constitution root → artifact"
        - "YAML manifest of authority chain with hash references + manual Architecture Board signatures"
      fail_mode: LEGITIMATE_WITNESS_WEAK or AUTHORITY_GAIN_TYPE_ERROR or AUTHORITY_DANGLING_REFERENCE or AUTHORITY_DAG_CYCLE
    witness_B_meaning_preserved:
      name: Witness B — MeaningPreserved(T) Justification
      predicate_reference: CC-001 §4 MeaningPreserved(T)
      justifies: "MeaningPreserved(T) = TRUE — T's output CanonicalIdentity set is semantically equivalent to T's input CanonicalIdentity set under SemanticRel closure."
      normative_concepts:
        - "CanonicalIdentity (FUNDAMENTAL abstract logical identity, per CC-001 §4 — NOT CanonicalForm)"
        - "SemanticRel = { DependsOn, Implements, Extends, Contains, References, EquivalentTo, Specializes, Refines, Uses } (FROZEN per CC-001 §4)"
        - "TransformationContract(T) = ⟨Inputs, Outputs, Preconditions, Postconditions, Invariants⟩"
      evidence_elements_required:
        - canonical_identity_well_defined: every artifact i ∈ Inputs(T) ∪ Outputs(T) has a well-defined CanonicalIdentity with deterministic identity-hash
        - semantic_equivalence_proof: SemanticEquivalence(⊔{CanonicalIdentity(i) | i ∈ Inputs(T)}, ⊔{CanonicalIdentity(o) | o ∈ Outputs(T)}) = TRUE — proven via SemanticRel homomorphism check
        - vocabulary_lexical_closure: every CanonicalIdentity term in Outputs(T) is registered in Constitutional Lexicon Registry (IA-19) with status ≥ ACTIVE
        - semantic_determinism_certificate: 2x replay of T on identical inputs produces identical CanonicalIdentity output set (IA-11 Semantic Determinism verified)
      representation_examples:
        - "Canonical Form identity hash chain K-FORM → D-FORM → X-FORM → V-FORM with round-trip proof"
        - "Knowledge Graph homomorphism proof (edges_in ⊑ edges_out modulo explicit extension declarations in contract)"
        - "Semantic Kernel inference trace with rule_id + premise_ids per edge"
        - "LLM-generated semantic diff report with ground-truth reference alignment"
      fail_mode: MEANING_WITNESS_WEAK or SEMANTIC_DRIFT_ERROR or CANONICAL_IDENTITY_MISMATCH or UNREGISTERED_TERM
    witness_C_provable:
      name: Witness C — Provable(T) Justification
      predicate_reference: CC-001 §5 Provable(T)
      justifies: "Provable(T) = TRUE — for every execution instance t of T reaching verdict stage, Evidence(t,T) syntactically entails Postconditions(T), and there is no evidential gap allowing ¬Postconditions(T) coexisting with a PASS verdict emission."
      normative_concepts:
        - "Evidence(t, T) = runtime evidence corpus for execution instance t of T"
        - "Postconditions(T) = extracted from TransformationContract(T) (NOT from strategy)"
        - "Evidence ⊢ Postconditions = syntactic entailment or constructive check; NOT probabilistic belief"
      evidence_elements_required:
        - postcondition_entailment: for each postcondition P ∈ Postconditions(T), Evidence(t,T) contains a witness (test result, hash match, conformance bit) that constructively establishes P=TRUE
        - no_evidential_gap_scan: exhaustive check that for every postcondition P, there is NO possible world in which ¬P holds but all evidence bits are identical (i.e., evidence is complete for the postcondition domain)
        - precondition_domain_check: inputs satisfied Preconditions(T) domain; run was within declared scope (not extrapolation)
        - strategy_correctness_evidence: Transformation Strategy (fungible) executed its declared correctness approach (FORMAL / TEST_SUITE / GOLDEN_FIXTURES / PROBABILISTIC / INFORMAL) and the result is archived
      representation_examples:
        - "Golden fixture hash match (output_sha256 == expected_sha256) for every declared output"
        - "Zod schema validation + Predicate registry evaluation of every PRED-* on output artifacts"
        - "Formal proof object from SAT/SMT solver encoding of Postconditions(T)"
        - "Coverage report showing 100% of postcondition assertions touched at runtime"
      fail_mode: PROVABLE_WITNESS_WEAK or TRANSFORMATION_POSTCONDITION_FAIL or INVARIANT_BREACH or EVIDENTIAL_GAP
  witness_composition_order:
    invariant: >
      Witnesses are conceptually ORDERED but independently justifiable:
        (1) Legitimate witness (w_A) is required first — a transformation with no authority cannot meaningfully produce semantic or correctness evidence.
        (2) MeaningPreserved witness (w_B) is required second — a semantically-drifted transformation is invalid regardless of execution correctness.
        (3) Provable witness (w_C) is required third — a legitimate+meaningful transformation is still useless without evidence that it actually worked.

      Independence property is PRESERVED: w_C can be PASS while w_A FAIL (example: implementation correct, executed by unauthorized agent) → overall ConstitutionallyValid(T) = FALSE per IA-20.
    aggregation_logic: "ConstitutionalProof(T) COMPLETE ⇔ (w_A=JUSTIFIES_PRED_A) ∧ (w_B=JUSTIFIES_PRED_B) ∧ (w_C=JUSTIFIES_PRED_C). If ANY witness is absent/insufficient → tuple is INCOMPLETE → ConstitutionallyValid(T) = FALSE (or INCONCLUSIVE if audit ongoing)."
  ledger_atomicity:
    append_model: "ConstitutionalProof(T) composite ID + three witness IDs are appended ATOMICALLY to the Evidence Ledger. Partial append (e.g. w_C appended without w_A) = LEDGER_CORRUPTION → IA-17 Constitution Preservation FAIL."
    composite_id_scheme: "CP-<unix_millis>-<w_A_id_8hex>-<w_B_id_8hex>-<w_C_id_8hex>"
    re_verification: "An auditor takes composite ID from Ledger, loads all three witnesses from evidence store, re-runs Constitutional Verifier CV-STAGE-0→6, and confirms IA-20(T) = same verdict as the archived result."
  downstream_artifacts_dependency:
    execution_evidence: "Hanya dihasilkan JIKA ConstitutionalProof(T) is COMPLETE (w_A ∧ w_B ∧ w_C all justify). Evidence carries reference ke composite ID + tiga witness IDs."
    assessment: "Menerima ExecutionEvidence + ConstitutionalProof composite ID + TransformationContract(T) sebagai input. Machine-evaluates per-property PASS/FAIL/INCONCLUSIVE matrix."
    justification: "Structured narrative that LISTS the three witnesses, cites their authority sources (AuthorityRel edges / SemanticRel homomorphisms / Postcondition entailment steps), and explains IA-20 verdict."
    verdict: "Verdict PASS hanya dapat diemit JIKA: ConstitutionalProof(T) COMPLETE ∧ Assessment matrix all PASS ∧ Justification narrative is lexically closed. No exceptions."
  verification_strategy:
    - Witness independence test: remove any one of {w_A, w_B, w_C} → ConstitutionalVerifier MUST return INCOMPLETE → Verdict PASS emission MUST be prevented by ACL.
    - Witness fungibility test: replace one representation of w_A (e.g. Neo4j DAG cert) with another equivalent w_A (e.g. Git merkle proof) → ConstitutionalVerifier MUST reach identical IA-20 verdict on same T.
    - Replay determinism: auditor re-running CV-STAGE-0→6 on archived witnesses MUST produce byte-identical IA-20 verdict 100% of the time.
  acl_check_required: true
  enforcement_acl_rule_id: ARCH-39-IA18-CONSTITUTIONAL-PROOF
  gate_impact:
    gate_c: "Low — Existing T001 PASS Proof Object retroactively classified as witness_C (Provable justification). witness_A and witness_B WAIVED with explicit GATEC-CP-WAIVER notation for Sprint-0 only. T001 ConstitutionalProof(T001) recorded as INCOMPLETE-but-PROVISIONAL for Gate C purposes."
    gate_d: "CRITICAL — Every transformation T002..T005 run MUST emit COMPLETE ⟨w_A, w_B, w_C⟩ tuple. Absent witness or weak justification = ConstitutionalProof INCOMPLETE = Gate-D Declined. No gate waivers allowed."
    gate_e: "FATAL — Repository Certification = For every transformation T in scope: ConstitutionalProof(T) COMPLETE ∧ Auditor re-verification matches archive result. 100% coverage required; zero exceptions."

principle_19_constitutional_lexicon:
  id: IA-19
  name: Constitutional Lexicon Registry — Terminologi adalah Artefak Konstitusional, Bukan Sekadar Dokumentasi
  anchor: IA-19-CONSTITUTIONAL-LEXICON
  axiom_realization: Law I (Authority governs terminology) + Axiom B (Meaning requires canonical vocabulary)
  rationale: >
    Sebelumnya terminologi EOS didefinisikan di TERMINOLOGY-FREEZE-TF1.yaml sebagai
    dokumentasi normatif. IA-19 meningkatkan statusnya: setiap istilah EOS adalah ARTEFAK
    KONSTITUSIONAL yang tunduk pada Law I Authority. Sebuah istilah yang tidak terdaftar di
    Constitutional Lexicon adalah istilah TIDAK RESMI dan tooling DAPAT menolaknya.
    Lexicon juga mengatur deprecation: sebuah istilah lama (mis. "Canonical Representation")
    BISA digantikan oleh yang baru (mis. "Canonical Form") dengan migration path yang jelas
    (aliases, replacement, epoch), sehingga lintas-epoch kompatibilitas dapat dijaga secara
    otomatis oleh tooling. Ini menjadikan TERMINOLOGI bagian dari governance, bukan sekadar
    dokumentasi.
  formal_statement: >
    Every canonical EOS term SHALL be registered in the Constitutional Lexicon Registry.
    Each Lexicon entry SHALL have: Canonical Term, Definition, Authority Source, Epoch,
    Status, Replacement (if superseded), and Aliases (including deprecated aliases).
    A term NOT present in the Lexicon with status ≥ PROPOSED SHALL be treated as
    NON-CANONICAL by all EOS tooling. Deprecation and replacement SHALL be governed by
    Lexicon entries, not ad-hoc documentation notes.
  lexicon_entry_schema_required:
    fields:
      canonical_term: "string (unique primary key — normative term)"
      definition: "string (formal normative definition)"
      authority_source: "reference to artifact that authorizes this term (e.g. VISION-01, ASP-01, Axiom B, PASAL 8)"
      epoch: "string — epoch identifier when term was introduced"
      status: "enum { PROPOSED, ACTIVE, DEPRECATED, RETIRED, REJECTED }"
      replacement: "string | null — canonical_term of replacement if status ∈ {DEPRECATED, RETIRED}"
      aliases: "list of string — including deprecated_aliases and former canonical names; ALL are recognized by tooling but tooling emits deprecation WARNING for deprecated ones"
      first_appeared_in: "reference to artifact + version where term first appeared canonically"
      cross_ref_ia: "IA-id | null — IA invariant that governs this term if any"
      cross_ref_axiom: "A/B/C/D | null — which constitutional axiom this term primarily serves"
  lexicon_governance_lifecycle:
    proposal: "New term proposed via Lexicon PR → status = PROPOSED. Requires Platform Steward review."
    activation: "Term activated by Architecture Board vote + epoch boundary marker → status = ACTIVE."
    deprecation: "When term superseded: old term status → DEPRECATED, new term status → ACTIVE, both entries carry cross-reference in replacement/aliases fields."
    retirement: "After 2 full epochs of deprecation → status = RETIRED. Alias still recognized but tooling emits ERROR (not WARNING) at Gate-E."
    rejection: "Term found invalid or redundant → status = REJECTED. Recorded in Lexicon for audit trail but never used."
  tooling_capabilities_enabled_by_lexicon:
    term_rejection: "Constitutional Verifier CV-STAGE-5 driver LEX_SCAN rejects artifacts containing NON-CANONICAL terms without explicit deprecated_alias annotation."
    automatic_migration: "Code modernizer script reads Lexicon replacement field and performs rename: CanonicalRepresentation → CanonicalForm di seluruh codebase, preserving deprecated_alias tags for backcompat windows."
    cross_epoch_compatibility: "Documentation generator reads Lexicon aliases and generates 'Deprecated since epoch X — use Y instead' notices automatically."
    terminology_consistency: "ACL scan ensures that contract YAML fields + schema fields + code comments use only Canonical Term or registered Alias."
  example_entries:
    - entry: "Canonical Form"
      status: ACTIVE
      replacement: "—"
      aliases: ["Canonical Representation (deprecated)", "Intermediate Representation (deprecated)", "IR (deprecated)"]
      authority_source: "Axiom B — Meaning"
      note: "Former canonical term 'Canonical Representation' superseded per Law-Oriented simplification. All four deprecated aliases recognized until Gate-E."
    - entry: "Transformation Semantics"
      status: ACTIVE
      replacement: "—"
      aliases: []
      authority_source: "Axiom C — Realization, IA-16"
      note: "Normative input/output/precondition/postcondition/invariant contract for a transformation."
    - entry: "Transformation Strategy"
      status: ACTIVE
      replacement: "—"
      aliases: ["Transformation Implementation (overlapping alias — prefer Transformation Strategy when referring to interchangeable realizations)"]
      authority_source: "Axiom C — Realization, IA-16"
  verification_strategy:
    - LEX_SCAN (CV-STAGE-5): runs over all YAML/MD/TS artifacts, checks that every EOS domain term is in Lexicon (status ≥ PROPOSED).
    - Deprecation enforcement: term with status DEPRECATED triggers ARCH-40 WARNING at Gate-D, ERROR at Gate-E (unless LEGACY waiver in artifact metadata).
    - Lexicon completeness: at any gate certification, the set of terms used in certified artifacts MUST have 100% coverage in Lexicon.
  acl_check_required: true
  enforcement_acl_rule_id: ARCH-40-IA19-LEXICON-GOVERNANCE
  canonical_registry_path: /root/Enterprise OS/enterprise/constitution/lexicon.yaml
  gate_impact:
    gate_c: "Low — TF1 is normative for Sprint 0; Lexicon registry added as parallel authoritative source. Backward compat preserved."
    gate_d: "MEDIUM — All Gate-D contracts/specs MUST use only Lexicon-registered terms with status ≥ ACTIVE. LEX_SCAN non-canonical = Gate-D Declined."
    gate_e: "HIGH — Repository Certification requires LEX_SCAN 100% pass across all governance + specification artifacts."

principle_20_constitutional_validity:
  id: IA-20
  name: Constitutional Validity — Sole Evaluation Criterion for Every Transformation / Verdict / Epochal Revision
  anchor: IA-20-CONSTITUTIONAL-VALIDITY
  axiom_realization: CC-001 §6 Constitutional Validity Meta-Predicate (conjunction of Predicates A ∧ B ∧ C)
  predicate_derivation: IA-20 IS the structural embodiment of ConstitutionallyValid(T) ⇔ Legitimate(T) ∧ MeaningPreserved(T) ∧ Provable(T). This is the ONE meta-invariant that subsumes all others. Every IA-xx invariant (IA-01..IA-19) is a derived engineering mechanism whose ultimate purpose is to enable IA-20 to evaluate TRUE.
  rationale: >
    EOS tidak lagi dievaluasi melalui daftar panjang "invariants terpisah" atau "conformance property list"
    yang dapat diinterpretasi berbeda-beda. Hanya ada SATU kriteria evaluasi: Constitutional Validity,
    didefinisikan sebagai konjungsi tiga predikat Boolean. Ini membuat seluruh sistem verifikasi EOS
    menjadi reducible to one well-defined boolean function — and therefore mathematically falsifiable.
    Setiap certification gate (Gate C, Gate D, Gate E, dan seluruh gate masa depan) HARUS mengevaluasi
    IA-20 pada setiap artefak yang diclaim valid. Jika IA-20 = FALSE, artefak tersebut REJECT. Tidak
    ada "almost PASS", tidak ada "spirit of the rule", tidak ada interpretasi.
  epistemological_status: SOLE_META_INVARIANT (conjunction of CC-001 frozen predicates)
  formal_statement: >
    For every architectural transformation T, runtime verdict V, and epochal revision R:

      ConstitutionalPass(T)  ⇔  IA-20(T)  =  Legitimate(T) ∧ MeaningPreserved(T) ∧ Provable(T)
      ConstitutionalPass(V)  ⇔  IA-20(V)  with V = Verdict(T)  ⇔  ConstitutionalPass(T)
      ConstitutionalPass(R)  ⇔  IA-20(R)  across every boundary artifact affected by R.

    Any evaluation result that is not reducible to the above conjunction is by definition
    not an EOS-compliant validation and SHALL be rejected by Constitutional Verifier.
  gate_certification_embodiment:
    gate_c:
      required_witnesses: "⟨witness_C⟩ mandatory for T001; ⟨witness_A, witness_B⟩ accepted with explicit GATEC-CP-WAIVER (Sprint-0 migration window only)."
      evaluation_logic: "IA-20 PASS ↔ (witness_A=PASS ∨ WAIVER) ∧ (witness_B=PASS ∨ WAIVER) ∧ (witness_C=PASS). No waiver for witness_C; Provable non-negotiable."
    gate_d:
      required_witnesses: "⟨witness_A, witness_B, witness_C⟩ complete tuple MANDATORY for every transformation T002..T005."
      evaluation_logic: "IA-20 PASS ↔ (all three witnesses = PASS). Missing witness = Gate-D Declined. INCONCLUSIVE on any witness = Gate-D PROVISIONAL_PASS with remediation plan."
    gate_e:
      required_witnesses: "⟨witness_A, witness_B, witness_C⟩ for EVERY transformation in certification scope, plus cross-transformation consistency witness."
      evaluation_logic: "IA-20 PASS ↔ (∀ transformation T in scope : ConstitutionallyValid(T)) ∧ (no authority_gain across inter-transformation boundaries) ∧ (CanonicalIdentity chain preserved end-to-end)."
    epochal_revision:
      required_witnesses: "Full IA-20 re-verification of every artifact affected by epoch boundary. Historical evidence for unchanged artifacts MAY be re-used (reproducibility re-check = SHA-256 identity match)."
      evaluation_logic: "IA-20 is the formal PASAL 8 filter: if GB (gain benefit) ≫ GC (gain cost) → IA-20(R) = PASS. If not → revision rejected back to Domain-A for redesign."
  evaluation_ordering_invariant:
    statement: >
      Legitimate(T) MUST be resolved for all inputs BEFORE MeaningPreserved(T) is evaluated.
      MeaningPreserved(T) MUST hold BEFORE Provable(T) is evaluated.
      Final verdict emission ONLY AFTER ConstitutionallyValid(T) = TRUE.
    implementation_note: "Corresponds to the old '6-tier' layout as engineering reference, but the layout itself is NOT constitutional. Only the predicate evaluation ordering is."
  derived_invariants:
    note: "ALL IA-01 through IA-19 are DERIVED engineering mechanisms that exist SOLELY to make IA-20 evaluation computable and automatable. None of them is independently constitutional."
    mapping:
      IA-01 Ontological Triad: "Enables Legitimate (layer roles) + MeaningPreserved (knowledge independence from runtime)."
      IA-02 Semantic Registry Graph: "Enables MeaningPreserved (semantic edges explicit) + Provable (predicate requirements declarative)."
      IA-03 Resolver/Executor Split: "Enables Provable (pure plan vs effectful execution separated for deterministic witness replay)."
      IA-04 Canonical Graph Catalog: "Enables MeaningPreserved + Provable (graph is SSOT, no inference drift between components)."
      IA-05 Execution Proof × Validation Proof: "Enables Provable (two witness categories for different claim kinds)."
      IA-06 Invariant Dependency Table: "Enables Legitimate (forbidden dependencies prevent authority-creating imports)."
      IA-07 No God Registry: "Enables Legitimate (ownership model prevents unauthorized authority concentration)."
      IA-08 Evolution Policy: "Enables Legitimate (change governance preserves authority chain) + MeaningPreserved (backward compat for CanonicalIdentity)."
      IA-09 Knowledge Not in Runtime: "Enables MeaningPreserved (engine = executor, not knowledge creator — direct KBE axiom)."
      IA-10 Immutable Snapshot: "Enables Provable (snapshot = reproducibility anchor for witness re-verification)."
      IA-11 Semantic Determinism: "Enables MeaningPreserved (same inputs → same semantic conclusions → same CanonicalIdentity)."
      IA-12 Explainability: "Enables Provable (every decision step has inspectable provenance for the witness)."
      IA-13 Stable Canonical Forms: "Enables MeaningPreserved (CanonicalIdentity concretizations = round-trip deterministic)."
      IA-14 Pure Transformations: "Enables MeaningPreserved + Provable (pure function = no side effects = deterministic witnesses)."
      IA-15 Dual Primary Graphs: "Enables Legitimate (AuthorityRel) + MeaningPreserved (SemanticRel) — strict separation prevents ontological mixing."
