      IA-18 Constitutional Proof: "Witness tuple ⟨w_A, w_B, w_C⟩ that materializes IA-20 into auditable artifacts."
      IA-19 Lexicon Registry: "Enables MeaningPreserved (term identity = CanonicalIdentity for vocabulary)."
