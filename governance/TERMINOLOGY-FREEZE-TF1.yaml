derived_from:
  - id: SPRINT-0-CONSOLIDATION
    summary: Consolidated terminology discussion Sprint-0 — Constitution → Knowledge → Protocols → Implementations → Execution → Evidence; Authority-Oriented replacing Architecture-framework framing.
  - id: USER-PROPOSAL-AUTHORITY-PIPELINE
    summary: Authority → Interpretation → Decision → Execution → Evidence pipeline; each stage only reduces, never creates authority.
  - id: USER-PROPOSAL-CANONICAL-REP
    summary: "Intermediate Representation (IR) is technology-coupled; replace with Canonical Representation (transport-agnostic). Pass → Transformation; Runtime → Execution System; Add Verdict layer."
  - id: USER-PROPOSAL-EOS-RENAMING
    summary: EOS = Constitutional Knowledge Computing System, not Knowledge Computing Platform (platform = implementation; system = authority model).
  - id: USER-PROPOSAL-IA17
    summary: IA-17 Authority Preservation meta-invariant covering planner, compiler, optimizer, AI planner, cache, incremental build, distributed execution.
  - id: USER-PROPOSAL-VERDICT-LAYER
    summary: Evidence → Assessment → Justification → Verdict; Verdict is governance-facing (Repository PASS / Certification VALID) while Assessment is technical.

activation_schedule:
  activation_gate: GATE-D-FIRST-CERTIFIED-TRANSFORMATION
  activation_condition:
    - "TF-1 content approved by architecture board quorum"
    - "IA-17 merged into INVARIANT-ARCHITECTURE.yaml"
    - "All canonical EOS spec and contract files carry TF-1 terminology"
  transition_windows:
    - legacy_ir_term_allowed_until: GATE-E (repository-wide deprecated alias)
    - legacy_compiler_pass_allowed_until: GATE-E (deprecated synonym)
    - legacy_runtime_allowed_until: GATE-E
  enforcement:
    post_activation_rule: "Any EOS artifact (contract, spec, schema, code comment) introduced post-TF-1 that uses a deprecated primary term without explicit deprecated_alias tag SHALL trigger ARCH-35-TERM-DEPRECATION conformance WARNING at Gate-D and ERROR at Gate-E."

terminology_freeze_preamble:
  statement: >
    The EOS vocabulary below SHALL be treated as normative from Gate-D forward. Consistent terminology is
    an architectural invariant itself (per IA-17 derivations: meaning must not drift between representations
    simply because words do). LLVM, POSIX, Git, TCP/IP demonstrate that vocab stability is almost as
    foundational as protocol stability for multi-decade systems.

  scope:
    - "All governance YAML, specifications, schemas, contracts, ADRs, RFCs, and code comments released under EOS."
    - "Protocol header fields and artifact metadata fields carrying term names (e.g. ir_format_version → rep_format_version)."

  deprecation_policy:
    - "Legacy terms listed below remain valid as deprecated_alias for tooling compatibility until Gate-E."
    - "Deprecation WARNING at Gate-D; ERROR at Gate-E for primary-term mismatch."
    - "Term addition/rename after TF-1 REQUIRES: ADR + Architecture Board quorum + new TF-* artifact + epoch bump per ASP-01."

authority_pipeline_declaration:
  status: RENAMED_AND_EXPANDED — see constitutional_validity_pipeline below
  note: >
    Former "EOS Authority Pipeline" renamed and expanded. The 5-stage order is retained as engineering
    reference, but the constitutional invariant is now predicate-based (IA-17 Constitution Preservation
    + IA-20 Constitutional Validity), not merely authority-monotonic.

constitutional_validity_pipeline_declaration:
  name: EOS Constitutional Validity Pipeline (normative — expanded from former Authority Pipeline)
  constitutional_anchor: IA-17 Constitution Preservation + IA-20 Constitutional Validity
  normative_order:
    - stage: AUTHORITY
      canonical_source_types: [CC-001 Constitutional Charter, Constitutional Vision, ASP, Invariant Architecture, Constitution IR]
      authority_level: 0
      predicate_boundary: "PRED_A (Legitimate) resolved here. AuthorityRel frozen relation set is the SSOT."
      rule: "No downstream stage may produce semantics that contradict this stage. AuthorityRel relation set = FUNDAMENTAL (NOT graph data structure)."
      example_artifacts: [CC-001 frozen predicates, VISION-01, ASP-01, IA-17/IA-20, CONSTIT-IR merkle_root]
    - stage: INTERPRETATION
      canonical_source_types: [Requirements, Intent, Policy, Ontology, Schema, Contracts]
      authority_level: 1
      predicate_boundary: "PRED_B (MeaningPreserved) resolved here. CanonicalIdentity (fundamental) + SemanticRel (frozen) = SSOT."
      rule: "Interpretation MAY only refine authority stage, NEVER add new policy. Canonical Identity is FUNDAMENTAL (NOT Canonical Form concretization)."
      example_artifacts: [REQ-ELS, Intent-Model, POLICY-*, ONT-*, contract.yaml with CanonicalIdentity refs]
    - stage: DECISION
      canonical_source_types: [Decision CanonicalIdentity, Planner Output, Candidate Selection]
      authority_level: 2
      predicate_boundary: "PRED_B maintained: Decision CanonicalIdentity semantically equivalent to Interpretation closure."
      rule: "All decisions MUST be traceable to Interpretation-stage inputs via SemanticRel homomorphism proof. TransformationContract (Pre/Post/Invariants) = FUNDAMENTAL."
      example_artifacts: [Decision CanonicalIdentity, planner decision_id, selection_witness, TransformationContract refs]
    - stage: EXECUTION
      canonical_source_types: [Execution CanonicalIdentity, Execution System, Workers, Orchestration]
      authority_level: 3
      predicate_boundary: "PRED_C (Provable) established here. Evidence(t,T) ⊢ Postconditions(T) with NO evidential gap."
      rule: "Execution SHALL produce outputs that strictly implement Decision stage inputs; no speculative authority. Transformation Strategy = FUNGIBLE (Planner/SAT/Rule/LLM/Streaming/Distributed ALL equivalent constitutionally)."
      example_artifacts: [Execution CanonicalIdentity, execution_plan_identity_hash, worker witness_C, Evidence(t,T) corpus]
    - stage: EVIDENCE
      canonical_source_types: [Evidence, Assessment, Justification, Verdict, Ledger]
      authority_level: 4
      predicate_boundary: "ALL THREE witnesses collected. ConstitutionalProof(T) = ⟨w_A, w_B, w_C⟩ COMPLETE ⇔ ConstitutionallyValid(T) = TRUE ⇔ Verdict PASS."
      rule: "Evidence is downstream of all and cannot create new authority; it only proves or falsifies. Witness form is FUNGIBLE; justification power = NORMATIVE."
      example_artifacts: [ConstitutionalProof composite ID, witness_A/B/C artifacts, ASSESSMENT, JUSTIFICATION, VERDICT, LEDGER-ENTRY atomic append]
  invariants:
    constitutional_validity_preserved: "Every stage transition X→Y: if a transformation T operates at the boundary, then ConstitutionallyValid(T) must hold. Authority/Meaning/Provability are ALL preserved."
    predicate_evaluation_order: "Legitimate (PRED_A) BEFORE MeaningPreserved (PRED_B) BEFORE Provable (PRED_C). Verdict only AFTER IA-20=TRUE."
    constitutional_chain_resolves: "Every artifact's constitutional_chain MUST resolve: (PRED_A) AuthorityRel→AUTHORITY root, (PRED_B) SemanticEquivalence→CanonicalIdentity, (PRED_C) Evidence⊢Postconditions. Loops/dangling/equivocation = FATAL."

constitutional_predicate_model_preamble:
  statement: >
    TF-1 terminology is organized under the EOS CONSTITUTIONAL PREDICATE MODEL (frozen in CC-001
    for one-decade horizon 2026–2036). The irreducible constitutional core = THREE FALSIFIABLE
    BOOLEAN PREDICATES and their conjunction:

      Predicate A :  Legitimate(x)            — artifact has valid AuthorityRel chain?
      Predicate B :  MeaningPreserved(T)      — transformation preserved CanonicalIdentity equivalence?
      Predicate C :  Provable(T)              — Evidence(t,T) constructively entails Postconditions(T)?

      Meta-Predicate:  ConstitutionallyValid(T)  ⇔  Legitimate(T) ∧ MeaningPreserved(T) ∧ Provable(T)

    FUNDAMENTAL (FROZEN) things are:
      AuthorityRel relation set,
      SemanticRel relation set,
      CanonicalIdentity (abstract logical identity),
      TransformationContract = ⟨Inputs, Outputs, Preconditions, Postconditions, Invariants⟩.

    EVERYTHING ELSE is a DERIVED engineering materialization and MAY be replaced entirely by
    future epochs, provided the truth values of Legitimate / MeaningPreserved / Provable remain
    invariant on identical inputs. In particular:
      • Authority Graph = ONE materialization of AuthorityRel. (Not fundamental.)
      • Knowledge Graph = ONE materialization of SemanticRel. (Not fundamental.)
      • Canonical Form = ONE concretization of CanonicalIdentity. (Not fundamental.)
      • Constitutional Proof = ⟨w_A,w_B,w_C⟩ derived WITNESS tuple of predicate evaluations. (Not constitutional.)
      • Three Fundamental Laws, Four Constitutional Axioms = DERIVED engineering corollaries.
        They are pedagogically useful but NOT the irreducible frozen core.

eos_system_renaming:
  previous_term: Knowledge Computing Platform
  normative_term: Constitutional Knowledge Computing System
  rationale: >
    "Platform" implies technology substrate and mutable product surface. "System" implies invariant authority
    model (Constitution → Knowledge → Protocols → Implementations → Execution → Evidence) plus deterministic
    governance. The EOS authority model is what is preserved across decades; implementation technologies are
    interchangeable.

core_vocabulary_normative:
  - term_id: TERM-CONSTITUTION
    normative_term: Constitution
    deprecated_aliases: []
    definition: "Normative root of all EOS authority: Vision + ASP + Invariants + Authority Rules, compiled into Constitution IR (which is itself Authority stage)."
    scope: Foundational
    authoritative_ref: VISION-01 + ASP-01 + IA-01..IA-17

  - term_id: TERM-AUTHORITY-PIPELINE
    normative_term: "Constitutional Validity Pipeline (formerly: Authority Pipeline)"
    deprecated_aliases: [Authority Pipeline]
    definition: >
      The five-stage, predicate-boundary flow AUTHORITY → INTERPRETATION → DECISION → EXECUTION → EVIDENCE.
      Each stage resolves exactly one predicate boundary: AUTHORITY=PRED_A; INTERPRETATION=PRED_B;
      DECISION=PRED_B maintained; EXECUTION=PRED_C; EVIDENCE=witness tuple collected, IA-20 verdict evaluated.
      No stage invents new authority, drifts meaning, or emits PASS without constructive entailment.
    scope: Foundational
    authoritative_ref: IA-17-CONSTITUTION-PRESERVATION + IA-20-CONSTITUTIONAL-VALIDITY

  - term_id: TERM-AUTHORITY-ORIENTED-ARCH
    normative_term: Authority-Oriented Architecture (AOA)
    deprecated_aliases: [Protocol-Oriented Architecture]
    definition: >
      The organizing principle of EOS: what is frozen is the authority graph, not a particular representation or
      transport protocol. Protocols are one form of boundary; authority is the invariant. Two implementations with
      different protocols are still EOS-compatible if they respect the same authority graph.
    scope: Paradigm

  - term_id: TERM-KNOWLEDGE-LAYER
    normative_term: Knowledge Layer
    deprecated_aliases: [Knowledge Zone, Semantic Layer (partial alias only)]
    definition: "EOS layer containing Requirements, Intent, Policies, Contracts, Ontology, Schemas (Interpretation stage)."
    scope: Layer
    authoritative_ref: TF-1 §authority_pipeline_declaration stage INTERPRETATION

  - term_id: TERM-CANONICAL-REPRESENTATION
    normative_term: Canonical Representation
    deprecated_aliases: [Intermediate Representation, IR]
    definition: >
      DEPRECATED — Former normative term. Superseded by Canonical Form (TERM-CANONICAL-FORM).
      Historical definition: A transport- and implementation-agnostic encoding of an EOS artifact.
      Replaced because Canonical Form additionally asserts independence from serialization, transport,
      storage, AND execution technology (identity same across YAML/JSON/Binary/ProtoBuf/DB/Memory/Graph/EventStream).
    scope: Layer (Legacy / Deprecated)
    status: DEPRECATED
    replacement: TERM-CANONICAL-FORM
    authoritative_ref: "IA-13 Stable Canonical Forms (revised anchor IA-13-STABLE-CANONICAL-FORMS)"
    semantic_change_note: "Former aliases KIR / DIR / EIR now subsumed under Knowledge-Form / Decision-Form / Evidence-Form. See TERM-CANONICAL-FORM for normative definition."

  - term_id: TERM-CANONICAL-FORM
    normative_term: Canonical Form
    deprecated_aliases:
      - Canonical Representation (deprecated)
      - Intermediate Representation (deprecated)
      - IR (deprecated)
    definition: >
      The sole logical identity of an EOS artifact's normative meaning (Law II / Axiom B domain).
      Canonical Form SHALL be independent of serialization, transport, storage, and execution technology.
      YAML, JSON, Binary, ProtoBuf, Database record, Memory Object, Graph node, Event Stream — all MAY
      realize the SAME Canonical Form provided round-trip determinism preserves identity hash across
      every concretization. Canonical Form = what something means normatively, NOT how it happens to be
      stored or transmitted today.
    scope: Law II — Meaning (Axiom B)
    authoritative_ref: IA-13 Stable Canonical Forms (anchor IA-13-STABLE-CANONICAL-FORMS)
    axiom: B
    semantic_change: SEM-005-CANONICAL-FORM

  - term_id: TERM-KNOWLEDGE-REP
    normative_term: Knowledge Form (K-FORM)
    deprecated_aliases: [Knowledge Representation, K-REP, Knowledge IR, KIR]
    definition: "Canonical Form of the Interpretation stage; normalized, deterministic snapshot of knowledge available to planner. Former aliases K-REP/KIR are retained for backward compatibility."
    scope: Law II — Meaning (Canonical Form)
    authoritative_ref: IA-13 Stable Canonical Forms (scope_required_canonical_forms K-FORM)

  - term_id: TERM-DECISION-REP
    normative_term: Decision Form (D-FORM)
    deprecated_aliases: [Decision Representation, D-REP, Decision IR, DIR]
    definition: "Canonical Form of planner output: candidate selection + trace + constraint satisfaction proof. Former aliases D-REP/DIR retained for backcompat."
    scope: Law II — Meaning (Canonical Form)
    authoritative_ref: IA-13 Stable Canonical Forms (scope_required_canonical_forms D-FORM)

  - term_id: TERM-EXECUTION-REP
    normative_term: Execution Form (X-FORM)
    deprecated_aliases: [Execution Representation, X-REP, Execution IR, Execution Plan IR, Plan IR]
    definition: "Canonical Form of the plan of execution that an Execution System consumes; scheduler/worker independent. Former aliases X-REP retained for backcompat."
    scope: Law II — Meaning (Canonical Form)
    authoritative_ref: IA-13 Stable Canonical Forms (scope_required_canonical_forms X-FORM)

  - term_id: TERM-EVIDENCE-REP
    normative_term: Evidence Form (V-FORM)
    deprecated_aliases: [Evidence Representation, V-REP, Evidence Provenance Graph (partial alias), EPG, Evidence IR]
    definition: "Canonical Form of provenance chain + measurements; parent of Assessment, Justification and Verdict. Former aliases V-REP/EPG retained as deprecated."
    scope: Law II — Meaning (Canonical Form)
    authoritative_ref: IA-13 Stable Canonical Forms (scope_required_canonical_forms V-FORM)

  - term_id: TERM-PROTOCOL
    normative_term: Protocol
    deprecated_aliases: []
    definition: "Boundary contract that governs exchange between two authority stages or two implementations; media for authority transport, not authority itself."
    scope: Boundary
    authoritative_ref: TF-1 scope note "Protocols are media, authority is invariant."

  - term_id: TERM-TRANSFORMATION
    normative_term: Transformation
    deprecated_aliases: [Compiler Pass, Pass, Compiler Stage]
    definition: >
      Any deterministic function: Input Canonical Form → Output Canonical Form, paired with a separation of
      Transformation Semantics (frozen normative contract) and Transformation Strategy (interchangeable
      implementation). Implementation technology is NOT prescribed: may be single-pass compiler, two-pass,
      rule engine, SAT solver, LLM, constraint solver, graph optimizer, incremental build, streaming, distributed.
    scope: Law III — Realization (Axiom C)

  - term_id: TERM-TRANSFORMATION-CONTRACT
    normative_term: Transformation Contract
    deprecated_aliases: [Compiler Contract, Pass Spec, Compiler Pass Contract]
    definition: >
      Constitution-defined (CONSTIT-IR) machine-readable codification of Transformation Semantics for exactly
      one transformation. Declares ONLY: input Canonical Form(s), output Canonical Form(s), preconditions,
      postconditions, invariants, determinism requirements, purity class (per IA-14), proof obligations,
      and traceability rules. It does NOT prescribe an internal implementation strategy (that is Strategy).
    scope: Law III — Realization (Normative Contract)
    authoritative_ref: IA-16 Semantics/Strategy separation + CONSTITUTIONAL-COMPILER.spec.yaml

  - term_id: TERM-TRANSFORMATION-SEMANTICS
    normative_term: Transformation Semantics
    deprecated_aliases: []
    definition: >
      Frozen normative contract portion of a transformation. Defines ONLY: Inputs, Outputs, Preconditions,
      Postconditions, Invariants. Technology-agnostic and implementation-oblivious. Analogous to
      SQL Standard (defines SELECT/JOIN/WHERE semantics ONLY), not a specific optimizer.
      Paired 1-to-many with Transformation Strategy artifacts.
    scope: Law III — Realization (Semantics, frozen)
    authoritative_ref: IA-16 Semantics × Strategy separation
    axiom: C

  - term_id: TERM-TRANSFORMATION-STRATEGY
    normative_term: Transformation Strategy
    deprecated_aliases: [Transformation Implementation (overlapping alias — prefer Strategy)]
    definition: >
      Interchangeable implementation of a Transformation Semantics contract. Kinds include: PLANNER, SAT_SOLVER,
      RULE_ENGINE, LLM, COMPILER, STREAMING, DISTRIBUTED_OPTIMIZER, HYBRID. Many Strategies may implement the
      SAME Transformation Semantics (analogy: PostgreSQL optimizer, MySQL optimizer, DuckDB all implement SQL Standard).
      Two strategies S1, S2 implementing the same Semantics SHALL be interchangeable (both produce conforming outputs).
    scope: Law III — Realization (Strategy, interchangeable)
    authoritative_ref: IA-16 Semantics × Strategy separation
    axiom: C

  - term_id: TERM-EXECUTION-SYSTEM
    normative_term: Execution System
    deprecated_aliases: [Runtime, Execution Runtime, EOS Runtime]
    definition: >
      Any system that consumes an Execution Canonical Form (X-FORM) and produces outputs + evidence.
      Includes: local runtime, Kubernetes, workflow engine, Temporal, distributed scheduler, LLM agent swarm,
      robot, simulator. "Runtime" is deprecated because EOS execution model is not limited to traditional
      process-level runtime (it is one Strategy kind within Axiom C).
    scope: Law III — Realization (Execution Strategy)

  - term_id: TERM-EVIDENCE
    normative_term: Evidence
    deprecated_aliases: []
    definition: "First technical product of Execution System run: raw cryptographic or deterministic proof bytes, digests, hashes, measurements. Emitted ONLY after Constitutional Proof (IA-18) receives PASS on all three sub-proofs."
    scope: Law III — Realization (Evidence Layer, Level 0)
    authoritative_ref: IA-18 Constitutional Proof

  - term_id: TERM-ASSESSMENT
    normative_term: Assessment
    deprecated_aliases: []
    definition: "Technical evaluation of Evidence against a specific conformance property vector. Machine-facing / technical. Produces a per-property PASS/FAIL/INCONCLUSIVE matrix."
    scope: Law III — Realization (Evidence Layer, Level 1)
    authoritative_ref: IA-18 Constitutional Proof downstream artifacts

  - term_id: TERM-JUSTIFICATION
    normative_term: Justification
    deprecated_aliases: []
    definition: "Structured + human-readable narrative explaining Assessment, including authority_proof_refs, semantic_proof_refs, correctness_proof_refs up through Constitutional Proof composite to Constitution."
    scope: Law III — Realization (Evidence Layer, Level 2)
    authoritative_ref: IA-12 Explainability + IA-18 Constitutional Proof

  - term_id: TERM-VERDICT
    normative_term: Verdict
    deprecated_aliases: [Conformance Verdict (legacy informal)]
    definition: >
      Governance-facing artifact derived from Justification + Assessment + Constitutional Proof composite ID.
      Normative answer consumed by humans, boards, registries, and certification gates.
      Examples: Repository Status = PASS; Repository Certification = VALID; Gate-D = PROVISIONAL_PASS; Gate-E = PRODUCTION_READY.
      A Verdict PASS SHALL reference a Constitutional Proof with ALL THREE sub-proofs = PASS.
    scope: Law III — Realization (Evidence Layer, Level 3)
    authoritative_ref: Axiom D + IA-18 Constitutional Proof

  - term_id: TERM-CANONICAL-FORM
    normative_term: Canonical Form
    deprecated_aliases:
      - Canonical Representation (deprecated)
      - Intermediate Representation (deprecated)
      - IR (deprecated)
    definition: >
      DERIVED CONCRETIZATION of CanonicalIdentity (TERM-CANONICAL-IDENTITY) for a specific engineering
      medium. Canonical Form realizes CanonicalIdentity in YAML, JSON, Binary, ProtoBuf, DB record,
      Memory Object, Graph Node, or Event Stream — but NONE of these is fundamental. The FROZEN
      FUNDAMENTAL is CanonicalIdentity (abstract logical identity). Two artifacts with DIFFERENT Canonical
      Forms may still have IDENTICAL CanonicalIdentity — provided SemanticEquivalence holds. Subclasses:
      K-FORM (Knowledge), D-FORM (Decision), X-FORM (Execution), V-FORM (Evidence) are all medium-specific
      concretizations of the SAME abstract CanonicalIdentity.
    scope: Predicate B — DERIVED concretization (NOT fundamental)
    authoritative_ref: IA-13 Stable Canonical Forms (ARCH-22 anchor STABLE-CANONICAL-FORMS) + SEM-005 TF-1
    fundamental_root: TERM-CANONICAL-IDENTITY (CanonicalIdentity = FUNDAMENTAL; CanonicalForm = DERIVED)
    concretization_examples: [K-FORM, D-FORM, X-FORM, V-FORM, YAML, JSON, Binary, ProtoBuf, Database, MemoryObject, GraphNode, EventStream]
    semantic_change: SEM-005-CANONICAL-FORM (now marked DERIVED of CanonicalIdentity)

  - term_id: TERM-KNOWLEDGE-REP
    normative_term: Knowledge Form (K-FORM)
    deprecated_aliases: [Knowledge Representation, K-REP, Knowledge IR, KIR]
    definition: "Canonical Form concretization of CanonicalIdentity for Interpretation stage; normalized, deterministic knowledge snapshot available to planner."
    scope: Predicate B — DERIVED concretization of CanonicalIdentity
    authoritative_ref: IA-13 scope_required_canonical_forms K-FORM
    derivation_chain: "CanonicalIdentity (FUNDAMENTAL) → Canonical Form (DERIVED) → K-FORM (concretization for Interpretation stage)"

  - term_id: TERM-DECISION-REP
    normative_term: Decision Form (D-FORM)
    deprecated_aliases: [Decision Representation, D-REP, Decision IR, DIR]
    definition: "Canonical Form concretization of CanonicalIdentity for planner output: candidate selection + trace + constraint satisfaction proof."
    scope: Predicate B — DERIVED concretization of CanonicalIdentity
    authoritative_ref: IA-13 scope_required_canonical_forms D-FORM
    derivation_chain: "CanonicalIdentity (FUNDAMENTAL) → Canonical Form (DERIVED) → D-FORM (concretization for Decision stage)"

  - term_id: TERM-EXECUTION-REP
    normative_term: Execution Form (X-FORM)
    deprecated_aliases: [Execution Representation, X-REP, Execution IR, Execution Plan IR, Plan IR]
    definition: "Canonical Form concretization of CanonicalIdentity for plan of execution that an Execution System consumes."
    scope: Predicate B — DERIVED concretization of CanonicalIdentity
    authoritative_ref: IA-13 scope_required_canonical_forms X-FORM
    derivation_chain: "CanonicalIdentity (FUNDAMENTAL) → Canonical Form (DERIVED) → X-FORM (concretization for Execution stage)"

  - term_id: TERM-EVIDENCE-REP
    normative_term: Evidence Form (V-FORM)
    deprecated_aliases: [Evidence Representation, V-REP, Evidence Provenance Graph (partial alias), EPG, Evidence IR]
    definition: "Canonical Form concretization of CanonicalIdentity for provenance chain + measurements; parent of Assessment, Justification, Verdict."
    scope: Predicate B + Predicate C — DERIVED concretization of CanonicalIdentity
    authoritative_ref: IA-13 scope_required_canonical_forms V-FORM
    derivation_chain: "CanonicalIdentity (FUNDAMENTAL) → Canonical Form (DERIVED) → V-FORM (concretization for Evidence stage)"

  - term_id: TERM-CONSTITUTIONAL-PROOF
    normative_term: Constitutional Proof (Witness Tuple)
    deprecated_aliases: [Proof (ambiguous), Constitutional Trace, Constitutional Proof — Three Sub-Proofs (former framing: now witness tuple)]
    definition: >
      EXPLICITLY DERIVED (NOT constitutional). ConstitutionalProof(T) is the WITNESS TUPLE that
      materializes a TRUE evaluation of ConstitutionallyValid(T) into machine-auditable artifacts:

        ConstitutionalProof(T) = ⟨ witness_Legitimate(T), witness_MeaningPreserved(T), witness_Provable(T) ⟩

      Completeness: ConstitutionalProof(T) is COMPLETE  ⇔  ConstitutionallyValid(T).
      Witness FORM is NOT prescribed: a witness MAY be a DAG walk cert, semantic equivalence proof,
      conformance test report, LLM audit trail, hash chain, or human approval document. Only the
      witness's JUSTIFICATION POWER (does it, on replay, cause the predicate to evaluate TRUE on T?)
      is normative. Representation = fungible engineering.
    scope: DERIVED Auditable Artifact (materializes IA-20 result into Ledger-appendable form)
    authoritative_ref: CC-001 §6 ConstitutionalProof witness tuple definition + IA-18 Constitutional Proof
    witness_spec:
      witness_A: "justifies Legitimate(T)=TRUE — Predicate A"
      witness_B: "justifies MeaningPreserved(T)=TRUE — Predicate B"
      witness_C: "justifies Provable(T)=TRUE — Predicate C"
    composite_id_scheme: "CP-<unix_millis>-<w_A_id_8hex>-<w_B_id_8hex>-<w_C_id_8hex>"
    ledge_atomic_append: "Composite ID + all three witness IDs appended ATOMICALLY; partial append = LEDGER_CORRUPTION (IA-17 violation)"

  - term_id: TERM-THREE-CONSTITUTIONAL-PREDICATES
    normative_term: Three Constitutional Predicates (Legitimate × MeaningPreserved × Provable)
    deprecated_aliases: [Three Fundamental Laws (pedagogical DERIVED alias), Four Constitutional Axioms (engineering DERIVED alias)]
    definition: >
      IRREDUCIBLE CONSTITUTIONAL CORE of EOS, frozen in CC-001 for a one-decade horizon (2026–2036).
      Three scientifically falsifiable Boolean predicates + their conjunction meta-predicate:

        Predicate A :  Legitimate(x)            ← AuthorityRel frozen relation set
        Predicate B :  MeaningPreserved(T)      ← CanonicalIdentity fundamental + SemanticRel frozen
        Predicate C :  Provable(T)              ← Evidence(t,T) ⊢ Postconditions(T)

        Meta-Predicate: ConstitutionallyValid(T)  ⇔  Legitimate(T) ∧ MeaningPreserved(T) ∧ Provable(T)

      EVERY other EOS concept — Three Laws, Four Axioms, Dual Graphs, Canonical Form, Constitutional Proof,
      Transformation Semantics/Strategy, Planner, Runtime, Ledger, Conformance — is STRICTLY DERIVED from
      these four (3 predicates + 1 conjunction). None is independently constitutional.
    scope: IRREDUCIBLE CONSTITUTIONAL FROZEN CORE (10-year horizon, CC-001)
    authoritative_ref: CC-001 §2 Constitutional Predicate Model + CC-001 §6 Constitutional Validity
    cross_ref_predicates: [TERM-PRED-A-LEGITIMATE, TERM-PRED-B-MEANINGPRESERVED, TERM-PRED-C-PROVABLE, TERM-CONSTITUTIONAL-VALIDITY]
    epistemological_status: "FALSIFIABLE_HYPOTHESIS (per Baseline v1.4 PASAL 8 — CC-001 states: 3 predicates are jointly sufficient and individually necessary. Gate C/Gate D/Gate E evidence either CORROBORATES or FALSIFIES this.)"

  - term_id: TERM-PRED-A-LEGITIMATE
    normative_term: Predicate A — Legitimate(x)
    deprecated_aliases: [Law I — Authority (pedagogical derived), Axiom A — Authority (engineering derived)]
    definition: >
      Legitimate : Artifact → Boolean. Answers: "Why is this artifact valid?".
      Formal: Legitimate(x) ⇔ (AuthorityRoot(x) exists) AND (AuthorityPath(x) ⊆ AuthorityRel) AND (NoAuthorityCycle(x)).
      AuthorityRel = { Authorizes, Delegates, Supersedes, Approves, DerivesAuthorityFrom, Ratifies, Amends, EpochBinds }
      is the FROZEN FUNDAMENTAL. Authority Graph = ONE materialization; MAY be RDF, Neo4j, Git DAG, SQL, YAML, binary index.
    scope: Constitutional Predicate (FUNDAMENTAL frozen per CC-001 §3)
    authoritative_ref: CC-001 §3 Predicate A — Legitimate(x)
    fundamental_frozen_concepts: [AuthorityRel RELATION SET (NOT graph data structure)]
    derived_concepts: [Authority Graph (materialization), Authority Pipeline (engineering ordering), Axiom A, Law I]

  - term_id: TERM-PRED-B-MEANINGPRESERVED
    normative_term: Predicate B — MeaningPreserved(T)
    deprecated_aliases: [Law II — Meaning (pedagogical derived), Axiom B — Meaning (engineering derived)]
    definition: >
      MeaningPreserved : Transformation → Boolean. Answers: "Did the normative meaning survive transformation T?".
      Formal: MeaningPreserved(T) ⇔ (∀i∈Inputs,∀o∈Outputs: CanonicalIdentity well-defined) AND SemanticEquivalence(⊔Inputs, ⊔Outputs)=TRUE.
      CanonicalIdentity (abstract logical identity) is FUNDAMENTAL. SemanticRel = { DependsOn, Implements, Extends, Contains,
      References, EquivalentTo, Specializes, Refines, Uses } is FROZEN FUNDAMENTAL.
      Canonical Form (YAML/JSON/ProtoBuf/binary) = ONE concretization of CanonicalIdentity; NOT fundamental.
      TransformationContract = ⟨Inputs,Outputs,Preconditions,Postconditions,Invariants⟩ = FUNDAMENTAL frozen structure.
    scope: Constitutional Predicate (FUNDAMENTAL frozen per CC-001 §4)
    authoritative_ref: CC-001 §4 Predicate B — MeaningPreserved(T)
    fundamental_frozen_concepts: [CanonicalIdentity (abstract logical identity, NOT CanonicalForm concretization), SemanticRel RELATION SET (NOT graph data structure), TransformationContract (Pre/Post/Invariants, NOT algorithm/strategy)]
    derived_concepts: [Canonical Form K/D/X/V-FORM (concretizations), Knowledge Graph (materialization), Semantic Kernel (reasoner), Axiom B, Law II]

  - term_id: TERM-PRED-C-PROVABLE
    normative_term: Predicate C — Provable(T)
    deprecated_aliases: [Law III — Realization (pedagogical derived, partial), Axiom C Realization + Axiom D Proof (engineering derived, combined)]
    definition: >
      Provable : Transformation → Boolean. Answers: "If this transformation emits PASS, can we PROVE it from evidence?".
      Formal: Provable(T) ⇔ (∀ executions t of T reaching verdict: Evidence(t,T) ⊢ Postconditions(T)) AND (no evidential gap allowing ¬Postconditions while PASS is emitted).
      Note: "Proof" as artifact = ONE possible witness of Provable(T); Provable(T) is a PROPERTY of the transformation,
      not the artifact. Strategy (Planner, SAT Solver, Rule Engine, LLM, Compiler, Streaming, Distributed Optimizer) is FUNGIBLE.
    scope: Constitutional Predicate (FUNDAMENTAL frozen per CC-001 §5)
    authoritative_ref: CC-001 §5 Predicate C — Provable(T)
    fundamental_frozen_concepts: [Evidence-entailment property (⊢), Evidential gap exclusion, TransformationContract.Postconditions]
    derived_concepts: [Constitutional Proof (witness tuple ⟨w_A,w_B,w_C⟩), Evidence → Assessment → Justification → Verdict pipeline, Execution System variants, Axiom C + Axiom D combined]

  - term_id: TERM-CONSTITUTIONAL-VALIDITY
    normative_term: Constitutional Validity (IA-20 Meta-Predicate)
    deprecated_aliases: [Constitutional Pass, Constitutional PASS (informal)]
    definition: >
      ConstitutionallyValid(T) ⇔ Legitimate(T) ∧ MeaningPreserved(T) ∧ Provable(T).
      IA-20 codifies this as the SOLE evaluation criterion for every architectural transformation,
      every runtime verdict, and every epochal revision. No validation result is EOS-compliant unless it
      is reducible to this conjunction. Six-Tier Architecture = engineering reference layout; Constitutional
      Validity = the ACTUAL constitutional invariant enforced across every tier.
    scope: Meta-Predicate (Conjunction of Predicates A ∧ B ∧ C)
    authoritative_ref: CC-001 §6 Constitutional Validity Meta-Predicate + IA-20 Constitutional Validity

  - term_id: TERM-AUTHORITYREL
    normative_term: AuthorityRel Relation Set
    deprecated_aliases: [Authority Graph (partial — graph = ONE materialization of AuthorityRel)]
    definition: >
      FUNDAMENTAL FROZEN normative relation set for Predicate A (Legitimate).
      AuthorityRel = { Authorizes, Delegates, Supersedes, Approves, DerivesAuthorityFrom, Ratifies, Amends, EpochBinds }.
      Every edge in EVERY materialization of authority (RDF, Neo4j, Git DAG, SQL, YAML, binary index, human-signed doc)
      MUST be an instance of this relation set. The relation set itself cannot be changed without CC-001 Charter Revision.
      The Graph data structure is a fungible engineering choice.
    scope: Predicate A — FROZEN FUNDAMENTAL (NOT data structure)
    authoritative_ref: CC-001 §3 Predicate A formal statement

  - term_id: TERM-SEMANTICREL
    normative_term: SemanticRel Relation Set
    deprecated_aliases: [Knowledge Graph (partial — graph = ONE materialization of SemanticRel)]
    definition: >
      FUNDAMENTAL FROZEN normative relation set for Predicate B (MeaningPreserved).
      SemanticRel = { DependsOn, Implements, Extends, Contains, References, EquivalentTo, Specializes, Refines, Uses }.
      Every semantic edge in EVERY materialization of meaning (Knowledge Graph nodes, Canonical Form refs,
      ontology hierarchy, schema inheritance, contract dependencies) MUST be an instance of this set.
      The relation set frozen; the Graph data structure is fungible.
    scope: Predicate B — FROZEN FUNDAMENTAL (NOT data structure)
    authoritative_ref: CC-001 §4 Predicate B formal statement

  - term_id: TERM-CANONICAL-IDENTITY
    normative_term: Canonical Identity
    deprecated_aliases: [Canonical Form (partial — Canonical Form = ONE concretization of CanonicalIdentity)]
    definition: >
      FUNDAMENTAL ABSTRACT logical identity of an artifact's normative meaning, completely independent
      of ANY serialization, transport, storage, or execution medium. Two artifacts that differ in every byte
      (YAML vs JSON vs ProtoBuf vs Binary vs DB row vs Memory Object vs Graph node vs Event Stream) still
      possess IDENTICAL CanonicalIdentity if and only if SemanticEquivalence(⊔input_ids, ⊔output_ids) = TRUE.
      Canonical Form (K/D/X/V-FORM etc.) = ONE concretization that realizes CanonicalIdentity for a specific
      engineering medium. CanonicalIdentity is the FROZEN FUNDAMENTAL; Forms are fungible.
    scope: Predicate B — FROZEN FUNDAMENTAL (NOT concretization)
    authoritative_ref: CC-001 §4 Predicate B — CanonicalIdentity definition + SemanticEquivalence property
    concretizations_are_derived: [Canonical Form K-FORM D-FORM X-FORM V-FORM, YAML JSON Binary ProtoBuf DB Memory Graph EventStream — ALL derived]

  - term_id: TERM-TRANSFORMATION-CONTRACT
    normative_term: Transformation Contract
    deprecated_aliases: [Transformation Semantics (near-synonym — Contract is the machine-readable codification of Semantics)]
    definition: >
      FUNDAMENTAL minimal normative structure of a transformation T (CC-001 §4):
        TransformationContract(T) = ⟨ InputSignatures, OutputSignatures, Preconditions, Postconditions, Invariants ⟩
      The Contract SHALL contain NO algorithm, NO programming language, NO scheduler, NO cost model.
      All of those are Transformation STRATEGY — fungible engineering (Planner, SAT, RuleEngine, LLM, Compiler,
      Streaming, Distributed Optimizer, etc.). Contract = the frozen SQL Standard; Strategy = the fungible Query Optimizer.
    scope: Predicate B + Predicate C — FROZEN FUNDAMENTAL contract structure
    authoritative_ref: CC-001 §4 TransformationContract definition + IA-16 Semantics/Strategy separation (SQL ↔ Optimizer pattern)

  - term_id: TERM-THREE-LAWS
    normative_term: Three Fundamental Laws (EOS Constitutional Theory)
    deprecated_aliases: [Six-Tier Constitutional Model (former theory — now Reference Architecture only)]
    definition: >
      DERIVED PEDAGOGICAL FRAMEWORK, NOT irreducible constitutional core. Three Laws are a useful human-readable
      restatement of the Three Constitutional Predicates for communication and teaching:
        Law I — Authority       ≡  Predicate A Legitimate(x) domain
        Law II — Meaning        ≡  Predicate B MeaningPreserved(T) domain
        Law III — Realization   ≡  Predicate C Provable(T) domain + engineering strategy side
      The irreducible FROZEN core is the 3 predicates + conjunction in CC-001, NOT the Three Laws. Law/Laws
      terminology remains ACTIVE for pedagogical use but explicitly DERIVED.
    scope: Constitutional Theory (PEDAGOGICAL DERIVED — above ASP/IA but NOT frozen core)
    authoritative_ref: "AXIOMS.md §Constitutional-Theory-Three-Laws (stamped: DERIVED from CC-001 predicates)"
    derivation_chain: "Three Constitutional Predicates (TERM-THREE-CONSTITUTIONAL-PREDICATES) → Three Laws (human-readable framing)"
    epistemological_status: PEDAGOGICAL_DERIVED — NOT independently falsifiable; inherits falsifiability from predicates.

  - term_id: TERM-FOUR-AXIOMS
    normative_term: Four Constitutional Axioms (A, B, C, D)
    deprecated_aliases: []
    definition: >
      DERIVED ENGINEERING OPERATIONAL COROLLARIES, NOT irreducible frozen core. Four Axioms are a practical
      engineering restatement of the Three Constitutional Predicates plus a derived Verdict bridge:
        Axiom A — Authority       ≡  Predicate A Legitimate(x) engineering operational form
        Axiom B — Meaning         ≡  Predicate B MeaningPreserved(T) engineering operational form
        Axiom C — Realization     ≡  Predicates B+C transformation side (Semantics×Strategy)
        Axiom D — Proof           ≡  Predicate C Provable(T) + Verdict-dependency derivation
      The irreducible FROZEN core is the 3 predicates + conjunction in CC-001. Four Axioms remain ACTIVE for
      engineering reference (IA-01..IA-19 trace back to Axioms A/B/C/D) but are explicitly DERIVED, not core.
    scope: Engineering Operational (DERIVED — actively used in IA mapping, but NOT frozen core)
    authoritative_ref: "AXIOMS.md §Four-Constitutional-Axioms-Frozen-Core (stamped: DERIVED operational corollaries of CC-001 predicates)"
    derivation_chain: "Three Constitutional Predicates → Four Axioms Operational Corollaries → IA-01..IA-20 structural invariants"
    epistemological_status: ENGINEERING_DERIVED — actively used but changeable (without CC-001 revision) via normal ADR + epoch process if predicates are preserved.

  - term_id: TERM-IA17
    normative_term: IA-17 Constitution Preservation
    deprecated_aliases: [IA-17 Authority Preservation (former name — now the PRED_A sub-component only)]
    definition: >
      CONSTITUTIONAL META-INVARIANT covering ALL THREE predicates, expanded from former "IA-17 Authority Preservation".
      Formal statement: Every architectural transformation SHALL preserve constitutional validity.
      ConstitutionallyValid(T) ⇔ Legitimate(T) ∧ MeaningPreserved(T) ∧ Provable(T).
      Covers: planner, compiler, optimizer, AI planner, cache, incremental build, distributed execution —
      ALL must preserve ALL three predicates, not only authority. A transformation that is byte-deterministic
      but MeaningPreserved=FALSE (semantic drift) or Provable=FALSE (insufficient evidence) = IA-17 violation.
      Former "Authority Preservation" scope retained as PRED_A sub-component of the expanded invariant.
    scope: Meta-Invariant (IA-17 = Predicates A∧B∧C structural embodiment)
    authoritative_ref: INVARIANT-ARCHITECTURE.yaml#IA-17-CONSTITUTION-PRESERVATION + CC-001 §6 (direct restatement)

