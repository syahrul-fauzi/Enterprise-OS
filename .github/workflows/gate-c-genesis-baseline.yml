name: Gate C Genesis Baseline

on:
  pull_request:
    paths:
      - "enterprise/science/gate-c/**"
      - "workspace/packages/tooling/eos-cli/src/commands/gate-c.ts"
      - "workspace/packages/tooling/eos-cli/src/index.ts"
      - "workspace/package.json"
      - "workspace/pnpm-lock.yaml"
  push:
    branches:
      - main
      - master
    paths:
      - "enterprise/science/gate-c/**"
      - "workspace/packages/tooling/eos-cli/src/commands/gate-c.ts"
      - "workspace/packages/tooling/eos-cli/src/index.ts"
      - "workspace/package.json"
      - "workspace/pnpm-lock.yaml"

jobs:
  verify-genesis-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: workspace/pnpm-lock.yaml

      - name: Install workspace dependencies
        working-directory: workspace
        run: pnpm install --frozen-lockfile

      - name: Verify immutable Genesis baseline
        working-directory: workspace
        run: pnpm eos gate-c verify-genesis-baseline
