[project]
name = "eke"
version = "0.1.0"
description = "Enterprise Knowledge Engine (EKE) for validating and processing EKL knowledge packages"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.23.0",
    "pyyaml>=6.0.2"
]

[project.optional-dependencies]
tests = [
    "pytest>=7.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
