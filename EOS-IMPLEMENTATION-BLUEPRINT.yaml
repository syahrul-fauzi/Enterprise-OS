# LAYER 7 — EVIDENCE LAYER (Traceability Structure Matrix RTM)
# ============================================================================
evidence_layer:
  requirement_traceability_matrix_rtm_structure_how_to_fill:
    rule_trace_forward_every_requirement_must_end_in_evidence:
      step_1_business_req_id: "Contoh: REQ-B-M1-CASE-001 (advokat dapat create perkara baru)"
      step_2_linked_design_decisions: "ADR-012 (case state machine memilih enum A, B, C berdasarkan PERADI); ADR-013 (PostgreSQL JSONB untuk metadata case extensible)"
      step_3_linked_code_artifacts_sha: "SHA commit implementasi fitur; path file: workspace/capabilities/legal-case/implementation/commands/case.commands.ts"
      step_4_linked_automated_test_case_id: "TEST-B-M1-CASE-001 sampai TEST-B-M1-CASE-020 (id test di QA testrail / jest test)"
      step_5_linked_acceptance_evidence: "Screenshot flow sukses + recording demo + QA report summary M1 SHA256."
    rule_trace_backward_every_acceptance_evidence_must_start_in_req: "Tidak ada bukti penerimaan yang 'floating'; setiap report QA / screenshot HARUS di-link ke 1 atau lebih business requirement ID."
  decision_traceability_git_adr_integration:
    format_required: "Setiap ADR = file docs/adr/ADR-XXXX.md DAN entry append di DECISION_LOG.md. Wajib SHA commit pertama implementasi code yang TERKAIT di ADR."
  audit_evidence_chain_of_custody:
    sensitive_data_access_log_retention: "12 bulan IMMUTABLE object storage; HANYA dapat dibaca oleh security team TANPA modify permission. WORM (Write Once Read Many)."
  implementation_evidence_release_tagging:
    strategy: "Setiap production release = tag semantic (vX.Y.Z) + build provenance SBOM (Software Bill of Materials) SHA-linked, agar release mana yang menyebabkan issue SEV dapat dirollback exact tag."

# ============================================================================
# FINAL VALIDATION SELF-CHECK (6 Selesai Conditions User) — STRUCTURE ONLY
# Catatan: Ini = CHECK APAKAH DOKUMEN INI SUDAH MEMENUHI 6 SYARAT STRUKTURAL YANG USER SEBUTKAN?
# User 6 syarat: (1) SSOT single source truth (2) no contradiction cross-domain
# (3) deliverable→milestone (4) milestone→AC (5) AC→expected evidence (6) evidence→req.
# ============================================================================
implementation_readiness_self_check_structure_only_execution_claim_content_can_be_wrong:
  check_1_single_source_of_truth_single_file:
    status: "EXECUTION CLAIM STRUCTURAL: Dokumen ini = 1 file YAML tunggal di root repository. Semua reference (pointer EVIDENCE.md, Measurement Report SHA, dst) di-link dari sini. TETAPI: Isi content = Design Intention murni."
    evidence: "File location: /root/Enterprise OS/EOS-IMPLEMENTATION-BLUEPRINT.yaml (sha256sum dapat dijalankan auditor untuk integrity)"
  check_2_no_contradiction_cross_domain:
    status: "EXECUTION CLAIM: Manual review sementara ini TIDAK menemukan kontradiksi eksplisit antar domain dependency (A shared identity digunakan B dan C; B dan C TIDAK saling hard depend; C→B optional). TETAPI: Ini membutuhkan review user stakeholder (terutama dependency C→B soft import brief) untuk konfirmasi bisnis model tidak kontradiksi."
  check_3_deliverable_linked_to_milestone:
    status: "EXECUTION CLAIM STRUCTURAL: Contoh di B-M1 (phase_m1_alpha_case_document_complete.deliverable_list_what_handover_m3_finance_if_payment) = deliverable list per milestone. 100% milestone di roadmap section = memiliki deliverable list (template sebagian, tapi STRUKTUR ada)."
  check_4_milestone_has_acceptance_criteria:
    status: "EXECUTION CLAIM STRUCTURAL: 100% phase milestone = field acceptance_criteria_expected_evidence terisi (contoh AC-B-M1-01 dst). Struktur terpenuhi."
  check_5_acceptance_criteria_expected_evidence:
    status: "EXECUTION CLAIM STRUCTURAL: Setiap AC field = menyatakan evidence yang diharapkan (QA sign-off, automated test, SHA report, sample invoice, etc). Struktur terpenuhi."
  check_6_evidence_linked_back_requirement:
    status: "EXECUTION CLAIM STRUCTURAL: Evidence Layer 7.1 RTM mendefinisikan rule forward+backward SETIAP evidence → AC → Milestone → Business Requirement ID. Struktur terpenuhi."
  overall_self_assessment_structure_only:
    statement: "Struktur 6 syarat user LENGKAP di dokumen ini (check 1 s.d. 6 status structural terpenuhi per Execution Claim internal). TETAPI SELURUH ISI = Design Intention. BELUM ada satupun angka nyata / tanggal pasti / stakeholder nama riil / implementasi code untuk meng-VERIFIKASI bahwa content 'benar' / 'siap implementasi'."
    classification_note:
      - "JANGAN SAMPAI menganggap '6/6 structural = EOS siap'. Ini = KESALAHAN LEVEL (Rule #2 user: Jangan menganggap Execution Claim sebagai Verified Fact). Structural ada = bukan content validated."
      - "Untuk status Verified Fact EOS siap implementasi → butuh user review content dan tanda tangan (atau approval SHA-linked EVIDENCE.md entry) → SELANJUTNYA generate artefak konkret code (milestone dijalankan) → baru pada titik itu 'EOS implementation blueprint validated' = Execution Claim berubah menjadi Verified Fact (ketika 3 domain artifacts muncul di code base)."
