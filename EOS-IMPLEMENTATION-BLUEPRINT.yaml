# ============================================================================
# 3-DOMAIN IDENTITIES (Verified Fact: nama domain berasal dari User Directive Eksplisit)
# ============================================================================
domains:
  domain_a_services_id:
    canonical_name: Services-ID
    fqdn: services-id.com
    primary_role_shorthand: "Shared Identity & Service Platform (IDP + Service Registry + KYC bersama)"
    domain_type: SHARED_PLATFORM  # Platform capability shared ke Domain B dan C.
  domain_b_lawyershub:
    canonical_name: LawyersHub
    fqdn: lawyershub.id
    primary_role_shorthand: "Sistem Manajemen Praktik Hukum End-to-End (Case, Document, Billing, Client Portal)"
    domain_type: PRIMARY_PRODUCT  # Produk utama yang telah ada implementasi parsial (Verified Fact: workspace/capabilities/ folder ada 2 concrete capabilities)
  domain_c_indolawclub:
    canonical_name: IndonesiaLawyersClub
    fqdn: indonesialawyersclub.id
    primary_role_shorthand: "Komunitas Advokat Indonesia + Marketplace Jasa Hukum + CPD (Continuing Professional Development)"
    domain_type: COMMUNITY_MARKETPLACE_PRODUCT  # Produk komunitas yang kemungkinan consume B dan share identity A.

# ============================================================================
# CRITICAL CROSS-CUTTING ARCHITECTURE HYPOTHESIS (Design Intention!)
# Ini = 4 keputusan arsitektur PALING PENTING yang mempengaruhi seluruh 7 layer
# ============================================================================
cross_cutting_architecture_hypothesis_design_intention:
  ccah_001_shared_identity_platform_is_a:
    statement: "Domain A (Services-ID) = Single Shared Identity Provider (IDP) OIDC/OAuth2 untuk Domain B dan Domain C. User login HANYA di services-id.com; lawyershub.id dan indonesialawyersclub.id tidak memiliki password database sendiri."
    rationale_design_intention: "Mengurangi 3× duplikasi IAM implementation, mempermudah SSO (bukan 3 akun terpisah untuk advokat yang join ILC DAN menggunakan LawyersHub)."
    risk_if_wrong: "Domain A menjadi SPOF (single point of failure). Dibutuhkan DR plan kuat untuk Services-ID."
    dependency_link_to_layers:
      business_layer: "1.1 tujuan bisnis A (menyediakan identity terpusat) dan 1.7 dependency matrix (B→A, C→A pada identity flow)."
      architecture_layer: "3.7 Security, 3.8 Identity (IAM shared platform)."
      operational_layer: "4.4 DR RTO/RPO 0 untuk IAM; 4.5 Incident severity matrix: Identity outage = SEV-1 untuk ketiga domain."
      evidence_layer: "7.2 Decision traceability: CC-AH-001 SHA-linked ke dokumen ini; butuh ADR terpisah jika user menyetujui."
  ccah_002_domain_boundaries_3_abc_strict:
    statement: "Strict Bounded Context DDD-style: Domain A = Identity ONLY; Domain B = Legal Practice Case+Doc+Billing ONLY (TIDAK BOLEH ada identity logic); Domain C = Community + Marketplace CPD ONLY (TIDAK BOLEH ada duplicate billing logic, jika butuh billing = consume shared Domain B billing service ATAU shared platform A billing)."
    rationale_design_intention: "Mencegah 'big ball of mud' coupling antar domain yang user sebutkan sebagai tantangan terbesar EOS (no contradiction cross-domain)."
    risk_if_wrong: "Jika B memutuskan mau bikin identity sendiri nanti = coupling kebocoran boundary mahal diperbaiki."
  ccah_003_shared_observability_security_finance:
    statement: "Observability stack (3.9), Security stack (3.7), Operational DR/Incident (Layer 4), dan Financial Layer (Layer 6) = SHARED PLATFORM SERVICES, dikelola BUKAN per domain tim terpisah."
    rationale_design_intention: "Shared service ini mengurangi biaya operasional 3x; Satu dashboard monitoring melihat 3 domain sekaligus."
  ccah_004_platform_capability_reuse_first:
    statement: "Setiap capability baru TIDAK BOLEH diimplementasi di 2 domain berbeda jika capability logic ≥80% identik. Wajib: (1) extract ke shared platform capability, (2) 2 domain consume via public API contract (3.6 OpenAPI)."
    rationale_design_intention: "Ini = inti EXP-001 (ROADMAP.md L244-L272 Domain Transfer). Evidence-Based Reuse (EOS Thesis) = HANYA extract setelah evidence 80% overlap muncul."

# ============================================================================
# LAYER 1 — BUSINESS LAYER (Design Intention SEMUA field)
# ============================================================================
business_layer:
  # Catatan: Semua OKR di bawah ini = DESIGN INTENTION. BELUM diverifikasi / disetujui stakeholder.
  per_domain:
    domain_a_services_id:
      purpose_statement: >
        "Menyediakan identity, access, KYC, dan service registry terpusat sebagai single
        shared foundation yang dapat dipergunakan produk hukum apapun dalam grup
        (LawyersHub dan IndonesiaLawyersClub) tanpa perlu duplikasi modul KYC/IAM per produk."
      smart_objectives_okr_design_intention:
        o1_identity_adoption:
          objective: "Menjadi satu-satunya identity provider untuk LawyersHub dan ILC."
          kr1_percent_sso_users: "100% user aktif LawyersHub + ILC = login via OIDC Services-ID"
          target_quarter: "FY26Q4 (Design Intention — TIDAK BOLEH dianggap komitmen)"
        o2_kyc_automation:
          objective: "Automasi KYC advokat untuk B dan C melalui KYC shared flow"
          kr1_kyc_pass_rate_auto: "≥90% KYC advokat = approved otomatis tanpa review manual (jika KTP + PERADI ID match)"
          target_quarter: "FY26Q4"
      stakeholders_register_design_intention:
        internal:
          - role: Product Owner Shared Platform
            name: "TBD (Name belum ditunjuk)"
            responsibility: "Backlog Domain A; OKR owner; stakeholder interface ke B dan C PO"
          - role: IAM Engineering Lead
            name: "TBD"
            responsibility: "OIDC provider implementation; KYC pipeline; Audit log"
        external:
          - role: PERADI (Ikatan Advokat Indonesia)
            responsibility: "Verifikasi ID Advokat (untuk KYC shared flow)"
          - role: DUKCAPIL / KTP verification provider
            responsibility: "KTP electronic ID verifier API vendor"
          - role: Client dari B+C (lawyer / end user)
