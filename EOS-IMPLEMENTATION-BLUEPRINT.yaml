        independen Indonesia: mengelola perkara (case), dokumen hukum, billing,
        e-sign, dan komunikasi klien dalam satu workspace tertutup."
      smart_objectives_okr_design_intention:
        o1_case_productivity:
          objective: "Meningkatkan produktivitas advokat dalam administrasi perkara dan dokumen"
          kr1_case_close_time_pct: "Waktu penyelesaian administrasi perkara berkurang ≥30% dibandingkan cara manual"
          target_quarter: "FY26Q4"
        o2_monthly_active_firms:
          objective: "Adopsi LawyersHub oleh minimal target firma hukum"
          kr1_firm_count: "Target design intention (disesuaikan business review)"
          target_quarter: "FY27Q1"
      stakeholders_register_design_intention:
        internal:
          - role: Product Owner LawyersHub
            name: "TBD"
            responsibility: "Backlog domain B; OKR owner"
          - role: Domain Expert Hukum / Legal Reviewer
            name: "TBD (minimal 1 advokat senior in-house)"
            responsibility: "Review flows kasus, template dokumen, compliance KUHAP/UU advokat"
          - role: QA Lead
            name: "TBD"
            responsibility: "Automated testing; regression testing; data privacy test"
        external:
