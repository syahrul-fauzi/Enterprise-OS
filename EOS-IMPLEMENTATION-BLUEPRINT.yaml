      scope_in: ["Case management", "Document management + esign", "Client portal", "Trust accounting billing", "Calendar hearing", "Search perkara fulltext"]
      scope_out: ["IAM/KYC (DIDELEGASIKAN KE DOMAIN A)", "Payment gateway sendiri (pakai shared A billing)", "CPD / community forum (MILIK C ILC)"]
    domain_c_indolawclub:
