        - bc_a02_user_profile_kyc_shared
        - bc_a03_service_registry_api_catalog
        - bc_a04_billing_invoicing_shared_reusable  # Shared billing supaya B dan C tidak duplikat payment module.
      business_service_catalog_what_users_get:
        - "Advokat melakukan 1x KYC di Services-ID → otomatis verified di LawyersHub DAN ILC (sekali isi, 2 platform masuk)."
        - "Admin memanage 1x permission group → berlaku untuk 3 domain."
      scope_in: ["IAM/OIDC identity", "KYC advokat shared", "Service registry API catalog", "Shared billing payment orchestration"]
      scope_out: ["Legal case management logic (INI MILIK LAWYERSHUB B)", "Community forum CPD (INI MILIK ILC C)", "Advokat practice software tools selain identity/billing"]
