    - "B → A | HARD DEPENDENCY Identity/KYC | LawyersHub user login via OIDC Services-ID; KYC advokat diverifikasi dari A"
    - "C → A | HARD DEPENDENCY Identity/KYC | IndonesiaLawyersClub user login via OIDC; CPD participant verified via A membership status"
    - "C → B | SOFT DEPENDENCY Marketplace Case File | ILC Marketplace client yang match advokat BISA (opsional) import brief ke LawyersHub jika advokat tersebut pengguna LawyersHub (HANYA dengan opt-in advokat). JIKA TIDAK ADA = tidak menembus boundary B."
    - "B → A | SOFT DEPENDENCY Shared Billing | LawyersHub billing payment = di-orchestrasi dari shared A billing module, B tidak handle payment gateway sendiri"
    - "C → A | SOFT DEPENDENCY Shared Billing | ILC membership fee + CPD course payment = via A shared billing, C tidak handle payment sendiri"

# ============================================================================
# LAYER 2 — DELIVERY LAYER
# ============================================================================
delivery_layer:
  global_definitions_design_intention:
    definition_of_done_global_dod:
      - "Code merged ke main branch (dengan minimal 1 peer review non-author)."
      - "Unit test code coverage ≥80% untuk logic bisnis NON-UI; ≥70% overall."
      - "Integration test (API) untuk endpoint berubah = GREEN."
      - "Deploy otomatis ke staging environment tanpa error."
      - "QA sign-off untuk fitur yang berubah (test plan terisi ≥95%)."
      - "User-facing documentation diperbarui (user guide / API doc / changelog)."
      - "Security scan (SAST) tidak ada HIGH severity."
    definition_of_ready_global_dor:
      - "Acceptance criteria per story ditulis dan disetujui PO."
      - "UX wireframe tersedia untuk story user-facing (jika UI berubah)."
      - "Dependency antar story sudah jelas (TIDAK ada external dependency blocker yang tidak tercatat)."
      - "Estimasi effort ≤ 13 story points per story (jika > = dipecah)."
      - "Impact ke domain lain sudah didiskusikan PO lintas-domain."
  per_domain_roadmap_milestones_design_intention:
    domain_b_lawyershub_first_because_has_existing_capabilities:
      order: 1  # Mengerjakan B terlebih dahulu karena ada concrete capabilities legal-case dan legal-document (Verified Fact di workspace/capabilities)
      phases:
        - phase_m1_alpha_case_document_complete:
          name: "M1 — Alpha Case+Doc Complete (v0.5 Alpha Closed)"
          target_date_quarter: "FY26Q4 (DESIGN INTENTION, BUKAN komitmen tanggal)"
          owner_role: "PO LawyersHub + Eng Lead"
          acceptance_criteria_expected_evidence:
            - "AC-B-M1-01: Advokat dapat membuat perkara baru, assign anggota tim, set status, simpan catatan melalui UI tanpa error flow utama (bukti = automated test + QA sign-off + demo recording)."
            - "AC-B-M1-02: Dokumen dapat diunggah per perkara, di-search fulltext, di-share dengan klien via portal secure link TTL (bukti = integration test 5 endpoint upload/search/share 100% success)."
            - "AC-B-M1-03: Semua 8 Gate 0 criteria capability legal-case legal-document = PASS (bukti = Measurement Report SHA256 tercatat append-only EVIDENCE.md)."
            - "AC-B-M1-04: SSO via Services-ID (jika A sudah ada di M1, BISA ditunda ke M2) OR local login fallback dulu dengan migration plan jelas M2."
            - "AC-B-M1-05: Tidak ada HIGH SAST vulnerability di code base security scan."
          deliverable_list_what_handover_m3_finance_if_payment:
            - "Build Alpha LawyersHub staging: v0.5.x."
            - "QA Report M1: Test result summary."
            - "Security Report SAST: HIGH severity count = 0."
            - "User Guide Alpha untuk internal tester."
            - "Measurement Report Gate 0 SHA256 untuk legal-case + legal-doc."
        - phase_m2_beta_billing_sso_clientportal:
          name: "M2 — Beta Billing + SSO Shared A + Client Portal"
          target_date_quarter: "FY27Q1"
          depends_on_milestone_other_domains: ["Domain A M1 SSO billing siap dipakai"]
          acceptance_criteria_expected_evidence:
            - "AC-B-M2-01: Advokat dapat generate invoice per perkara, catat payment via shared A billing, bukti PDF invoice auto-generate (automated test + 3 sample invoice PDF)."
            - "AC-B-M2-02: 100% login flow user baru = OIDC via Services-ID (bukti = SSO integration test green + local login fallback dihapus/disable non-admin)."
            - "AC-B-M2-03: Klien dapat login ke portal (via A + passwordless link?), lihat daftar perkara mereka, download dokumen shared, approve esign (bukti = QA end-to-end test user role klien)."
        - phase_m3_ga_general_availability:
          name: "M3 — GA Umum untuk 50 firma pertama"
          target_date_quarter: "FY27Q2"
          acceptance_criteria_expected_evidence:
            - "AC-B-M3-01: 50 firma hukum / advokat independen = onboarding completed tanpa major critical bug (evidence = onboarding log success rate ≥95%)."
            - "AC-B-M3-02: SLA availability 99.5% untuk 30 hari terakhir (evidence = uptime monitoring report)."
    domain_a_services_id_roadmap:
      order: 2
      phases:
        - phase_a_m1_sso_shared_core:
          name: "A-M1 — SSO OIDC Core + KYC Pipeline Dasar"
          target_date_quarter: "FY26Q4 (bersamaan waktu B M1)"
          acceptance_criteria_expected_evidence:
            - "AC-A-M1-01: Identity Provider OIDC = dapat issue token JWT, LawyersHub sebagai client confidential terdaftar, refresh token flow work (bukti = OIDC conformance test suite pass ≥ 90% claims)."
            - "AC-A-M1-02: Flow KYC advokat: input KTP + PERADI ID = verified/declined (bukti = 10 sample test case pipeline result)."
        - phase_a_m2_shared_billing_catalog:
          name: "A-M2 — Shared Billing Payment Orchestration + API Service Catalog"
          target_date_quarter: "FY27Q1 (sebelum B M2)"
    domain_c_indolawclub_roadmap:
      order: 3
      phases:
        - phase_c_m1_community_membership_marketplace_beta:
          name: "C-M1 — Beta Community Membership + Marketplace"
          target_date_quarter: "FY27Q2 (setelah B M2 + A M2 stabil)"
          depends_on: ["A-M1 SSO siap", "A-M2 Billing siap"]
          acceptance_criteria_expected_evidence:
            - "AC-C-M1-01: Advokat login via Services-ID otomatis populate profile jika KYC verified di A (bukti = integration test SSO C)."
            - "AC-C-M1-02: Marketplace: Klien dapat post brief, advokat dapat apply, match notification terkirim ke kedua pihak."
        - phase_c_m2_cpd:
          name: "C-M2 — CPD Event + Credit Tracking GA"
          target_date_quarter: "FY27Q3"

# ============================================================================
# LAYER 3 — ARCHITECTURE LAYER
# ============================================================================
architecture_layer:
  enterprise_context_c4_level1_design_intention:
    users_external:
      - actor: Advokat Pengguna
        uses_systems: ["LawyersHub (B)", "IndonesiaLawyersClub (C) via Services-ID (A) SSO"]
      - actor: Klien Akhir
        uses_systems: ["LawyersHub Client Portal (B)", "ILC Marketplace (C)"]
      - actor: Admin Organisasi Advokat (PERADI)
        uses_systems: ["Services-ID (A) KYC verification callback"]
    external_systems_integrations:
      - name: "DUKCAPIL / KTP Electronic Verification Vendor"
        used_by: "Domain A (KYC flow)"
      - name: "Payment Gateway (Midtrans / Xendit / Duitku)"
        used_by: "Domain A (Shared Billing A-M2)"
      - name: "E-Sign Provider (e.g., Doku Sign / Peruri Sign / Privy)"
        used_by: "Domain B (Document esign M2)"
      - name: "SMTP / WhatsApp Business Notification Provider"
        used_by: "All 3 domains via shared notification service (A platform)"
    intra_3_domain_relationships_enum_ccah:
      ccah_001_depiction: "A = Shared IDP di tengah; B dan C = children OIDC relying party yang AUTH ke A; C dapat SOFT consume B marketplace import JIKA user opt-in."
  domain_boundary_map_ddd_strict_bounded_context:
    bounded_context_a_identity_platform:  # 100% inside A
      aggregates: ["UserIdentity", "KycSubmission", "PermissionGroup", "ClientAppOIDC", "BillingInvoiceShared", "ApiServiceRegistryEntry"]
      outbound_events_public_contract_3_6_openapi_later:
        - "a.user.kyc.approved.v1 (Publish ke B dan C via event bus)"
        - "a.user.profile.updated.v1"
        - "a.billing.invoice.paid.v1 (Publish ke B/C agar invoice status di mark PAID)"
      anti_corruption_layer: "B dan C TIDAK BOLEH direct SQL ke database A; HANYA boleh consume public event atau public REST API contract."
    bounded_context_b_law_practice:  # 100% inside B
      aggregates: ["LegalCase", "LegalDocument", "InvoiceTrustLine", "LawyerFirm", "ClientPortalUserLink"]
      inbound_acl_from_a: "ACL only: consume a.user.kyc.approved untuk auto-create lawyer profile di B. HANYA menerima public contract event."
      inbound_acl_from_c_soft: "ACL marketplace optional: HANYA menerima c.marketplace.engagement.created VIA authenticated A service token JIKA advokat tersebut already registered di B."
    bounded_context_c_community_marketplace:
      aggregates: ["CommunityMemberProfile", "ForumThread", "MarketplaceBrief", "Engagement", "CpdCourse", "CpdAttendanceCredit"]
      inbound_acl_from_a: "ACL consume a.user.kyc.approved + a.billing.invoice.paid (untuk membership fee)."
  shared_platform_capabilities_list:
    spc_01_shared_iam_oidc:  # A
    spc_02_shared_kyc_pipeline:  # A
    spc_03_shared_billing_payment:  # A
    spc_04_shared_notification_smtp_whatsapp:  # A shared
    spc_05_shared_file_storage_encrypted_s3_compatible:  # A shared — B dokumen hukum sensitif dan C materi CPD = terpisah bucket tapi 1 platform
    spc_06_shared_observability_logging_metrics_traces:  # Ops shared layer
    spc_07_shared_security_secrets_vault:  # Security shared
  api_contract_required_mandatory_design_intention_per_phase:
    - "Setiap bounded context wajib publish OpenAPI 3.1 spec yaml (file) KE DALAM folder contracts/openapi/<bc_name>.yaml SEBELUM endpoint live production."
    - "Consumer B/C wajib generate client SDK DARI spec yaml itu; TIDAK BOLEH hardcode URL path di luar spec."
  security_architecture_outline_design_intention:
    authn: "OIDC Authorization Code Flow + PKCE untuk web apps; mTLS untuk service to service backend communication antar bounded context."
    authz: "RBAC shared permission group disimpan di A; setiap B/C tambahkan scope local per context (contoh B memiliki scope case:create, C scope forum:post — group di A assign scope gabungan)."
    encryption:
      at_rest: "AES-256-GCM untuk data sensitif (dokumen hukum B, KYC data A); data encryption key (DEK) wrapped oleh KMS yang TERDAPAT di HSM/Vault TIDAK di aplikasi."
      in_transit: "TLS 1.3 ONLY untuk semua endpoint publik; HSTS includeSubDomains preload."
    secrets_management: "HashiCorp Vault (atau setara) TIDAK BOLEH ada plaintext secrets di .env commit ke git — semua secret via Vault Agent Injector."
  identity_access_iam_per_domain_role_matrix_design_intention:
    domain_a_shared:
      - role_platform_super_admin: "Hanya untuk tim SRE. Manage IAM app client, rotate key, vault admin."
      - role_a_billing_finance_admin: "Melihat semua invoice shared across domain (keperluan finance team)."
      - role_a_kyc_reviewer: "Manual review case KYC yang gagal auto-verifikasi."
    domain_b_lawyershub:
      - role_b_firm_owner_admin: "Manage user di firma hukumnya; invite anggota tim; billing firma"
      - role_b_senior_advokat: "Kelola perkara; create/delete dokumen high privilege"
      - role_b_junior_advokat_paralegal: "Edit perkara; upload dokumen; TIDAK bisa delete final dokumen"
      - role_b_client_portal_user: "Hanya lihat perkara + dokumen yang di-share; approve e-sign;"
    domain_c_ilc:
      - role_c_community_admin_moderator: "Moderasi forum; approve event CPD;"
      - role_c_advokat_member_verified: "Post marketplace penawaran; join CPD dan dapat credit;"
      - role_c_client_enduser: "Post brief di marketplace; enroll CPD public course;"
  observability_stack_outline_design_intention:
    logs: "Loki / OpenSearch (structured JSON log; HAPUS log yang berisi sensitive field PII sebelum ingest via redaction pipeline)."
    metrics: "Prometheus + Grafana; default SLA dashboard per domain; RED method per service (Rate, Errors, Duration)."
    traces: "OpenTelemetry SDK untuk semua service backend; trace ID propagasi via W3C Trace Context header ke event bus juga."
    alerting: "Alertmanager ke Slack/Oncall; severity routing: SEV1 → SMS + call out of hours, SEV2 → Slack, SEV3 → Jira ticket."

# ============================================================================
# LAYER 4 — OPERATIONAL LAYER
# ============================================================================
operational_layer:
  deployment_environments:
    - env_local_developer: "Minikube / docker-compose per developer; TIDAK akses shared data."
    - env_dev_integration: "CI deploy otomatis setiap PR; isolated namespace k8s; database baru per PR branch."
    - env_staging_uat: "Production-like; snapshot anonymized data (TIDAK ADA real PII) dari production; QA + UAT user testing sini."
    - env_production: "Multi region ASEAN-1 primary, ASEAN-2 DR; backup schedule; SOC2 controls level."
  sla_per_domain_targets_design_intention:
    domain_b_lawyershub_production:  # Paling kritis karena data perkara aktif
      availability_monthly: "99.9% (max downtime ~43m/month)"
      case_document_api_response_p95: "<=500 ms"
      incident_response_sev1_case_document_unavailable: "15 menit ack; 1 jam mitigation; Root Cause Analysis <24 jam."
    domain_a_services_id_iam_kyc_shared:
      availability_monthly: "99.95% (IAM = kritis semua domain)"
      login_api_p95: "<=300 ms"
    domain_c_community_marketplace:
      availability_monthly: "99.5% (community/forum downtime kurang kritis dari data hukum B)"
  backup_policy_design_intention:
    rpo_targets_maximum_data_loss:
      domain_b_case_documents: "RPO = 1 JAM (incremental backup setiap jam)"
      domain_a_iam: "RPO = 15 MENIT"
      domain_c: "RPO = 6 JAM"
    retention: "Backup harian 7 hari; mingguan 4 minggu; bulanan 12 bulan; encrypt backup with separate key. Restore test wajib dijalankan SEKALI/BULAN per domain (evidence = restore test report tanggal + success sha checksum)."
  disaster_recovery_dr_rto_targets:
    domain_a_iam: "RTO = 2 JAM (IAM down = semua domain susah login)"
    domain_b: "RTO = 4 JAM"
    domain_c: "RTO = 8 JAM"
  incident_response_severity_matrix_design_intention:
    sev1_critical:
      contoh: [
        "LawyersHub 5xx error untuk ≥20% user (tidak bisa buka dokumen perkara)",
        "Services-ID OIDC tidak dapat issue token → B DAN C user TIDAK BISA login selama >5 menit",
        "Ada indikasi kebocoran data PII dokumen hukum (confirmed or highly suspected)"
      ]
      ack_time_minutes: 15
      mitigation_time_hours: 1
      postmortem_deadline_hours: 24
    sev2_high:
      contoh: ["Search perkara di B error p99 >10 detik selama 30 menit", "Forum C tidak bisa post (tetapi login + marketplace masih ok)"]
      ack_time_minutes: 30
      mitigation_time_hours: 4
    sev3_medium:
      contoh: ["UI styling bug non-blocking", "Export PDF minor alignment error"]
      ack_time_hours: 4
  support_model_3tier_shared_across_domain:
    tier1_helpdesk: "Handle common issue: password reset via A, cara upload doc, dll; 24/7 untuk SEV1; work hour Indonesia (08.00-20.00 WIB) untuk SEV2/3 non-production impact."
    tier2_engineering_support: "Handle backend/API issue; escalasi ke tier3 jika butuh code fix bug emergency patch release."
    tier3_vendor_core_engineer: "Architect + Senior dev yang paham domain B/C/A boundary + data schema; emergency hotfix + postmortem author."

# ============================================================================
# LAYER 5 — GOVERNANCE LAYER (Engineering + Operational, BUKAN governance metodologis EOS)
# ============================================================================
governance_engineering_layer:
  decision_log_registry_required_for:
    - "Architecture decision: Setiap ADR (Architecture Decision Record) wajib nomor ADR-XXX, berisi context decision, alternative considered, decision, consequences. SHA-linked ke artefak."
    - "Technology selection decision (misal pilih PostgreSQL bukan MySQL; pilih Ory Hydra sebagai OIDC provider)."
    - "Major library upgrade (React 18→19; pnpm major; etc.) yang beresiko breaking lintas domain."
  change_management_release_design_intention:
    release_cadence_regular: "Weekly release window Rabu 14.00 WIB untuk non-hotfix change; 4 mata approval: (1) PO change accept, (2) QA regression sign off, (3) Security scan HIGH = 0 confirm, (4) SRE deploy window confirm availability + monitoring standby."
    hotfix_emergency_release: "Dapat keluar kapan saja TETAPI wajib: minimal 1 eng review + 1 QA test smoke 5 minute + post-incident review 2 hari kerja kemudian + change log record lengkap."
  risk_register_engineering_design_intention_initial_seed:
    - id: RISK-ENG-001
      title: "Services-ID SPOF Identity (CC AH-001 risiko)"
      likelihood: MEDIUM
      impact: HIGH
      mitigations: ["Multi region DR A-M1+; RTO/RPO 2 jam / 15 menit (Row Operational Layer)", "Manual fallback JWT signing key emergency jika OIDC fully down ≤24 jam (prosedur)."]
      owner_role: "SRE Lead + IAM Eng Lead"
      target_resolve_quarter: "FY26Q4 (saat A-M1 production pertama)"
    - id: RISK-ENG-002
      title: "Data PII Hukum LawyersHub kebocoran (dokumen perkara adalah data paling sensitif)"
      likelihood: LOW (jika enkripsi at rest + in transit + secret vault)
      impact: CRITICAL
      mitigations: ["Audit log semua akses dokumen B ke SIEM, immutable 1 tahun.", "Envelope encryption KMS + DEK terpisah.", "Zero-trust: dokumen HANYA bisa diakses via short-lived signed URL, NEVER public."]
  assumption_register_initial_seed:
    - id: ASSUMP-001
      statement: "OIDC provider open source (misal Ory Hydra atau Keycloak) dapat mencukupi kebutuhan 3 domain tanpa custom OIDC server dari scratch."
      verify_by: "Proof of concept IAM sebelum A-M1 closed (sebelum Q3 berakhir)."
      risk_if_wrong: "Delay A-M1 1-2 sprint."
  dependency_external_register_initial_seed:
    - name: "Payment Gateway (salah satu Xendit / Midtrans / Duitku)"
      for_domain_shared: "A billing (B + C shared)"
      contract_type: "SaaS Vendor"
      fallback_plan: "Daftar minimal 2 provider; abstraction layer shared billing supaya ganti provider BISA tanpa ubah code B dan C (hanya config A)."
  issue_register:
    note: "Saat ini = BELUM ada issue teknis formal (TBD di task tracker JIRA/Linear saat project execution dimulai). Entry ini = placeholder agar structure lengkap."

