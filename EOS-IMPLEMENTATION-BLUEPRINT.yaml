      scope_in: ["Membership komunitas advokat", "Forum diskusi hukum", "Marketplace jasa advokat klien", "CPD event course credit"]
      scope_out: ["Internal case management tools (MILIK B LawyersHub)", "Billing sendiri = gunakan shared A", "Identity sendiri = gunakan A SSO"]
  cross_domain_dependency_matrix:
