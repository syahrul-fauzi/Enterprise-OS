# Enterprise OS Configuration
version: "1.2.0"

# Base paths
base_path: "/root/Enterprise-OS"
workspace_path: "/root/Enterprise-OS/workspace"
products_path: "/root/Enterprise-OS/workspace/products"
governance_path: "/root/Enterprise-OS/governance"
kernel_path: "/root/Enterprise-OS/implementation/eos/kernel"
engines_path: "/root/Enterprise-OS/implementation/eos/engines"
evidence_base: "/root/Enterprise-OS/workspace/products/{product}/evidence"

# Active product - UPDATED for P0-PT-001 (CommsMe PT Establishment Work Seed)
primary_product: "commsme"

# Control plane configuration
control_plane:
  state_file: "eos-state.yaml"

# Engines configuration
engines:
  observer:
    enabled: true
    output_dir: "observations"
  validator:
    enabled: true
    rules_file: "rules.yaml"
    output_dir: "validation-reports"
  pattern:
    enabled: true
    rules_file: "rules.yaml"
    output_dir: "pattern-candidates"
  doctor:
    enabled: true
    output_dir: "delivery-reports"

# Evidence validation rules
evidence:
  required_fields:
    - "title"
    - "timestamp"
    - "source"
  allowed_extensions:
    - ".md"
    - ".yaml"
    - ".json"