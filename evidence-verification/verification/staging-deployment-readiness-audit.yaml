      - Konfirmasi database migration berhasil tanpa error
    decision: CONDITIONAL GO

  - item_id: GEN-STG-004
    description: Security dan tenant isolation
    status: PENDING
    evidence: Akan diverifikasi setelah deployment
    required_actions:
      - Verifikasi authentication dan authorization berfungsi di staging
      - Konfirmasi tenant boundary terisolasi dengan benar
      - Pastikan tidak ada cross-tenant data leakage
      - Verifikasi policy enforcement berfungsi di runtime staging
    decision: CONDITIONAL GO

  - item_id: GEN-STG-005
    description: Failure/recovery drill
    status: PENDING
    evidence: Akan dijalankan setelah security validation
    required_actions:
      - Jalankan failure injection test suite di staging
      - Verifikasi retry, idempotency, timeout, dan recovery berfungsi
      - Konfirmasi external ambiguity handling berfungsi di lingkungan staging
      - Pastikan audit trail tercatat dengan benar untuk semua failure scenario
