  - item_id: GEN-STG-007
    description: Independent deployment review
    status: PENDING
    evidence: Akan dijalankan setelah semua tahapan sebelumnya selesai
    required_actions:
      - Review semua evidence deployment staging
      - Dokumentasikan semua temuan dan blocker (jika ada)
      - Buat rekomendasi untuk next phase
    decision: CONDITIONAL GO

