    status: COMPLIANT
    evidence: Semua logika bisnis berada di genesis-eos, tidak ada duplikasi di layer lain

  - constraint: EOS Work Core owns authority and evidence governance
    status: COMPLIANT
    evidence: Semua otoritas Work, continuity, dan evidence governance tetap berada di EOS Work Core

  - constraint: Paperclip executes agents, not semantic authority
    status: COMPLIANT
