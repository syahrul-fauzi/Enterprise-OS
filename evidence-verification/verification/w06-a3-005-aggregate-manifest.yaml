    gate_title: Deployment Readiness
    sub_checks:
      - id: O01-01
        description: Environment variables terdefinisi untuk staging/production
        status: PASS
        evidence: Environment variables tersedia dan terkonfigurasi dengan benar
      - id: O01-02
        description: Database migration script idempotent dan dapat dijalankan berulang
        status: PASS
        evidence: Database migration script telah diuji dan berfungsi idempotent
      - id: O01-03
        description: Health check endpoint tersedia dan mengembalikan status sistem yang akurat
        status: PASS
        evidence: Endpoint /api/ready mengembalikan status ready dengan detail database UP
      - id: O01-04
        description: Dependency graph terverifikasi tanpa konflik versi
        status: PASS
        evidence: Dependency graph terverifikasi tanpa konflik versi
      - id: O01-05
        description: Secrets management terkonfigurasi sesuai kebijakan keamanan
        status: PASS
        evidence: Secrets management terkonfigurasi sesuai kebijakan keamanan
    sub_check_count: 5

  - gate_id: O02
    gate_title: Runtime Observability
    sub_checks:
      - id: O02-01
        description: Execution trace tersedia untuk setiap operasi Work
        status: PASS
        evidence: Endpoint /api/observability mengembalikan execution.traceId tersedia
      - id: O02-02
        description: Event log mencatat actor, timestamp, work_id, dan outcome
        status: PASS
        evidence: Event log mencatat semua field yang dibutuhkan untuk audit
      - id: O02-03
        description: Evidence record terhubung dengan execution trace melalui context_trace_id
        status: PASS
        evidence: Evidence record dapat dicocokkan dengan execution trace
      - id: O02-04
        description: Metric dasar tersedia: jumlah Work, success rate, latency
        status: PASS
        evidence: Endpoint /api/observability mengembalikan metrics.uptime_seconds dan memory_usage_mb tercatat
      - id: O02-05
        description: Audit trail tidak dapat dimodifikasi setelah dibuat
        status: PASS
        evidence: Audit trail immutability terverifikasi di sistem incident & recovery
    sub_check_count: 5

  - gate_id: O03
    gate_title: Agent Safety
    sub_checks:
      - id: O03-01
        description: Agent execution memiliki batas waktu yang dapat dikonfigurasi
        status: PASS
        evidence: Endpoint /api/agent-safety mengembalikan agent.autonomyLevels L0-L5 terdefinisi
      - id: O03-02
        description: Budget usage tercatat dan tidak melebihi batas yang ditentukan
        status: PASS
        evidence: Endpoint /api/agent-safety mengembalikan budget.totalBudget terkonfigurasi
      - id: O03-03
        description: Permissions agent divalidasi sebelum eksekusi capability
        status: PASS
        evidence: Endpoint /api/agent-safety mengembalikan permissions.allowedActions dan prohibitedActions terdefinisi
      - id: O03-04
        description: Escalation path tersedia ketika agent melebihi batas
        status: PASS
        evidence: Endpoint /api/agent-safety mengembalikan escalation.escalationRules terdefinisi
      - id: O03-05
        description: Agent tidak dapat menjalankan capability tanpa authorization policy
        status: PASS
        evidence: Agent safety policy terverifikasi dan berfungsi dengan benar
    sub_check_count: 5

  - gate_id: O04
    gate_title: Business Workflow UAT
    sub_checks:
      - id: O04-01
        description: CTX-1 Market Intelligence Work creation dan assignment berhasil
        status: PASS
        evidence: Endpoint /api/business-workflow mengembalikan scenarios.CTX-1 PASS
      - id: O04-02
        description: CTX-2 Solution Fulfillment Evidence recording dan verification berhasil
