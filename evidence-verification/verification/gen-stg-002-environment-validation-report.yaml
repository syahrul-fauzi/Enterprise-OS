environment_comparison:
  - category: Database Configuration
    development:
      POSTGRES_USER: eos_dev
      POSTGRES_PASSWORD: eos_dev_password_123
      POSTGRES_DB: eos_identity_dev
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://eos_dev:eos_dev_password_123@localhost:5432/eos_identity_dev
    staging:
      POSTGRES_USER: eos_user
      POSTGRES_PASSWORD: eos_staging_pass_2026
      POSTGRES_APP_USER: app_user
      POSTGRES_APP_PASSWORD: app_staging_pass_2026
      POSTGRES_DB: eos_identity
      POSTGRES_PORT: 5433
      DATABASE_URL: postgresql://eos_user:eos_staging_pass_2026@localhost:5433/eos_identity
    drift: Intentional - Staging menggunakan database terpisah dengan kredensial yang berbeda untuk isolasi lingkungan
    drift_severity: LOW
    drift_acceptance: ACCEPTED

  - category: Node Environment
    development:
      NODE_ENV: development
    staging:
      NODE_ENV: production
    drift: Intentional - Staging menggunakan mode production untuk memverifikasi perilaku sistem yang sama dengan produksi
    drift_severity: LOW
    drift_acceptance: ACCEPTED

  - category: TLS Configuration
    development:
      CADDY_TLS: internal
    staging:
      CADDY_TLS: internal
      STAGING_REQUIRE_PUBLIC_TLS: "0"
      STAGING_TLS_INSECURE: "1"
    drift: No drift - Konfigurasi TLS staging sama dengan development untuk verifikasi lokal
    drift_severity: NONE
    drift_acceptance: N/A

  - category: Domain Configuration
    development:
      LAWYERSHUB_DOMAIN: lawyershub.id
      SERVICES_ID_DOMAIN: services-id.com
      ILC_DOMAIN: indonesialawyersclub.id
    staging:
      LAWYERSHUB_DOMAIN: lawyershub.id
      SERVICES_ID_DOMAIN: services-id.com
      ILC_DOMAIN: indonesialawyersclub.id
    drift: No drift - Domain konfigurasi konsisten antara development dan staging
    drift_severity: NONE
    drift_acceptance: N/A

  - category: Port Configuration
    development:
      API_PORT: 3001
    staging:
      STAGING_HTTP_PORT: 80
      STAGING_HTTPS_PORT: 443
    drift: Intentional - Staging menggunakan port standar HTTP/HTTPS untuk deployment yang realistis
    drift_severity: LOW
    drift_acceptance: ACCEPTED

