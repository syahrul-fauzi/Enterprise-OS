    percentage: 89% dari total layer
    description: Semua layer lain bisa diotomatisasi dengan Playwright/API/Database test
  tools:
    - name: Playwright
      layers: [A, C]
      description: Browser testing untuk UI/UX behavior
    - name: API/MCP Tests
      layers: [C, D, I]
      description: Testing untuk actor dan cross-surface
    - name: Database Verification
      layers: [F]
      description: Persistence dan recovery test
    - name: eos-evidence-engine
      layers: [G]
      description: Audit dan evidence verification
    - name: Security Scanner
      layers: [H]
      description: Security and tenant isolation test

