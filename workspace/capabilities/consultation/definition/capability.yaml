    start_date: "2026-08-14"
    core_questions:
      - "Did Consultation understand the right problem?"
      - "Did it request the right work?"
      - "Did it stop at the right boundary?"
      - "Did the user obtain the intended outcome?"
    case1_preliminary:
       outcome: "SUFFICIENT"
       requiredCapabilitiesInvoked: 2
       unnecessaryCapabilitiesNotCalled: "..."
       trueLeverage: 2
       trueLeverageStatus: "⏳ derived metric / perlu definisi"
       # Format sesuai koreksi epistemik War Room:
       # Outcome: SUFFICIENT             ✅ observed
       # Required capability: 2          ✅ observed
       # Unnecessary work avoided: ...   ✅ jika ada evidence
       # True leverage: 2                ⏳ derived metric / perlu definisi
contracts:
  requires:
    - name: WorkflowEngineProvider
      range: ">=0.1 <0.2"
    - name: LegalCaseProvider
      range: ">=0.1 <0.2"
    - name: EvidenceRegistryProvider
      range: ">=0.1 <0.2"
