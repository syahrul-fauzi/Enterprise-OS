eos-constitutional-proposal:
  id: CONST-PROPOSAL-001
  name: "Codify Work as EOS Fundamental Constitutional Primitive"
  submitted_at: "2026-08-21T10:00:00Z"
  submitter_agent: "eos-command-center"
  status: "UNDER_REVIEW"
  basis:
    - "FPA-01: Fundamental Primitive Audit (COMPLETED, hypothesis H-W survives all reduction attacks, confidence 0.97)"
    - "FPA-02: Primitive Consequence Audit (COMPLETED, all 10 architectural predicates passed, no falsification of H-W)"
    - "P-011: Semantic Substitutability Attack (PASSED, no combination of smaller primitives can replicate Work's observed semantic behavior)"
    - "P8: Durability (PASSED, Work survives process crash/restart - all test conditions met, no falsification)"
    - "P9: Independent Addressability (PASSED, all 11 acceptance criteria met, H-W strengthened)"
    - "C11-C21: All continuity experiments passed, Work's stability across transient changes consistently observed"
  
  primitive_definition: |
    Work is hypothesized as the EOS domain's irreducible persistent referent - the fundamental continuity substrate of the platform. This hypothesis has survived all falsification attempts executed to date (P-010, P8, P9, P-011) within the C11-C21 experimental space, earning status as a Constitutional Primitive Candidate pending governance ratification.
    
    CORE INVARIANT (fundamental constitutional property):
    > **A Work remains referentially addressable across changes in execution conditions.**
    
    This invariant captures referential continuity - the ability to resolve the same persistent Work regardless of changes to transient execution dimensions that may affect it:
    - Actor changes (user → agent → paralegal)
    - Execution context changes (tenant, workspace, session rotation)
    - Execution failures and restarts (crash recovery, re-entry)
    - External state ambiguity (UNKNOWN state transitions)
    - Capability boundary crossings (cross-domain execution)
    
    Work aligns with W3C PROV model as PROV:Entity (persistent entity), while Execution = PROV:Activity (time-bound process) and Actor = PROV:Agent (responsible party) - maintaining the core PROV distinction that enables this invariant. PROV provides semantic alignment but does not prove Work's primitive status; this is a domain-specific EOS conclusion from reduction and falsification attacks.
    
    Work as a persistent referent is the stable anchor that survives all changes to its associated transient properties:
                        W1
                         │
        stable referential anchor
                         │
       ┌─────────────┼─────────────┐
       ▼             ▼             ▼
    Actor          Execution    Capability
    changes         changes       changes
       │             │             │
       └─────────────┼─────────────┘
                     ▼
              W1 remains W1

  constitutional_clauses_to_enforce:
    # All clauses enforce the core invariant: "Work remains referentially addressable across changes in execution conditions"
    # logicalWorkId is an implementation mechanism; the clauses protect the referential continuity invariant, not just the ID
    
    - clause_id: W-CONST-001
      clause: "Work identity must maintain referential continuity across all execution condition changes - Work may never become unaddressable due to changes in actor, session, execution, or context"
      enforcement:
        - Repository layer: resolve(workId) must work exclusively from workId, no other parameters required
        - Verification: Cold-start resolution test (no active execution context) must pass on every release
        - Observability: All resolution failures are flagged as critical constitutional violations
    - clause_id: W-CONST-002
      clause: "Work and Execution are structurally distinct - Work lifecycle is completely decoupled from Execution lifecycle to survive process death"
      enforcement:
        - Type system: Separate Work and ExecutionContext types with no inheritance
        - Storage: Work records persist indefinitely; Execution records are temporary
        - Runtime: No execution termination logic may delete or invalidate a Work
    - clause_id: W-CONST-003
      clause: "Work identity may never be derived from transient properties (actor_id, session_id, execution_id, context_trace_id) to preserve independent addressability"
      enforcement:
        - Codebase audit: No workId generation may hash/concatenate transient properties
        - Type system: workId is always caller-provided, never generated by runtime from transient state
    - clause_id: W-CONST-004
      clause: "Work must tolerate external uncertainty - Work remains valid/addressable when external effects enter UNKNOWN state"
      enforcement:
        - Idempotency state machine is separate from Work identity
        - No garbage collection logic may delete Work due to UNKNOWN state
        - Re-entry must be allowed for Works in UNKNOWN state
    - clause_id: W-CONST-005
      clause: "Work must preserve causal lineage - all state transitions to a Work's state must be logged to the same workId with proper parent-child causal links"
      enforcement:
        - execution-observability.ts: All executions for a decision_id must share the same logicalWorkId
        - verifyWorkIdCorrelation() must run on every Work attachment
    - clause_id: W-CONST-006
      clause: "Lineage must explain Work, but never be a requirement to find Work - lineage reconstruction is never mandatory for address resolution"
      enforcement:
        - Repository layer: byId(id) may never require lineage context as a parameter
        - P9-style independent lookup test must run on every release
    - clause_id: W-CONST-007
      clause: "All associated properties of a Work (actors, authority, capabilities, executions, artifacts, evidence) may evolve - only referential continuity is constitutionally protected"
      enforcement:
        - No runtime restrictions on updating associated transient properties
        - Constitution only prohibits changes that break referential addressability, not evolution of Work's associated state

  evidence_references:
    - fpa01: "/governance/fpa/fpa-01-fundamental-primitive-audit.yaml"
    - fpa02: "/governance/fpa/fpa-02-primitive-consequence-audit.yaml"
    - p8_evidence: "/.eos-state/evidence/P8-EXPERIMENT-1787300761739-evidence.json"
    - p9_evidence: "/.eos-state/evidence/P9-EXPERIMENT-1787300761740-evidence.json"
    - p5p6_evidence: "/.eos-state/evidence/P5-P6-re-verification-20260821.json"
    - c21_evidence: "/governance/certification/c21-external-ambiguity-evidence.yaml"

  next_steps:
    - "Constitutional review period: 3 business days"
    - "Straw poll among governance agents to ratify proposal"
    - "If ratified, merge clauses into eos-constitution.yaml as permanent platform rules"
    - "Enforce clauses in CI/CD pipeline: all code changes must violate no Work primitive invariants"
    - "Add Work primitive verification to the Foundation certification gate"