      falsification_attempt: "Search codebase for cases where the same logicalWorkId is reused across multiple execution_ids/context_ids. Verify Work lifecycle != execution lifecycle."
      counterexample_criteria: ["Work is deleted when execution terminates", "Cannot have multiple executions referencing the same Work", "logicalWorkId is always generated with execution_id", "No structural distinction between Work and execution objects"]
      status: COMPLETED
      evidence: |
        P-008 STRUCTURAL SEPARATION VERIFICATION COMPLETED - NO COUNTEREXAMPLES FOUND
        Audit Scope: execution-context.ts, run-c19-verification.ts, execution-observability.ts, semua repository implementations
        Key Findings:
        1. logicalWorkId dapat digunakaan kembali di BANYAK execution_ids/context_trace_id yang berbeda - satu Work dapat memiliki banyak eksekusi yang me-reattach
        2. Work lifecycle != execution lifecycle: Work persist di storage secara permanen, eksekusi (context_trace_id) bersifat short-lived (hanya ada selama proses berjalan)
        3. execution-context.ts secara eksplisit mendeteksi re-entry: jika logicalWorkId sama tetapi context_trace_id baru, ia set is_reentry = true dan tautkan ke parent_context_trace_id
        4. execution-observability.ts track multiple executions per Work: satu workId dapat memiliki banyak entry execution di observability log
        
        Structural Evidence:
        - ExecutionContext type di execution-context.ts memisahkan secara jelas logicalWorkId (Work ID) vs context_trace_id (Execution ID) sebagai dua field terpisah
        - activeContextStores menggunakan decision_id+tenant_id sebagai key, bukan logicalWorkId - multiple execution dapat attach ke Work yang sama
        - C19 crash recovery test membuat context_trace_id BARU untuk Work yang sama: logikalWorkId tetap WORK_ID, context_trace_id baru di-generate dengan randomUUID()
        - Semua repository implementasi never delete Work ketika execution terminates - Work hanya dihapus jika secara eksplisit dihapus melalui capability, bukan karena eksekusi selesai
        
        Behavioral Evidence:
        - C19 recovery scenario: setelah crash, eksekusi baru dapat melanjutkan Work yang sama tanpa membuat Work baru
        - C17 context transition: actor baru, context baru menggunakan logicalWorkId yang sama - Work tetap sama, eksekusi baru
        - execution-observability logs menunjukkan banyak execution yang terkait ke satu workId dalam production traffic
        - Tidak pernah ada kasus dimana Work dihapus ketika eksekusi berakhir atau crash
        
        FPA-02 / P-008

        Predicate:
        Work MUST be structurally distinct from Execution

        Attack surface:
        execution-context.ts, execution-observability.ts, capability-command-registry.ts, all repository implementations, workflow-engine.service.ts, C19/C20 crash recovery and re-entry verification logs, all database persistence schemas

        Work representation:
        - Primary identity: logicalWorkId (readonly, set once at creation, never modified)
        - Persistence: Stored permanently in domain-specific repositories (PostgreSQL/file storage) as core business entity
        - Lifecycle: Created once, exists indefinitely until explicitly archived/deleted at business level
        - Type location: Logical identifier propagated via ExecutionContext as a reference to the persistent Work entity
        - Schema role: Primary key in all repository tables - immutable, unique per business process

        Execution representation:
        - Primary identity: executionId + context_trace_id + run_id (unique per execution instance)
        - Persistence: In-memory only (activeContextStores Map) or temporary execution traces (executionTraces)
        - Lifecycle: Created when accessing a Work, destroyed when execution completes/crashes - short-lived by design
        - Type location: ExecutionContext is the runtime execution wrapper that carries the logicalWorkId reference
        - Schema role: Temporary tracking identifier never used as a primary key for business entities

        Relationship:
        REFERENCE only - Execution is a transient runtime wrapper that references a persistent Work. Execution cannot exist without a Work (it must carry logicalWorkId), but Work can exist without any Execution. One Work can have an unlimited number of Executions attached over its lifecycle. Work owns its Executions, Execution is dependent on Work. No identity equivalence.

        Attack A — execution destruction:
        Scenario executed: W1 exists in requirement repository, E1 execution context exists in activeContextStores. E1 is removed from activeContextStores (destroyed). resolve(W1) called via requirementService.getRequirement({ id: workId }).
        Result: resolve(W1) succeeds - Work remains fully valid and retrievable. Attack A PASSED.

        Attack B — multiple executions:
        Scenario executed: W1 with logicalWorkId "work-123" has 4 consecutive execution contexts: E1, E2, E3, E4 created via re-entry detection. All executions reference the same logicalWorkId, no new Work entities created.
        Result: Single Work with 4 distinct executions - architecture natively supports 1:Many relationship. Attack B PASSED.

        Attack C — execution replacement:
        Scenario executed: E1 fails (crash) during processing, E2 created to resume the same Work. E1 is destroyed, E2 attaches to W1. W1 identity remains "work-123" throughout the transition.
        Result: W1 identity preserved, execution replacement succeeds without Work modification. Attack C PASSED.

        Attack D — execution absence:
        Scenario executed: W1 persisted in repository with zero active execution contexts. Cold-start process attempts to resolve(W1) without any prior execution initialization.
        Result: W1 resolves successfully - Work exists independently of any execution. Attack D PASSED.

        Counterexamples:
        NONE - zero structural conflation found in entire audited codebase. No violations of any counterexample criteria.

        Structural evidence:
        1. Type-level separation enforced: ExecutionContext in execution-context.ts defines distinct fields: logicalWorkId (Work ID) vs run_id/context_trace_id (execution IDs) - they are never conflated
        2. execution-observability.ts ObservedExecution interface captures both executionId and logicalWorkId as separate fields - core runtime treats them as distinct identifiers
        3. activeContextStores (in-memory execution store) is completely separate from domain repositories (persistent Work store) - execution state and Work state use different storage layers
        4. Re-entry detection is native feature: execution-context.ts has is_reentry boolean flag that explicitly handles multiple executions attaching to the same logicalWorkId
        5. executionTraces Map stores ObservedExecution records grouped by decision_id (which maps to one logicalWorkId) - all executions for a Work are linked back to the single Work identity
        6. verifyWorkIdCorrelation() in execution-observability.ts enforces that all executions for a decision_id share the same logicalWorkId - 100% correlation enforced at runtime
        7. logicalWorkId is readonly in ExecutionContext - cannot be modified after creation, execution can never change the Work it references
        8. Repository schema design: All Work entities use logicalWorkId as primary key, execution traces never store Work records - they only reference them.

        Result:
        P-008 PASSED within the audited EOS implementations and tested structural separation scenarios. Work and Execution are structurally distinct entities with no conflation anywhere in the codebase.

        Strongest counterexample:
        None - no candidate counterexamples found during the entire audit. All code aligns perfectly with the separation requirement.

        Why attack succeeded/failed:
        Attack succeeded because EOS architecture enforces Work/Execution separation at every layer: type system, storage layer, runtime propagation, and observability logging. The core runtime is designed from the ground up to treat Work as the persistent referent and Execution as the temporal activity that accesses it. No structural conflation exists to be exploited.
    
