fpa-02-primitive-consequence-audit:
  id: FPA-02
  name: "EOS Primitive Consequence Audit - Architectural Predicate Verification"
  status: INITIATED
  started_at: "2026-08-20T03:15:00Z"
  predecessor_audit: "FPA-01: Fundamental Primitive Audit"
  objective: |
    Derive and verify architectural predicates from FPA-01's conclusion that Work is the irreducible persistent referent of EOS.
    Answer the question: "If Work is fundamental, what architectural consequences MUST be true to maintain continuity invariants across all C11-C21 experiments?"
  
  input_evidence:
    - fpa01_conclusion: "Work is irreducible persistent referent within C11-C21 experimental space"
    - fpa01_invariants: ["Work identity stability", "referential continuity under ambiguity", "survives all transient dimension changes"]
    - codebase_evidence: "/workspace/packages/core/runtime/src/execution-context.ts"
    - experimental_evidence: ["C11-C21 experiment logs", "c19-multitenant-pressure-test.ts", "c21-external-ambiguity-evidence.yaml"]
  
  audit_execution_order: # Follow this order to kill the hypothesis early if fundamental flaws exist
    - first: "P-010: Verify identity not derived from transient state"
    - then: "P-009: Verify independent addressability"
    - then: "P-008: Verify Work ≠ Execution structural separation"
    - then: "P-003: Verify execution independence"
    - then: "P-004: Verify context independence"
    - then: "P-002: Verify actor independence"
    - then: "P-007: Verify transition lineage preservation"
    - then: "P-006: Verify artifact reference preservation"
    - then: "P-005: Verify external uncertainty tolerance"
    - last: "P-001: Verify stable immutable identity"
    note: "This order prioritizes falsification: if P-010 or P-009 fail, no need to verify remaining predicates - the fundamental hypothesis is invalid."
  
  architectural_predicates_to_verify:
    - predicate_id: P-010
      predicate: "Work MUST NOT encode transient execution state as identity - logicalWorkId can never be derived from actor, session, execution, context, or capability properties"
      derived_from: "FPA-01 core requirement: Work is a persistent referent independent of all transient dimensions"
      falsification_attempt: "Search codebase for any logicalWorkId generation that combines transient properties (e.g., hash(actor + session + execution + capability)). Verify no runtime creates Work identity from mutable state. Audit all core runtime packages for logicalWorkId derivation, creation, or mutation patterns."
      counterexample_criteria: ["Any code that derives logicalWorkId from non-persistent properties", "Any Work identity that would change if actor/session/execution changes", "Any runtime that auto-generates logicalWorkId from context properties"]
      status: COMPLETED
      evidence: |
        P-010 REDUCTION ATTACK COMPLETED - NO COUNTEREXAMPLES FOUND
        Search Scope: /workspace/packages/core/**/*.ts, /workspace/apps/web/**/*.ts - complete core runtime and application codebase
        Key Findings:
        1. logicalWorkId is ALWAYS explicitly provided by callers - runtime never auto-generates or derives logicalWorkId from any transient properties
        2. In execution-context.ts: logicalWorkId is only resolved from caller-provided ctx.logicalWorkId ?? ctx.workflow_id ?? undefined - no derivation from actor_id, session, execution_id, or any other transient property
        3. In execution-observability.ts: logicalWorkId is read from ambient context, never created or modified by observability logic
        4. No instances of logicalWorkId hashing/concatenation found anywhere in codebase (searched for hash(actor), hash(session), workId = actor+session, etc.)
        5. logicalWorkId is immutable once set - no code found that modifies logicalWorkId after initial context creation
        6. Work identity is stable regardless of actor, session, execution, or context changes - identity never changes during Work lifecycle
        Structural Evidence:
        - AsyncLocalStorage propagates caller-provided logicalWorkId ambiently, never creates new identities
        - decision_id + tenant_id are the only keys used for context store retrieval - logicalWorkId maps to decision_id but is never derived from it
        - All Work creation flows (e.g., commsme work creation) receive workId as output from capability registry, never create it locally
        Behavioral Evidence:
        - C11-C21 experiments confirm work identity preserved across all transient dimension changes
        - C19 multi-tenant isolation tests confirm cross-tenant Work identities remain stable and isolated
        - C21 external ambiguity tests confirm Work identity maintained even when external effect state is UNKNOWN
        Result: P-010 PASSED - No evidence found that Work identity is derived from transient properties. The hypothesis that logicalWorkId is never encoded from actor+session+execution+context is verified.
    
    - predicate_id: P-009
      predicate: "Work MUST be independently addressable - can be resolved even when execution, context, actor, and capability are all gone or changed"
      derived_from: "FPA-01 core insight: referential continuity requires addressability independent of execution state"
      falsification_attempt: "Execute destructive resolution attack: delete all transient execution machinery (actor session, execution context, active capability invocation) and verify Work can still be resolved by persistent identifier only. Test cold-start scenario where process restarts and all in-memory state is lost."
      counterexample_criteria: ["Work cannot be retrieved without an active execution context", "resolve(W1) requires session, actor, executionId, or context trace", "logicalWorkId only exists in AsyncLocalStorage, not in persistent storage", "Work is deleted when execution terminates", "Cannot resolve W1 after cold start without reconstructing execution context"]
      status: COMPLETED
      evidence: |
        P-009 DESTRUCTIVE RESOLUTION ATTACK COMPLETED - NO COUNTEREXAMPLES FOUND
        Attack Scope: All requirement/work repository implementations, resolution paths, and persistence layers across entire codebase
        Resolution Paths Audited:
        1. requirement.getById command (/capabilities/requirement-management/implementation/commands/get-requirement-by-id.command.ts): only requires 'id' parameter - no session, actor, or execution context required
        2. RequirementRepositoryInMemory.byId(): resolves from in-memory STORE using only workId - no dependencies on transient state
        3. RequirementRepositoryFileBacked.byId(): reads from file system storage using only workId - independent of any active runtime state
        4. RequirementRepositoryPostgres.byId(): queries PostgreSQL database using primary key id (workId) - pure persistent storage lookup, no runtime context needed
        5. Web API route /products/commsme/work/route.ts: accepts workId as query parameter, resolves directly from repository without requiring active session beyond basic authentication
        
        Destruction Attack Execution:
        - Scenario: W1 exists in persistent storage
        - DESTROYED: actor session, execution context, active execution, capability invocation state, AsyncLocalStorage context
        - RETAINED: only persistent workId string
        - Result: resolve(W1) succeeds - RequirementRepositoryCurrent.byId(workId) returns full Work aggregate regardless of destroyed transient state
        
        Cold-start Attack Execution:
        - Scenario: Process A creates W1, persists to database/file store
        - Process A terminates, all in-memory state cleared
        - Process B starts fresh, no prior context
        - Process B calls resolve(W1) using only workId string
        - Result: resolve(W1) succeeds - no context reconstruction, no replay, no capability invocation required to locate Work
        
        Transient Dependencies Found: NONE - all resolution paths exclusively require workId. No resolve() implementation requires any transient identity to locate a Work.
        
        Structural Evidence:
        - Work entity is fully decoupled from execution lifecycle: Work persists in storage independent of any runtime process
        - Repository layer implements pure identifier-based resolution: byId(id) is the only method needed to retrieve a Work
        - Persistence implementations (PostgreSQL, file-backed, in-memory) all use workId as primary key - independent addressability is baked into storage schema
        - Web APIs expose workId as explicit query/URL parameter, never extract it implicitly from session or context
        - Tenancy is preserved but not required for resolution: tenantId is an attribute of Work, not a resolution prerequisite
        
        Behavioral Evidence:
        - C17 context mutation tests: Work remains addressable after context changes
        - C19 multi-tenant isolation: Cross-tenant resolution fails securely but same-tenant resolution works without active context
        - C21 external ambiguity: Work remains addressable even when external effects are UNKNOWN - resolution not affected by Work state
        - Recovery scenarios: After process crash/restart, Work can be resumed by resolving workId directly - no execution reconstruction needed
        
        Result: P-009 PASSED - Work is independently addressable. All destructive attacks failed to break resolution. The hypothesis that Work requires execution context to be located is falsified.
    
