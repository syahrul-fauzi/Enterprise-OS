        - parent_context_trace_id is REQUIRED for all re-entry executions - every new execution links back to the previous one, maintaining an unbroken causal chain
        - CausalTraceView.tsx renders complete transformation trace for a requirementId (which maps to logicalWorkId) - all state changes, evidence, and artifacts are linked to the same Work
        
