  status: COMPLETED
  started_at: "2026-08-20T00:00:00Z"
  completed_at: "2026-08-20T01:30:00Z"
  hypothesis: |
    Work can maintain stable identity across external boundary (world-facing execution)
    while handling ambiguity Case B: DB commit → external call executed → response lost → crash
    without producing duplicate side effects. No new abstractions required - existing idempotency primitive sufficient.
  evidence:
    recon_findings:
      existing_external_effect_primitive: "idempotencyStates (tenant-isolated Map in capability-command-registry) + circuitBreakerStates + concurrencyStates"
      existing_operation_identity: "ambient workId, ambient idempotency_key, externalReferenceId tracking"
      existing_idempotency_mechanism: "PRE-EXISTING idempotency filter + extended state machine: PREPARED→DISPATCHED→ACKNOWLEDGED/FAILED|UNKNOWN"
      existing_retry_mechanism: "calculateExponentialBackoff from @repo/core-runtime + full circuit breaker with half-open state"
      existing_execution_receipt: "transitionHistory in every IdempotencyEntry with full audit trail"
      existing_observability: "state transition logging + webhook evidence store + execution context tracing"
      existing_persistence_boundary: "tenant-isolated in-memory stores + disk-persisted webhook evidence"
      existing_recovery_mechanism: "DISPATCHED→UNKNOWN transition on recovery to block automatic retries"
      can_tie_to_workid: true
      can_tie_to_decisionid: true
      can_tie_to_executionid: true
      can_tie_to_artifactversion: true
      failure_states_implemented:
        prepared: true
        dispatched: true
        acknowledged: true
        unknown: true
        failed: true
      missing: "NONE - all required primitives already existed. Only minimal extensions to idempotencyStates."
      falsification_boundary: "If during recovery of Case B, system retries automatically → FAIL. If system marks as UNKNOWN requiring manual reconcile → PASS"
      verdict: "PASSABLE"
    invariants_verification:
      - invariant: "Work identity (W1 preserved across all boundaries)"
        required: "W1"
        status: "PASS"
        evidence: "executionContext.logicalWorkId preserved across all invocations, never modified"
      - invariant: "Persisted state exactly once"
        required: "exactly once"
        status: "PASS"
        evidence: "idempotency filter returns cached results for completed states, prevents duplicate execution"
      - invariant: "External operation distinguishable"
        required: "distinguishable"
        status: "PASS"
        evidence: "externalSystem + externalReferenceId tracked in IdempotencyEntry, unique per external call"
      - invariant: "Crash after external execution handled"
        required: "handled"
        status: "PASS"
        evidence: "DISPATCHED state during recovery transitions to UNKNOWN, blocking automatic retry"
      - invariant: "Duplicate side effect = 0"
        required: "0 or explicitly idempotent"
        status: "PASS"
        evidence: "markExternalCallDispatched() only allows dispatch from PREPARED/UNKNOWN states"
      - invariant: "Recovery context fresh"
        required: "fresh"
        status: "PASS"
        evidence: "executionContext.get() called on every invoke, re-computes all context values"
      - invariant: "Authorization recomputed"
        required: "recomputed"
        status: "PASS"
        evidence: "session validation runs on every invocation, checks for revoked/expired sessions"
      - invariant: "Evidence complete"
        required: "complete"
        status: "PASS"
        evidence: "transitionHistory tracks every state change with timestamp and reason"
      - invariant: "Retry deterministic"
        required: "deterministic"
        status: "PASS"
        evidence: "Uses core-runtime's calculateExponentialBackoff, same sequence every time"
      - invariant: "Work reconstruction = 0"
        required: "0"
        status: "PASS"
        evidence: "Original W1 preserved throughout all state transitions, never creates new work"
      - invariant: "Artifact duplication = 0"
        required: "0"
        status: "PASS"
        evidence: "concurrencyStates block concurrent modifications to same artifact"
      - invariant: "Tenant/workspace leakage = 0"
        required: "0"
        status: "PASS"
        evidence: "All state store keys include tenantId, cross-tenant access blocked by session validation"
    case_b_verification:
      scenario: "DB commit → external call executed → external response lost → crash → recovery"
      handled: true
      implementation: |
        1. W1 executes, calls markExternalCallDispatched() → state: DISPATCHED
        2. EOS crashes before webhook received
        3. Recovery triggers invoke() on same idempotency key
        4. invoke() detects state = DISPATCHED → transitions to UNKNOWN
        5. Cannot retry until human operator reconciles external state manually
        6. Prevents duplicate side effects that would occur with blind retries
      code_reference:
        - "packages/core/kernel/src/registry/capability-command-registry.ts:L344"
        - "apps/web/app/api/external-webhooks/commsme/government/route.ts:L47"
    fundamental_primitive_question:
      question: "Is idempotency key more fundamental than Work?"
      analysis: |
        No. idempotency key is a property OF Work, not a replacement. Work remains the continuity anchor
        that ties together: idempotency state, execution context, actor identity, capability boundaries,
        and external effect tracking. The idempotency state machine is an extension OF Work's properties,
        not a separate primitive.
      conclusion: "Work remains the fundamental continuity substrate. idempotency key is a Work property."
