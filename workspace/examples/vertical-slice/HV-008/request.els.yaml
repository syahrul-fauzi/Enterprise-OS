business_statement:
  title: "$2.4M Cross-Org Supply Chain Dispute Resolution"
  description: >
    Menyelesaikan Work disputasi barang ekspor bernilai $2.4M yang melibatkan 6 pihak dari organisasi berbeda:
    1. Buyer (importir di Jerman)
    2. Supplier (produsen di Indonesia)
    3. Logistics (perusahaan pengiriman internasional)
    4. Customs (bea cukai kedua negara)
    5. Insurer (perusahaan asuransi barang)
    Work ini harus melewati 6 boundary yang berbeda (organization, domain, authority, execution_provider, settlement, surface)
    namun Work W-003 harus tetap coherent dengan identity, authority, evidence, dan continuity yang terjaga.
    Ini adalah bukti pertama EOS sebagai economic resolution substrate di era RESOLUTION.
  origin: "eos_war_room_strategic_directive"
  compliance:
    - "primitive_reuse_100_percent"
    - "no_duplicate_work"
    - "architecture_freeze_compliance"
    - "evidence_truth_separation"
    - "all_transitions_require_valid_authorization"

capability_refs:
  - capability_id: "CAP-WORK-001"
    capability_name: "work-identity-preservation"
    purpose: "Menjaga ID W-003 tetap invariant sepanjang semua transisi boundary"
  - capability_id: "CAP-AUTH-004"
    capability_name: "cross-boundary-authority-transfer"
    purpose: "Memastikan setiap perubahan actor memiliki otoritas yang valid dari semua pihak"
  - capability_id: "CAP-EVID-002"
    capability_name: "evidence-chain-compilation"
    purpose: "Menyusun rantai evidence lengkap dari setiap keputusan dan transisi"
  - capability_id: "CAP-SETTLE-001"
    capability_name: "settlement-execution"
    purpose: "Menjalankan settlement akhir sesuai keputusan bersama semua pihak"
  - capability_id: "CAP-VERIFY-003"
    capability_name: "economic-outcome-verification"
    purpose: "Memverifikasi outcome ekonomi dapat diterima oleh semua stakeholder"

acceptanceCriteria:
  - "economic_resolution_loop_fully_functional"
  - "settlement_outcomes_verifiable_by_all_parties"
  - "primitive_reuse_remains_100_percent"
  - "no_duplicate_work_implementation"
  - "cross_boundary_continuity_preserved"
  - "all_transitions_have_valid_actor_authority"
  - "economic_gravity_verified_2_4M_usd"
  - "replayability_produces_identical_outcome"