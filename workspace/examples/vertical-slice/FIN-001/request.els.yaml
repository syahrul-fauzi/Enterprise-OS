business_statement:
  title: "Cross-Border Settlement Resolution Commercial Validation"
  description: >
    FIN-001 is the first commercial validation slice for EOS Phase 4: test whether EOS can resolve economically consequential cross-border settlement Work across external provider boundaries while preserving core continuity/resolution lineage. EOS owns Work identity, continuity, resolution lineage, authority context, evidence lineage, execution coordination, outcome linkage, and settlement state as derived/verified fact — but does NOT own bank, payment rail, FX truth, AML/KYC truth, customs truth, legal truth, fund custody, or regulatory authority.
  origin: "Phase 4 Commercial Validation Mandate"
  compliance:
    - "0 new core primitive allowed"
    - "0 new platform layer allowed"
    - "0 duplicate primitive allowed"
    - "only domain adapter/provider adapter/projection/validation logic may be added"
    - "Rule of Two enforced for any candidate primitive"

capability_refs:
  - capability_id: "CAP-ATOMIC-003"
    capability_name: "payment-processing"
    purpose: "Reuse existing Midtrans payment processing capability for cross-border settlement execution"
  - capability_id: "CAP-WORK-CORE-001"
    capability_name: "work-boundary-validation"
    purpose: "Reuse work-core boundary validation utilities for L1 EOS proof checks"
  - capability_id: "CAP-CONNECTOR-007"
    capability_name: "midtrans-webhook-handler"
    purpose: "Reuse connector-ecosystem Midtrans webhook handler for external status reconciliation"
  - capability_id: "CAP-PRODUCT-002"
    capability_name: "evidence-management"
    purpose: "Reuse product-delivery evidence management functions for outcome verification"

acceptanceCriteria:
  - "L1 EOS proof passes: Work identity, Authority, Continuity, Evidence lineage, Resolution chain, Replayability all verified"
  - "L2 External execution proof passes: External provider invoked, response captured, bound to Work, no duplicate mutation, external status reconciled"
  - "L3 Commercial proof requirements identified: Real organization, Real authorized actor, Real operational Work, Real external transaction, Real economic consequence, Willingness-to-pay signal"
  - "Single active production slice rule enforced: HV-008 archived, FIN-001 only active slice"
  - "91.67% primitive reuse achieved with only 1 MINIMAL FIX required"
  - "EOS core differentiator preserved: Evidence ≠ truth, Execution ≠ outcome, Outcome ≠ finality"