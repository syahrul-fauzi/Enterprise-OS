id: workspace-standard
name: Standard Base Workspace
description: Root composition package that provides core EOS primitives for all workspaces. Serves as the foundation for every other composition in the system, defining the base patterns, capabilities, and surfaces that all work inherits. Preserves work invariants and enforces Work Continuity substrate requirements across all use cases.
version: "1.0.0"
domain: core
industry: cross-industry
jurisdictions:
  - global
tags:
  - base-composition
  - core-primitives
  - work-continuity
  - invariant-preservation
reuseCount: 5 # Currently used by legal-workspace, work-template-core, doc-standard-compose, gov-api-standard, pt-establishment
firstIntroduced: "2026-09-29"
maintainers:
  - eos-core-team
dependencies:
  - work-core@>=1.0.0
reuse_targets:
  - ALL_COMPOSITIONS # This is the root base package used by every other composition
compliance:
  work_invariant_preserved: true
  architecture_freeze_compliant: true
  no_new_core_primitives: true
  rule_of_two_satisfied: true # Used by 5+ compositions already, satisfies Rule of Two with extreme reuse
  dependency_violations: 0
  work_continuity_strengthened: true # Enforces the fundamental Work Continuity substrate across all EOS operations