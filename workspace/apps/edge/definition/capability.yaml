id: apps-edge
name: EOS Edge Runtime
version: 0.1.0
owner: edge-domain
status: ACTIVE
introduced: "2026-09-26"
provides:
  - edge-runtime
  - device-context
  - local-execution
  - offline-continuity
  - state-hydration
purpose: Device-side runtime surface yang memperluas Work Continuity dari EOS Core ke lingkungan eksekusi lokal perangkat.
manifest_version: 1.0.0
exports:
  - EdgeRuntime
  - ContextAcquisition
  - StateHydration
  - NativeExecution
implementation:
