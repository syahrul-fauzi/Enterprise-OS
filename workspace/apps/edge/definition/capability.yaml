  owner: edge-domain
  purpose: Execution surface untuk perangkat lokal — mengimplementasikan Work Continuity di sisi perangkat tanpa mendefinisikan ulang Work semantics.
  consumers:
    - apps-web
    - apps-api
    - agent-orchestration
  maturity:
    level: experimental
  lifecycle:
    state: active
  evidence_required:
    - cross_surface_work_persistence
    - offline_state_reconciliation
    - device_context_normalization
    - native_execution_evidence_tracking
  stability: experimental