version: "1.0.0"
status: FROZEN
kind: CONTRACT
contract_kind: INTERMEDIATE_REPRESENTATION_CONTRACT
ir_id: CONSTITUTION_IR
ir_format_version: "1.0.0"
ir_abbreviation: CONSTIT-IR
evolution_domain: DOMAIN-B-SPECIFICATION
ssot_note: CONSTITUTION_IR_IS_THE_COMPILED_FORM_OF_THE_EOS_CONSTITUTION._INPUT_SOURCE_FILES = CONSTITUTIONAL-VISION.yaml + ARCHITECTURAL-STABILITY-PRINCIPLES.yaml (ASP+MP01) + INVARIANT-ARCHITECTURE.yaml (IA-01..14) + EVOLUTION-DOMAINS.yaml + PROTOCOL-GOVERNANCE.yaml. OUTPUT of Constitutional Compiler. This is the Stable IR that all future verifiers / protocol rule generators / compatibility matrix generators consume so they do NOT parse the constitution prose directly. This is IA-13 Stable IR equivalent for the Constitutional layer.
governance_ref:
  vision: /root/Enterprise-OS/governance/CONSTITUTIONAL-VISION.yaml
  asp_mp01: /root/Enterprise-OS/governance/ARCHITECTURAL-STABILITY-PRINCIPLES.yaml#MP-01
  ia13: /root/Enterprise-OS/governance/INVARIANT-ARCHITECTURE.yaml#principle_13_stable_intermediate_representations
  ia14: /root/Enterprise-OS/governance/INVARIANT-ARCHITECTURE.yaml#principle_14_pure_compiler_passes
  protocol_governance: /root/Enterprise-OS/governance/PROTOCOL-GOVERNANCE.yaml
  conformance_properties: /root/Enterprise-OS/governance/CONFORMANCE-PROPERTIES.yaml
  arch_rule_manifest: /root/Enterprise-OS/governance/ARCH-RULE-GENERATION.manifest.yaml
  constitutional_compiler_spec: /root/Enterprise-OS/enterprise/specifications/CONSTITUTIONAL-COMPILER.spec.yaml
  constitutional_verifier_pipeline: /root/Enterprise-OS/enterprise/specifications/CONSTITUTIONAL-VERIFIER.pipeline.yaml
  protocol_compilation_spec: /root/Enterprise-OS/enterprise/specifications/PROTOCOL-COMPILATION.spec.yaml
  authority_dag_schema: /root/Enterprise-OS/enterprise/schema/AUTHORITY-DAG.schema.yaml
  artifact_schema: /root/Enterprise-OS/enterprise/schema/artifact.schema.yaml
derived_from:
  - User_Point_Constitution_IR_From_Vision_ASP_IA
  - User_Point_Architecture_Rules_Generated_Not_Manual
  - User_Point_Constitutional_Verifier_Instead_of_Arch_Check
  - User_Point_Authority_Flow_DAG_Official
  - User_Point_Protocol_Governance_Compiled_Not_Manual
  - User_Point_Evolution_Domains_As_Type_System_Not_Policy
  - User_Point_Conformance_Properties_Not_Binary_Pass_Fail

constitution_source_inputs:
  ordered:
    - /root/Enterprise-OS/governance/CONSTITUTIONAL-VISION.yaml
    - /root/Enterprise-OS/governance/ARCHITECTURAL-STABILITY-PRINCIPLES.yaml
    - /root/Enterprise-OS/governance/INVARIANT-ARCHITECTURE.yaml
    - /root/Enterprise-OS/governance/EVOLUTION-DOMAINS.yaml
    - /root/Enterprise-OS/governance/PROTOCOL-GOVERNANCE.yaml
    - /root/Enterprise-OS/governance/CONFORMANCE-MODEL.yaml
    - /root/Enterprise-OS/governance/CONFORMANCE-PROPERTIES.yaml
  compile_purity:
    statement: "Constitutional Compiler (pass 1-5 below) is a pure function of these inputs only. No env vars, no network, no timestamps in hashable fields. MP-01 Computable Governance."
  compilation_hash_anchor:
    merkle_root_of_sorted_hash_inputs: >
      ir_content_hash input list = sorted list of (each source file path + SHA-256 of canonical YAML content).
      Constitutional Compiler SHALL produce byte-identical CONSTIT-IR for identical content inputs (version bumps without semantic change may be PATCH only).

constitution_ir_sections_required:
  header:
    mandatory: true
    fields:
      - field: ir_format_version
        type: semver
      - field: ir_content_hash
        type: sha256
      - field: constitution_sources_sha256_merkle_root
        type: sha256
      - field: constitutional_compiler_version
        type: semver
      - field: vision_version
        type: literal "1.0.0" (Vision is immutable; changes to vision would NOT be compiled but trigger FOUNDATION charter rewrite)
      - field: produced_at_utc
        note: DIAGNOSTICS ONLY, EXCLUDED from ir_content_hash.
      - field: passes_applied
        type: array
        values:
          - CC-PASS-1-DOMAIN-TYPING
          - CC-PASS-2-AUTHORITY-DAG
          - CC-PASS-3-BOUNDARY-RULES
          - CC-PASS-4-VERIFICATION-RULE-GEN
          - CC-PASS-5-COMPAT-MATRIX-GEN

  type_system_section:
    mandatory: true
    ir_field: evolution_domain_types
    description: "Evolution Domains as TYPE SYSTEM (per user point 6), elevated to Authority-Oriented Architecture (per TF-1). Not policy strings — machine-checkable type error on import/mutation mismatch. Canonical enumeration = artifact.schema.yaml#artifact_type.type_name (now 19 types, 4 domains, 4 Evidence sub-layers). Any import/mutation violation → TYPE_ERROR (not policy review). Authority Pipeline: AUTHORITY→INTERPRETATION→DECISION→EXECUTION→EVIDENCE stages embedded via authority_stage_index 0..4 inside every type definition."
    type_system_contract_anchor: /root/Enterprise-OS/enterprise/schema/artifact.schema.yaml#artifact_type
    terminology_freeze_ref: governance/TERMINOLOGY-FREEZE-TF1.yaml
    ia17_authority_preservation_ref: governance/INVARIANT-ARCHITECTURE.yaml#IA-17-AUTHORITY-PRESERVATION
    enforcement_in_verifier: CONST-VERIF Stage 1 (CV-TYPE-01 import, CV-TYPE-02 mutate, CV-TYPE-03 unclassified) + CV-STAGE-2 AUTHORITY_GAIN_TYPE_ERROR scan
    types:
      - type_name: CONSTITUTIONAL_VISION
        evolution_domain: DOMAIN-A-CONSTITUTION
        authority_level_index: 0
        authority_stage: AUTHORITY
        deprecated_aliases: []
        type_rules:
          - cannot_import_type: [SPECIFICATION, PROTOCOL, CONTRACT, TRANSFORMATION_MANIFEST, PREDICATE_MANIFEST, DECISION_REPRESENTATION, KNOWLEDGE_REPRESENTATION, EXECUTION_REPRESENTATION, IMPLEMENTATION_MODULE, IMPLEMENTATION_TOOLING, EVIDENCE_PROOF, EVIDENCE_LEDGER, CONFORMANCE_REPORT, VERDICT, GENERATED_ARTIFACT]
          - cannot_mutate: true
          - can_be_imported_by: [CONSTITUTION_PRINCIPLE, CONSTITUTION_INVARIANT, CONSTITUTION_POLICY]
      - type_name: CONSTITUTION_PRINCIPLE
        evolution_domain: DOMAIN-A-CONSTITUTION
        authority_level_index: 1
        authority_stage: AUTHORITY
        deprecated_aliases: []
        type_rules:
          - can_import_type: [CONSTITUTIONAL_VISION]
          - cannot_import_type: [PROTOCOL, CONTRACT, TRANSFORMATION_MANIFEST, PREDICATE_MANIFEST, DECISION_REPRESENTATION, KNOWLEDGE_REPRESENTATION, EXECUTION_REPRESENTATION, IMPLEMENTATION_MODULE, IMPLEMENTATION_TOOLING, EVIDENCE_PROOF, EVIDENCE_LEDGER, CONFORMANCE_REPORT, VERDICT, GENERATED_ARTIFACT]
          - cannot_mutate: true
          - can_be_imported_by: [CONSTITUTION_INVARIANT, CONSTITUTION_POLICY, SPECIFICATION]
      - type_name: CONSTITUTION_INVARIANT
        evolution_domain: DOMAIN-A-CONSTITUTION
        authority_level_index: 2
        authority_stage: AUTHORITY
        deprecated_aliases: []
        type_rules:
          - can_import_type: [CONSTITUTIONAL_VISION, CONSTITUTION_PRINCIPLE]
          - cannot_import_type: [CONTRACT, TRANSFORMATION_MANIFEST, PREDICATE_MANIFEST, DECISION_REPRESENTATION, KNOWLEDGE_REPRESENTATION, EXECUTION_REPRESENTATION, IMPLEMENTATION_MODULE, IMPLEMENTATION_TOOLING, EVIDENCE_PROOF, EVIDENCE_LEDGER, CONFORMANCE_REPORT, VERDICT, GENERATED_ARTIFACT]
          - cannot_mutate: true
          - can_be_imported_by: [CONSTITUTION_POLICY, SPECIFICATION, PROTOCOL, CONTRACT]
      - type_name: CONSTITUTION_POLICY
        evolution_domain: DOMAIN-A-CONSTITUTION
        authority_level_index: 3
        authority_stage: AUTHORITY
        deprecated_aliases: []
        type_rules:
          - can_import_type: [CONSTITUTIONAL_VISION, CONSTITUTION_PRINCIPLE, CONSTITUTION_INVARIANT]
          - cannot_mutate: true
          - can_be_imported_by: [SPECIFICATION, PROTOCOL, CONTRACT]
      - type_name: SPECIFICATION
        evolution_domain: DOMAIN-B-SPECIFICATION
        authority_level_index: 4
        authority_stage: INTERPRETATION
        sub_types: [PROTOCOL, CONTRACT]
        deprecated_aliases: []
        type_rules:
          - can_import_type: [CONSTITUTION_PRINCIPLE, CONSTITUTION_INVARIANT, CONSTITUTION_POLICY]
          - cannot_import_type:
              forbidden_target: CONSTITUTIONAL_VISION
              rationale: "Spec consumes VISION indirectly through compiled CONSTIT-IR only; never raw VISION yaml."
          - cannot_mutate_type: [CONSTITUTIONAL_VISION, CONSTITUTION_PRINCIPLE, CONSTITUTION_INVARIANT, CONSTITUTION_POLICY]
          - cannot_import_type_2: [IMPLEMENTATION_MODULE, IMPLEMENTATION_TOOLING, EVIDENCE_PROOF, EVIDENCE_LEDGER, CONFORMANCE_REPORT, VERDICT, GENERATED_ARTIFACT]
          - can_be_imported_by: [PROTOCOL, CONTRACT, TRANSFORMATION_MANIFEST, PREDICATE_MANIFEST, DECISION_REPRESENTATION, KNOWLEDGE_REPRESENTATION, IMPLEMENTATION_MODULE, IMPLEMENTATION_TOOLING]
      - type_name: PROTOCOL
        sub_type_of: SPECIFICATION
        evolution_domain: DOMAIN-B-SPECIFICATION
        authority_level_index: 5
        authority_stage: INTERPRETATION
        deprecated_aliases: []
        type_rules:
          - can_import_type: [SPECIFICATION, CONTRACT, CONSTITUTION_INVARIANT, CONSTITUTION_POLICY]
          - cannot_mutate_type: [SPECIFICATION, CONSTITUTIONAL_VISION, CONSTITUTION_PRINCIPLE, CONSTITUTION_INVARIANT, CONSTITUTION_POLICY]
          - can_be_imported_by: [CONTRACT, TRANSFORMATION_MANIFEST, PREDICATE_MANIFEST, DECISION_REPRESENTATION, KNOWLEDGE_REPRESENTATION, EXECUTION_REPRESENTATION, IMPLEMENTATION_MODULE, IMPLEMENTATION_TOOLING]
      - type_name: CONTRACT
        sub_type_of: SPECIFICATION
        evolution_domain: DOMAIN-B-SPECIFICATION
        authority_level_index: 6
        authority_stage: INTERPRETATION
        deprecated_aliases: []
        type_rules:
          - can_import_type: [SPECIFICATION, PROTOCOL, CONSTITUTION_INVARIANT]
          - cannot_mutate_type: [SPECIFICATION, PROTOCOL, CONSTITUTIONAL_VISION, CONSTITUTION_PRINCIPLE, CONSTITUTION_INVARIANT, CONSTITUTION_POLICY]
          - can_be_imported_by: [TRANSFORMATION_MANIFEST, PREDICATE_MANIFEST, DECISION_REPRESENTATION, KNOWLEDGE_REPRESENTATION, EXECUTION_REPRESENTATION, IMPLEMENTATION_MODULE, IMPLEMENTATION_TOOLING]
      - type_name: TRANSFORMATION_MANIFEST
        evolution_domain: DOMAIN-B-SPECIFICATION
        authority_level_index: 7
        authority_stage: INTERPRETATION
        deprecated_aliases: [Compiler Pass Contract, Pass Manifest]
        type_rules:
          - can_import_type: [SPECIFICATION, PROTOCOL, CONTRACT]
          - cannot_mutate_type: [SPECIFICATION, PROTOCOL, CONTRACT, CONSTITUTIONAL_VISION, CONSTITUTION_PRINCIPLE, CONSTITUTION_INVARIANT, CONSTITUTION_POLICY]
          - can_be_imported_by: [EXECUTION_REPRESENTATION, IMPLEMENTATION_MODULE]
      - type_name: PREDICATE_MANIFEST
        evolution_domain: DOMAIN-B-SPECIFICATION
        authority_level_index: 8
        authority_stage: INTERPRETATION
        deprecated_aliases: []
        type_rules:
          - can_import_type: [SPECIFICATION, PROTOCOL, CONTRACT]
          - cannot_mutate_type: [SPECIFICATION, PROTOCOL, CONTRACT, CONSTITUTIONAL_VISION, CONSTITUTION_PRINCIPLE, CONSTITUTION_INVARIANT, CONSTITUTION_POLICY]
          - can_be_imported_by: [EXECUTION_REPRESENTATION, IMPLEMENTATION_MODULE]
      - type_name: KNOWLEDGE_REPRESENTATION
        evolution_domain: DOMAIN-B-SPECIFICATION
        authority_level_index: 9
        authority_stage: INTERPRETATION
        stable_canonical: true
        canonical_id: K-REP
        deprecated_aliases: [KNOWLEDGE_IR, KIR]
        type_rules:
          - can_import_type: [SPECIFICATION, PROTOCOL, CONTRACT, TRANSFORMATION_MANIFEST, PREDICATE_MANIFEST]
          - cannot_mutate_type: [SPECIFICATION, PROTOCOL, CONTRACT, CONSTITUTIONAL_VISION, CONSTITUTION_PRINCIPLE, CONSTITUTION_INVARIANT, CONSTITUTION_POLICY]
          - can_be_imported_by: [DECISION_REPRESENTATION, EXECUTION_REPRESENTATION, IMPLEMENTATION_MODULE]
      - type_name: DECISION_REPRESENTATION
        evolution_domain: DOMAIN-B-SPECIFICATION
        authority_level_index: 10
        authority_stage: DECISION
        stable_canonical: true
        canonical_id: D-REP
        deprecated_aliases: [DECISION_IR, DIR]
        type_rules:
          - can_import_type: [SPECIFICATION, PROTOCOL, CONTRACT, TRANSFORMATION_MANIFEST, PREDICATE_MANIFEST, KNOWLEDGE_REPRESENTATION]
          - cannot_mutate_type: [SPECIFICATION, PROTOCOL, CONTRACT, TRANSFORMATION_MANIFEST, PREDICATE_MANIFEST, KNOWLEDGE_REPRESENTATION, CONSTITUTIONAL_VISION, CONSTITUTION_PRINCIPLE, CONSTITUTION_INVARIANT, CONSTITUTION_POLICY]
          - can_be_imported_by: [EXECUTION_REPRESENTATION, IMPLEMENTATION_MODULE, CONFORMANCE_REPORT]
      - type_name: EXECUTION_REPRESENTATION
        evolution_domain: DOMAIN-B-SPECIFICATION
        authority_level_index: 11
        authority_stage: EXECUTION
        stable_canonical: true
        canonical_id: X-REP
        deprecated_aliases: [EXECUTION_PLAN, EXEC-PLAN, Plan IR, Execution IR]
        type_rules:
          - can_import_type: [PROTOCOL, CONTRACT, TRANSFORMATION_MANIFEST, PREDICATE_MANIFEST, DECISION_REPRESENTATION, KNOWLEDGE_REPRESENTATION]
          - cannot_mutate_type: [DECISION_REPRESENTATION, KNOWLEDGE_REPRESENTATION, SPECIFICATION, PROTOCOL, CONTRACT, CONSTITUTIONAL_VISION, CONSTITUTION_PRINCIPLE, CONSTITUTION_INVARIANT, CONSTITUTION_POLICY]
          - can_be_imported_by: [IMPLEMENTATION_MODULE, EVIDENCE_PROOF]
      - type_name: IMPLEMENTATION_MODULE
        evolution_domain: DOMAIN-C-IMPLEMENTATION
        authority_level_index: 12
        authority_stage: EXECUTION
        deprecated_aliases: [Runtime Module (partial)]
        type_rules:
          - can_import_type: [SPECIFICATION, PROTOCOL, CONTRACT, TRANSFORMATION_MANIFEST, PREDICATE_MANIFEST, DECISION_REPRESENTATION, KNOWLEDGE_REPRESENTATION, EXECUTION_REPRESENTATION, IMPLEMENTATION_TOOLING]
          - cannot_mutate_type: [SPECIFICATION, PROTOCOL, CONTRACT, TRANSFORMATION_MANIFEST, PREDICATE_MANIFEST, DECISION_REPRESENTATION, KNOWLEDGE_REPRESENTATION, EXECUTION_REPRESENTATION, CONSTITUTIONAL_VISION, CONSTITUTION_PRINCIPLE, CONSTITUTION_INVARIANT, CONSTITUTION_POLICY]
          - cannot_import_type:
              - CONSTITUTIONAL_VISION
              - CONSTITUTION_PRINCIPLE
              - CONSTITUTION_INVARIANT
              - CONSTITUTION_POLICY
            rationale: "Implementation must NOT do raw imports of constitution YAML. Governance semantics must come from compiled CONSTIT-IR or through the verifier engine only."
          - can_be_imported_by: [IMPLEMENTATION_TOOLING, EVIDENCE_PROOF, CONFORMANCE_REPORT]
      - type_name: IMPLEMENTATION_TOOLING
        evolution_domain: DOMAIN-C-IMPLEMENTATION
        authority_level_index: 13
        authority_stage: EXECUTION
        deprecated_aliases: []
        type_rules:
          - can_import_type: [SPECIFICATION, PROTOCOL, CONTRACT, IMPLEMENTATION_MODULE, EXECUTION_REPRESENTATION, GENERATED_ARTIFACT]
          - cannot_mutate_type: [SPECIFICATION, PROTOCOL, CONTRACT, CONSTITUTIONAL_VISION, CONSTITUTION_PRINCIPLE, CONSTITUTION_INVARIANT, CONSTITUTION_POLICY]
          - can_be_imported_by: [CONFORMANCE_REPORT, GENERATED_ARTIFACT]
      - type_name: EVIDENCE_PROOF
        evolution_domain: DERIVED-EVIDENCE
        authority_level_index: 14
        authority_stage: EVIDENCE
        evidence_layer: Level_0_Raw_Evidence
        stable_canonical: true
        canonical_id: V-REP-LEVEL-0
        deprecated_aliases: [Evidence IR, EPG (partially)]
        type_rules:
          - can_import_type: [EXECUTION_REPRESENTATION, IMPLEMENTATION_MODULE]
          - cannot_mutate:
              value: true
              rationale: "Append-only proof object. Mutation invalidates the cryptographic evidence chain."
          - cannot_mutate_type: [EXECUTION_REPRESENTATION, IMPLEMENTATION_MODULE, SPECIFICATION, PROTOCOL, CONTRACT, CONSTITUTIONAL_VISION, CONSTITUTION_PRINCIPLE, CONSTITUTION_INVARIANT, CONSTITUTION_POLICY]
          - cannot_import_type:
              - CONSTITUTION_VISION
              - CONSTITUTION_PRINCIPLE
              - CONSTITUTION_INVARIANT
              - CONSTITUTION_POLICY
              - SPECIFICATION
              - PROTOCOL
              - CONTRACT
            rationale: "Evidence cannot read governance directly. Provenance chain is established only via EXECUTION_REPRESENTATION metadata, not direct import."
          - can_be_imported_by: [EVIDENCE_ASSESSMENT, EVIDENCE_LEDGER, CONFORMANCE_REPORT]
      - type_name: EVIDENCE_ASSESSMENT
        evolution_domain: DERIVED-EVIDENCE
        authority_level_index: 15
        authority_stage: EVIDENCE
        evidence_layer: Level_1_Assessment
        deprecated_aliases: []
        type_rules:
          - can_import_type: [EVIDENCE_PROOF]
          - cannot_mutate:
              value: true
              rationale: "Technical assessment of raw evidence; mutating invalidates conformance measurement chain."
          - can_be_imported_by: [EVIDENCE_JUSTIFICATION, EVIDENCE_LEDGER, CONFORMANCE_REPORT]
      - type_name: EVIDENCE_JUSTIFICATION
        evolution_domain: DERIVED-EVIDENCE
        authority_level_index: 16
        authority_stage: EVIDENCE
        evidence_layer: Level_2_Justification
        deprecated_aliases: [Justification (narrative only)]
        type_rules:
          - can_import_type: [EVIDENCE_PROOF, EVIDENCE_ASSESSMENT]
          - cannot_mutate:
              value: true
              rationale: "Append-only structured + narrative. Must reference authority sources explicitly."
          - can_be_imported_by: [VERDICT, EVIDENCE_LEDGER, CONFORMANCE_REPORT]
      - type_name: VERDICT
        evolution_domain: DERIVED-EVIDENCE
        authority_level_index: 17
        authority_stage: EVIDENCE
        evidence_layer: Level_3_Verdict
        deprecated_aliases: []
        type_rules:
          - can_import_type: [EVIDENCE_ASSESSMENT, EVIDENCE_JUSTIFICATION, EVIDENCE_LEDGER, CONFORMANCE_REPORT]
          - cannot_mutate:
              value: true
              rationale: "Verdict is governance-facing normative output. Once emitted, alteration requires ADR + board record."
          - cannot_mutate_type: [EVIDENCE_PROOF, EVIDENCE_ASSESSMENT, EVIDENCE_JUSTIFICATION, IMPLEMENTATION_MODULE, DECISION_REPRESENTATION, SPECIFICATION, PROTOCOL, CONTRACT, CONSTITUTIONAL_VISION, CONSTITUTION_PRINCIPLE, CONSTITUTION_INVARIANT, CONSTITUTION_POLICY]
          - can_be_imported_by: [EVIDENCE_LEDGER, REPOSITORY_CERTIFICATION (future)]
      - type_name: EVIDENCE_LEDGER
        evolution_domain: DERIVED-EVIDENCE
        authority_level_index: 18
        authority_stage: EVIDENCE
        evidence_layer: Level_Infrastructure
        deprecated_aliases: [Ledger (ambiguous)]
        type_rules:
          - can_import_type: [EVIDENCE_PROOF, EVIDENCE_ASSESSMENT, EVIDENCE_JUSTIFICATION, VERDICT, CONFORMANCE_REPORT]
          - cannot_mutate:
              value: true
              rationale: "Append-only ledger. Only APPEND operation allowed through proof-ledger package API. Rewrite or delete = hash chain break."
          - can_be_imported_by: [CONFORMANCE_REPORT, VERDICT]
      - type_name: CONFORMANCE_REPORT
        evolution_domain: DERIVED-EVIDENCE
        authority_level_index: 19
        authority_stage: EVIDENCE
        evidence_layer: Level_Assessment_Summary
        deprecated_aliases: []
        type_rules:
          - can_import_type: [EVIDENCE_PROOF, EVIDENCE_LEDGER, EVIDENCE_ASSESSMENT, EVIDENCE_JUSTIFICATION, IMPLEMENTATION_MODULE, DECISION_REPRESENTATION]
          - cannot_mutate_type: [EVIDENCE_PROOF, EVIDENCE_LEDGER, EVIDENCE_ASSESSMENT, EVIDENCE_JUSTIFICATION, IMPLEMENTATION_MODULE, DECISION_REPRESENTATION, SPECIFICATION, PROTOCOL, CONTRACT, CONSTITUTIONAL_VISION, CONSTITUTION_PRINCIPLE, CONSTITUTION_INVARIANT, CONSTITUTION_POLICY]
          - can_be_imported_by: [VERDICT]
      - type_name: GENERATED_ARTIFACT
        evolution_domain: DERIVED-EVIDENCE
        authority_level_index: 20
        authority_stage: EVIDENCE
        deprecated_aliases: []
        type_rules:
          - can_import_type: [IMPLEMENTATION_TOOLING]
            rationale: "Only tooling produces generated artifacts. Never hand-written. Violation = ARCH-MAN-INTEGRITY-001."
          - cannot_mutate_type: [SPECIFICATION, PROTOCOL, CONTRACT, CONSTITUTION_VISION, CONSTITUTION_PRINCIPLE, CONSTITUTION_INVARIANT, CONSTITUTION_POLICY]
          - parent_input_hash_required:
              value: true
              rationale: "Every generated file must carry parent CONSTIT-IR hash for provenance. See ARCH-MAN-INTEGRITY-001."

  authority_graph_section:
    mandatory: true
    ir_field: authority_graph_dag
    schema_ref: /root/Enterprise-OS/enterprise/schema/AUTHORITY-DAG.schema.yaml
    verifier_stage_ref: CV-STAGE-2
    dag_edge_format: { from, to, edge_kind, authority_proof_ref }
    edges_required:
      - from: CONSTITUTIONAL_VISION
        to: ASP
        edge_kind: VISION_CONSTRAINS_PRINCIPLES
        authority_proof_ref: CONSTITUTIONAL-VISION.yaml#authority_dag_edges_foundation
      - from: ASP
        to: IA
        edge_kind: ASP_CONSTRAINS_INVARIANTS
        authority_proof_ref: ARCHITECTURAL-STABILITY-PRINCIPLES.yaml
      - from: IA
        to: SPECIFICATION_ALL
        edge_kind: INVARIANTS_CONSTRAIN_SPECS
        authority_proof_ref: IA-01..IA-14
      - from: SPECIFICATION_ALL
        to: PROTOCOL_ALL
        edge_kind: SPECS_DEFINE_PROTOCOLS
        authority_proof_ref: PROTOCOL-GOVERNANCE.yaml
      - from: PROTOCOL_ALL
        to: IMPLEMENTATION_ALL
        edge_kind: PROTOCOLS_CONSTRAIN_IMPLEMENTATIONS
        authority_proof_ref: PROTOCOL-GOVERNANCE.yaml#required_protocol_inventory
      - from: IMPLEMENTATION_ALL
        to: EVIDENCE_LAYER
        edge_kind: EXECUTION_PRODUCES_EVIDENCE
        authority_proof_ref: CONSTITUTIONAL-VISION.yaml#VISION-02
    cycle_check_enforcement:
      statement: "Edges form a strict DAG with total order V→C→S→P→I→E. Constitutional Compiler SHALL compute a topological sort of every authority edge; any cycle = compilation error, and Constitution IR SHALL NOT be emitted until cycle removed."
      algorithm: Kahn's algorithm with deterministic tie-break by node id lex order.

  boundary_rules_section:
    mandatory: true
    ir_field: boundary_rules
    description: Compiled form of IA-01 Ontological Triad + IA-09 Knowledge Not In Runtime + ASP-02 No Upward.
    rules_list_mandatory:
      - rule_id: BR-IA01-TRIAD
        rule_statement: "Three ontological zones Knowledge × Registry × Runtime — each answer different question. Zone cross-reads only through explicit IRs (KIR / DIR / EPG)."
        enforcement_ref: "ARCH-18 checks IA-06 forbidden dep table (8 pairs)."
      - rule_id: BR-IA09-NO-KNOWLEDGE-RUNTIME
        rule_statement: "Runtime code does NOT embed knowledge strings, transformation hardcoded ids, contract literal predicates."
        enforcement_ref: "ARCH-19 regex scanner + whitelisted loader contexts."
      - rule_id: BR-IA10-SNAPSHOT-BOUNDARY
        rule_statement: "Planner+Runtime+Validator+Evidence each operate on exactly one KS- snapshot id. No mutable enterprise/knowledge dir reads POST plan."
        enforcement_ref: "ARCH-20 path scanner + execution plan snapshot field check."
      - rule_id: BR-ASP02-NO-UPWARD-WRITE
        rule_statement: "No .ts in packages/core/runtime|execution|resolver|proof-ledger|composition|apps|capabilities writes governance/spec YAML paths."
        enforcement_ref: "ARCH-24 write/delete/append upstream pattern scanner."
      - rule_id: BR-PROTO-BOUNDARY-EXCHANGE
        rule_statement: "Cross-component exchange objects that are Execution/Plan/Compiler type MUST carry ir_format_version + ir_content_hash or plan_hash versioned protocol fields."
        enforcement_ref: "ARCH-25 ad-hoc interface scanner."

  stability_levels_section:
    mandatory: true
    ir_field: stability_levels
    per_type:
      CONSTITUTION: { change_cost: EXTREME, deprecation: NEVER, epoch_needed_for_change: true }
      ASP: { change_cost: EXTREME, deprecation: EPOCH_ONLY, minimum_epoch_overlap: 3 }
      IA: { change_cost: EXTREME_HIGH, deprecation: EPOCH_OR_MAJOR, minimum_epoch_overlap: 2 }
      SPECIFICATION: { change_cost: HIGH, deprecation: 2-major-releases, semver_policy: SEMVER_2_0 }
      PROTOCOL: { change_cost: HIGH, deprecation: 2-major-releases, semver_policy: SEMVER_2_0 }
      IMPLEMENTATION: { change_cost: LOW, deprecation: AT_WILL, only_conformance_binding: true }

  compatibility_policies_section:
    mandatory: true
    ir_field: compatibility_policies
    entries:
      - target: CONSTITUTION
        rule: Identity (compatibility is ontological; either still EOS or different platform).
      - target: SPEC/PROTOCOL
        rule: SEMVER 2.0 (MAJOR=backward incompat, MINOR=new optional fields, PATCH=editorial only). No exceptions.
      - target: IMPLEMENTATION
        rule: Behavioral (compat across impl versions undefined; only protocol conformance binds).
    deprecation_windows:
      - spec_protocol_major_overlap_required: "≥ 2 MAJOR releases of successor before predecessor sunset."
      - implementation_overlap: "None; replacement allowed at any time provided conformance."

  proof_requirements_section:
    mandatory: true
    ir_field: proof_requirements
    per_class:
      - artifact_class: CONSTITUTION change
        proof_required: Foundation Charter revision + epoch migration plan.
      - artifact_class: ASP change
        proof_required: ADR + Architecture Board unanimous vote record + GOVERNANCE_STATE updated.
      - artifact_class: IA change
        proof_required: ADR + 2/3 Architecture Board recorded vote + 1 IA conflict resolution audit.
      - artifact_class: SPEC MAJOR
        proof_required: ADR ref + Specification Review sign-off record (3 reviewers minimum, 1 Board minimum).
      - artifact_class: SPEC MINOR
        proof_required: Specification Review (2 reviewers).
      - artifact_class: IMPL
        proof_required: PR review record + conformance test 100% PASS + report_content_hash included in release log.

  verification_rule_generators_section:
    mandatory: true
    ir_field: verification_rule_generators
    description: "MP-01 Computable Governance. Each IA/ASP statement maps to ARCH-* enforcement IDs. This section IS the declaration that ACL is not a disconnected artifact but compiled governance rules."
    generators_mandatory_list:
      - id: VGEN-IA01-TRIAD
        source_statement_ref: IA-01 Ontological Triad
        outputs_arch_rule_ids: [ARCH-18-ONT-TRIAD]
        compiled_check_parameters:
          triad_zones: [Knowledge Zone, Registry Zone, Runtime Zone]
          zone_to_zone_forbidden: ["Knowledge → Runtime", "Registry → Knowledge rewrite", "Runtime → Knowledge write"]
          ir_border_check_required: ["KIR border", "DIR border", "EPG border"]
      - id: VGEN-IA06-TABLE
        source_statement_ref: IA-06 Cross-Layer Dependency Table (8 forbidden pairs)
        outputs_arch_rule_ids: [ARCH-18-INV-TABLE]
        compiled_check_parameters:
          forbidden_dependency_pairs_count: 8
          forbidden_pairs_table_ref: INVARIANT-ARCHITECTURE.yaml#IA-06_cross_layer_forbidden_dependencies
      - id: VGEN-IA09-RUNTIME
        source_statement_ref: IA-09 Knowledge Not In Runtime
        outputs_arch_rule_ids: [ARCH-19]
        compiled_check_parameters:
          forbidden_src_patterns_in_runtime_ts: ["contract string literal", "predicate id literal hardcoded", "transformation manifest id embedded"]
          whitelist_loader_contexts: ["registry-resolver package (declarative import only)", "predicate-registry package"]
      - id: VGEN-IA10
        source_statement_ref: IA-10 Immutable Knowledge Snapshot
        outputs_arch_rule_ids: [ARCH-20-IA10-SNAPSHOT]
        compiled_check_parameters:
          - mutable_reads_forbidden_paths: ["enterprise/constitution","enterprise/schema","workspace/contracts","governance/"]
          - post_planning_src_dirs: ["packages/core/runtime/src","packages/core/registry-resolver/src","packages/core/proof-ledger/src","packages/composition"]
          - snapshot_attachment_field_name: knowledge_snapshot
      - id: VGEN-IA11
        source_statement_ref: IA-11 Semantic Determinism
        outputs_arch_rule_ids: [ARCH-21-IA11-SEM-DET]
        compiled_check_parameters:
          - non_det_signatures: ["Math.random","Date.now","new Date()","fetch","axios","process.env(??)? ?=? branch"]
          - deterministic_tiebreak_signatures: [".localeCompare(","Object.keys().sort()",".sort((a,b)=>a.localeCompare(b))"]
      - id: VGEN-IA13
        source_statement_ref: IA-13 Stable Intermediate Representations
        outputs_arch_rule_ids: [ARCH-22-IA13-STABLE-IR]
        compiled_check_parameters:
          required_ir_contract_paths:
            [
              "workspace/contracts/KNOWLEDGE-SNAPSHOT.contract.yaml",
              "workspace/contracts/KNOWLEDGE-IR.contract.yaml",
              "workspace/contracts/DECISION-IR.contract.yaml",
              "workspace/contracts/EVIDENCE-PROVENANCE-GRAPH.contract.yaml",
            ]
          required_protocol_version_fields: [ir_format_version, plan_format_version, format_version]
          required_protocol_hash_fields: [ir_content_hash, plan_hash, content_hash, plan.id.*sha256]
      - id: VGEN-IA14
        source_statement_ref: IA-14 Pure Compiler Passes
        outputs_arch_rule_ids: [ARCH-23-IA14-PURE-PASS]
        compiled_check_parameters:
          upstream_forbid_write_paths:
            [
              "governance/","enterprise/constitution","enterprise/schema","enterprise/execution","enterprise/specifications/SEMANTIC-KERNEL.yaml","workspace/contracts/",
            ]
      - id: VGEN-ASP02+04
        source_statement_ref: ASP-02 Downward + ASP-04 Domains
        outputs_arch_rule_ids: [ARCH-24]
        compiled_check_parameters:
          meta_files_required:
            [
              "governance/ARCHITECTURAL-STABILITY-PRINCIPLES.yaml",
              "governance/EVOLUTION-DOMAINS.yaml",
              "governance/PROTOCOL-GOVERNANCE.yaml",
              "governance/CONFORMANCE-MODEL.yaml",
            ]
          evolution_domain_glob_mapping_path: "governance/EVOLUTION-DOMAINS.yaml#domain_artifact_full_mapping"
      - id: VGEN-PROTO-BOUNDARY
        source_statement_ref: Protocol Governance (all)
        outputs_arch_rule_ids: [ARCH-25]
        compiled_check_parameters:
          conformance_impl_private_import_forbid: true
          ad_hoc_type_version_hash_headers_require: true
      - id: VGEN-CONF-PROP
        source_statement_ref: CONFORMANCE-PROPERTIES.yaml (6-dimensional Deterministic/Compatible/Reproducible/Auditable/Explainable/Canonical)
        outputs_arch_rule_ids: [ARCH-29-CONF-PROP-MEASURE]
        compiled_check_parameters:
          measurement_algorithms: [MEASURE-DET-v1, MEASURE-COMPAT-v1, MEASURE-REPRO-v1, MEASURE-AUDIT-v1, MEASURE-EXP-v1, MEASURE-CAN-v1]
          conformance_contract_ref: /root/Enterprise-OS/governance/CONFORMANCE-PROPERTIES.yaml
          vector_schema_ref: /root/Enterprise-OS/governance/CONFORMANCE-PROPERTIES.yaml#conformance_property_vector_schema
      - id: VGEN-TYPE-SYSTEM
        source_statement_ref: Evolution Domains as Type System (artifact.schema.yaml#artifact_type + CONSTIT-IR.type_system_section)
        outputs_arch_rule_ids: [ARCH-26-TYPE-IMPORT, ARCH-27-TYPE-MUTATE, ARCH-28-TYPE-UNCLASSIFIED]
        compiled_check_parameters:
          cv_stage1_checks: [CV-TYPE-01, CV-TYPE-02, CV-TYPE-03]
          type_system_anchor: /root/Enterprise-OS/enterprise/schema/artifact.schema.yaml#artifact_type
          type_enumeration_count: 18
          domain_count: 4
      - id: VGEN-AUTH-DAG
        source_statement_ref: Authority Flow as DAG (AUTHORITY-DAG.schema.yaml + VISION-03 authority flows downward only)
        outputs_arch_rule_ids: [ARCH-30-DAG-REVERSE, ARCH-31-DAG-CYCLE, ARCH-32-DAG-DANGLING]
        compiled_check_parameters:
          cv_stage2_checks: [CV-DAG-01, CV-DAG-02, CV-DAG-03]
          dag_schema_ref: /root/Enterprise-OS/enterprise/schema/AUTHORITY-DAG.schema.yaml
          cycle_algorithm: KAHNS_TOPOLOGICAL_TIEBREAK_AUTH_LEVEL_THEN_LEX
          edge_direction_rule: "topological_index(from) < topological_index(to) → forward else reverse-invalid"
      - id: VGEN-PROTO-COMP
        source_statement_ref: PROTOCOL-COMPILATION.spec.yaml (Protocol Governance compiled into matrices, paths, migrations, deprecation)
        outputs_arch_rule_ids: [ARCH-33-COMPAT-MATRIX, ARCH-34-UPGRADE-PATH]
        compiled_check_parameters:
          matrix_generation: GEN-COMPAT-MATRIX-v1
          upgrade_generation: GEN-UPGRADE-PATHS-v1
          migration_generation: GEN-MIGRATION-v1
          deprecation_generation: GEN-DEPRECATION-v1
          output_path_root: build/governance/generated-compat/

ir_content_hash_calculation:
  hash_algorithm: SHA-256
  included_sections_sorted_keys:
    - header (minus produced_at_utc)
    - evolution_domain_types (types, rules sorted)
    - authority_graph_dag (edges sorted from→to)
    - boundary_rules (sorted by rule_id)
    - stability_levels
    - compatibility_policies
    - proof_requirements
    - verification_rule_generators (sorted by id)
  excluded:
    - produced_at_utc (diagnostic only)
  canonical_json_rules: keys sorted, no whitespace, arrays preserved order.

enforcement:
  statements:
    - "No future Constitutional Verifier (ARCH-*) release may read ASP/IA prose directly as the ONLY source of rules. It SHALL read CONSTIT-IR contract, and optionally validate that CONSTIT-IR itself was correctly compiled from raw sources (self-check)."
    - "Protocol rule generators and compatibility matrix generators SHALL consume CONSTIT-IR as their only authoritative input. This minimizes governance drift."
