
contract:
  name: identity-contract
  version: "1.0"
  description: Standard identity and authentication contract for enterprise products

api:
  base_path: /api/v1/identity
  
  endpoints:
    - name: register
      method: POST
      path: /register
      request:
        schema:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
            password:
              type: string
              minLength: 8
            name:
              type: string
      response:
        201:
          description: User created successfully
          schema:
            type: object
            properties:
              user_id:
                type: string
                format: uuid
              email:
                type: string
              name:
                type: string
        400:
          description: Invalid request
        409:
          description: Email already exists

    - name: login
      method: POST
      path: /login
      request:
        schema:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
            password:
              type: string
      response:
        200:
          description: Login successful
          schema:
            type: object
            properties:
              access_token:
                type: string
              token_type:
                type: string
                example: Bearer
              expires_in:
                type: integer
                description: Seconds until token expires
        401:
          description: Invalid credentials

    - name: get_current_user
      method: GET
      path: /me
      headers:
        Authorization:
          type: string
          description: Bearer token
      response:
        200:
          description: Current user information
          schema:
            type: object
            properties:
              user_id:
                type: string
                format: uuid
              email:
                type: string
              name:
                type: string
              created_at:
                type: string
                format: date-time
        401:
          description: Unauthorized

  data_models:
    User:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          description: Unique user identifier
        email:
          type: string
          format: email
          description: User email address
        name:
          type: string
          description: Full user name
        created_at:
          type: string
          format: date-time
          description: Account creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last account update timestamp

  events:
    - name: UserRegistered
      description: Event emitted when a new user registers
      schema:
        type: object
        properties:
          event_id:
            type: string
            format: uuid
          event_type:
            type: string
            const: UserRegistered
          user_id:
            type: string
            format: uuid
          email:
            type: string
            format: email
          name:
            type: string
          timestamp:
            type: string
            format: date-time

    - name: UserLoggedIn
      description: Event emitted when a user logs in
      schema:
        type: object
        properties:
          event_id:
            type: string
            format: uuid
          event_type:
            type: string
            const: UserLoggedIn
          user_id:
            type: string
            format: uuid
          timestamp:
            type: string
            format: date-time

