packages:
  - apps/*
  - packages/core/*
  - packages/composition/*
  - packages/compositions/*
  - packages/presentation/*
  - config/*
  - packages/tooling/*
  - products/*
  - capabilities/*
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  sharp: false
overrides:
  '@repo/core-kernel': link:packages/core/kernel
  core-capability-registry: link:packages/core-capability-registry
