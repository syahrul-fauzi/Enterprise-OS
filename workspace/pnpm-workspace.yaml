packages:
  - apps/*
  - packages/core/*
  - packages/contracts-core
  - packages/composition
  - packages/compositions/*
  - packages/presentation/*
  - config/*
  - packages/tooling/*
  - products/*
  - capabilities/*
allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: false
  sharp: false
overrides:
  '@repo/core-kernel': link:packages/core/kernel
  '@repo/core-runtime': link:packages/core/runtime
  '@repo/core-capability-registry': link:packages/core/capability-registry
  '@repo/contracts-core': link:packages/contracts-core