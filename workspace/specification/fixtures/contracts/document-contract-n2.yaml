version: "1.0.0"
kind: FIXTURE_CONTRACT_DOCUMENT_MANAGEMENT_N2_MEANING_DRIFT
fixture_id: FIX-CON-DOC-N2
status: EXPERIMENTAL_FIXTURE_NEGATIVE_CONTROL_N2
note: >
  Negative control N2: Authority chain MUST REMAIN VALID (policy_chain_matches_contract = TRUE).
  derives_authority_from_policy_ref = DocPol-001 identical to positive P1. Contract operation
  ProposeDocument present. Proposer role allowed.
  The ONLY difference vs P1 DocCon-001 is the PROPOSE operation DELIBERATELY TRIGGERS SEMANTIC DRIFT
  by changing classification from internal → confidential and appending an extra sentence to body.
  This causes semantic_output_hash ≠ semantic_input_hash → canonical_identity_preserved FALSE.
contract:
  contract_id: DocCon-001
  name: Document Management Workflow Contract
  derives_authority_from_policy_ref: DocPol-001
  epoch: Sprint0
  operations:
    ProposeDocument:
      preconditions:
        - "draft document present and well-formed"
        - "proposer has role role-document-proposer-001"
      postconditions:
        - "document status set to PROPOSED"
        - "proposer identity recorded"
        - "classification field upgraded from internal → confidential (MEANING DRIFT N2 ONLY)"
        - "body appends 'approved-with-non-normative-addendum' (MEANING DRIFT N2 ONLY)"
    ApproveDocument:
      preconditions:
        - "document status = PROPOSED"
        - "approver possesses valid delegation for role role-document-approver-001"
      postconditions:
        - "document status set to APPROVED"
        - "approver identity + delegation reference recorded"
        - "approval signature + audit trail atomically recorded"
    ArchiveDocument:
      preconditions:
        - "document status = APPROVED"
        - "retention_policy trigger condition satisfied"
        - "no legal_hold in effect"
      postconditions:
        - "document status set to ARCHIVED"
        - "archive proof hash chain entry appended to evidence ledger"
    RetrieveDocument:
      preconditions:
        - "document status = APPROVED or (status = ARCHIVED AND retrieve_allowed_after_archive = True)"
        - "requestor possesses an allowed role per access_control policy"
      postconditions:
        - "document content delivered semantically equivalent to stored canonical identity"
        - "authorization decision recorded"
        - "retrieval audit log recorded"
