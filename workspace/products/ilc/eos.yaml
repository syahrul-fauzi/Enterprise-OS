version: "1.0"
workspace:
  name: ilc
  display_name: ILC (Indonesian Legal Commons)
  description: Komunitas akademisi dan praktisi hukum untuk berbagi konten dan penelitian hukum
lifecycle:
  phase: D.1
  status: ACTIVE
  contract:
    stages:
      - name: discover
        description: Anggota komunitas menemukan konten dan penelitian terbaru
        terminal: false
      - name: create
        description: Anggota mempublikasikan konten atau artikel baru
        terminal: false
      - name: execute
        description: Diskusi dan kolaborasi antar anggota komunitas
        terminal: false
      - name: progress
        description: Update dan pengembangan konten yang ada
        terminal: false
      - name: evidence
        description: Mengumpulkan semua bukti engagement komunitas
        terminal: false
      - name: complete
        description: Proyek kolaborasi selesai, konten terverifikasi
        terminal: true
  real_user_jobs:
    - id: content-101
      name: Discover and engage with legal content/community
      description: Full lifecycle keterlibatan komunitas dari pencarian konten hingga publikasi bersama
      status: active
      requirements:
        - req-ilc-001
quality:
  targets:
    evidence_required: true
    test_coverage_min: 80
    runtime_invocation_required: true
governance:
  baseline_locked: false
  needs_audit: false
  evidence_path: ./evidence