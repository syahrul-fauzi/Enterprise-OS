    fee_id: "fee-security-assessment"
    delivery_time: "7 hari kerja"
  - id: "automation-opportunity-assessment"
    name: "Automation Opportunity Assessment"
    description: "Identifikasi proses yang dapat diotomasi untuk efisiensi operasional"
    fee_id: "fee-automation-assessment"
    delivery_time: "4 hari kerja"
