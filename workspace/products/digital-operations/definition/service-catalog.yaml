version: "1.0"
product_id: "digital-operations"
display_name: "Managed Digital Business Operations"
description: "Kami tidak hanya memperbaiki sistem digital. Kami memastikan sistem tersebut terus bekerja untuk bisnis Anda."
service_domains:
  - id: "finance-operations"
    name: "Finance Operations"
    description: "Mengelola rekonsiliasi transaksi, pencocokan invoice, dan penanganan exception keuangan"
    scope:
      - "Ingest transaksi dari bank gateway, e-wallet, dan marketplace"
      - "Pencocokan invoice vs transaksi otomatis"
      - "Penanganan exception keuangan (unmatched transactions) dengan eskalasi manusia jika diperlukan"
      - "Laporan rekonsiliasi harian/mingguan dengan evidence teraudit"
      - "Integrasi dengan akuntansi pelanggan (Xero, Jurnal, Odoo)"
    pricing_hypothesis:
      basic:
        setup_fee_idr: 1500000
        recurring_fee_monthly_idr: 750000
        target_customer: "UMKM (transaksi <500/bulan)"
      professional:
        setup_fee_idr: 3000000
        recurring_fee_monthly_idr: 1800000
        target_customer: "Bisnis menengah (transaksi <5000/bulan)"
      enterprise:
        setup_fee_idr: 7500000
        recurring_fee_monthly_idr: 4500000
        target_customer: "Enterprise (unlimited transaksi)"
    acceptance_criteria:
      - "Rekonsiliasi selesai <24 jam setelah transaksi masuk"
      - "95% transaction matched otomatis (human intervention <5%)"
      - "Semua evidence tercatat di EOS governance-evidence"
      - "Customer menandatangani acceptance form untuk hasil rekonsiliasi"
      - "Tidak ada kesalahan laporan keuangan selama 30 hari pilot"
    capability_reuse:
      existing_capabilities: ["deal-coordinator.reconciliation.execute", "value-metering.usage-measurement.record", "connector-ecosystem.transaction.ingest"]
      eos_core_capabilities: ["core.governance-evidence", "core.work-continuity", "core.connector-ecosystem"]
      no_new_primitives: true # EOS Core FROZEN, tidak buat capability baru
    capabilities: ["transaction-ingestion", "reconciliation", "exception-handling", "financial-reporting"]
    shared_capabilities: ["value-metering.usage-tracking", "deal-coordinator.reconciliation", "connector-ecosystem.bank-payment-gateway"]
    eos_capabilities: ["core.connector-ecosystem", "core.governance-evidence", "core.work-continuity"]
    verified_capabilities: # Phase 1: Semua capability sudah terverifikasi dapat diinvoke
      - "deal-coordinator.reconciliation.execute"
      - "value-metering.usage-measurement.record"
      - "connector-ecosystem.transaction.ingest"
      - "work.exception.create"
      - "work.exception.assign"
      - "work.exception.resolve"
  - id: "content-growth-operations"
    name: "Content & Growth Operations"
    description: "Mengelola siklus hidup konten, optimasi anggaran iklan, dan kualitas data CRM"
    scope:
      - "Pengelolaan lifecycle konten video/artikel dari ide sampai distribusi"
      - "Otomatisasi repurposing konten (long-form → short-form)"
      - "Manajemen provider kreatif dengan approval workflow"
      - "Optimasi ad-spend ROI dengan dynamic budget adjustment (dengan batas approval manusia)"
      - "Laporan performa konten dengan engagement metrics"
    pricing_hypothesis:
      standard:
        setup_fee_idr: 2000000
        recurring_fee_monthly_idr: 1200000
        target_customer: "Kreator/UMKM konten"
      professional:
        setup_fee_idr: 4500000
        recurring_fee_monthly_idr: 3000000
        target_customer: "Bisnis media/agency"
      enterprise:
        setup_fee_idr: 10000000
        recurring_fee_monthly_idr: 7000000
        target_customer: "Enterprise content team"
    acceptance_criteria:
      - "Waktu produksi konten turun 40% dari baseline manual"
      - "100% konten melewati editorial review sebelum publikasi"
      - "Ad-spend ROI meningkat minimal 15% selama pilot"
      - "Semua distribusi sesuai jadwal tanpa keterlambatan"
      - "Customer memberikan renewal intent setelah 30 hari"
    capability_reuse:
      existing_capabilities: ["smace.content.process", "value-metering.ad-spend.attribute", "crm.data.enrich"]
      eos_core_capabilities: ["core.work-continuity", "core.governance-evidence", "core.connector-ecosystem"]
      no_new_primitives: true # EOS Core FROZEN, tidak buat capability baru
    capabilities: ["content-lifecycle", "ad-spend-optimization", "crm-enrichment", "lead-intelligence", "editorial-qa"]
    shared_capabilities: ["value-metering.content-metering", "deal-coordinator.agreement-tracking", "connector-ecosystem.social-media-ad-platform"]
    eos_capabilities: ["core.connector-ecosystem", "core.atomic-composition", "core.execution-coordination"]
    verified_capabilities: # Phase 1: Semua capability sudah terverifikasi dapat diinvoke
      - "smace.content.process"
      - "value-metering.ad-spend.attribute"
      - "crm.data.enrich"
      - "work.approval.request"
      - "work.approval.fulfill"
  - id: "customer-commerce-operations"
    name: "Customer & Commerce Operations"
    description: "Mengelola eskalasi dukungan pelanggan, intelijen harga pesaing, dan penanganan exception order"
    scope:
      - "Customer care escalation dengan jalur manusia yang jelas (sesuai kebijakan WhatsApp/Instagram)"
      - "CRM data quality: deduplikasi, normalisasi, enrichment"
      - "Competitor pricing intelligence (alert perubahan harga, bukan repricing otomatis)"
      - "Lead intelligence dari sumber yang sah (tidak scraping ilegal)"
      - "Penanganan refund dengan otorisasi yang teraudit"
    pricing_hypothesis:
      standard:
        setup_fee_idr: 2500000
        recurring_fee_monthly_idr: 1500000
        target_customer: "Toko online/merchant"
      professional:
        setup_fee_idr: 5500000
        recurring_fee_monthly_idr: 3500000
        target_customer: "Bisnis retail multi-channel"
      enterprise:
        setup_fee_idr: 12000000
        recurring_fee_monthly_idr: 8000000
        target_customer: "Enterprise commerce"
    acceptance_criteria:
      - "Waktu resolusi customer care turun 50% dari baseline"
      - "CRM data accuracy meningkat menjadi 98%"
      - "100% eskalasi manusia sesuai SLA (dalam 24 jam kerja)"
      - "Tidak ada pelanggaran kebijakan platform komunikasi"
      - "Customer menyatakan satisfaction score >4/5"
    capability_reuse:
      existing_capabilities: ["deal-coordinator.case-escalation.execute", "value-metering.usage-measurement.record", "connector-ecosystem.crm-sync"]
      eos_core_capabilities: ["core.policy-enforcement", "core.work-continuity", "core.governance-evidence"]
      no_new_primitives: true # EOS Core FROZEN, tidak buat capability baru
    capabilities: ["message-classification", "customer-lookup", "policy-entitlement-check", "pricing-intelligence", "order-exception-handling"]
    shared_capabilities: ["value-metering.support-metering", "deal-coordinator.escalation-tracking", "connector-ecosystem.whatsapp-instagram-email"]
    eos_capabilities: ["core.communication", "core.connector-ecosystem", "core.security-hardening"]
    verified_capabilities: # Phase 1: Semua capability sudah terverifikasi dapat diinvoke
      - "communication.message.classify"
      - "customer.order.lookup"
      - "policy.entitlement.verify"
      - "work.escalation.create"
      - "work.resolution.record"
