    name: "Website & Platform Recovery"
    description: "Pemulihan website dan platform setelah downtime, hack, atau data loss"
    fee_id: "fee-recovery"
    delivery_time: "on-demand"
  - id: "integration-health-check"
    name: "Integration Health Check"
    description: "Audit integrasi sistem, konektivitas API, dan data synchronization"
    fee_id: "fee-integration-check"
    delivery_time: "3 hari kerja"
  - id: "security-reliability-assessment"
    name: "Security & Reliability Assessment"
