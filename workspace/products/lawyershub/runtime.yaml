
runtime:
  product: lawyershub
  version: "0.1.0"

  components:
    - name: api
      type: backend
      technology: python
      port: 8000
      health_check: /health
      dependencies:
        - capability: identity
    - name: web
      type: frontend
      technology: react
      port: 3000
      health_check: /
      dependencies:
        - component: api

  capabilities:
    - identity:
        contract_path: ../../contracts/identity/identity-contract.yaml
        usage: authentication

  environments:
    development:
      domain: localhost
      api_base_url: http://localhost:8000
      web_base_url: http://localhost:3000
      database:
        type: postgresql
        host: localhost
        port: 5432
        name: lawyershub_dev
    staging:
      domain: staging.lawyershub.id
      api_base_url: https://api.staging.lawyershub.id
      web_base_url: https://staging.lawyershub.id
      database:
        type: postgresql
        isolated: true
    production:
      domain: lawyershub.id
      api_base_url: https://api.lawyershub.id
      web_base_url: https://lawyershub.id
      database:
        type: postgresql
        isolated: true
        monitoring_enabled: true

  deployment:
    method: docker-compose
    docker_compose_path: ./deployment/docker-compose.yaml

  evidence:
    capture_enabled: true
    log_path: ./evidence/runtime.log
    metrics_enabled: true
