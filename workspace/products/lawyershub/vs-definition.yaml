id: VS-001

experiment:
  id: EXP-001-lawyershub

name: "Client-to-Matter Management"

objective: "Validate EOS ability to guide delivery of a real business capability through evidence-driven execution."

scope:
  included:
    - Client creation
    - Client profile management
    - Legal matter creation
    - Matter status tracking
    - Basic activity timeline
  excluded:
    - Document management
    - Billing
    - Court integration
    - Collaboration workflow
    - AI legal assistant
    - Multi-tenant optimization

primary_actor: "Lawyer"

user_journey: |
  Lawyer
    ↓
  Create Client
    ↓
  View Client Profile
    ↓
  Create Legal Matter
    ↓
  Update Matter Status
    ↓
  Review Matter Timeline
    ↓
  Understand Current Case State

business_outcome:
  outcome:
    capability_validated:
      - Client Management
      - Matter Management
    user_value:
      - Reduce client information fragmentation
      - Improve matter visibility
      - Establish operational record

capability_mapping:
  "Business Capability": "Legal Practice Management"
  "Business Capabilities (CBP":
    - "Client Management"
    - "Matter Management"
  "Business Service": "Client & Matter Tracking Service"
  "Platform Capabilities":
    - Application Runtime
    - Database
    - Authentication
    - Deployment Pipeline

implementation_boundary:
  architecture_decision: "Modular Monolith"
  directory_structure:
    - client
    - matter
    - activity
    - identity
    - shared

success_criteria:
  product_success:
    - Lawyer dapat membuat client (User flow berhasil)
    - Lawyer dapat membuat matter (Matter tersimpan)
    - Lawyer dapat melihat status matter (Status view tersedia)
    - Aktivitas tercatat (Timeline tersedia)
    - Deployment berjalan (Production/staging URL)
  eos_success:
    - Workspace Event → Observation → Validation → Decision → Implementation → Observation → Learning
