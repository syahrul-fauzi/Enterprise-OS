version: "1.0"
workspace:
  name: lawyershub
  display_name: LawyersHub
  description: Platform manajemen kasus hukum untuk advokat dan firma hukum di Indonesia
lifecycle:
  phase: D.2
  status: ACTIVE
  contract:
    stages:
      - name: discover
        description: Pengguna menemukan dan memahami produk
        terminal: false
      - name: create
        description: Pengguna membuat legal matter baru
        terminal: false
      - name: execute
        description: Proses kasus berjalan dengan assignment lawyer
        terminal: false
      - name: progress
        description: Update status kasus secara berkala
        terminal: false
      - name: evidence
        description: Mengumpulkan semua bukti eksekusi
        terminal: false
      - name: complete
        description: Kasus selesai, evidence terverifikasi
        terminal: true
  real_user_jobs:
    - id: lh-case-101
      name: Create/manage legal matter
      description: Full lifecycle manajemen kasus hukum litigasi perusahaan
      status: completed
      requirements:
        - req-lh-001
    - id: lh-case-102
      name: Legal Document Generation
      description: Generasi dokumen hukum otomatis dengan compliance check dan legal templates
      status: completed
      requirements:
        - req-lh-002
    - id: lh-case-103
      name: Automate legal intake
      description: Full lifecycle otomatisasi intake kasus hukum dari formulir klien hingga penugasan advokat
      status: completed
      requirements:
        - req-lh-003
quality:
  targets:
    evidence_required: true
    test_coverage_min: 80
    runtime_invocation_required: true
governance:
  baseline_locked: true
  needs_audit: false
  evidence_path: ./evidence