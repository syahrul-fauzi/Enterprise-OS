# LawyersHub Workspace Constitution
version: "1.1"

workspace:
  name: lawyershub
  description: "Legal practice management platform"

lifecycle:
  phase: C1.3
  status: Release Candidate

contracts:
  evidence: required
  tests: required
  deployment: optional

production:
  target:
    readiness: 90
  deployment:
    status: pending
    target:
  monitoring:
    status: pending
  backup:
    status: pending

quality:
  coverage:
    minimum: 80
  tests:
    enabled: true
    directory: tests
  linting:
    enabled: true
  typechecking:
    enabled: true

technology:
  backend:
    language: python
    framework: fastapi
  frontend:
    language: javascript
    framework: vanilla

evidence:
  enabled: true
  directory: evidence
