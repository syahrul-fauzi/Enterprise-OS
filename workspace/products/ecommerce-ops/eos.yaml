version: "1.0"
workspace:
  name: ecommerce-ops
  display_name: E-commerce Ops
  description: Kategori pekerjaan universal untuk manajemen pesanan marketplace, pengelolaan inventory, rekonsiliasi pembayaran, dan operasional e-commerce
lifecycle:
  phase: D.2
  status: ACTIVE
  contract:
    stages:
      - name: discover
        description: Pesanan baru diterima dari marketplace (Shopee/Lazada/Tokopedia) dan sinkronkan ke canonical Work (EOS 6-stage lifecycle phase 1)
        terminal: false
      - name: create
        description: Buat Work baru dengan detail order, customer, dan inventory (EOS 6-stage lifecycle phase 2)
        terminal: false
      - name: execute
        description: Jalankan proses fulfillment: verifikasi pembayaran, cek stock, generate label shipping, serahkan ke logistik (EOS 6-stage lifecycle phase 3)
        terminal: false
      - name: progress
        description: Pantau pengiriman real-time, sinkronkan status balik ke marketplace (EOS 6-stage lifecycle phase 4)
        terminal: false
      - name: evidence
        description: Rekonsiliasi semua biaya (logistik, fee marketplace, inventory), catat revenue di governance-evidence (EOS 6-stage lifecycle phase 5)
        terminal: false
      - name: complete
        description: Arsipkan semua bukti transaksi, tutup Work secara resmi (EOS 6-stage lifecycle phase 6)
        terminal: true
  real_user_jobs:
    - id: ecom-101
      name: Shopee order fulfillment lifecycle
      description: Full cycle manajemen pesanan Shopee mulai dari sinkronisasi hingga penutupan pesanan
      status: completed
      requirements:
        - req-ecom-001
    - id: ecom-102
      name: Marketplace order fulfillment automation
      description: Automasi penuh manajemen pesanan lintas marketplace (Shopee, Tokopedia, Lazada, TikTok Shop, WooCommerce)
      status: completed
      requirements:
        - req-ecom-002
quality:
  targets:
    evidence_required: true
    test_coverage_min: 85
    runtime_invocation_required: true
governance:
  baseline_locked: true
  needs_audit: false
  evidence_path: ./evidence