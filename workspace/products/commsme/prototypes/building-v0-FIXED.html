<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EOS Building v0 - FIXED - Human Prototype</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        
        html, body {
            background-color: #fafafa;
            min-height: 100vh;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
        }
        
        #app {
            width: 100%;
            max-width: 420px;
            min-width: 100%;
            margin: 0 auto;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 3px solid red; /* Debug border - lihat batas container */
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .pulse-dot {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Lobby specific styles */
        .lobby-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 20px;
            font-weight: 700;
        }
        
        .lobby-header .brand-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .lobby-header .brand-primary {
            color: #1c1917;
        }
        
        .lobby-header .brand-secondary {
            color: #78716c;
        }
        
        .lobby-header .header-profile {
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }
        
        .lobby-header .header-profile:hover {
            background-color: #f5f5f4;
        }
        
        .input-microcopy {
            font-size: 12px;
            color: #78716c;
            line-height: 1.4;
            margin-top: 8px;
            text-align: center;
        }
        
        /* Onboarding card untuk pengguna baru */
        .onboarding-card {
            background-color: #fafaf9;
            border: 1px solid #e7e5e4;
            border-radius: 16px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .onboarding-card h3 {
            font-size: 18px;
            font-weight: 600;
            color: #1c1917;
            margin: 0;
        }
        
        .onboarding-card p {
            font-size: 14px;
            color: #57534e;
            line-height: 1.5;
            margin: 0;
        }
        
        .example-prompts {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }
        
        .example-pill {
            background-color: white;
            border: 1px solid #d6d3d1;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            color: #44403c;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .example-pill:hover {
            background-color: #f5f5f4;
            border-color: #a8a29e;
        }
        
        .main-question {
            margin-top: 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .main-title {
            font-size: clamp(1.5rem, 5vw, 2rem);
            line-height: 1.3;
            color: #292524;
            font-weight: 700;
            width: 100%;
        }
        
        .input-group {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }
        
        #main-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d6d3d1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        
        #main-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
        }
        
        #start-btn {
            width: 100%;
            background-color: #1c1917;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        #start-btn:hover {
            background-color: #44403c;
        }
        
        .quick-options-section {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }
        
        .quick-options-label {
            font-size: 14px;
            color: #57534e;
            margin-bottom: 8px;
        }
        
        .work-card {
            background-color: white;
            border: 1px solid #e7e5e4;
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .work-card:hover {
            border-color: #a8a29e;
        }
        
        .work-card.new-work:hover {
            border-color: #93c5fd;
            background-color: #eff6ff;
        }
        
        .work-card-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        
        .work-card-title {
            font-size: 16px;
            font-weight: 500;
            color: #292524;
        }
        
        .work-card-arrow {
            color: #a8a29e;
            font-size: 16px;
        }
        
        .active-works-section {
            margin-top: 32px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .active-works-label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #78716c;
        }

        /* Common back button styles */
        .back-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }

        #back-btn, #back-to-lobby-btn, #back-lobby-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #back-btn:hover, #back-to-lobby-btn:hover, #back-lobby-btn:hover {
            background-color: #f5f5f4;
        }

        .back-label {
            font-size: 14px;
            color: #78716c;
        }

        /* Work state styles */
        .work-content {
            display: flex;
            flex-direction: column;
            gap: 32px;
            padding-top: 16px;
        }

        .work-title {
            font-size: 24px;
            font-weight: 500;
            color: #292524;
        }

        .work-card {
            background-color: white;
            border: 1px solid #e7e5e4;
            border-radius: 16px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .section-label {
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #57534e;
            margin-bottom: 16px;
        }

        .completed-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .check-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #bbf7d0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .check-icon svg {
            width: 12px;
            height: 12px;
            color: #16a34a;
        }

        .item-text {
            color: #44403c;
        }

        .work-input {
            width: 100%;
            padding: 16px;
            border: 1px solid #d6d3d1;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        .work-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
        }

        .continue-btn {
            align-self: flex-end;
            padding: 12px 24px;
            background-color: #1c1917;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .continue-btn:hover {
            background-color: #44403c;
        }

        /* Legal case workspace styles */
        .case-status-card {
            background-color: white;
            border: 1px solid #e7e5e4;
            border-radius: 16px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .case-title {
            font-size: 24px;
            font-weight: 600;
            color: #1c1917;
            padding-bottom: 16px;
            border-bottom: 1px solid #e7e5e4;
        }

        .case-meta {
            color: #78716c;
            margin-top: 4px;
        }

        .assign-lawyer-btn {
            padding: 8px 16px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .assign-lawyer-btn:hover {
            background-color: #3b82f6;
        }

        .close-case-btn {
            padding: 8px 16px;
            background-color: #1c1917;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .close-case-btn:hover {
            background-color: #44403c;
        }

        .case-id {
            font-size: 14px;
            color: #78716c;
            padding-top: 16px;
        }

        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        /* Waiting state styles */
        .waiting-card {
            background-color: white;
            border: 1px solid #e7e5e4;
            border-radius: 16px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .waiting-title {
            font-size: 24px;
            font-weight: 500;
            color: #292524;
        }

        .waiting-status {
            font-size: 20px;
            color: #44403c;
            margin-bottom: 12px;
        }

        .waiting-description {
            color: #78716c;
            line-height: 1.5;
        }

        .waiting-note {
            border-top: 1px solid #e7e5e4;
            padding-top: 32px;
        }

        .waiting-note-title {
            font-size: 18px;
            color: #57534e;
            margin-bottom: 8px;
        }

        .waiting-note-desc {
            color: #a8a29e;
            line-height: 1.5;
        }

        .finish-btn {
            align-self: flex-start;
            padding: 12px 24px;
            background-color: #1c1917;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .finish-btn:hover {
            background-color: #44403c;
        }

        /* Result state styles */
        .success-card {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 16px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Aplikasi akan di-render oleh JavaScript -->
    </div>

    <script>
        // EOS Capability Registry Bridge - minimal binding only, no new business logic
        window.capabilityRegistry = {
            async invoke(capability, commandName, input) {
                console.log(`[capability-registry] Invoked: ${capability}.${commandName}`, input);
                // Reuse existing legal-case command schemas from capability (LawyersHub C1)
                if (capability === "legal-case" && commandName === "case.create") {
                    return {
                        output: { id: `case-${Date.now()}`, status: "draft" },
                        record: { ok: true, invokedAt: new Date().toISOString() }
                    };
                }
                if (capability === "legal-case" && commandName === "case.assignLawyer") {
                    return {
                        output: { id: input.id, lawyerId: input.lawyerId, status: "in_progress" },
                        record: { ok: true, invokedAt: new Date().toISOString() }
                    };
                }
                if (capability === "legal-case" && commandName === "case.close") {
                    return {
                        output: { id: input.id, status: "closed" },
                        record: { ok: true, invokedAt: new Date().toISOString() }
                    };
                }
                // Reuse existing service-directory command schemas from capability (Services.ID C2)
                if (capability === "service-directory" && commandName === "createServiceRequest") {
                    return {
                        output: { id: `sr-${Date.now()}`, status: "draft" },
                        record: { ok: true, invokedAt: new Date().toISOString() }
                    };
                }
                if (capability === "service-directory" && commandName === "acceptServiceRequest") {
                    return {
                        output: { id: input.id, providerId: input.providerId, status: "accepted" },
                        record: { ok: true, invokedAt: new Date().toISOString() }
                    };
                }
                if (capability === "service-directory" && commandName === "markServiceDelivered") {
                    return {
                        output: { id: input.id, status: "delivered", deliveredAt: new Date() },
                        record: { ok: true, invokedAt: new Date().toISOString() }
                    };
                }
                throw new Error(`Command not found: ${capability}.${commandName}`);
            }
        };

        // State aplikasi
        let currentState = 'LOBBY'; // LOBBY | WORK | WAITING | RESULT
        let selectedWork = null;
        let currentCase = null; // Preserve case context between renders (no context reconstruction)

        // Data pekerjaan aktif
        const activeWorks = [
            { id: 'nda-vendor', title: 'NDA Vendor', status: 'active' },
            { id: 'pt-establishment', title: 'PT Establishment', status: 'active' }
        ];

        // Pilihan pekerjaan baru (categorical intent actions - UX optimized)
        const newWorkOptions = [
            { id: 'perizinan-nib', title: '📋 Layanan Perizinan & NIB' },
            { id: 'kontrak-mitra', title: '📝 Drafting Kontrak & Perjanjian' },
            { id: 'konsultasi-hukum', title: '⚡ Konsultasi Hukum Fast-Track' }
        ];

        // Data untuk state WORK (ketika user pilih pekerjaan)
        const workData = {
            'perizinan-nib': {
                title: 'Pengurusan Perizinan & NIB',
                completed: ['data usaha', 'alamat tempat usaha', 'identitas pemilik'],
                needed: 'Detail skala usaha dan jenis barang/jasa',
                nextAction: 'Lanjutkan Proses'
            },
            'kontrak-mitra': {
                title: 'Drafting Kontrak & Perjanjian',
                completed: ['informasi perusahaan', 'data mitra', 'kebutuhan kontrak'],
                needed: 'Detail jangka waktu kerjasama',
                nextAction: 'Lanjutkan'
            },
            'konsultasi-hukum': {
                title: 'Konsultasi Hukum Fast-Track',
                completed: ['identitas pemohon', 'deskripsi awal masalah'],
                needed: 'Dokumen pendukung jika ada',
                nextAction: 'Jadwalkan Konsultasi'
            },
            'legal-case': {
                title: 'Kasus Hukum Umum',
                completed: ['data klien', 'detail kasus', 'dokumen pendukung'],
                needed: 'Bukti pendukung tambahan',
                nextAction: 'Lanjutkan'
            }
        };

        // Render fungsi utama
        function render() {
            const app = document.getElementById('app');
            switch(currentState) {
                case 'LOBBY':
                    app.innerHTML = renderLobby();
                    break;
                case 'WORK':
                    app.innerHTML = renderWork();
                    break;
                case 'WAITING':
                    app.innerHTML = renderWaiting();
                    break;
                case 'RESULT':
                    app.innerHTML = renderResult();
                    break;
            }
            attachEventListeners();
        }

        // Render LOBBY (state awal)
        function renderLobby() {
            const activeWorksHtml = activeWorks.map(work => `
                <div class="work-card" data-id="${work.id}">
                    <div class="work-card-content">
                        <span class="work-card-title">${work.title}</span>
                        <span class="work-card-arrow">→</span>
                    </div>
                </div>
            `).join('');

            const newWorksHtml = newWorkOptions.map(work => `
                <div class="work-card new-work" data-id="${work.id}">
                    <div class="work-card-content">
                        <span class="work-card-title">${work.title}</span>
                        <span class="work-card-arrow">+</span>
                    </div>
                </div>
            `).join('');

            return `
                <div class="fade-in">
                    <!-- Header -->
                    <div class="lobby-header">
                        <div class="brand-group">
                            <span class="brand-primary">hola</span>
                            <span class="brand-secondary">CommsMe</span>
                        </div>
                        <span class="header-profile" aria-label="Buka profil pengguna">👤</span>
                    </div>

                    <!-- Conditional Hierarchy - Pertama: Pekerjaan yang sedang berjalan (untuk returning user) -->
                    ${activeWorks.length > 0 ? `
                    <div class="active-works-section">
                        <p class="active-works-label">📌 Pekerjaan yang masih berjalan:</p>
                        ${activeWorksHtml}
                    </div>
                    ` : `
                    <!-- Empty State / Onboarding untuk pengguna BARU (activeWorks = []) -->
                    <div class="onboarding-card">
                        <h3>👋 Selamat datang di CommsMe!</h3>
                        <p>Kami bantu urusan legal dan perizinan UMKM Anda jadi lebih mudah. Coba ketik contoh ini:</p>
                        <div class="example-prompts">
                            <span class="example-pill">"Saya mau daftar NIB untuk usaha katering"</span>
                            <span class="example-pill">"Butuh kontrak kerja sama dengan supplier"</span>
                        </div>
                    </div>
                    `}

                    <!-- Second: Primary Action Block (buat permintaan baru) -->
                    <div class="main-question">
                        <h1 class="main-title">Apa yang ingin Anda selesaikan hari ini?</h1>
                        
                        <!-- Input intent bebas - SATU-SATUNYA entry point utama -->
                        <div class="input-group">
                            <input id="main-input" type="text" placeholder="Ketik masalah Anda, sistem AI akan mengarahkan ke tim yang tepat..." aria-label="Input deskripsi kebutuhan Anda">
                            <button id="start-btn" aria-label="Mulai proses analisis kebutuhan">Proses & Analisis →</button>
                        </div>
                        <p class="input-microcopy">AI kami akan langsung menganalisis kebutuhan Anda dan menghubungkan ke divisi perizinan atau tim hukum yang sesuai.</p>

                        <!-- Pilihan cepat sebagai SHORTCUT saja, bukan entry point kedua -->
                        <div class="quick-options-section">
                            <span class="quick-options-label">atau pilih layanan cepat:</span>
                            ${newWorksHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        // Render Legal Case Workspace - LawyersHub integration (reuses existing legal-case capability)
        function renderLegalCaseWorkspace() {
            // If we have an existing case, preserve context (0 reconstruction)
            if (currentCase) {
                const statusText = currentCase.status === "draft" ? "Belum dimulai" : "Sedang dikerjakan";
                const finalStatusText = currentCase.status === "closed" || currentCase.status === "delivered" || currentCase.status === "implemented" ? "Selesai" : statusText;
                
                return `
                    <div class="fade-in">
                        <header class="back-header">
                            <button id="back-btn">
                                <svg class="w-5 h-5 text-stone-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                                </svg>
                            </button>
                            <span class="back-label">Kembali ke lobby</span>
                        </header>
                        <div class="work-content">
                            <div class="case-status-card">
                                <div>
                                    <h2 class="case-title">${currentCase.title}</h2>
                                    <p class="case-meta">Status: ${finalStatusText} | Penanggung jawab: ${currentCase.isRequirement ? (currentCase.requirementOwner || "Belum ditugaskan") : currentCase.isITService ? (currentCase.providerId || "Belum ditugaskan") : (currentCase.lawyerId || "Belum ditugaskan")}</p>
                            </div>
                            ${currentCase.status === "draft" ? `
                                    <button id="assign-handler-btn" class="assign-lawyer-btn">Tugaskan orang yang mengerjakan</button>
                                ` : ""}
                                ${(currentCase.status === "in_progress" || currentCase.status === "accepted" || currentCase.status === "delivery_started") && (currentCase.requirementOwner || currentCase.providerId || currentCase.lawyerId) ? `
                                    <button id="close-case-btn" class="close-case-btn">Tandai Selesai</button>
                                ` : ""}
                                <!-- ID disembunyikan: end-user tidak membutuhkannya, hanya untuk internal sistem -->
                            </div>
                        </div>
                    </div>
                `;
            }

            // Loading state for first render - BUILDING AS UNIFIED ENTRY POINT (C3)
            setTimeout(async () => {
                const mainInput = document.getElementById('main-input');
                const userNeed = mainInput?.value?.trim() || "Masalah hukum dengan vendor";
                
                // DETECT DOMAIN OTOMATIS dari input pengguna (tanpa pengguna pilih manual)
                const itKeywords = ["server", "it support", "website", "aplikasi", "cybersecurity", "cloud", "internet", "komputer", "laptop"];
                const requirementKeywords = ["butuh fitur", "perlu fitur", "feature request", "development", "product requirement", "kebutuhan produk", "backlog"];
                const isITNeed = itKeywords.some(keyword => userNeed.toLowerCase().includes(keyword));
                const isRequirementNeed = requirementKeywords.some(keyword => userNeed.toLowerCase().includes(keyword));
                
                // BUILDING ROUTING: Panggil capability yang TEPAT berdasarkan domain (0 new capability, reuse semua yang ada)
                let createResult;
                let contextObj;
                
                if (isRequirementNeed) {
                    // ROUTE TO ILC (Product Requirements domain) - invoke requirement-management capability (Slice C4)
                    const { output } = await window.capabilityRegistry.invoke("requirement-management", "requirement.create", {
                        title: userNeed,
                        description: userNeed,
                        productId: "ilc",
                        sessionId: "session-test-001",
                        priority: "medium"
                    });
                    createResult = output;
                    contextObj = {
                        id: createResult.id,
                        title: userNeed,
                        status: createResult.status,
                        requirementOwner: null,
                        isITService: false,
                        isRequirement: true
                    };
                    console.log(`[BUILDING.ROUTER] Detected product requirement, routed to ILC/requirement-management: ${userNeed}`);
                } else if (isITNeed) {
                    // ROUTE TO SERVICES.ID (IT domain) - invoke service-directory capability (Slice C2)
                    const { output } = await window.capabilityRegistry.invoke("service-directory", "createServiceRequest", {
                        title: userNeed,
                        category: "IT Support",
                        sessionId: "session-test-001"
                    });
                    createResult = output;
                    contextObj = {
                        id: createResult.id,
                        title: userNeed,
                        status: createResult.status,
                        providerId: null,
                        isITService: true,
                        isRequirement: false
                    };
                    console.log(`[BUILDING.ROUTER] Detected IT need, routed to Services.ID: ${userNeed}`);
                } else {
                    // ROUTE TO LAWYERSHUB (Legal domain) - invoke legal-case capability (Slice C1)
                    const { output } = await window.capabilityRegistry.invoke("legal-case", "case.create", {
                        title: userNeed,
                        sessionId: "session-test-001",
                        priority: "medium"
                    });
                    createResult = output;
                    contextObj = {
                        id: createResult.id,
                        title: userNeed,
                        status: createResult.status,
                        lawyerId: null,
                        isITService: false,
                        isRequirement: false
                    };
                    console.log(`[BUILDING.ROUTER] Detected legal need, routed to LawyersHub: ${userNeed}`);
                }

                // Preserve context globally to avoid reconstruction
                currentCase = contextObj;

                // Re-render with preserved context
                render();
            }, 100);

            return `
                <div class="fade-in">
                    <header class="back-header">
                        <button id="back-btn">
                            <svg class="w-5 h-5 text-stone-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                            </svg>
                        </button>
                        <span class="back-label">Kembali ke lobby</span>
                    </header>
                    <div class="work-content">
                        <div class="case-status-card loading-state">
                            <div class="pulse-dot w-3 h-3 bg-blue-600 rounded-full"></div>
                            <p style="color: #78716c;">Memuat kasus hukum...</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render Work state
        function renderWork() {
            const work = workData[selectedWork];
            if (!work) return `<div>Error: Work not found</div>`;

            const completedHtml = work.completed.map(item => `
                <div class="completed-item">
                    <span class="check-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                        </svg>
                    </span>
                    <span class="item-text">${item}</span>
                </div>
            `).join('');

            return `
                <div class="fade-in">
                    <header class="back-header">
                        <button id="back-to-lobby-btn">
                            <svg class="w-5 h-5 text-stone-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                            </svg>
                        </button>
                        <span class="back-label">Kembali ke lobby</span>
                    </header>
                    <div class="work-content">
                        <h1 class="work-title">${work.title}</h1>
                        <div class="work-card">
                            <div>
                                <p class="section-label">Sudah selesai</p>
                                ${completedHtml}
                            </div>
                            <div>
                                <p class="section-label">Butuh data lagi</p>
                                <input class="work-input" type="text" placeholder="${work.needed}" id="work-input">
                            </div>
                            <button id="continue-btn" class="continue-btn">${work.nextAction}</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render Waiting state
        function renderWaiting() {
            return `
                <div class="fade-in">
                    <header class="back-header">
                        <button id="back-lobby-btn">
                            <svg class="w-5 h-5 text-stone-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                            </svg>
                        </button>
                        <span class="back-label">Batal</span>
                    </header>
                    <div class="work-content">
                        <div class="waiting-card">
                            <h1 class="waiting-title">Prosesmu sedang ditangani</h1>
                            <div>
                                <p class="waiting-status">Menunggu advokat...</p>
                                <p class="waiting-description">Tim hukum kami sedang memproses permintaanmu. Kamu akan mendapatkan notifikasi ketika advokat telah ditugaskan.</p>
                            </div>
                            <div class="waiting-note">
                                <p class="waiting-note-title">Butuh bantuan lebih cepat?</p>
                                <p class="waiting-note-desc">Hubungi support di support@commsme.id untuk prioritas prosesmu.</p>
                            </div>
                        </div>
                        <button id="finish-early-btn" class="finish-btn">Selesaikan lebih awal</button>
                    </div>
                </div>
            `;
        }

        // Render Result state
        function renderResult() {
            return `
                <div class="fade-in">
                    <header class="back-header">
                        <button id="back-to-start-btn">
                            <svg class="w-5 h-5 text-stone-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                            </svg>
                        </button>
                        <span class="back-label">Kembali awal</span>
                    </header>
                    <div class="work-content">
                        <div class="success-card">
                            <div style="font-size: 48px;">✅</div>
                            <h2 style="font-size: 24px; font-weight: 600; color: #166534;">Selesai!</h2>
                            <p style="color: #15803d; line-height: 1.6;">Dokumen kontrakmu telah berhasil dibuat dan siap untuk ditandatangani. Cek emailmu untuk download file PDF.</p>
                            <button id="download-btn" style="padding: 12px 24px; background-color: #16a34a; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; align-self: center;">Download Dokumen</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Attach semua event listeners setelah render
        function attachEventListeners() {
            // Back button listeners (semua state)
            const backButtons = ['back-btn', 'back-to-lobby-btn', 'back-lobby-btn', 'back-to-start-btn'];
            backButtons.forEach(id => {
                const btn = document.getElementById(id);
                if (btn) {
                    btn.addEventListener('click', () => {
                        currentState = 'LOBBY';
                        currentCase = null;
                        render();
                    });
                }
            });

            // Lobby start button
            const startBtn = document.getElementById('start-btn');
            if (startBtn) {
                startBtn.addEventListener('click', () => {
                    const input = document.getElementById('main-input');
                    const inputValue = input?.value?.trim() || "";
                    
                    // Error state: input kosong
                    if (inputValue.length === 0) {
                        alert("Mohon ceritakan kebutuhan Anda terlebih dahulu sebelum memulai proses.");
                        return;
                    }

                    // Ambiguity detection logic (basic keyword matching untuk prototype)
                    const nibKeywords = ['nib', 'perizinan', 'daftar', 'pirt', 'ijin'];
                    const kontrakKeywords = ['kontrak', 'perjanjian', 'mitra', 'vendor', 'supplier'];
                    const konsultasiKeywords = ['konsultasi', 'hukum', 'pengacara', 'bingung', 'tidak tahu'];
                    
                    const hasNib = nibKeywords.some(k => inputValue.toLowerCase().includes(k));
                    const hasKontrak = kontrakKeywords.some(k => inputValue.toLowerCase().includes(k));
                    const hasKonsultasi = konsultasiKeywords.some(k => inputValue.toLowerCase().includes(k));
                    
                    // FALLBACK: Jika tidak ada keyword yang cocok (input ambigu), arahkan ke triage konsultasi
                    if (!hasNib && !hasKontrak && !hasKonsultasi) {
                        selectedWork = 'konsultasi-hukum'; // Consultation triage
                    } else if (hasNib) {
                        selectedWork = 'perizinan-nib';
                    } else if (hasKontrak) {
                        selectedWork = 'kontrak-mitra';
                    } else {
                        selectedWork = 'legal-case';
                    }
                    
                    currentState = 'WORK';
                    render();
                });
            }
            
            // Tambahkan click listener untuk example-pills (isi input otomatis)
            document.querySelectorAll('.example-pill').forEach(pill => {
                pill.addEventListener('click', () => {
                    const input = document.getElementById('main-input');
                    if (input) {
                        input.value = pill.textContent.replace(/"/g, '');
                    }
                });
            });

            // Work card click listeners (lobby)
            document.querySelectorAll('.work-card').forEach(card => {
                card.addEventListener('click', () => {
                    const id = card.dataset.id;
                    if (id === 'legal-case') {
                        // Legal case special handling
                        currentState = 'WORK';
                        selectedWork = 'legal-case';
                    } else {
                        selectedWork = id;
                        currentState = 'WORK';
                    }
                    render();
                });
            });

            // Continue button (work state)
            const continueBtn = document.getElementById('continue-btn');
            if (continueBtn) {
                continueBtn.addEventListener('click', () => {
                    currentState = 'WAITING';
                    render();
                });
            }

            // Finish early button (waiting state)
            const finishEarlyBtn = document.getElementById('finish-early-btn');
            if (finishEarlyBtn) {
                finishEarlyBtn.addEventListener('click', () => {
                    currentState = 'RESULT';
                    render();
                });
            }

            // Download button (result state)
            const downloadBtn = document.getElementById('download-btn');
            if (downloadBtn) {
                downloadBtn.addEventListener('click', () => {
                    currentState = 'LOBBY';
                    currentCase = null;
                    render();
                });
            }

            // Unified assign handler button (works for all domains)
            const assignHandlerBtn = document.getElementById('assign-handler-btn');
            if (assignHandlerBtn) {
                assignHandlerBtn.addEventListener('click', async () => {
                    if (currentCase.isRequirement) {
                        await window.capabilityRegistry.invoke("requirement-management", "requirement.startDelivery", { id: currentCase.id, ownerId: "dev-team-001" });
                        currentCase.requirementOwner = "dev-team-001";
                        currentCase.status = "delivery_started";
                    } else if (currentCase.isITService) {
                        await window.capabilityRegistry.invoke("service-directory", "acceptServiceRequest", { id: currentCase.id, providerId: "provider-techfix-001" });
                        currentCase.providerId = "provider-techfix-001";
                        currentCase.status = "accepted";
                    } else {
                        await window.capabilityRegistry.invoke("legal-case", "case.assignLawyer", { id: currentCase.id, lawyerId: "lawyer-123" });
                        currentCase.lawyerId = "lawyer-123";
                        currentCase.status = "in_progress";
                    }
                    render();
                });
            }
            
            // Close case button (handles ALL domains: legal, service, requirement)
            const closeBtn = document.getElementById('close-case-btn');
            if (closeBtn) {
                closeBtn.addEventListener('click', async () => {
                    if (currentCase.isRequirement) {
                        // Untuk ILC: mark requirement sebagai implemented
                        await window.capabilityRegistry.invoke("requirement-management", "requirement.markImplemented", { id: currentCase.id });
                    } else if (currentCase.isITService) {
                        // Untuk Services.ID: mark service sebagai delivered
                        await window.capabilityRegistry.invoke("service-directory", "markServiceDelivered", { id: currentCase.id });
                    } else {
                        // Untuk LawyersHub: close legal case
                        await window.capabilityRegistry.invoke("legal-case", "case.close", { id: currentCase.id });
                    }
                    currentState = 'RESULT';
                    render();
                });
            }

            // Enter key untuk main input
            const mainInput = document.getElementById('main-input');
            if (mainInput) {
                mainInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        selectedWork = 'legal-case';
                        currentState = 'WORK';
                        render();
                    }
                });
            }
        }

        // Inisialisasi aplikasi
        render();
    </script>
</body>
</html>
