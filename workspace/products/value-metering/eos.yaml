version: "1.0"
workspace:
  name: value-metering
  display_name: Operational Economics & Value Measurement
  description: Membuat konsumsi layanan, biaya operasional, dan kontribusi ekonomi dapat diukur serta dipertanggungjawabkan.
lifecycle:
  phase: D.2
  status: ACTIVE
  contract:
    stages:
      - name: discover
        description: Identifikasi sumber usage dan biaya yang perlu diukur (EOS 6-stage lifecycle phase 1)
        terminal: false
      - name: create
        description: Setup metering plan dengan spesifikasi attribution (EOS 6-stage lifecycle phase 2)
        terminal: false
      - name: execute
        description: Jalankan collection dan processing usage data (EOS 6-stage lifecycle phase 3)
        terminal: false
      - name: progress
        description: Pantau consumption, margin, dan biaya secara real-time (EOS 6-stage lifecycle phase 4)
        terminal: false
      - name: evidence
        description: Kumpulkan bukti usage untuk invoice dan audit (EOS 6-stage lifecycle phase 5)
        terminal: false
      - name: complete
        description: Laporan periodik selesai, data terarsipkan (EOS 6-stage lifecycle phase 6)
        terminal: true
  real_user_jobs:
    - id: vm-101
      name: Track and report AI/API/cloud usage consumption
      description: Full lifecycle pengukuran penggunaan resource dan atribusi biaya ke tenant/customer/Work
      status: active
      requirements:
        - req-vm-001
quality:
  targets:
    evidence_required: true
    test_coverage_min: 85
    runtime_invocation_required: true
governance:
  baseline_locked: true
  needs_audit: false
  evidence_path: ./evidence