# EOS Product Manifest: Human+AI Work Organization
# First production vertical slice demonstrating Atomic Work Composition's core value
# Real human work with AI augmentation - the golden path for EOS adoption

product:
  id: human-ai-collab
  name: "Human+AI Work Organization"
  domain: "collaboration"
  maturity: "beta"
  introduced: "2026-08-31"
  
# The core thesis this product proves:
# Atomic Work Composition enables seamless collaboration between Humans, AI Agents, and External Services
# without any changes to core identity or work systems - all as Layer2 projections
thesis: |
  Any piece of work can be decomposed into atomic capability requirements,
  matched to the best available provider (human or machine),
  composed into an ephemeral team, executed, and measured economically.
  No manual team creation, no identity duplication, no organizational silos.

# This product directly validates E1 Capability Provider Economy Audit
# 3 of 5 provider types in production use: Human Professional, AI Agent, External Service
e1_audit_validation:
  tested_providers:
    - "human-professional"
    - "ai-agent"
    - "external-service"
  core_changes_required: 0
  reuse_percentage: 100%
  
# Golden Proof: "Launch a Business" use case that ships to production
golden_proof:
  work_id: "work-business-launch-001"
  description: "Launch Online Business for UMKM Batik Jaya"
  requirements_count: 7
  actors_count: 8
    - 4 Human Professionals
    - 2 AI Agents
    - 2 External Services
  budget: 125000000
  status: "executing"
  
# Capabilities consumed (all existing, no new core capabilities required)
capabilities:
  - work-core
  - atomic-composition
  - ai-agent-execution
  - governance-evidence
  - agent-orchestration
lifecycle:
  phase: D.2
  status: ACTIVE
  contract:
    stages:
      - name: discover
        description: Pengguna menemukan dan memahami produk
        terminal: false
      - name: create
        description: Pengguna membuat Work baru
        terminal: false
      - name: execute
        description: Work berjalan dengan kolaborasi Human+AI
        terminal: false
      - name: progress
        description: Update status Work secara berkala
        terminal: false
      - name: evidence
        description: Mengumpulkan semua bukti eksekusi
        terminal: false
      - name: complete
        description: Work selesai, evidence terverifikasi
        terminal: true
  real_user_jobs:
    - id: hai-101
      name: Human+AI Work Coordination
      description: Full lifecycle koordinasi Work antara Human dan AI Agent, pembagian tugas, dan pelacakan status
      status: completed
      requirements:
        - req-hai-001
    - id: hai-102
      name: Ephemeral Team Composition Automation
      description: Full lifecycle otomatisasi komposisi tim sementara, pencocokan kemampuan, dan pengukuran ekonomi
      status: completed
      requirements:
        - req-hai-002
quality:
  targets:
    evidence_required: true
    test_coverage_min: 85
    runtime_invocation_required: true
governance:
  baseline_locked: true
  needs_audit: false
  evidence_path: ./evidence