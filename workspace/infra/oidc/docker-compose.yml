version: '3.8'
services:
  hydra-db:
    image: postgres:13
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=hydra
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=hydra
    volumes:
      - hydra-db-data:/var/lib/postgresql/data

  hydra-db-migrate:
    image: oryd/hydra:v2.2.0
    command:
      - migrate
      - sql
      - -e
      - --yes
    environment:
      - DSN=postgres://hydra:secret@hydra-db:5432/hydra?sslmode=disable
    depends_on:
      - hydra-db

  hydra:
    image: oryd/hydra:v2.2.0
    ports:
      - "4444:4444"
      - "4445:4445"
    command:
      - serve
      - all
      - --dev
    environment:
      - DSN=postgres://hydra:secret@hydra-db:5432/hydra?sslmode=disable
      - URLS_SELF_ISSUER=http://0.0.0.0:4444
      - SERVE_PUBLIC_CORS_ENABLED=true
      - SERVE_PUBLIC_CORS_ALLOWED_ORIGINS=*
      - URLS_CONSENT=http://0.0.0.0:3003/consent
      - URLS_LOGIN=http://0.0.0.0:3002/login
      - OIDC_SUBJECT_IDENTIFIERS_SUPPORTED_TYPES=public,pairwise
      - OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT=a-very-secret-salt
      - SECRETS_SYSTEM=this-is-not-a-secure-secret
    depends_on:
      - hydra-db-migrate

  consent:
    image: node:18
    working_dir: /usr/src/app
    volumes:
      - ./consent-app:/usr/src/app
    ports:
      - "3003:3000"
    command: sh -c 'npm install && node index.js'

volumes:
  hydra-db-data: