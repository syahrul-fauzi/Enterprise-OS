services:
  postgres:
    container_name: eos-staging-postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: eos_identity
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d eos_identity"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: eos-staging-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL automatic backup sidecar (production requirement)
  postgres_backup:
    container_name: eos-staging-postgres-backup
    image: prodrigestivill/postgres-backup-local:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: eos_identity
      BACKUP_SCHEDULE: "0 1 * * *"  # Daily backup at 1 AM
      BACKUP_KEEP_DAYS: 30
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  web:
    container_name: eos-staging-web
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/eos_identity
      EOS_REQUIREMENT_STORAGE_PATH: /data/requirements/requirements.json
      EOS_EVIDENCE_STORAGE_ROOT: /data/evidence
      EOS_RUNTIME_INVOCATION_EVIDENCE_PATH: /app/portfolios/evidence/verification/enterprise/runtime-invocations-staging.jsonl
      REALITY_PATH_ONLY: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - web_state:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  caddy:
    container_name: eos-staging-caddy
    image: caddy:2.10.2-alpine
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${STAGING_HTTP_PORT:-80}:80"
      - "${STAGING_HTTPS_PORT:-443}:443"
    environment:
      CADDY_TLS: ${CADDY_TLS}
      SERVICES_ID_DOMAIN: ${SERVICES_ID_DOMAIN}
      LAWYERSHUB_DOMAIN: ${LAWYERSHUB_DOMAIN}
      ILC_DOMAIN: ${ILC_DOMAIN}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  postgres_backups:
  redis_data:
  web_state:
  caddy_data:
  caddy_config: