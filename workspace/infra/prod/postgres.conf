# PostgreSQL Production Configuration for EOS
# work-prod-009: Postgres WAL/backup/RLS configuration
# Implements production-grade write-ahead logging, connection limits, and security settings

# ------------------------------
# WAL (Write-Ahead Log) Configuration
# ------------------------------
wal_level = replica                    # Enable WAL replication and backup capabilities
max_wal_senders = 3                   # Maximum concurrent WAL senders for replication
wal_keep_size = 16GB                  # Retain WAL files for 16GB to support point-in-time recovery
wal_buffers = 16MB                    # WAL buffer size (16MB for production workloads)
checkpoint_timeout = 15min            # Regular checkpoint interval to prevent WAL bloat
checkpoint_completion_target = 0.9    # Smooth checkpoint execution to avoid I/O spikes
archive_mode = on                     # Enable WAL archiving for point-in-time recovery
archive_command = 'cp %p /backups/wal/%f && mkdir -p /backups/wal'  # Archive WAL files to backup volume (creates directory if missing)

# ------------------------------
# Connection & Memory Configuration
# ------------------------------
listen_addresses = '*'               # Listen on all network interfaces to allow container connections
max_connections = 100                 # Maximum concurrent connections (matches pool settings in base.repository.ts)
shared_buffers = 1GB                  # Shared memory buffer cache (25% of system RAM for 4GB+ systems)
work_mem = 4MB                        # Memory per sort/hash operation (prevents disk spills)
maintenance_work_mem = 256MB          # Memory for maintenance operations (VACUUM, CREATE INDEX)
effective_cache_size = 3GB            # Planner estimate of available OS cache (75% of system RAM)

# ------------------------------
# Security Configuration (RLS Enforcement)
# ------------------------------
# Enable custom session variables for EOS tenant isolation (used by setSessionContext/clearSessionContext)
# custom_variable_classes removed - deprecated in modern PostgreSQL (12+), no longer required
app.current_tenant = ''               # Default empty tenant context (enforced by RLS policies)
app.current_workspace = ''            # Default empty workspace context (enforced by RLS policies)

# ------------------------------
# Logging & Observability
# ------------------------------
log_statement = 'none'                # Disable full statement logging in production (adjust for debugging only)
log_connections = on                  # Log connection establishment for audit
log_disconnections = on               # Log connection termination for audit
log_duration = on                     # Log query execution duration for performance monitoring
log_line_prefix = '%t [%p]: [%c-%l] '  # Structured log prefix with timestamp, PID, session ID