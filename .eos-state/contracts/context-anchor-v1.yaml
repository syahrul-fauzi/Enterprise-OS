## Extension of Existing Primitives (NO BREAKING CHANGES)
Context Anchor ditambahkan sebagai **optional fields** ke existing EngineContext (Python) dan ExecutionContext (TypeScript), sehingga tidak merusak kode yang sudah ada.

### 1. Python: EngineContext Extension (implementation/shared/engine/context.py)
```python
@dataclass
class EngineContext:
    # Existing fields tetap dipertahankan 100%
    execution_id: str = field(default_factory=lambda: str(uuid.uuid4()))
    correlation_id: str = field(default_factory=lambda: str(uuid.uuid4()))
    engine_version: str = "1.0.0"
    configuration: Dict[str, Any] = field(default_factory=dict)
    diagnostics: EngineDiagnosticEngine = field(default_factory=EngineDiagnosticEngine)
    started_at: datetime = field(default_factory=datetime.utcnow)
    provenance: Dict[str, Any] = field(default_factory=dict)
    metrics: Dict[str, Any] = field(default_factory=dict)
    
    # NEW OPTIONAL FIELDS (Context Anchor) - tidak required untuk existing code
    current_state: Optional[GovernanceState] = None  # Derived from GOVERNANCE_STATE.yaml
    next_work: Optional[CurrentJourney] = None        # Derived from current-journey.yaml
    active_constraints: List[Policy] = field(default_factory=list)  # Active policies
    required_proof: List[Evidence] = field(default_factory=list)     # Evidence yang harus dihasilkan
    recent_decisions: List[Decision] = field(default_factory=list)   # Keputusan terakhir dalam eksekusi ini
    
    @classmethod
    def from_parent(cls, parent_context: "EngineContext") -> "EngineContext":
        """
        Override dari existing from_parent() untuk mewarisi Context Anchor fields
        Semua parent's context anchor fields diwarisi ke child context
        """
        return cls(
            execution_id=str(uuid.uuid4()),
            correlation_id=parent_context.correlation_id,
            engine_version=parent_context.engine_version,
            configuration=parent_context.configuration.copy(),
            provenance={
                **parent_context.provenance,
                "parent_execution_id": parent_context.execution_id,
                "inheritance_timestamp": datetime.utcnow().isoformat()
            },
            # Inherit Context Anchor fields dari parent
            current_state=parent_context.current_state,
            next_work=parent_context.next_work,
            active_constraints=parent_context.active_constraints.copy(),
            required_proof=parent_context.required_proof.copy(),
            recent_decisions=parent_context.recent_decisions.copy()
        )
```

