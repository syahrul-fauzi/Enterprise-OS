## Core Purpose
Context Anchor adalah **single source of truth untuk runtime state yang sedang aktif** dalam setiap eksekusi engine EOS.
- Tidak menggantikan canonical state di disk (YAML/JSON tetap menjadi source of truth)
- Hanya menyimpan **derived in-memory state** yang sudah di-parse, di-validasi, dan siap digunakan
- Memastikan semua engine/mesin/actor dalam eksekusi yang sama mengkonsumsi state yang identik
- Menghindari parsing berulang ribuan file canonical di setiap pemanggilan engine

## Boundary Rules (Canonical vs Derived)
### CANONICAL STATE (IMMUTABLE DALAM RUNTIME)
# For automated validation: canonical_state_paths list
canonical_state_paths:
  - "governance/GOVERNANCE_STATE.yaml"
  - ".eos-state/current-journey.yaml"
  - "workspace/.eos-state/work/EOS-WORK-*.json"
  - ".eos-state/recon/*.json"
  - ".eos-state/proofs/*.json"
# **Lokasi**: Semua file .yaml/.json di governance/, .eos-state/, workspace/.eos-state (seperti inventory di EOS-JOURNEY-003_recon.json)
# **Sifat**: Human-readable, persistent di disk, hanya boleh diubah oleh authorized state producers
# **Akses**: Hanya dibaca sekali oleh Context Anchor saat inisialisasi (kecuali invalidasi eksplisit)
# **Contoh**: GOVERNANCE_STATE.yaml, current-journey.yaml, EOS-WORK-001.json

### DERIVED STATE (IN-MEMORY ONLY)
# For automated validation: derived_state_only list
derived_state_only:
  - "current_state"
  - "next_work"
  - "active_constraints"
  - "required_proof"
  - "recent_decisions"
  - "cachedGovernanceState"
# **Lokasi**: Hanya dalam Context Anchor (tidak pernah disimpan ke disk sebagai state permanen)
# **Sifat**: In-memory, cacheable, dapat di-invalidate dan direload
# **Akses**: Semua state consumers dalam eksekusi yang sama mengakses derived state ini
# **Contoh**: Parsed GovernanceState, CurrentJourney object, active constraints list

