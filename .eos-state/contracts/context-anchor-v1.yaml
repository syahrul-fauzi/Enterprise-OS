## Cache Ownership & Invalidation Rules
### Cache Ownership
- Hanya **Journey Engine** yang memiliki wewenang untuk mengubah/invalidate Context Anchor cache
- Semua engine lain (EAEOS, MOS, EIS, CEOS, EKE) HANYA boleh **membaca** state dari Context Anchor
- Tidak ada actor/engine lain yang boleh memodifikasi state dalam Context Anchor
### Per-Candidate Invalidation Rules
CACHE-001 (GOVERNANCE_STATE.yaml):
  invalidate_condition: "Hanya jika governance/GOVERNANCE_STATE.yaml mtime berubah dari cache_timestamp"
  reset_implementation: "resetStateMetrics() + cachedGovernanceState = null"
CACHE-002 (current-journey.yaml):
  invalidate_condition: "Hanya jika .eos-state/current-journey.yaml mtime berubah dari cache_timestamp"
  reset_implementation: "resetJourneyMetrics() + cachedJourneyState = null"
CACHE-003 (EOS-WORK-001.json):
  invalidate_condition: "Hanya jika workspace/.eos-state/work/EOS-WORK-001.json mtime berubah dari cache_timestamp"
  reset_implementation: "resetWorkStateMetrics() + cachedWorkState = null"

### Invalidation & Reload Conditions
Context Anchor hanya boleh melakukan reload canonical state dari disk jika dan hanya jika:
1. **Deteksi perubahan timestamp**: File canonical memiliki mtime yang lebih baru dari last_load_timestamp di Context Anchor
2. **Manual invalidation**: Journey Engine mengeluarkan perintah eksplisit `invalidate_context_anchor()`
3. **Process restart**: Saat process EOS dimulai ulang (cold start), Context Anchor harus parse ulang semua canonical state
4. **Tenant switch**: Jika eksekusi berpindah tenant_id, Context Anchor harus di-reset dan load state tenant yang baru

### Stale State Detection
- Context Anchor menyimpan `last_load_timestamp` untuk setiap canonical state yang di-load
- Setiap 60 detik, Journey Engine memverifikasi mtime semua file canonical yang ter-cache
- Jika ada perubahan, Context Anchor men-trigger reload dan log event ke `context_anchor_reload.log`
### Instrumentation Requirements
- Setiap cache candidate harus memiliki semantic metrics yang sama dengan CACHE-001 (loadCalls, cacheHits, cacheMisses, parseCount)
- Semua metrics harus tercatat di .eos-state/proofs/cache-metrics.json untuk audit trail
- Tidak boleh implementasikan cache candidate tanpa metrics yang terukur
- Semua cache implementation harus melewati verifikasi test yang mirip test-state-metrics.ts

## Machine Work Contract
Setiap engine yang menggunakan Context Anchor harus mematuhi kontrak kerja ini:
1. **Selalu gunakan from_parent()**: Saat membuat child context, selalu gunakan `EngineContext.from_parent(parent_context)` untuk mewarisi Context Anchor
2. **Tidak pernah modify parent's state**: Semua modifikasi state hanya boleh dilakukan di context engine sendiri, bukan di parent
3. **Laporkan penggunaan state**: Setiap engine harus mencatat penggunaan state ke `context.metrics["state_access_count"]` untuk observability
4. **Kirim evidence setelah selesai**: Setelah eksekusi engine selesai, bukti eksekusi harus ditambahkan ke `context.required_proof`
5. **Jangan parse canonical state secara mandiri**: Semua akses ke canonical state harus melalui Context Anchor, tidak boleh membaca file secara langsung

## Validation Rules (Automated Checks)
eos-cli akan memvalidasi kepatuhan Context Anchor dengan aturan berikut sebelum setiap eksekusi:
1. **Tidak ada direct file read**: Tidak boleh ada `readFileSync` atau `open()` untuk file canonical di luar Context Anchor
2. **Semua context inheritance benar**: Setiap child context harus mewarisi Context Anchor dari parent
3. **Cache ownership terjaga**: Hanya Journey Engine yang memanggil fungsi invalidasi
4. **Semua state access tercatat**: Semua akses ke state dalam Context Anchor tercatat di metrics
5. **Tidak ada state yang disimpan ke disk**: Derived state tidak pernah disimpan ke file di luar memory

